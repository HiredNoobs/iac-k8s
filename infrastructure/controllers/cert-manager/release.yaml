# Bump the chart version and the images together, each image is the chart's appVersion pinned by
# its digest (the multi-arch index). The CRDs come with the chart (crds.enabled), add their schemas
# to lint.yml. They're kept if the release is removed (crds.keep), deleting them would delete every
# Certificate and Issuer in the cluster.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 1h
  chart:
    spec:
      chart: cert-manager
      version: "v1.21.2"
      sourceRef:
        kind: HelmRepository
        name: cert-manager
  values:
    crds:
      enabled: true
      keep: true
    # DNS-01's check that the TXT record is visible, over DNS-over-HTTPS: the LAN intercepts
    # DNS (port 53) to any server and answers locally, so the authoritative servers can't be
    # asked directly. 1.1.1.1 sees Cloudflare's own zones straight away.
    dns01RecursiveNameservers: https://1.1.1.1/dns-query
    dns01RecursiveNameserversOnly: true
    image:
      digest: sha256:70f532fd9cfde0b09d55687200942399d89838bc2d5d5b45152eb799a15912b8
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
    webhook:
      image:
        digest: sha256:a60e2dac46dbb8a7f3df95c54ce941012f54c2fe022f0ee55aaa1ab40ed957ae
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
    cainjector:
      image:
        digest: sha256:c85268c64f2e0e76684bf5fe8906caff34b82523561c6affe0fae3546bd87562
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
    # The pods solving HTTP-01 challenges (unused with DNS-01, pinned anyway).
    acmesolver:
      image:
        digest: sha256:699b40d622211ab7accad8a21b04c5fbaa1841ef7a12621e8de492dbe27b2503
    # A Helm hook Job checking the webhook answers, Flux's health checks already wait for it.
    startupapicheck:
      enabled: false
