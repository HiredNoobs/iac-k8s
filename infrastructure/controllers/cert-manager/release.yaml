# Each image is the chart's appVersion pinned by its digest (the multi-arch index), set by
# update-pins.sh when the chart's version changes. The CRDs come with the chart (crds.enabled), add
# their schemas to lint.yml. They're kept if the release is removed (crds.keep), deleting them would
# delete every Certificate and Issuer in the cluster.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 1h
  chart:
    spec:
      chart: cert-manager
      version: "v1.21.3"
      sourceRef:
        kind: HelmRepository
        name: cert-manager
  values:
    crds:
      enabled: true
      keep: true
    # DNS-01's check that the TXT record is visible, over DNS-over-HTTPS: the LAN intercepts
    # DNS (port 53) to any server and answers locally, so the authoritative servers can't be
    # asked directly. 1.1.1.1 sees Cloudflare's own zones straight away.
    dns01RecursiveNameservers: https://1.1.1.1/dns-query
    dns01RecursiveNameserversOnly: true
    image:
      # update-pins: image=quay.io/jetstack/cert-manager-controller
      tag: v1.21.3
      digest: sha256:9f4f96a33c7774cef24466fcd85031997531a03a8d117f151126baa8d1290dcc
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
    webhook:
      image:
        # update-pins: image=quay.io/jetstack/cert-manager-webhook
        tag: v1.21.3
        digest: sha256:055ac8e9de6a0ba6763794838fe38944acc650f68ebe1b01dd8be079e580f458
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
    cainjector:
      image:
        # update-pins: image=quay.io/jetstack/cert-manager-cainjector
        tag: v1.21.3
        digest: sha256:083d0e906f8eb44e255fe4ff817ae54e49f9ed82e22f1011bb4e9e4f4b8a641f
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
    # The pods solving HTTP-01 challenges (unused with DNS-01, pinned anyway).
    acmesolver:
      image:
        # update-pins: image=quay.io/jetstack/cert-manager-acmesolver
        tag: v1.21.3
        digest: sha256:c8c1225bb2fe8ab37a330b77f0d8c2ee6a41210fcb54fc07ca606ab9a022b8b7
    # A Helm hook Job checking the webhook answers, Flux's health checks already wait for it.
    startupapicheck:
      enabled: false
