# The image is the chart's appVersion pinned by its digest (the multi-arch index), set by
# update-pins.sh when the chart's version changes.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reloader
  namespace: reloader
spec:
  interval: 1h
  chart:
    spec:
      chart: reloader
      version: "2.2.19"
      sourceRef:
        kind: HelmRepository
        name: stakater
  values:
    image:
      # Only the digest is used once it's set, the tag says which version it is.
      repository: stakater/reloader
      # update-pins: image=stakater/reloader
      tag: v1.4.23
      digest: sha256:e9dba79a047aa6a2ad538b53165a45c429f187aab4acaad8e43439a7b43a2753
    reloader:
      # Restarts by changing a pod template annotation rather than adding env vars to the
      # containers, which stays out of the way of Flux's manifests.
      reloadStrategy: annotations
      readOnlyRootFileSystem: true
      deployment:
        # The chart already sets the pod's (non-root, RuntimeDefault), this is the rest of the
        # restricted pod security standard. readOnlyRootFilesystem is added by the chart.
        containerSecurityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
