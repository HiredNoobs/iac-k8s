# Bump the chart version and the image together, the image is the chart's appVersion pinned by
# its digest (the multi-arch index).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reloader
  namespace: reloader
spec:
  interval: 1h
  chart:
    spec:
      chart: reloader
      version: "2.2.18"
      sourceRef:
        kind: HelmRepository
        name: stakater
  values:
    image:
      # Only the digest is used once it's set, the tag says which version it is.
      tag: v1.4.22
      digest: sha256:def2480040adc164b3a57340e77674eadfd88fb7f0593df25e93297f29c7fd7c
    reloader:
      # Restarts by changing a pod template annotation rather than adding env vars to the
      # containers, which stays out of the way of Flux's manifests.
      reloadStrategy: annotations
      readOnlyRootFileSystem: true
      deployment:
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
