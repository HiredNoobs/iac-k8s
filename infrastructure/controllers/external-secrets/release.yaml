# Bump the chart version and the image together, the image is the chart's appVersion pinned by
# its digest (the multi-arch index). The CRDs come with the chart, add their schemas to lint.yml.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: external-secrets
spec:
  interval: 1h
  chart:
    spec:
      chart: external-secrets
      version: "2.13.0"
      sourceRef:
        kind: HelmRepository
        name: external-secrets
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  values:
    image:
      # renovate: image=ghcr.io/external-secrets/external-secrets
      tag: v2.13.0@sha256:f799d87a6a959e597a4ba7a8d2379886292c3fcfbee678f7dc2d3566051bcb96
    webhook:
      image:
        # renovate: image=ghcr.io/external-secrets/external-secrets
        tag: v2.13.0@sha256:f799d87a6a959e597a4ba7a8d2379886292c3fcfbee678f7dc2d3566051bcb96
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
    certController:
      image:
        # renovate: image=ghcr.io/external-secrets/external-secrets
        tag: v2.13.0@sha256:f799d87a6a959e597a4ba7a8d2379886292c3fcfbee678f7dc2d3566051bcb96
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
    # Vault's Kubernetes auth reviews ESO's token with that same token (no long-lived reviewer
    # token in Vault), which needs the TokenReview API.
    systemAuthDelegator: true
