# The image is the chart's appVersion pinned by its digest (the multi-arch index), set by
# update-pins.sh when the chart's version changes. The CRDs come with the chart, add their schemas to lint.yml.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: external-secrets
spec:
  interval: 1h
  chart:
    spec:
      chart: external-secrets
      version: "2.14.0"
      sourceRef:
        kind: HelmRepository
        name: external-secrets
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  values:
    image:
      # update-pins: image=ghcr.io/external-secrets/external-secrets
      tag: v2.14.0@sha256:10608eb53e636e744903d5f3657a4d9c44e28d9d9c181b73e07bc7dd2e6884dc
    webhook:
      image:
        # update-pins: image=ghcr.io/external-secrets/external-secrets
        tag: v2.14.0@sha256:10608eb53e636e744903d5f3657a4d9c44e28d9d9c181b73e07bc7dd2e6884dc
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
    certController:
      image:
        # update-pins: image=ghcr.io/external-secrets/external-secrets
        tag: v2.14.0@sha256:10608eb53e636e744903d5f3657a4d9c44e28d9d9c181b73e07bc7dd2e6884dc
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
    # Vault's Kubernetes auth reviews ESO's token with that same token (no long-lived reviewer
    # token in Vault), which needs the TokenReview API.
    systemAuthDelegator: true
