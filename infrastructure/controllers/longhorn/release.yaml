# Storage for every app's volumes. Replicas only go on nodes with a longhorn_disk (iac-homelab),
# which mounts a separate disk at /var/mnt/longhorn and labels the node
# node.longhorn.io/create-default-disk=true. The nodes need the iscsi-tools and util-linux-tools
# Talos extensions.
#
# Adopted from stack-longhorn's release manifest install, so these values reproduce it. Upgrade
# one minor version at a time (Longhorn doesn't support skipping), check the upgrade notes first:
# https://longhorn.io/docs/latest/deploy/upgrade/. Flux doesn't roll back or uninstall on a
# failure (no remediation), Longhorn can't be downgraded and uninstalling deletes every volume.
#
# Images aren't pinned by digest, unlike everywhere else: Longhorn records the engine and
# instance manager image names in its volumes, a different name (even the same image with a
# digest) is a new engine and needs every volume upgraded. They follow the chart's version.
#
# The CRDs come with the chart (as templates), their schemas are in lint.yml.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  interval: 1h
  timeout: 15m
  chart:
    spec:
      chart: longhorn
      version: "1.12.1"
      sourceRef:
        kind: HelmRepository
        name: longhorn
  install:
    remediation:
      retries: 0
  upgrade:
    remediation:
      retries: 0
  values:
    defaultSettings:
      defaultDataPath: /var/mnt/longhorn
      createDefaultDiskLabeledNodes: true
      # Copies on different nodes and Proxmox hosts where possible.
      defaultReplicaCount: 2
      # The zone is the Proxmox host (topology.kubernetes.io/zone): a volume's copies are never
      # on the same host, so losing one keeps every volume. With 3 hosts and 2 copies a lost
      # host's copies are rebuilt on the third.
      replicaZoneSoftAntiAffinity: false
      # Moves a copy when a volume's copies share a host (e.g. after a host is added), only as
      # far as needed: best-effort would also even out the copies per node.
      replicaAutoBalance: least-effort
    # The default StorageClass, longhorn. longhorn-single (one copy) is in
    # infrastructure/configs/longhorn.
    persistence:
      defaultClassReplicaCount: 2
      defaultDataLocality: best-effort
    # The NAS share (credentials: infrastructure/configs/longhorn), backed up nightly by the
    # RecurringJob there.
    defaultBackupStore:
      backupTarget: cifs://192.168.111.6/longhorn-backups
      backupTargetCredentialSecret: longhorn-backup
