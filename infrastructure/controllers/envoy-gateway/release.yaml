# The Gateway API controller: it runs Envoy for each Gateway and turns the Gateways, HTTPRoutes
# and Envoy Gateway's policies into Envoy config. The Gateway itself is in
# infrastructure/configs/gateway.
#
# Bump the chart (repository.yaml) and the image together, the image is the chart's appVersion
# pinned by its digest (the multi-arch index). The Envoy proxy image isn't set, the controller's
# built-in default is already pinned by digest. The CRDs (Envoy Gateway's and the Gateway API's,
# experimental channel) come with the chart, add their schemas to lint.yml.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
  namespace: envoy-gateway
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: envoy-gateway
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  values:
    global:
      images:
        envoyGateway:
          image: docker.io/envoyproxy/gateway:v1.9.3@sha256:192fc9bdadb6d2462e8cf7bd702ce3dd9648f3310c6038787448a1f509b7cd9f
    deployment:
      envoyGateway:
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 1024Mi
    config:
      envoyGateway:
        # Backend: upstreams outside the cluster (the NAS, Proxmox), or reached by DNS name.
        extensionApis:
          enableBackend: true
        # At info the controller logs every reconcile ("reconciling gateways", "processing ...
        # Secret": ~30k lines a day); warnings and errors are what's worth keeping.
        logging:
          level:
            default: warn
