# The Gateway API controller: it runs Envoy for each Gateway and turns the Gateways, HTTPRoutes
# and Envoy Gateway's policies into Envoy config. The Gateway itself is in
# infrastructure/configs/gateway.
#
# Bump the chart (repository.yaml) and the image together, the image is the chart's appVersion
# pinned by its digest (the multi-arch index). The Envoy proxy image isn't set, the controller's
# built-in default is already pinned by digest. The CRDs (Envoy Gateway's and the Gateway API's,
# experimental channel) come with the chart, add their schemas to lint.yml.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
  namespace: envoy-gateway
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: envoy-gateway
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  values:
    global:
      images:
        envoyGateway:
          image: docker.io/envoyproxy/gateway:v1.9.2@sha256:9d67017c442a70e6ae9f1a358e6c80eb653c67c2e40823d9a991e0daf37ba926
    deployment:
      envoyGateway:
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 1024Mi
    config:
      envoyGateway:
        # Backend: upstreams outside the cluster (the NAS, Proxmox), or reached by DNS name.
        extensionApis:
          enableBackend: true
