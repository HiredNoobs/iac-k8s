# Cluster-wide config: the admission policies, CoreDNS' disruption budget, and config using the
# controllers' CRDs (ClusterSecretStore, ClusterIssuer, the controllers' network policies, ...).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - admission-policies
  - coredns
  - cluster-issuer
  - cluster-secret-store
  - flux-notifications
  - gateway
  - longhorn
  - network-policies
