# The monitoring CA, for TLS between the monitoring components (apps/base/monitoring) and from
# rsyslog (apps/base/rsyslog) to VictoriaLogs. Generated by cert-manager: unlike redis-ca and
# rabbitmq-ca nothing outside the cluster trusts it (the Gateway verifies these backends with
# ca.crt from each component's secret), so a new one is fine and it isn't kept in Vault.
#
# Server certificates and anyone needing the CA get a Certificate with issuerRef ClusterIssuer
# monitoring-ca (cert-manager puts ca.crt in its secret).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: monitoring-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: monitoring-ca
  secretName: monitoring-ca
  duration: 87600h # 10 years
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    kind: ClusterIssuer
    name: selfsigned
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: monitoring-ca
spec:
  ca:
    secretName: monitoring-ca
