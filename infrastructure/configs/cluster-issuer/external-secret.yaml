# Cloudflare API token for DNS-01 (key: api-token), Zone:DNS:Edit on the domain. ClusterIssuers
# read their secrets from cert-manager's own namespace.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare
  namespace: cert-manager
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: cloudflare
  dataFrom:
    - extract:
        key: production/cert-manager
