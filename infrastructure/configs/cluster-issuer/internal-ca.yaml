# The internal CA, for in-cluster HTTPS backends only the Gateway connects to (e.g. Pi-hole's web
# UI), so Envoy can verify them (their Backend's caCertificateRefs: the app's own certificate
# secret, which has ca.crt). Generated by cert-manager like monitoring-ca: nothing outside the
# cluster trusts it, so a new one is fine and it isn't kept in Vault. Uses the selfsigned
# ClusterIssuer from monitoring-ca.yaml.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: internal-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: internal-ca
  secretName: internal-ca
  duration: 87600h # 10 years
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    kind: ClusterIssuer
    name: selfsigned
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: internal-ca
spec:
  ca:
    secretName: internal-ca
