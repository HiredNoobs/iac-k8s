# Who reaches External Secrets Operator: kube-apiserver (its webhook) and vmagent (metrics).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ingress
  namespace: external-secrets
spec:
  endpointSelector: {}
  ingress:
    - fromEntities:
        - kube-apiserver
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: vmagent
      toPorts:
        - ports:
            - port: metrics
