# The NAS share Longhorn backs up to (cifs://192.168.111.6/longhorn-backups, the backup target
# in infrastructure/controllers/longhorn). The NAS user can only reach that share.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: longhorn-backup
  namespace: longhorn-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: longhorn-backup
  dataFrom:
    - extract:
        key: production/longhorn
