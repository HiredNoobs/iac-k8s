# Every Kustomization in flux-system (they all apply iac-k8s), one status per Kustomization.
# Info events too, so a successful apply shows as a success, not only failures.
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: forgejo-commit-status
  namespace: flux-system
spec:
  providerRef:
    name: forgejo
  eventSeverity: info
  eventSources:
    - kind: Kustomization
      name: "*"
