# Forgejo token for Flux's commit statuses (key: token). It belongs to the flux-bot user, a
# collaborator on iac-k8s only, with write:repository.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-commit-status
  namespace: flux-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: forgejo-commit-status
  dataFrom:
    - extract:
        key: production/flux-system
