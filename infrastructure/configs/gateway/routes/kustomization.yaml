# One file per site: a Backend (where it is), an HTTPRoute (its hostname on the Gateway) and,
# behind Authelia, a SecurityPolicy. Clients always get HTTPS with the Gateway's wildcard
# certificate, the http:// or https:// in each file's header is only how Envoy reaches the site.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - bazarr.yaml
  - jellyfin.yaml
  - lidarr.yaml
  - nas.yaml
  - profilarr.yaml
  - prowlarr.yaml
  - proxmox.yaml
  - proxmox-001.yaml
  - proxmox-002.yaml
  - proxmox-003.yaml
  - proxmox-999.yaml
  - qbittorrent.yaml
  - radarr.yaml
  - seerr.yaml
  - sonarr.yaml
  - vaultwarden.yaml
