# vaultwarden.hirednoobs.com -> http://vaultwarden.vaultwarden-core.svc.cluster.local:80, vaultwarden-core (still a stack, move this to the app in D5).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: vaultwarden
  namespace: gateway
spec:
  endpoints:
    - fqdn:
        hostname: vaultwarden.vaultwarden-core.svc.cluster.local
        port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vaultwarden
  namespace: gateway
spec:
  parentRefs:
    - name: public
      sectionName: https
  hostnames:
    - vaultwarden.hirednoobs.com
  rules:
    - backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: vaultwarden
