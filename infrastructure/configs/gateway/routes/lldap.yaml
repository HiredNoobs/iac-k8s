# lldap.hirednoobs.com -> http://lldap.lldap-core.svc.cluster.local:17170, lldap-core (still a stack, move this to the app in D5).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: lldap
  namespace: gateway
spec:
  endpoints:
    - fqdn:
        hostname: lldap.lldap-core.svc.cluster.local
        port: 17170
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: lldap
  namespace: gateway
spec:
  parentRefs:
    - name: public
      sectionName: https
  hostnames:
    - lldap.hirednoobs.com
  rules:
    - backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: lldap
