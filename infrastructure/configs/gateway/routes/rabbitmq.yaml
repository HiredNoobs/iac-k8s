# rabbitmq.hirednoobs.com -> https://rabbitmq-broker.rabbitmq-core.svc.cluster.local:15671, rabbitmq-core (still a stack, move this to the app in D5).
# Envoy reaches it over HTTPS, its self-signed certificate isn't verified (like nginx).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: rabbitmq
  namespace: gateway
spec:
  endpoints:
    - fqdn:
        hostname: rabbitmq-broker.rabbitmq-core.svc.cluster.local
        port: 15671
  tls:
    insecureSkipVerify: true
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rabbitmq
  namespace: gateway
spec:
  parentRefs:
    - name: public
      sectionName: https
  hostnames:
    - rabbitmq.hirednoobs.com
  rules:
    - backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: rabbitmq
