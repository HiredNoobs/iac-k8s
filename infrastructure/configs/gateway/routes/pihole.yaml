# pihole.hirednoobs.com -> https://pihole-web.pihole-core.svc.cluster.local:443, pihole-core (still a stack, move this to the app in D5).
# Envoy reaches it over HTTPS, its self-signed certificate isn't verified (like nginx).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: pihole
  namespace: gateway
spec:
  endpoints:
    - fqdn:
        hostname: pihole-web.pihole-core.svc.cluster.local
        port: 443
  tls:
    insecureSkipVerify: true
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pihole
  namespace: gateway
spec:
  parentRefs:
    - name: public
      sectionName: https
  hostnames:
    - pihole.hirednoobs.com
  rules:
    - backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: pihole
