# auth.hirednoobs.com -> http://authelia.authelia-core.svc.cluster.local:9091, authelia-core (still a stack, move this to the app in D5).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: auth
  namespace: gateway
spec:
  endpoints:
    - fqdn:
        hostname: authelia.authelia-core.svc.cluster.local
        port: 9091
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: auth
  namespace: gateway
spec:
  parentRefs:
    - name: public
      sectionName: https
  hostnames:
    - auth.hirednoobs.com
  rules:
    - backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: auth
