# grafana.hirednoobs.com -> https://grafana.grafana-core.svc.cluster.local:3000, grafana-core (still a stack, move this to the app in D5).
# Envoy reaches it over HTTPS, its self-signed certificate isn't verified (like nginx).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: grafana
  namespace: gateway
spec:
  endpoints:
    - fqdn:
        hostname: grafana.grafana-core.svc.cluster.local
        port: 3000
  tls:
    insecureSkipVerify: true
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: gateway
spec:
  parentRefs:
    - name: public
      sectionName: https
  hostnames:
    - grafana.hirednoobs.com
  rules:
    - backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: grafana
