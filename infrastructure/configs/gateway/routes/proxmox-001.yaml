# proxmox-001.hirednoobs.com -> https://192.168.111.2:8006, Proxmox.
# Envoy reaches it over HTTPS and verifies the host's certificate against the cluster's CA
# (proxmox-ca.yaml), as prx-001.hirednoobs.com (its name in the certificate).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: proxmox-001
  namespace: gateway
spec:
  endpoints:
    - ip:
        address: 192.168.111.2
        port: 8006
  tls:
    sni: prx-001.hirednoobs.com
    caCertificateRefs:
      - group: ""
        kind: ConfigMap
        name: proxmox-ca
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: proxmox-001
  namespace: gateway
spec:
  parentRefs:
    - name: public
      sectionName: https
  hostnames:
    - proxmox-001.hirednoobs.com
  rules:
    - backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: proxmox-001
