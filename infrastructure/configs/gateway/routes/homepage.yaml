# homepage.hirednoobs.com -> http://homepage.homepage-core.svc.cluster.local:3000, homepage-core (still a stack, move this to the app in D5).
# Behind Authelia (SecurityPolicy), see ../authelia.yaml.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: homepage
  namespace: gateway
spec:
  endpoints:
    - fqdn:
        hostname: homepage.homepage-core.svc.cluster.local
        port: 3000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: homepage
  namespace: gateway
spec:
  parentRefs:
    - name: public
      sectionName: https
  hostnames:
    - homepage.hirednoobs.com
  rules:
    - backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: homepage
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: homepage
  namespace: gateway
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: homepage
  extAuth:
    failOpen: false
    headersToExtAuth:
      - X-Forwarded-Proto
      - X-Forwarded-For
      - Authorization
      - Proxy-Authorization
      - Accept
      - Cookie
    http:
      path: /api/authz/ext-authz/
      backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: authelia
      headersToBackend:
        - Remote-User
        - Remote-Groups
        - Remote-Name
        - Remote-Email
