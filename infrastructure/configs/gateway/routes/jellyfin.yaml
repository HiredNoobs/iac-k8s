# jellyfin.hirednoobs.com -> http://192.168.111.6:8096, the NAS.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: jellyfin
  namespace: gateway
spec:
  endpoints:
    - ip:
        address: 192.168.111.6
        port: 8096
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jellyfin
  namespace: gateway
spec:
  parentRefs:
    - name: public
      sectionName: https
  hostnames:
    - jellyfin.hirednoobs.com
  rules:
    - backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: jellyfin
