# Authelia (stack-authelia, still a stack), for the SecurityPolicies of routes behind it. Each
# request is checked with Authelia's ext-authz endpoint first: anyone not logged in is redirected
# to auth.hirednoobs.com, and the user is passed on as Remote-User/-Groups/-Name/-Email (set by
# Authelia, a client's own are replaced). Move it to Authelia's app when that's migrated (D5).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: authelia
  namespace: gateway
spec:
  endpoints:
    - fqdn:
        hostname: authelia.authelia-core.svc.cluster.local
        port: 9091
---
# Lets the SecurityPolicies of apps behind Authelia use the Backend above, one entry per
# namespace.
apiVersion: gateway.networking.k8s.io/v1
kind: ReferenceGrant
metadata:
  name: authelia
  namespace: gateway
spec:
  from:
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: homepage
  to:
    - group: gateway.envoyproxy.io
      kind: Backend
      name: authelia
