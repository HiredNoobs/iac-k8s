# The one entry point for *.hirednoobs.com: HTTP (only redirects, https-redirect.yaml) and HTTPS
# with the wildcard certificate (certificate.yaml). Routes in any namespace can attach to it,
# with parentRefs: [{name: public, namespace: gateway, sectionName: https}].
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: public
  namespace: gateway
spec:
  gatewayClassName: envoy
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: public
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: "*.hirednoobs.com"
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.hirednoobs.com"
      tls:
        mode: Terminate
        certificateRefs:
          - name: wildcard-tls
      allowedRoutes:
        namespaces:
          from: All
    # The prx-999 VMs' journals on their own listener, to Vector (apps/base/vector), which only
    # these VMs may reach. Clients pick the listener by SNI, the more specific hostname wins over
    # the wildcard.
    - name: journald
      protocol: HTTPS
      port: 443
      hostname: journald.hirednoobs.com
      tls:
        mode: Terminate
        certificateRefs:
          - name: wildcard-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: vector
    # The Proxmox hosts' metrics (InfluxDB lines from their metric server) on their own listener,
    # to vmagent (apps/base/monitoring/vmagent/metrics-route.yaml), which only the hosts may reach.
    - name: metrics
      protocol: HTTPS
      port: 443
      hostname: metrics.hirednoobs.com
      tls:
        mode: Terminate
        certificateRefs:
          - name: wildcard-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
    # Jellyfin alone on its own port, allows for IoT VLAN to only access Jellyfin.
    - name: jellyfin
      protocol: HTTPS
      port: 8443
      hostname: jellyfin.hirednoobs.com
      tls:
        mode: Terminate
        certificateRefs:
          - name: wildcard-tls
      allowedRoutes:
        namespaces:
          from: Same
