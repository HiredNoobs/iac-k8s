# The Gateway's wildcard certificate, renewed by cert-manager 30 days before it expires. A
# change to it (names, key) is safest tried on letsencrypt-staging first.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard
  namespace: gateway
spec:
  secretName: wildcard-tls
  dnsNames:
    - "*.hirednoobs.com"
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt
