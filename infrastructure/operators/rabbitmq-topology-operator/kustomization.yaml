# RabbitMQ's Messaging Topology Operator: users, permissions (and queues, exchanges, policies...)
# as rabbitmq.com resources, applied through RabbitMQ's management API. Our RabbitMQ isn't
# deployed by RabbitMQ's Cluster Operator, so every resource points at it with
# rabbitmqClusterReference.connectionSecret (see apps/base/rabbitmq/operator-connection.yaml).
#
# Upstream only ships release manifests (no chart), vendored unmodified:
# https://github.com/rabbitmq/messaging-topology-operator/releases/download/v1.20.4/messaging-topology-operator-with-certmanager.yaml
# sha256 11a390b02c74397251cdcbee7efac01b1cafc08ac041cd7ab2d69696b6fac0d8. Renovate bumps the
# image in the patch below and .forgejo/scripts/update-pins.sh replaces the file, URL and checksum
# with the new release's (by hand: bump the image, then run the script).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - messaging-topology-operator-with-certmanager.yaml
  # Since 1.20 the operator watches RabbitmqClusters and won't start without their CRD, which
  # belongs to the Cluster Operator. Upstream won't change this (it's meant to run with the Cluster
  # Operator) and suggests installing just the CRD: rabbitmq/messaging-topology-operator#1234. There
  # are no RabbitmqClusters. Vendored unmodified:
  # https://raw.githubusercontent.com/rabbitmq/cluster-operator/v2.23.0/config/crd/bases/rabbitmq.com_rabbitmqclusters.yaml
  # sha256 6203b7216bbb76aa6eeedc8ee3d07e4750b8ed66c9498346e6098be9a89c309e. Not upgraded with the
  # operator, only if a release needs a newer version.
  - rabbitmqclusters-crd.yaml
# rabbitmq-ca's certificate (public, not a secret), so the operator trusts RabbitMQ's management
# API over HTTPS. Committed rather than synced from Vault: an ExternalSecret here would need ESO's
# CRDs before this could apply. A change renames the ConfigMap, which rolls the operator.
configMapGenerator:
  - name: rabbitmq-ca
    namespace: rabbitmq-system
    files:
      - ca.crt=rabbitmq-ca.crt
patches:
  # Never pruned: deleting the CRDs deletes every User, Permission, ... and the operator deletes
  # those from RabbitMQ.
  - target:
      kind: CustomResourceDefinition
    patch: |
      - op: add
        path: /metadata/annotations/kustomize.toolkit.fluxcd.io~1prune
        value: disabled
  - patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: messaging-topology-operator
        namespace: rabbitmq-system
      spec:
        template:
          spec:
            containers:
              - name: manager
                image: rabbitmqoperator/messaging-topology-operator:1.20.4@sha256:27988ec3a9f23dfa9f4581985e0fdaf9c1267b0a8708acdc50fe5ba04d6e9254
                # Upstream requests 300m, far more than it uses here.
                resources:
                  requests:
                    cpu: 50m
                # Go reads every file in /etc/ssl/certs as a trusted CA.
                volumeMounts:
                  - name: rabbitmq-ca
                    mountPath: /etc/ssl/certs/rabbitmq-ca.crt
                    subPath: ca.crt
                    readOnly: true
            volumes:
              - name: rabbitmq-ca
                configMap:
                  name: rabbitmq-ca
