# labv2/production/mealie:
#
# - OIDC_CLIENT_SECRET: Mealie's OIDC client secret. Authelia holds its digest
#   (labv2/production/authelia AUTHELIA_OIDC_MEALIE_CLIENT_SECRET_DIGEST): change both together.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mealie
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: mealie
  dataFrom:
    - extract:
        key: production/mealie
