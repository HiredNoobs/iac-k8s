# A single Mealie: SQLite, so never two at once. Recreate stops the old pod before the new one
# starts (the volume is ReadWriteOnce anyway). No PDB: with one instance there's nothing to keep up
# during a drain.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mealie
  labels:
    app.kubernetes.io/name: mealie
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mealie
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mealie
    spec:
      # 911 is the image's own user (abc, the default PUID/PGID): started as it, the entry script
      # skips its root-only user switch (gosu), so nothing runs as root. fsGroup lets it write
      # /app/data.
      securityContext:
        runAsNonRoot: true
        runAsUser: 911
        runAsGroup: 911
        fsGroup: 911
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mealie
          image: hkotel/mealie:v3.29.0@sha256:78eb28b8776d0bad40c5e605c72b3f4f5976793e491558c7dcbdfc04c835d4bc
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: BASE_URL
              value: https://mealie.hirednoobs.com
            - name: TZ
              value: Europe/London
            - name: ALLOW_SIGNUP
              value: "false"
            # Authelia only: no username/password form, so the default admin can't log in either.
            - name: ALLOW_PASSWORD_LOGIN
              value: "false"
            - name: OIDC_AUTH_ENABLED
              value: "true"
            - name: OIDC_PROVIDER_NAME
              value: Authelia
            - name: OIDC_CONFIGURATION_URL
              value: https://auth.hirednoobs.com/.well-known/openid-configuration
            - name: OIDC_CLIENT_ID
              value: mealie
            - name: OIDC_CLIENT_SECRET_FILE
              value: /secrets/oidc-client-secret
            # Accounts are created on first login, for members of either group.
            - name: OIDC_SIGNUP_ENABLED
              value: "true"
            - name: OIDC_USER_GROUP
              value: mealie
            - name: OIDC_ADMIN_GROUP
              value: admins
            # Straight to Authelia from the login page, and the session survives closing the browser.
            - name: OIDC_AUTO_REDIRECT
              value: "true"
            - name: OIDC_REMEMBER_ME
              value: "true"
          ports:
            - name: http
              containerPort: 9000
              protocol: TCP
          # The image's own health check. The first start creates the database.
          startupProbe:
            httpGet:
              path: /api/app/about
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/app/about
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/app/about
              port: http
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 384Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: secrets
              mountPath: /secrets
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mealie-data
        - name: secrets
          secret:
            secretName: mealie
            items:
              - key: OIDC_CLIENT_SECRET
                path: oidc-client-secret
