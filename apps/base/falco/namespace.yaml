apiVersion: v1
kind: Namespace
metadata:
  name: falco
  labels:
    # Falco watches every syscall on the node through eBPF (capabilities BPF, PERFMON, SYS_PTRACE,
    # SYS_RESOURCE, host /proc and /etc read-only, the CRI socket), which baseline refuses.
    pod-security.kubernetes.io/enforce: privileged
