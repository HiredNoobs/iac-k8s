module(load="imudp")
module(load="imtcp")

input(type="imudp" port="514" ruleset="remote")
input(type="imtcp" port="514" ruleset="remote")

template(name="RawOutput" type="string" string="%rawmsg%\n")

# Everything as raw syslog to VictoriaLogs (apps/base/monitoring), queued in memory while it's
# unreachable.
ruleset(name="remote") {
  action(
    type="omfwd"
    target="victorialogs.monitoring.svc.cluster.local"
    port="514"
    protocol="tcp"
    template="RawOutput"
    action.resumeRetryCount="-1"
    queue.type="linkedlist"
    queue.size="10000"
  )
}
