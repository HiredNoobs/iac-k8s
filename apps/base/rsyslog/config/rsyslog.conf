# Longer than syslog's usual 8k: the Proxmox hosts send each journal entry's fields as JSON
# (iac-homelab's proxmox/rsyslog.conf allows the same).
global(maxMessageSize="64k")

module(load="imudp")
module(load="imtcp")

input(type="imudp" port="514" ruleset="remote")
input(type="imtcp" port="514" ruleset="remote")

# One JSON line per message for Vector (apps/base/vector), which parses the syslog itself: the
# message as it came, the sender's address (Vector only sees rsyslog's), when it arrived (an
# RFC 3164 timestamp has no year or time zone) and over what (imudp, imtcp).
template(name="VectorJson" type="list") {
  constant(value="{\"message\":\"")
  property(name="rawmsg" format="json")
  constant(value="\",\"fromhost_ip\":\"")
  property(name="fromhost-ip" format="json")
  constant(value="\",\"received\":\"")
  property(name="timegenerated" dateFormat="rfc3339" format="json")
  constant(value="\",\"transport\":\"")
  property(name="inputname" format="json")
  constant(value="\"}\n")
}

# Everything to Vector, queued in memory while it's unreachable.
ruleset(name="remote") {
  action(
    type="omfwd"
    target="syslog.vector.svc.cluster.local"
    port="5514"
    protocol="tcp"
    template="VectorJson"
    action.resumeRetryCount="-1"
    queue.type="linkedlist"
    queue.size="10000"
  )
}
