# rsyslog: receives syslog from the LAN (UDP/TCP 514) and forwards it to VictoriaLogs. Stateless,
# messages are queued in memory while VictoriaLogs is unreachable. Replicas are spread over the
# Proxmox hosts (zones), one per host.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rsyslog
  labels:
    app.kubernetes.io/name: rsyslog
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rsyslog
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rsyslog
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: rsyslog
                topologyKey: topology.kubernetes.io/zone
      # syslog:adm, the image's user (by number, runAsNonRoot can't check a name). Port 514
      # without root or CAP_NET_BIND_SERVICE: containerd lets pods bind any port
      # (ip_unprivileged_port_start=0).
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 4
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rsyslog
          image: rsyslog/rsyslog:2026-04@sha256:0c2960a55e1ee518d09385dbf06703a770e13cd064d46177256b7dad6374a2b2
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: syslog-udp
              containerPort: 514
              protocol: UDP
            - name: syslog-tcp
              containerPort: 514
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: syslog-tcp
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: syslog-tcp
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            # Room for the forwarding queue (10000 messages) while VictoriaLogs is down.
            limits:
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/rsyslog.conf
              subPath: rsyslog.conf
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: rsyslog-config
