    local=/redis.hirednoobs.com/;\
    local=/rsyslog.hirednoobs.com/;\
    local=/router.hirednoobs.com/;\
    local=/prx-001.hirednoobs.com/;\
    local=/prx-002.hirednoobs.com/;\
    local=/prx-003.hirednoobs.com/;\
    local=/prx-999.hirednoobs.com/;\
    local=/prx-001-srv-prod-core-control-001.hirednoobs.com/;\
    local=/prx-001-srv-prod-core-worker-001.hirednoobs.com/;\
    local=/prx-001-srv-prod-core-worker-002.hirednoobs.com/;\
    local=/prx-001-srv-prod-core-worker-003.hirednoobs.com/;\
    local=/prx-001-srv-prod-core-worker-004.hirednoobs.com/;\
    local=/prx-002-srv-prod-core-control-001.hirednoobs.com/;\
    local=/prx-002-srv-prod-core-worker-001.hirednoobs.com/;\
    local=/prx-002-srv-prod-core-worker-002.hirednoobs.com/;\
    local=/prx-003-srv-prod-core-control-001.hirednoobs.com/;\
    local=/prx-003-srv-prod-core-worker-001.hirednoobs.com/;\
    local=/prx-003-srv-prod-core-worker-002.hirednoobs.com/;\
    local=/prx-999-srv-mgmt-001.hirednoobs.com/;\
    local=/git.hirednoobs.com/;\
    local=/vault.hirednoobs.com/;"
