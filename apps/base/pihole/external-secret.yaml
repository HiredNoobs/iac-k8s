# PIHOLE_WEB_ADMIN_PASS: the web UI/API password. PIHOLE_API_APP_PWHASH (optional): an app
# password's hash for API clients like homepage, shared by every replica. Generate an app
# password in the web UI and copy webserver.api.app_pwhash from pihole.toml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pihole
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: pihole
  dataFrom:
    - extract:
        key: production/pihole
