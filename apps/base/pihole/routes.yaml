# The web UIs: pihole.hirednoobs.com on any replica, pihole<n> on replica n-1 (only those that
# exist answer). Backends rather than the Services: the UI is HTTPS, and Envoy verifies its
# certificate against the internal CA (ca.crt in pihole-tls) and the replica's name (sni, which
# has to be one of the certificate's dnsNames). Pi-hole's UI is under /admin/, so / redirects
# there (its login when there's no session).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: pihole
spec:
  endpoints:
    - fqdn:
        hostname: pihole-web.pihole.svc.cluster.local
        port: 443
  tls:
    sni: pihole-web.pihole.svc.cluster.local
    caCertificateRefs:
      - group: ""
        kind: Secret
        name: pihole-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pihole
spec:
  parentRefs:
    - name: public
      namespace: gateway
      sectionName: https
  hostnames:
    - pihole.hirednoobs.com
  rules:
    - matches:
        - path:
            type: Exact
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: /admin/
            statusCode: 302
    - backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: pihole
---
