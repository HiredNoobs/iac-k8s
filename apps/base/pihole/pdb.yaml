# Node drains (Talos upgrades) take one replica at a time. With a single replica it doesn't
# block the drain, DNS is down until the pod is back.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pihole
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pihole
