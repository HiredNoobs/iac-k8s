# One replica: the volumes are ReadWriteOnce, Recreate stops the old pod before the new one mounts
# them. The image's user is 10001 (the restricted pod security standard), fsGroup lets it write the
# volumes; it writes nothing else, so the root filesystem is read only.
#
# Verdicts on the findings are added on its page (httproute.yaml), where each finding on Grafana's
# Vulnerabilities dashboard links, or in the pod:
#   kubectl -n advisory-map exec -it deploy/advisory-map -- advisory-map vex tui --author <you>
# (or vex list, vex add, vex prune; see the app's docs/vex.md).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: advisory-map
  labels:
    app.kubernetes.io/name: advisory-map
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: advisory-map
  template:
    metadata:
      labels:
        app.kubernetes.io/name: advisory-map
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: advisory-map
          image: hirednoobs/advisory-map:0.8.0@sha256:2b414fc01d386eda1995b3e487976f35bc96a4d65731c668ce52fba2f2b3ff80
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: PROMETHEUS_URL
              value: https://victoriametrics.monitoring.svc:8428
            - name: PROMETHEUS_CA_FILE
              value: /etc/advisory-map/tls/ca.crt
            - name: MAPPING_FILE
              value: /etc/advisory-map/mapping.toml
            - name: DATA_DIR
              value: /data
            # The verdicts (OpenVEX documents), on a volume of their own: DATA_DIR can be thrown
            # away, VEX_DIR can't. VEX_AUTHOR is left unset, so each verdict says who made it.
            - name: VEX_DIR
              value: /vex
            # The verdicts page saves each verdict as the user in Remote-User, which the Gateway
            # sets from Authelia. Only the Gateway reaches the port (network-policy.yaml): anything
            # else could send the header itself and save as anyone.
            - name: WEB_PORT
              value: "8081"
            - name: WEB_AUTHOR_HEADER
              value: Remote-User
            # Hourly where a refresh fetches only what changed (KEV, OSV, the CVE List); the Debian
            # tracker comes whole. CWE keeps the 24h default.
            - name: FEED_REFRESH_KEV
              value: 1h
            - name: FEED_REFRESH_OSV
              value: 1h
            - name: FEED_REFRESH_CVELIST
              value: 1h
            - name: FEED_REFRESH_DEBIAN
              value: 6h
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: web
              containerPort: 8081
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /metrics
              port: http
            periodSeconds: 30
          # The limit leaves room for the CVE List's pack in the page cache, which counts against it.
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: vex
              mountPath: /vex
            - name: mapping
              mountPath: /etc/advisory-map/mapping.toml
              subPath: mapping.toml
              readOnly: true
            - name: tls
              mountPath: /etc/advisory-map/tls
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: advisory-map-data
        - name: vex
          persistentVolumeClaim:
            claimName: advisory-map-vex
        - name: mapping
          configMap:
            name: advisory-map-mapping
        - name: tls
          secret:
            secretName: advisory-map-monitoring-tls
            items:
              - { key: ca.crt, path: ca.crt }
