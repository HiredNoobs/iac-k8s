# The feeds' last good copies (DATA_DIR): the CVE List clone (~340 MB), the Debian tracker (~90 MB
# plus a download beside it), the OSV index and each ecosystem's archive while it's read. All of it
# can be fetched again.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: advisory-map-data
  labels:
    app.kubernetes.io/name: advisory-map
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: longhorn
  resources:
    requests:
      storage: 2Gi
---
# The verdicts on the findings (VEX_DIR): OpenVEX documents written by `advisory-map vex`, their
# archive, and the fingerprints that tell when a verdict expires. Kilobytes, but they're judgements
# made by hand: nothing can fetch them again, so Longhorn's nightly backup is all there is.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: advisory-map-vex
  labels:
    app.kubernetes.io/name: advisory-map
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
