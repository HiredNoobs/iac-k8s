# The verdicts page (deployment.yaml), behind Authelia (security-policy.yaml).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: advisory-map
spec:
  parentRefs:
    - name: public
      namespace: gateway
      sectionName: https
  hostnames:
    - advisory-map.hirednoobs.com
  rules:
    - backendRefs:
        - name: advisory-map
          port: 8081
