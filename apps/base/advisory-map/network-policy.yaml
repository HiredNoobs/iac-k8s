# Only vmagent (its metrics are the advisories) and the Gateway's Envoy (the verdicts page) reach
# advisory-map, every other connection to its pods is dropped.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        # vmagent, scraping metrics.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: vmagent
      ports:
        - port: http
    - from:
        # The Gateway's Envoy, for the verdicts page behind Authelia.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway
          podSelector:
            matchLabels:
              gateway.envoyproxy.io/owning-gateway-name: public
      ports:
        - port: web
