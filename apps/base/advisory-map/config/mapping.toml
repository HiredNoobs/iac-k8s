# What runs, as CVE List products and OSV packages (app-advisory-map's docs/mapping.md). Products are
# named as their CVE records name them, an entry per name where they use several. The VMs' Debian
# packages need no entry.
#
# Containers by their image's tag (image_spec, as the pod spec has it): what runs. Helm releases by
# appVersion where the images can't say it: charts that run them by digest alone (cert-manager,
# reloader; update-pins.sh keeps their images at the chart's appVersion), or many images for one
# product (Longhorn). Their images regex covers what they run.

[images]
query = "kube_pod_container_info"
label = "image_spec"

# -----------------------------------------------------
# Talos and Kubernetes
# -----------------------------------------------------

[[software]]
query = 'node_os_info{id="talos"}'
vendor = "siderolabs"
product = "talos"
ecosystem = "Go"
package = "github.com/siderolabs/talos"
version_label = "version_id"
kind = "talos"
images = '^ghcr\.io/siderolabs/'

[[software]]
query = "kube_node_info"
vendor = "kubernetes"
product = "kubernetes"
ecosystem = "Go"
package = "k8s.io/kubernetes"
version_label = "kubelet_version"
target_labels = ["node"]
kind = "kubernetes"
images = '^registry\.k8s\.io/(kube-apiserver|kube-controller-manager|kube-scheduler|kube-proxy):'

[[software]]
query = "kube_node_info"
vendor = "kubernetes"
product = "kubelet"
version_label = "kubelet_version"
target_labels = ["node"]
kind = "kubernetes"

# -----------------------------------------------------
# Helm releases
# -----------------------------------------------------

[[software]]
query = 'gotk_resource_info{customresource_kind="HelmRelease", name="cert-manager"}'
vendor = "cert-manager"
product = "cert-manager"
ecosystem = "Go"
package = "github.com/cert-manager/cert-manager"
version_label = "chart_app_version"
target_labels = ["exported_namespace", "name"]
kind = "helm"
images = '^quay\.io/jetstack/cert-manager-'

[[software]]
query = 'gotk_resource_info{customresource_kind="HelmRelease", name="longhorn"}'
vendor = "suse"
product = "longhorn"
version_label = "chart_app_version"
target_labels = ["exported_namespace", "name"]
kind = "helm"
images = '^(docker\.io/)?longhornio/'

[[software]]
query = 'gotk_resource_info{customresource_kind="HelmRelease", name="reloader"}'
ecosystem = "Go"
package = "github.com/stakater/Reloader"
version_label = "chart_app_version"
target_labels = ["exported_namespace", "name"]
kind = "helm"
images = '(^|/)stakater/reloader(:|$)'

