# What runs, as CVE List products and OSV packages (app-advisory-map's docs/mapping.md). Products are
# named as their CVE records name them, an entry per name where they use several. Software with no
# records yet is named as they would name it: owner/repository (GitHub's CNA) and its Go module. The
# VMs' and Proxmox hosts' Debian packages need no entry.
#
# Containers by their image's tag (image_spec, as the pod spec has it): what runs. Helm releases by
# appVersion where the images can't say it: charts that run them by digest alone (cert-manager,
# reloader; update-pins.sh keeps their images at the chart's appVersion), or many images for one
# product (Longhorn). Their images regex covers what they run.
#
# Fixes are releases: an image's tags in the registry it's pulled from (a fix is one that can be
# pulled), Kubernetes by Talos' kubelet image, Talos and the VMs' binaries by their git tags.
# release_regex picks the variant an image runs (distroless, alpine, ...).

[images]
query = "kube_pod_container_info"
label = "image_spec"

# -----------------------------------------------------
# Talos and Kubernetes
# -----------------------------------------------------

[[software]]
query = 'node_os_info{id="talos"}'
vendor = "siderolabs"
product = "talos"
ecosystem = "Go"
package = "github.com/siderolabs/talos"
version_label = "version_id"
kind = "talos"
releases = "git:https://github.com/siderolabs/talos.git"
images = '^ghcr\.io/siderolabs/'

[[software]]
query = "kube_node_info"
vendor = "kubernetes"
product = "kubernetes"
ecosystem = "Go"
package = "k8s.io/kubernetes"
version_label = "kubelet_version"
target_labels = ["node"]
kind = "kubernetes"
releases = "registry:ghcr.io/siderolabs/kubelet"
images = '^registry\.k8s\.io/(kube-apiserver|kube-controller-manager|kube-scheduler|kube-proxy):'

[[software]]
query = "kube_node_info"
vendor = "kubernetes"
product = "kubelet"
version_label = "kubelet_version"
target_labels = ["node"]
kind = "kubernetes"
releases = "registry:ghcr.io/siderolabs/kubelet"

[[software]]
query = 'kube_pod_container_info{image_spec=~"(.*/)?coredns/coredns:.*"}'
vendor = "coredns"
product = "coredns"
ecosystem = "Go"
package = "github.com/coredns/coredns"
version_label = "image_spec"
version_regex = ':v?([0-9][^@]*)'
target_labels = ["namespace", "container"]
kind = "container"
releases = "registry:registry.k8s.io/coredns/coredns"

# kubectl's own vulnerabilities are usually filed under Kubernetes, whose server-side ones don't apply.
[[software]]
query = 'kube_pod_container_info{image_spec=~"(.*/)?kubectl:.*"}'
ecosystem = "Go"
package = "k8s.io/kubectl"
version_label = "image_spec"
version_regex = ':v?([0-9][^@]*)'
target_labels = ["namespace", "container"]
kind = "container"
releases = "registry:registry.k8s.io/kubectl"

