# /metrics for vmagent (its advisory-map job), the verdicts page for the Gateway (httproute.yaml).
apiVersion: v1
kind: Service
metadata:
  name: advisory-map
  labels:
    app.kubernetes.io/name: advisory-map
spec:
  selector:
    app.kubernetes.io/name: advisory-map
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    - name: web
      port: 8081
      targetPort: web
      protocol: TCP
