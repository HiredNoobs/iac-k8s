# CrowdSec: scenarios over the Gateway's access log and the router's firewall drops, which
# vector-aggregator sends its agent (apps/base/vector/config/aggregator/crowdsec.yaml), and the
# community blocklist. In simulation for now: its alerts are logged, nothing is banned.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: crowdsec
resources:
  - namespace.yaml
  - external-secret.yaml
  - certificate.yaml
  - release.yaml
