# CrowdSec's chart: the LAPI (decisions, alerts, the community blocklist; SQLite on two Longhorn
# volumes) and one agent (parsers and scenarios). Chart 0.24.2 is CrowdSec v1.8.1, the image
# pinned by its digest (the multi-arch index); bump them together.
#
# The agent reads nothing from the nodes: its only input is HTTPS from vector-aggregator, with a
# client certificate from the monitoring CA (certificate.yaml). Its parsers and scenarios come
# from the hub snapshot in the image (no volume for the hub, so it neither updates nor upgrades
# at start): they change only with the image.
#
# Simulation (simulation.yaml): alerts are raised and logged, every decision is simulated, so
# nothing is banned. Nothing is shared with CrowdSec: no signals, no usage metrics, no console
# enrolment. The LAPI still logs in to the central API to pull the community blocklist, a
# smaller one for engines that don't share.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: crowdsec
spec:
  interval: 24h
  url: https://crowdsecurity.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: crowdsec
spec:
  interval: 1h
  chart:
    spec:
      chart: crowdsec
      version: "0.24.2"
      sourceRef:
        kind: HelmRepository
        name: crowdsec
  # The chart's values schema has no transform for any source, though CrowdSec takes one on each.
  install:
    disableSchemaValidation: true
  upgrade:
    disableSchemaValidation: true
  values:
    image:
      # renovate: image=crowdsecurity/crowdsec
      tag: v1.8.1@sha256:0f2523fa61ef507f15d953045cface490cc880670c62f2755ced17524107f71a
    # csLapiSecret and registrationToken from Vault (external-secret.yaml).
    secrets:
      externalSecret:
        name: crowdsec
    appsec:
      enabled: false
    config:
      simulation.yaml: |
        simulation: true
      config.yaml.local: |
        api:
          server:
            disable_usage_metrics_export: true
            # The chart's registration: the agent registers with the token, from a pod address.
            auto_registration:
              enabled: true
              token: "${REGISTRATION_TOKEN}"
              allowed_ranges:
                - "10.244.0.0/16"
            online_client:
              sharing: false
              pull:
                community: true
                blocklists: false
      parsers:
        # The fields the hub's crowdsecurity/http-logs and HTTP scenarios read, as its nginx
        # parser sets them, from the Gateway's lines (apps/base/vector/config/aggregator/
        # crowdsec.yaml), after the hub's syslog parser.
        s01-parse:
          gateway.yaml: |
            name: hirednoobs/gateway
            description: "Envoy's access log at the Gateway"
            filter: "evt.Parsed.program == 'gateway'"
            onsuccess: next_stage
            statics:
              - parsed: remote_addr
                expression: JsonExtractUnescape(evt.Parsed.message, "source_ip")
              - parsed: verb
                expression: JsonExtractUnescape(evt.Parsed.message, "method")
              - parsed: request
                expression: JsonExtractUnescape(evt.Parsed.message, "path")
              - parsed: status
                expression: JsonExtractUnescape(evt.Parsed.message, "status")
              - parsed: http_user_agent
                expression: JsonExtractUnescape(evt.Parsed.message, "user_agent")
              - parsed: target_fqdn
                expression: JsonExtractUnescape(evt.Parsed.message, "host")
              - meta: service
                value: http
              - meta: log_type
                value: http_access-log
              - meta: source_ip
                expression: evt.Parsed.remote_addr
              - meta: http_status
                expression: evt.Parsed.status
              - meta: http_path
                expression: evt.Parsed.request
              - meta: http_verb
                expression: evt.Parsed.verb
              - meta: http_user_agent
                expression: evt.Parsed.http_user_agent
              - meta: target_fqdn
                expression: evt.Parsed.target_fqdn
    lapi:
      persistentVolume:
        data:
          storageClassName: longhorn
        config:
          storageClassName: longhorn
      podAnnotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "6060"
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 512Mi
    agent:
      isDeployment: true
      hostVarLog: false
      acquisition: []
      additionalAcquisition:
        - source: http
          listen_addr: 0.0.0.0:8081
          path: /
          auth_type: mtls
          tls:
            server_cert: /etc/crowdsec/http-tls/tls.crt
            server_key: /etc/crowdsec/http-tls/tls.key
            ca_cert: /etc/crowdsec/http-tls/ca.crt
          # vector-aggregator's syslog lines, each in a JSON object, as this source takes only JSON.
          transform: JsonExtractUnescape(evt.Line.Raw, "line")
          labels:
            type: syslog
      ports:
        - name: http-datasource
          containerPort: 8081
          protocol: TCP
      service:
        ports:
          - name: http-datasource
            port: 8081
            targetPort: 8081
            protocol: TCP
      extraVolumes:
        - name: http-tls
          secret:
            secretName: crowdsec-agent-tls
      extraVolumeMounts:
        - name: http-tls
          mountPath: /etc/crowdsec/http-tls
          readOnly: true
      env:
        # HTTP scanning, probing, known exploit paths (crowdsecurity/http-cve), and port scans in
        # the firewall drops. Private and loopback addresses are never acted on
        # (crowdsecurity/whitelists).
        - name: COLLECTIONS
          value: crowdsecurity/base-http-scenarios crowdsecurity/iptables
        - name: PARSERS
          value: crowdsecurity/dateparse-enrich crowdsecurity/whitelists
      # Restarted when its certificate is renewed.
      deploymentAnnotations:
        reloader.stakater.com/auto: "true"
      podAnnotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "6060"
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 384Mi
  # The chart mounts the host's /var/lib/docker/containers into the agent whatever hostVarLog
  # says (for pod logs, which it doesn't read here).
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: crowdsec-agent
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: crowdsec-agent
              spec:
                template:
                  spec:
                    containers:
                      - name: crowdsec-agent
                        volumeMounts:
                          - mountPath: /var/lib/docker/containers
                            $patch: delete
                    volumes:
                      - name: varlibdockercontainers
                        $patch: delete
