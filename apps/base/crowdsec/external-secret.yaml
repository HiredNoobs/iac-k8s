# The LAPI's JWT secret (csLapiSecret) and the token the agent registers with
# (registrationToken), 64 characters each, in Vault at production/crowdsec. The chart would
# otherwise generate both itself.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: crowdsec
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: crowdsec
  dataFrom:
    - extract:
        key: production/crowdsec
