# Unit tests for what the aggregator sends CrowdSec's agent (config/aggregator/crowdsec.yaml).
# How to run them: tests/collector/pipeline.yaml; geo/ and threat/ as in geo.yaml and
# threat-intel.yaml.
tests:
  - name: a Gateway request becomes a gateway line with the fields CrowdSec's gateway parser reads
    inputs:
      - insert_at: geo
        type: vrl
        source: |
          . = {
            "_msg": "GET grafana.hirednoobs.com/.env?x=1 404 1ms", "_time": t'2026-10-19T12:00:00.004Z',
            "kubernetes": {"namespace": "envoy-gateway", "pod": {"name": "envoy-public-1"}, "container": {"name": "envoy"}, "node": {"name": "worker-4"}},
            "source.ip": "89.160.20.112", "source.port": 51000, "destination.ip": "10.244.3.7",
            "http.request.method": "GET", "http.response.status_code": 404, "url.domain": "grafana.hirednoobs.com",
            "url.original": "/.env?x=1", "url.path": "/.env", "user_agent.original": "curl/8.10.1"
          }
          %dataset = "envoy.access"
    outputs:
      - extract_from: crowdsec_lines
        conditions:
          - type: vrl
            source: |
              assert_eq!(., {"line": "2026-10-19T12:00:00.004+00:00 vector gateway: " + encode_json({
                "host": "grafana.hirednoobs.com",
                "method": "GET",
                "path": "/.env?x=1",
                "source_ip": "89.160.20.112",
                "status": "404",
                "user_agent": "curl/8.10.1"
              })})

  - name: a firewall drop becomes a kernel line, for CrowdSec's iptables parser
    inputs:
      - insert_at: syslog
        type: vrl
        source: |
          . = {
            "message": "<4>Oct 16 15:41:10 RT-BE86U-FFA0-1F4D20D-C kernel: DROP IN=eth0 OUT= MAC=a0:36:bc:12:34:56:00:1b:21:aa:bb:cc:08:00 SRC=203.0.113.7 DST=81.2.69.160 LEN=44 TOS=0x00 PREC=0x00 TTL=243 ID=54321 PROTO=TCP SPT=48234 DPT=8443 WINDOW=1024 RES=0x00 SYN URGP=0 MARK=0x8000000",
            "fromhost_ip": "192.168.111.1", "received": "2026-10-16T16:41:10.001+01:00", "transport": "imudp"
          }
    outputs:
      - extract_from: crowdsec_lines
        conditions:
          - type: vrl
            source: |
              line = string!(.line)
              assert!(starts_with(line, "2026-10-16T"))
              assert!(ends_with(line, " vector kernel: DROP IN=eth0 OUT= MAC=a0:36:bc:12:34:56:00:1b:21:aa:bb:cc:08:00 SRC=203.0.113.7 DST=81.2.69.160 LEN=44 TOS=0x00 PREC=0x00 TTL=243 ID=54321 PROTO=TCP SPT=48234 DPT=8443 WINDOW=1024 RES=0x00 SYN URGP=0 MARK=0x8000000"))
              assert_eq!(keys(.), ["line"])

  - name: an accepted connection isn't sent
    inputs:
      - insert_at: syslog
        type: vrl
        source: |
          . = {
            "message": "<6>Oct 28 14:05:00 RT-BE86U-FFA0-1F4D20D-C kernel: ACCEPT IN=br0 OUT=wgc1 MAC=a0:36:bc:12:34:56:00:1b:21:aa:bb:cc:08:00 SRC=192.168.50.20 DST=81.2.69.160 LEN=60 TOS=0x00 PREC=0x00 TTL=63 ID=1 DF PROTO=TCP SPT=40000 DPT=443 WINDOW=64240 RES=0x00 SYN URGP=0",
            "fromhost_ip": "192.168.111.1", "received": "2026-10-28T14:05:00.001+00:00", "transport": "imudp"
          }
    no_outputs_from: [crowdsec_lines]

  - name: other lines aren't sent
    inputs:
      - insert_at: syslog
        type: vrl
        source: |
          . = {"message": "<6>Oct 16 15:41:10 RT-BE86U-FFA0-1F4D20D-C kernel: br0: port 3(eth3) entered forwarding state", "fromhost_ip": "192.168.111.1", "received": "2026-10-16T16:41:10+01:00", "transport": "imudp"}
    no_outputs_from: [crowdsec_lines]
