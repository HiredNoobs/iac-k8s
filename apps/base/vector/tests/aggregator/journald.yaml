# Unit tests for config/aggregator/journald.yaml.
tests:
  - name: journald entry, the common fields (cron)
    inputs:
      - insert_at: journald
        type: vrl
        source: |
          . = {
            "message": "(root) CMD (command -v debian-sa1 > /dev/null && debian-sa1 1 1)",
            "@timestamp": "2026-10-14T12:00:00.123456Z", "timestamp": "2026-10-14T12:00:01.5Z",
            "host": "prx-999-srv-mgmt-001",
            "source_type": "http_server", "path": "/journald",
            "X-Forwarded-For": "203.0.113.200, 192.168.111.254",
            "event.created": "2026-10-14T12:00:00.200000Z",
            "_HOSTNAME": "prx-999-srv-mgmt-001", "_MACHINE_ID": "a1a1", "_BOOT_ID": "b007",
            "_SYSTEMD_UNIT": "cron.service", "_TRANSPORT": "syslog", "SYSLOG_IDENTIFIER": "CRON",
            "SYSLOG_FACILITY": "9", "SYSLOG_PID": "4242", "PRIORITY": "6", "_PID": "4242", "_UID": "0",
            "_GID": "0", "_COMM": "cron", "_EXE": "/usr/sbin/cron", "_CMDLINE": "/usr/sbin/CRON -f",
            "_SYSTEMD_INVOCATION_ID": "inv1", "_SYSTEMD_SLICE": "system.slice", "_CAP_EFFECTIVE": "1ffffffffff",
            "__CURSOR": "s=1;i=2", "__MONOTONIC_TIMESTAMP": "123", "__REALTIME_TIMESTAMP": "1791979200123456",
            "__SEQNUM": "9", "__SEQNUM_ID": "x", "_SOURCE_REALTIME_TIMESTAMP": "1791979200123000",
            "_STREAM_ID": "st"
          }
    outputs:
      - extract_from: final
        conditions:
          - type: vrl
            source: |
              assert_eq!(."event.dataset", "journald.log")
              assert_eq!(."event.provider", "CRON")
              assert_eq!(."event.kind", "event")
              assert_eq!(._msg, "(root) CMD (command -v debian-sa1 > /dev/null && debian-sa1 1 1)")
              # When it was logged (@timestamp), not when it reached the listener (timestamp).
              assert_eq!(._time, t'2026-10-14T12:00:00.123456Z')
              # When the VM's Vector read it.
              assert_eq!(."event.created", t'2026-10-14T12:00:00.200Z')
              assert_eq!(."host.hostname", "prx-999-srv-mgmt-001")
              assert_eq!(."host.name", "prx-999-srv-mgmt-001.hirednoobs.com")
              # The VM's own address: the last X-Forwarded-For entry (Envoy's).
              assert_eq!(."host.ip", "192.168.111.254")
              assert_eq!(."host.id", "a1a1")
              assert_eq!(."host.boot.id", "b007")
              assert_eq!(."process.pid", 4242)
              assert_eq!(."process.name", "cron")
              assert_eq!(."process.executable", "/usr/sbin/cron")
              assert_eq!(."process.command_line", "/usr/sbin/CRON -f")
              assert_eq!(."process.user.id", "0")
              assert_eq!(."process.group.id", "0")
              assert_eq!(."log.syslog.appname", "CRON")
              assert_eq!(."log.syslog.procid", "4242")
              assert_eq!(."log.syslog.severity.code", 6)
              assert_eq!(."log.syslog.severity.name", "Informational")
              assert_eq!(."log.syslog.facility.code", 9)
              assert_eq!(."log.syslog.facility.name", "cron")
              assert_eq!(."log.syslog.priority", 78)
              assert_eq!(."log.level", "info")
              assert_eq!(."Systemd.Unit", "cron.service")
              assert_eq!(."Systemd.Transport", "syslog")
              assert_eq!(."Systemd.Journal.SystemdInvocationId", "inv1")
              assert_eq!(."Systemd.Journal.SystemdSlice", "system.slice")
              assert_eq!(."Systemd.Journal.CapEffective", "1ffffffffff")
              # The journal's bookkeeping, and what was moved, is gone.
              for_each(keys(.)) -> |_i, k| {
                assert!(!match(k, r'^(_|[A-Z]+_)[A-Z_]+$|^(message|timestamp|@timestamp|host|path|source_type|X-Forwarded-For)$'), "still there: " + k)
                assert!(!contains(k, "Cursor") && !contains(k, "Monotonic") && !contains(k, "Seqnum") && !contains(k, "StreamId") && !contains(k, "Realtime"), "bookkeeping: " + k)
              }
              assert!(!exists(.kubernetes))

  - name: sshd login (Debian 13's sshd-session)
    inputs:
      - insert_at: journald
        type: vrl
        source: |
          . = {
            "message": "Accepted publickey for hirednoobs from 192.168.50.140 port 50004 ssh2: ED25519 SHA256:bbb",
            "timestamp": "2026-10-14T12:00:00Z", "X-Forwarded-For": "192.168.111.202",
            "_HOSTNAME": "prx-999-srv-vault-001", "_SYSTEMD_UNIT": "ssh.service", "SYSLOG_IDENTIFIER": "sshd-session",
            "PRIORITY": "6", "_PID": "900", "_COMM": "sshd-session"
          }
    outputs:
      - extract_from: final
        conditions:
          - type: vrl
            source: |
              assert_eq!(."event.dataset", "sshd.log")
              assert_eq!(."event.provider", "sshd")
              assert_eq!(."event.category", ["authentication"])
              assert_eq!(."event.type", ["start"])
              assert_eq!(."event.action", "ssh_login")
              assert_eq!(."event.outcome", "success")
              assert_eq!(."user.name", "hirednoobs")
              assert_eq!(."source.ip", "192.168.50.140")
              assert_eq!(."source.port", 50004)
              assert_eq!(."related.ip", ["192.168.50.140"])
              assert_eq!(."related.user", ["hirednoobs"])
              assert_eq!(."Ssh.Method", "publickey")
              assert_eq!(."Ssh.Signature", "ED25519 SHA256:bbb")
              assert_eq!(."host.hostname", "prx-999-srv-vault-001")

  - name: sshd failed login, invalid user
    inputs:
      - insert_at: journald
        type: vrl
        source: |
          . = {
            "message": "Invalid user admin0 from 192.168.50.66 port 40000",
            "timestamp": "2026-10-14T12:00:00Z", "X-Forwarded-For": "192.168.111.201",
            "_HOSTNAME": "prx-999-srv-runner-001", "_SYSTEMD_UNIT": "ssh.service", "SYSLOG_IDENTIFIER": "sshd-session", "PRIORITY": "6"
          }
    outputs:
      - extract_from: final
        conditions:
          - type: vrl
            source: |
              assert_eq!(."event.action", "ssh_login")
              assert_eq!(."event.outcome", "failure")
              assert_eq!(."event.reason", "invalid user")
              assert_eq!(."source.ip", "192.168.50.66")
              assert_eq!(."source.port", 40000)
              assert_eq!(."user.name", "admin0")

  - name: sshd failed login, closed before authentication
    inputs:
      - insert_at: journald
        type: vrl
        source: |
          . = {
            "message": "Connection closed by authenticating user root 192.168.50.67 port 40011 [preauth]",
            "timestamp": "2026-10-14T12:00:01Z", "X-Forwarded-For": "192.168.111.201",
            "_HOSTNAME": "prx-999-srv-runner-001", "_SYSTEMD_UNIT": "ssh.service", "SYSLOG_IDENTIFIER": "sshd-session", "PRIORITY": "6"
          }
    outputs:
      - extract_from: final
        conditions:
          - type: vrl
            source: |
              assert_eq!(."event.action", "ssh_login")
              assert_eq!(."event.outcome", "failure")
              assert_eq!(."event.reason", "closed before authentication")
              assert_eq!(."source.ip", "192.168.50.67")
              assert_eq!(."user.name", "root")

  - name: sshd failed login, a wrong password
    inputs:
      - insert_at: journald
        type: vrl
        source: |
          . = {
            "message": "Failed password for root from 192.168.50.66 port 40022 ssh2",
            "timestamp": "2026-10-14T12:00:02Z", "X-Forwarded-For": "192.168.111.201",
            "_HOSTNAME": "prx-999-srv-runner-001", "_SYSTEMD_UNIT": "ssh.service", "SYSLOG_IDENTIFIER": "sshd-session", "PRIORITY": "6"
          }
    outputs:
      - extract_from: final
        conditions:
          - type: vrl
            source: |
              assert_eq!(."event.action", "ssh_login")
              assert_eq!(."event.outcome", "failure")
              assert_eq!(."event.reason", "failed password")
              assert_eq!(."Ssh.Method", "password")
              assert_eq!(."user.name", "root")
              assert_eq!(."source.ip", "192.168.50.66")
              assert_eq!(."source.port", 40022)

  - name: sshd's PAM line for a wrong password
    inputs:
      - insert_at: journald
        type: vrl
        source: |
          . = {
            "message": "pam_unix(sshd:auth): authentication failure; logname= uid=0 euid=0 tty=ssh ruser= rhost=192.168.50.66  user=root",
            "timestamp": "2026-10-14T12:00:02Z", "X-Forwarded-For": "192.168.111.201",
            "_HOSTNAME": "prx-999-srv-runner-001", "_SYSTEMD_UNIT": "ssh.service", "SYSLOG_IDENTIFIER": "sshd-session", "PRIORITY": "5"
          }
    outputs:
      - extract_from: final
        conditions:
          - type: vrl
            source: |
              assert_eq!(."event.dataset", "sshd.log")
              assert_eq!(."event.category", ["authentication"])
              assert_eq!(."event.action", "authentication_failure")
              assert_eq!(."event.outcome", "failure")
              assert_eq!(."source.ip", "192.168.50.66")
              assert_eq!(."user.name", "root")

  - name: sudo command (the command is the process, sudo its parent)
    inputs:
      - insert_at: journald
        type: vrl
        source: |
          . = {
            "message": "www-data : PWD=/var/www ; USER=root ; COMMAND=/bin/bash",
            "timestamp": "2026-10-14T12:00:00Z", "X-Forwarded-For": "192.168.111.200",
            "_HOSTNAME": "prx-999-srv-git-001", "_SYSTEMD_UNIT": "session-12.scope", "SYSLOG_IDENTIFIER": "sudo",
            "PRIORITY": "5", "_PID": "5000", "_COMM": "sudo", "_EXE": "/usr/bin/sudo", "_CMDLINE": "sudo -s"
          }
    outputs:
      - extract_from: final
        conditions:
          - type: vrl
            source: |
              assert_eq!(."event.dataset", "sudo.log")
              assert_eq!(."event.provider", "sudo")
              assert_eq!(."event.category", ["process"])
              assert_eq!(."event.type", ["start"])
              assert_eq!(."event.outcome", "success")
              assert_eq!(."user.name", "www-data")
              assert_eq!(."user.effective.name", "root")
              assert_eq!(."process.command_line", "/bin/bash")
              assert_eq!(."process.working_directory", "/var/www")
              assert_eq!(."process.parent.pid", 5000)
              assert_eq!(."process.parent.name", "sudo")
              assert_eq!(."process.parent.command_line", "sudo -s")
              assert!(!exists(."process.pid"))
              assert_eq!(."log.level", "notice")

  - name: sudo refused (NOT in sudoers)
    inputs:
      - insert_at: journald
        type: vrl
        source: |
          . = {
            "message": "eve : user NOT in sudoers ; TTY=pts/1 ; PWD=/home/eve ; USER=root ; COMMAND=/bin/bash",
            "timestamp": "2026-10-14T12:00:00Z", "X-Forwarded-For": "192.168.111.201",
            "_HOSTNAME": "prx-999-srv-runner-001", "SYSLOG_IDENTIFIER": "sudo", "PRIORITY": "2"
          }
    outputs:
      - extract_from: final
        conditions:
          - type: vrl
            source: |
              assert_eq!(."event.outcome", "failure")
              assert_eq!(."error.message", "user NOT in sudoers")
              assert_eq!(."user.name", "eve")
              assert_eq!(."Terminal.Name", "pts/1")
              assert_eq!(."log.level", "critical")

  - name: sudo's PAM line for a wrong password
    inputs:
      - insert_at: journald
        type: vrl
        source: |
          . = {
            "message": "pam_unix(sudo:auth): authentication failure; logname=eve uid=1001 euid=0 tty=/dev/pts/1 ruser=eve rhost=  user=eve",
            "timestamp": "2026-10-14T12:00:02Z", "X-Forwarded-For": "192.168.111.201",
            "_HOSTNAME": "prx-999-srv-runner-001", "SYSLOG_IDENTIFIER": "sudo", "PRIORITY": "5"
          }
    outputs:
      - extract_from: final
        conditions:
          - type: vrl
            source: |
              assert_eq!(."event.dataset", "sudo.log")
              assert_eq!(."event.category", ["authentication"])
              assert_eq!(."event.action", "authentication_failure")
              assert_eq!(."event.outcome", "failure")
              assert_eq!(."user.name", "eve")

  - name: Vault audit response with the root token
    inputs:
      - insert_at: journald
        type: vrl
        source: |
          . = {
            "message": "{\"auth\":{\"accessor\":\"hmac-sha256:aa\",\"client_token\":\"hmac-sha256:bb\",\"display_name\":\"root\",\"policies\":[\"root\"],\"token_policies\":[\"root\"],\"token_type\":\"service\"},\"request\":{\"id\":\"r-1\",\"operation\":\"update\",\"mount_type\":\"system\",\"path\":\"sys/audit/stdout\",\"remote_address\":\"192.168.111.254\",\"remote_port\":51000,\"namespace\":{\"id\":\"root\"},\"data\":{\"file_path\":\"hmac-sha256:cc\"}},\"response\":{},\"time\":\"2026-10-14T12:00:00.5Z\",\"type\":\"response\"}",
            "timestamp": "2026-10-14T12:00:00.6Z", "X-Forwarded-For": "192.168.111.202",
            "_HOSTNAME": "prx-999-srv-vault-001", "_SYSTEMD_UNIT": "vault.service", "SYSLOG_IDENTIFIER": "vault", "PRIORITY": "6"
          }
    outputs:
      - extract_from: final
        conditions:
          - type: vrl
            source: |
              assert_eq!(."event.dataset", "vault.audit")
              assert_eq!(."event.provider", "vault")
              assert_eq!(."event.category", ["authentication"])
              assert_eq!(."event.type", ["info"])
              assert_eq!(."event.action", "update")
              assert_eq!(."event.outcome", "success")
              assert_eq!(."event.id", "r-1")
              assert_eq!(."source.ip", "192.168.111.254")
              assert_eq!(."source.port", 51000)
              assert_eq!(."user.name", "root")
              assert_eq!(."user.roles", ["root"])
              assert_eq!(._time, t'2026-10-14T12:00:00.5Z')
              assert_eq!(._msg, "response update sys/audit/stdout by root")
              # The rest, Vault's names capitalised; the request's data keeps its keys.
              assert_eq!(."Secrets.Audit.Request".Path, "sys/audit/stdout")
              assert_eq!(."Secrets.Audit.Request".MountType, "system")
              assert_eq!(."Secrets.Audit.Auth".TokenPolicies, ["root"])
              assert_eq!(."Secrets.Audit.Type", "response")
              # The data as one JSON text field.
              assert_eq!(."Secrets.Audit.Request.Data", "{\"file_path\":\"hmac-sha256:cc\"}")
              assert!(!exists(."Secrets.Audit.Time"))

  - name: Vault audit, a failed userpass login (the error in the response's data)
    inputs:
      - insert_at: journald
        type: vrl
        source: |
          . = {
            "message": "{\"auth\":{\"display_name\":\"\",\"policies\":[]},\"request\":{\"id\":\"r-2\",\"operation\":\"update\",\"path\":\"auth/userpass/login/nobody\",\"remote_address\":\"192.168.50.77\",\"remote_port\":51001},\"response\":{\"data\":{\"error\":\"invalid username or password\"}},\"time\":\"2026-10-14T12:00:00Z\",\"type\":\"response\"}",
            "timestamp": "2026-10-14T12:00:00Z", "X-Forwarded-For": "192.168.111.202",
            "_HOSTNAME": "prx-999-srv-vault-001", "_SYSTEMD_UNIT": "vault.service", "PRIORITY": "6"
          }
    outputs:
      - extract_from: final
        conditions:
          - type: vrl
            source: |
              assert_eq!(."event.outcome", "failure")
              assert_eq!(."error.message", "invalid username or password")
              assert!(!exists(."user.name"))
              assert_eq!(."Secrets.Audit.Response.Data", "{\"error\":\"invalid username or password\"}")
              assert_eq!(._msg, "response update auth/userpass/login/nobody failed: invalid username or password")

  - name: Vault audit, a Kubernetes login (the token's metadata keeps its keys in the response too)
    inputs:
      - insert_at: journald
        type: vrl
        source: |
          . = {
            "message": "{\"auth\":{\"display_name\":\"kubernetes-external-secrets\",\"policies\":[\"default\"],\"metadata\":{\"role\":\"eso\",\"service_account_uid\":\"sa-1\"}},\"request\":{\"id\":\"r-3\",\"operation\":\"update\",\"path\":\"auth/kubernetes/login\",\"remote_address\":\"192.168.111.22\",\"remote_port\":51002},\"response\":{\"auth\":{\"client_token\":\"hmac-sha256:dd\",\"metadata\":{\"role\":\"eso\",\"service_account_uid\":\"sa-1\"}},\"mount_accessor\":\"auth_kubernetes_1\"},\"time\":\"2026-10-14T12:00:00Z\",\"type\":\"response\"}",
            "timestamp": "2026-10-14T12:00:00Z", "X-Forwarded-For": "192.168.111.202",
            "_HOSTNAME": "prx-999-srv-vault-001", "_SYSTEMD_UNIT": "vault.service", "PRIORITY": "6"
          }
    outputs:
      - extract_from: final
        conditions:
          - type: vrl
            source: |
              assert_eq!(."Secrets.Audit.Auth.Metadata", {"role": "eso", "service_account_uid": "sa-1"})
              assert_eq!(."Secrets.Audit.Response.Auth.Metadata", {"role": "eso", "service_account_uid": "sa-1"})
              assert_eq!(."Secrets.Audit.Response".Auth.ClientToken, "hmac-sha256:dd")
              assert_eq!(."Secrets.Audit.Response".MountAccessor, "auth_kubernetes_1")
              assert!(!exists(."Secrets.Audit.Response".Auth.Metadata))

  - name: Vault audit, a secret read (its keys stay inside one data field)
    inputs:
      - insert_at: journald
        type: vrl
        source: |
          . = {
            "message": "{\"auth\":{\"display_name\":\"kubernetes-external-secrets\",\"policies\":[\"eso\"]},\"request\":{\"id\":\"r-4\",\"operation\":\"read\",\"path\":\"labv2/data/production/contentbot\",\"remote_address\":\"192.168.111.22\",\"remote_port\":51003},\"response\":{\"data\":{\"data\":{\"CYTUBE_USER\":\"hmac-sha256:9f2c\",\"CYTUBE_PASS\":\"hmac-sha256:1c7a\"},\"metadata\":{\"version\":3}}},\"time\":\"2026-10-14T12:00:00Z\",\"type\":\"response\"}",
            "timestamp": "2026-10-14T12:00:00Z", "X-Forwarded-For": "192.168.111.202",
            "_HOSTNAME": "prx-999-srv-vault-001", "_SYSTEMD_UNIT": "vault.service", "PRIORITY": "6"
          }
    outputs:
      - extract_from: final
        conditions:
          - type: vrl
            source: |
              data = ."Secrets.Audit.Response.Data"
              assert!(is_string(data))
              assert_eq!(parse_json!(data), {"data": {"CYTUBE_USER": "hmac-sha256:9f2c", "CYTUBE_PASS": "hmac-sha256:1c7a"}, "metadata": {"version": 3}})
              assert!(!exists(."Secrets.Audit.Response".Data))
              assert_eq!(."event.action", "read")

  - name: Vault audit, a delete request by an OIDC user (the token's email)
    inputs:
      - insert_at: journald
        type: vrl
        source: |
          . = {
            "message": "{\"auth\":{\"display_name\":\"oidc-alice\",\"policies\":[\"admin\"],\"metadata\":{\"email\":\"alice@example.com\",\"role\":\"admin\"}},\"request\":{\"id\":\"r-5\",\"operation\":\"delete\",\"path\":\"labv2/metadata/production/old\",\"remote_address\":\"192.168.50.140\",\"remote_port\":51004},\"time\":\"2026-10-14T12:00:00Z\",\"type\":\"request\"}",
            "timestamp": "2026-10-14T12:00:00Z", "X-Forwarded-For": "192.168.111.202",
            "_HOSTNAME": "prx-999-srv-vault-001", "_SYSTEMD_UNIT": "vault.service", "PRIORITY": "6"
          }
    outputs:
      - extract_from: final
        conditions:
          - type: vrl
            source: |
              assert_eq!(."event.action", "delete")
              assert_eq!(."event.type", ["info", "end"])
              assert_eq!(."user.name", "oidc-alice")
              assert_eq!(."user.email", "alice@example.com")
              # A request: its outcome is the response's.
              assert!(!exists(."event.outcome"))

  - name: Vault's own line
    inputs:
      - insert_at: journald
        type: vrl
        source: |
          . = {
            "message": "2026-10-14T12:00:00.000Z [WARN]  core: something odd",
            "timestamp": "2026-10-14T12:00:00Z", "X-Forwarded-For": "192.168.111.202",
            "_HOSTNAME": "prx-999-srv-vault-001", "_SYSTEMD_UNIT": "vault.service", "SYSLOG_IDENTIFIER": "vault", "PRIORITY": "4"
          }
    outputs:
      - extract_from: final
        conditions:
          - type: vrl
            source: |
              assert_eq!(."event.dataset", "vault.log")
              assert_eq!(."log.level", "warning")
              assert_eq!(."log.logger", "core")

  - name: Forgejo failed login through the proxy (no port)
    inputs:
      - insert_at: journald
        type: vrl
        source: |
          . = {
            "message": "2026/10/14 12:00:00 routers/web/auth/auth.go:220:SignInPost() [W] Failed authentication attempt for admin from 192.168.50.88: user does not exist [uid: 0, name: admin]",
            "timestamp": "2026-10-14T12:00:00Z", "X-Forwarded-For": "192.168.111.200",
            "_HOSTNAME": "prx-999-srv-git-001", "_SYSTEMD_UNIT": "forgejo.service", "SYSLOG_IDENTIFIER": "forgejo", "PRIORITY": "4"
          }
    outputs:
      - extract_from: final
        conditions:
          - type: vrl
            source: |
              assert_eq!(."event.dataset", "forgejo.log")
              assert_eq!(."event.provider", "forgejo")
              # The line as it came, like the other sources' parsers.
              assert_eq!(._msg, "2026/10/14 12:00:00 routers/web/auth/auth.go:220:SignInPost() [W] Failed authentication attempt for admin from 192.168.50.88: user does not exist [uid: 0, name: admin]")
              assert_eq!(."log.level", "warning")
              assert_eq!(."log.origin.file.name", "routers/web/auth/auth.go")
              assert_eq!(."log.origin.file.line", 220)
              assert_eq!(."log.origin.function", "SignInPost")
              assert_eq!(."event.action", "password-login")
              assert_eq!(."event.outcome", "failure")
              assert_eq!(."user.name", "admin")
              assert_eq!(."source.ip", "192.168.50.88")
              assert!(!exists(."source.port"))
              assert_eq!(."event.reason", "user does not exist [uid: 0, name: admin]")

  - name: Forgejo failed login as the journal has it (no console prefix, port 0)
    inputs:
      - insert_at: journald
        type: vrl
        source: |
          . = {
            "message": "Failed authentication attempt for hirednoobs from 192.168.50.140:0: user's password is invalid [uid: 1, name: HiredNoobs]",
            "timestamp": "2026-10-14T18:46:37Z", "X-Forwarded-For": "192.168.111.200",
            "_HOSTNAME": "prx-999-srv-git-001", "_SYSTEMD_UNIT": "forgejo.service", "SYSLOG_IDENTIFIER": "forgejo", "PRIORITY": "4",
            "CODE_FILE": "routers/web/auth/auth.go", "CODE_LINE": "220", "CODE_FUNC": "SignInPost"
          }
    outputs:
      - extract_from: final
        conditions:
          - type: vrl
            source: |
              assert_eq!(."event.dataset", "forgejo.log")
              assert_eq!(."event.kind", "event")
              assert_eq!(."event.action", "password-login")
              assert_eq!(."event.outcome", "failure")
              assert_eq!(."user.name", "hirednoobs")
              assert_eq!(."source.ip", "192.168.50.140")
              assert!(!exists(."source.port"))
              assert_eq!(."event.reason", "user's password is invalid [uid: 1, name: HiredNoobs]")
              assert_eq!(."log.level", "warning")
              assert_eq!(."log.origin.file.name", "routers/web/auth/auth.go")
              assert_eq!(."log.origin.function", "SignInPost")

  - name: Forgejo failed login straight to it (with a port)
    inputs:
      - insert_at: journald
        type: vrl
        source: |
          . = {
            "message": "2026/10/14 12:00:10 routers/web/auth/auth.go:220:SignInPost() [W] Failed authentication attempt for hirednoobs from 127.0.0.1:44330: password mismatch",
            "timestamp": "2026-10-14T12:00:10Z", "X-Forwarded-For": "192.168.111.200",
            "_HOSTNAME": "prx-999-srv-git-001", "_SYSTEMD_UNIT": "forgejo.service", "PRIORITY": "4"
          }
    outputs:
      - extract_from: final
        conditions:
          - type: vrl
            source: |
              assert_eq!(."source.ip", "127.0.0.1")
              assert_eq!(."source.port", 44330)
              assert_eq!(."event.reason", "password mismatch")

  - name: "format mismatch: a dated Forgejo line without its <file>:<line>:<function>()"
    inputs:
      - insert_at: journald
        type: vrl
        source: |
          . = {
            "message": "2026/10/14 12:00:20 [W] Failed authentication attempt for admin from 192.168.50.88: user does not exist",
            "timestamp": "2026-10-14T12:00:20Z", "X-Forwarded-For": "192.168.111.200",
            "_HOSTNAME": "prx-999-srv-git-001", "_SYSTEMD_UNIT": "forgejo.service", "PRIORITY": "4"
          }
    outputs:
      - extract_from: final
        conditions:
          - type: vrl
            source: |
              assert_eq!(."event.dataset", "forgejo.log")
              assert_eq!(."event.kind", "pipeline_error")
              assert_eq!(."error.type", "format_mismatch")

  - name: a Proxmox host's failed login (pvedaemon)
    inputs:
      - insert_at: journald
        type: vrl
        source: |
          # The message as Proxmox logs it (forum.proxmox.com, crowdsec's parser); the rest as
          # prx-999's own entries come through syslog_journal.
          . = {
            "message": "authentication failure; rhost=::ffff:192.168.50.66 user=admin@pve msg=no such user ('admin@pve')",
            "@timestamp": "2026-10-15T21:30:00.000001+00:00", "event.created": "2026-10-15T21:30:00.2+00:00",
            "X-Forwarded-For": "192.168.111.9", "_HOSTNAME": "prx-999", "_SYSTEMD_UNIT": "pvedaemon.service",
            "SYSLOG_IDENTIFIER": "pvedaemon", "SYSLOG_FACILITY": "3", "PRIORITY": "3", "_PID": "1109",
            "_COMM": "pvedaemon worke", "_TRANSPORT": "syslog", "MESSAGE": "authentication failure; rhost=::ffff:192.168.50.66 user=admin@pve msg=no such user ('admin@pve')"
          }
    outputs:
      - extract_from: final
        conditions:
          - type: vrl
            source: |
              assert_eq!(."event.dataset", "pvedaemon.log")
              assert_eq!(."event.provider", "pvedaemon")
              assert_eq!(."event.action", "login")
              assert_eq!(."event.outcome", "failure")
              assert_eq!(."event.category", ["authentication"])
              assert_eq!(."event.reason", "no such user ('admin@pve')")
              assert_eq!(."source.ip", "192.168.50.66")
              assert_eq!(."user.name", "admin")
              assert_eq!(."user.domain", "pve")
              assert_eq!(."related.ip", ["192.168.50.66"])
              assert_eq!(."host.hostname", "prx-999")
              assert_eq!(."log.level", "error")

  - name: a Proxmox host's login (pvedaemon, a real line)
    inputs:
      - insert_at: journald
        type: vrl
        source: |
          . = {
            "message": "<root@pam> successful auth for user 'root@pam'",
            "@timestamp": "2026-10-15T21:20:37.965942+00:00", "event.created": "2026-10-15T21:20:38.412306+00:00",
            "X-Forwarded-For": "192.168.111.9", "_HOSTNAME": "prx-999", "_SYSTEMD_UNIT": "pvedaemon.service",
            "SYSLOG_IDENTIFIER": "pvedaemon", "SYSLOG_FACILITY": "3", "PRIORITY": "6", "_PID": "1109",
            "_COMM": "pvedaemon worke", "_TRANSPORT": "syslog", "MESSAGE": "<root@pam> successful auth for user 'root@pam'"
          }
    outputs:
      - extract_from: final
        conditions:
          - type: vrl
            source: |
              assert_eq!(."event.dataset", "pvedaemon.log")
              assert_eq!(."event.action", "login")
              assert_eq!(."event.outcome", "success")
              assert_eq!(."user.name", "root")
              assert_eq!(."user.domain", "pam")
              assert_eq!(."related.user", ["root"])
              assert!(!exists(."source.ip"))
              assert!(!exists(."event.reason"))

  - name: a Proxmox task starting (pvedaemon, a real line)
    inputs:
      - insert_at: journald
        type: vrl
        source: |
          . = {
            "message": "<root@pam> starting task UPID:prx-999:0019BC92:03BF8AEC:6AD143A5:vncshell::root@pam:",
            "@timestamp": "2026-10-15T21:20:37.912593+00:00", "event.created": "2026-10-15T21:20:38.412306+00:00",
            "X-Forwarded-For": "192.168.111.9", "_HOSTNAME": "prx-999", "_SYSTEMD_UNIT": "pvedaemon.service",
            "SYSLOG_IDENTIFIER": "pvedaemon", "PRIORITY": "6", "_TRANSPORT": "syslog"
          }
    outputs:
      - extract_from: final
        conditions:
          - type: vrl
            source: |
              assert_eq!(."event.dataset", "pvedaemon.log")
              assert_eq!(."event.action", "vncshell")
              assert_eq!(."event.category", ["process"])
              assert_eq!(."event.type", ["start"])
              assert_eq!(."Task.Id", "UPID:prx-999:0019BC92:03BF8AEC:6AD143A5:vncshell::root@pam:")
              assert_eq!(."user.name", "root")
              assert_eq!(."user.domain", "pam")
              assert!(!exists(."Task.Target"))
              assert!(!exists(."event.outcome"))

  - name: a Proxmox task that ended OK (pvedaemon, a real line)
    inputs:
      - insert_at: journald
        type: vrl
        source: |
          . = {
            "message": "<root@pam> end task UPID:prx-999:0019BC92:03BF8AEC:6AD143A5:vncshell::root@pam: OK",
            "@timestamp": "2026-10-15T21:20:38.831383+00:00", "event.created": "2026-10-15T21:20:39.162325+00:00",
            "X-Forwarded-For": "192.168.111.9", "_HOSTNAME": "prx-999", "_SYSTEMD_UNIT": "pvedaemon.service",
            "SYSLOG_IDENTIFIER": "pvedaemon", "PRIORITY": "6", "_TRANSPORT": "syslog"
          }
    outputs:
      - extract_from: final
        conditions:
          - type: vrl
            source: |
              assert_eq!(."event.type", ["end"])
              assert_eq!(."event.outcome", "success")
              assert!(!exists(."error.message"))

  - name: a Proxmox task that failed (a scheduled backup, not a real line)
    inputs:
      - insert_at: journald
        type: vrl
        source: |
          . = {
            "message": "end task UPID:prx-001:00001234:0000ABCD:6AD14000:vzdump:101:root@pam: job errors",
            "@timestamp": "2026-10-15T23:00:00.000001+00:00", "event.created": "2026-10-15T23:00:00.2+00:00",
            "X-Forwarded-For": "192.168.111.2", "_HOSTNAME": "prx-001", "_SYSTEMD_UNIT": "pvescheduler.service",
            "SYSLOG_IDENTIFIER": "pvescheduler", "PRIORITY": "6", "_TRANSPORT": "syslog"
          }
    outputs:
      - extract_from: final
        conditions:
          - type: vrl
            source: |
              assert_eq!(."event.dataset", "pvescheduler.log")
              assert_eq!(."event.action", "vzdump")
              assert_eq!(."Task.Target", "101")
              assert_eq!(."event.outcome", "failure")
              assert_eq!(."error.message", "job errors")
              assert_eq!(."user.name", "root")

  - name: a Proxmox task that ended with warnings succeeded (not a real line)
    inputs:
      - insert_at: journald
        type: vrl
        source: |
          . = {
            "message": "<root@pam> end task UPID:prx-001:00001235:0000ABCE:6AD14001:qmstart:102:root@pam: WARNINGS: 1",
            "@timestamp": "2026-10-15T23:00:00.000001+00:00", "X-Forwarded-For": "192.168.111.2",
            "_HOSTNAME": "prx-001", "SYSLOG_IDENTIFIER": "pvedaemon", "PRIORITY": "6"
          }
    outputs:
      - extract_from: final
        conditions:
          - type: vrl
            source: |
              assert_eq!(."event.action", "qmstart")
              assert_eq!(."event.outcome", "success")
              assert!(!exists(."error.message"))

  - name: a Proxmox line that's neither a login nor a task
    inputs:
      - insert_at: journald
        type: vrl
        source: |
          . = {
            "message": "worker 1476877 finished",
            "@timestamp": "2026-10-15T21:11:55.358868+00:00", "X-Forwarded-For": "192.168.111.9",
            "_HOSTNAME": "prx-999", "SYSLOG_IDENTIFIER": "pveproxy", "PRIORITY": "6"
          }
    outputs:
      - extract_from: final
        conditions:
          - type: vrl
            source: |
              assert_eq!(."event.dataset", "pveproxy.log")
              assert!(!exists(."event.action"))
              assert!(!exists(."user.name"))

  # The corosync rules (vmalert-logs journald.yml) read these as they are.
  - name: a Proxmox host's corosync line stays as it is (not a real line)
    inputs:
      - insert_at: journald
        type: vrl
        source: |
          . = {
            "message": "  [KNET  ] link: host: 4 link: 0 is down",
            "@timestamp": "2026-10-16T08:00:00.000001+00:00", "X-Forwarded-For": "192.168.111.2",
            "_HOSTNAME": "prx-001", "_SYSTEMD_UNIT": "corosync.service", "SYSLOG_IDENTIFIER": "corosync",
            "PRIORITY": "6"
          }
    outputs:
      - extract_from: final
        conditions:
          - type: vrl
            source: |
              assert_eq!(."event.dataset", "journald.log")
              assert_eq!(."log.syslog.appname", "corosync")
              assert_eq!(."host.hostname", "prx-001")
              assert_eq!(._msg, "  [KNET  ] link: host: 4 link: 0 is down")

  - name: an entry the journal remap failed on is kept, its message, unit and machine
    inputs:
      - insert_at: unparsed
        type: vrl
        source: |
          . = {
            "message": "something", "@timestamp": "2026-10-14T12:00:00Z", "timestamp": t'2026-10-14T12:00:01Z',
            "X-Forwarded-For": "203.0.113.9, 192.168.111.201", "_HOSTNAME": "prx-999-srv-runner-001", "_SYSTEMD_UNIT": "cron.service",
            "metadata": {"dropped": {"component_id": "journald", "message": "boom", "reason": "error"}}
          }
    outputs:
      - extract_from: final
        conditions:
          - type: vrl
            source: |
              assert_eq!(."event.dataset", "journald.log")
              assert_eq!(."event.kind", "pipeline_error")
              assert_eq!(."error.message", "boom")
              assert_eq!(._msg, "something")
              assert_eq!(._time, "2026-10-14T12:00:00Z")
              assert_eq!(."Systemd.Unit", "cron.service")
              # The VM's own address: the last X-Forwarded-For entry.
              assert_eq!(."host.ip", "192.168.111.201")
              assert_eq!(."host.hostname", "prx-999-srv-runner-001")
              assert!(!exists(._HOSTNAME))
