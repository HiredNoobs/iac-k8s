  - name: a Proxmox host's journal entry (sshd) goes to the journal parser
    inputs:
      - insert_at: syslog_by_sender
        type: vrl
        source: |
          # As iac-homelab's proxmox/rsyslog.conf sends it (from a run of it in rsyslog 8.2001).
          . = {
            "message": s'<38>1 2026-10-15T18:00:00.123456+00:00 prx-001 journal - - - { "MESSAGE": "Accepted publickey for root from 192.168.50.140 port 51234 ssh2: ED25519 SHA256:abc", "PRIORITY": "6", "SYSLOG_FACILITY": "4", "SYSLOG_IDENTIFIER": "sshd-session", "_PID": "1234", "_COMM": "sshd-session", "_CMDLINE": "sshd-session: root [priv]", "_SYSTEMD_UNIT": "ssh.service", "_HOSTNAME": "prx-001", "_TRANSPORT": "syslog", "_BOOT_ID": "b00t", "_SYSTEMD_SLICE": "system.slice" }',
            "fromhost_ip": "192.168.111.2", "received": "2026-10-15T18:00:00.200000+00:00", "transport": "imtcp",
            "host": "10.244.3.8", "port": 41758, "source_type": "socket", "timestamp": t'2026-10-15T18:00:00.300Z'
          }
    outputs:
      - extract_from: final
        conditions:
          - type: vrl
            source: |
              assert_eq!(get!(., ["event.dataset"]), "sshd.log")
              assert_eq!(get!(., ["event.action"]), "ssh_login")
              assert_eq!(get!(., ["event.outcome"]), "success")
              assert_eq!(get!(., ["user.name"]), "root")
              assert_eq!(get!(., ["source.ip"]), "192.168.50.140")
              assert_eq!(._msg, "Accepted publickey for root from 192.168.50.140 port 51234 ssh2: ED25519 SHA256:abc")
              # When it was logged; when the relay got it.
              assert_eq!(._time, t'2026-10-15T18:00:00.123456Z')
              assert_eq!(get!(., ["event.created"]), t'2026-10-15T18:00:00.200Z')
              assert_eq!(get!(., ["host.hostname"]), "prx-001")
              assert_eq!(get!(., ["host.name"]), "prx-001.hirednoobs.com")
              assert_eq!(get!(., ["host.ip"]), "192.168.111.2")
              assert_eq!(get!(., ["host.boot.id"]), "b00t")
              assert_eq!(get!(., ["process.pid"]), 1234)
              assert_eq!(get!(., ["process.command_line"]), "sshd-session: root [priv]")
              assert_eq!(get!(., ["Systemd.Unit"]), "ssh.service")
              assert_eq!(get!(., ["Systemd.Journal.SystemdSlice"]), "system.slice")
              assert_eq!(get!(., ["log.level"]), "info")
              assert_eq!(get!(., ["log.syslog.facility.name"]), "auth")
              for_each(["message", "MESSAGE", "fromhost_ip", "received", "transport", "X-Forwarded-For", "@timestamp", "Log.Transport"]) -> |_i, k| { assert!(get!(., [k]) == null, "still there: " + k) }
              assert!(!exists(.tags))

