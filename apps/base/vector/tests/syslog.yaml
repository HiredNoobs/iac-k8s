            source: |
              assert_eq!(get!(., ["event.action"]), "dhcp-nak")
              assert_eq!(get!(., ["event.outcome"]), "failure")
              assert!(!exists(."client.domain"))

  - name: "router Wi-Fi, pairwise key handshake: the device is in (the sample)"
    inputs:
      - insert_at: syslog
        type: vrl
        source: |
          . = {
            "message": "<30>Oct 15 08:21:23 RT-BE86U-FFA0-1F4D20D-C hostapd: wl1.1: STA f4:d1:08:ab:66:34 WPA: pairwise key handshake completed (RSN)",
            "fromhost_ip": "192.168.111.1", "received": "2026-10-15T09:21:23.834+01:00", "transport": "imudp"
          }
    outputs:
      - extract_from: final
        conditions:
          - type: vrl
            source: |
              assert_eq!(get!(., ["client.mac"]), "F4-D1-08-AB-66-34")
              assert_eq!(get!(., ["event.action"]), "pairwise-key-handshake-completed")
              assert_eq!(get!(., ["event.category"]), ["authentication"])
              assert_eq!(get!(., ["event.type"]), ["start"])
              assert_eq!(get!(., ["event.outcome"]), "success")

  - name: router Wi-Fi, a WPS attempt (the sample)
    inputs:
      - insert_at: syslog
        type: vrl
        source: |
          . = {
            "message": "<30>Oct 15 08:21:23 RT-BE86U-FFA0-1F4D20D-C hostapd: wl0.1: STA d4:da:cd:7c:4c:3e IEEE 802.1X: Supplicant used different EAP type: 254 (expanded)",
            "fromhost_ip": "192.168.111.1", "received": "2026-10-15T09:21:23.834+01:00", "transport": "imudp"
          }
    outputs:
      - extract_from: final
        conditions:
