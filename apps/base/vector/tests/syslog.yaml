    outputs:
      - extract_from: final
        conditions:
          - type: vrl
            source: |
              assert_eq!(get!(., ["event.action"]), "dhcp-discover")
              assert_eq!(get!(., ["client.mac"]), "28-7B-11-05-6D-5E")
              assert!(!exists(."client.ip"))

