              assert_eq!(get!(., ["event.dataset"]), "pvedaemon.log")
              assert_eq!(get!(., ["event.action"]), "vncshell")
              assert_eq!(get!(., ["event.category"]), ["process"])
              assert_eq!(get!(., ["event.type"]), ["start"])
              assert_eq!(get!(., ["Task.Id"]), "UPID:prx-999:0019BC92:03BF8AEC:6AD143A5:vncshell::root@pam:")
              assert_eq!(get!(., ["user.name"]), "root")
              assert_eq!(get!(., ["user.domain"]), "pam")
              assert!(!exists(."Task.Target"))
              assert!(!exists(."event.outcome"))

  - name: a Proxmox task that ended OK (pvedaemon, a real line)
    inputs:
      - insert_at: journald
        type: vrl
        source: |
          . = {
            "message": "<root@pam> end task UPID:prx-999:0019BC92:03BF8AEC:6AD143A5:vncshell::root@pam: OK",
