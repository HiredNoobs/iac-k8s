# Unit tests for config/collector/coredns.yaml.
tests:
  - name: CoreDNS failed query (the sample)
    inputs:
      - insert_at: pods
        type: vrl
        source: |
          . = {
            "message": "[ERROR] plugin/errors: 2 pihole.hirednoobs.com. AAAA: read udp 10.244.0.16:48741->169.254.116.108:53: i/o timeout",
            "timestamp": t'2026-10-13T09:00:00.000Z', "stream": "stdout",
            "kubernetes": {"pod_namespace": "kube-system", "pod_name": "coredns-1", "container_name": "coredns"}
          }
    outputs:
      - extract_from: final
        conditions:
          - type: vrl
            source: |
              assert_eq!(."event.dataset", "coredns.log")
              assert_eq!(."log.level", "error")
              assert_eq!(."log.logger", "plugin/errors")
              assert_eq!(."event.outcome", "failure")
              # The first number is the response code (plugin/errors), by its name.
              assert_eq!(."dns.response_code", "SERVFAIL")
              assert!(!exists(."Dns.ErrorCount"))
              assert_eq!(."dns.question.name", "pihole.hirednoobs.com")
              assert_eq!(."dns.question.type", "AAAA")
              assert_eq!(."error.message", "read udp 10.244.0.16:48741->169.254.116.108:53: i/o timeout")
              assert_eq!(."destination.ip", "169.254.116.108")
              assert_eq!(."destination.port", 53)
              assert_eq!(."related.ip", ["169.254.116.108"])
              assert_eq!(."event.category", ["network"])
              assert_eq!(."event.type", ["protocol"])
              assert_eq!(."network.protocol", "dns")

  - name: CoreDNS consolidated errors line
    inputs:
      - insert_at: pods
        type: vrl
        source: |
          . = {
            "message": "[ERROR] plugin/errors: 3 errors like '^read udp .* i/o timeout$' occurred in last 5m0s",
            "timestamp": t'2026-10-13T09:00:00.000Z', "stream": "stdout",
            "kubernetes": {"pod_namespace": "kube-system", "pod_name": "coredns-1", "container_name": "coredns"}
          }
    outputs:
      - extract_from: final
        conditions:
          - type: vrl
            source: |
              assert_eq!(."event.kind", "event")
              assert_eq!(."event.outcome", "failure")
              assert_eq!(."Dns.ErrorCount", 3)
              assert_eq!(."error.message", "^read udp .* i/o timeout$")
              assert!(!exists(."dns.response_code"))

  - name: CoreDNS response code with no name stays a number
    inputs:
      - insert_at: pods
        type: vrl
        source: |
          . = {
            "message": "[ERROR] plugin/errors: 23 x.hirednoobs.com. A: bad cookie",
            "timestamp": t'2026-10-13T09:00:00.000Z', "stream": "stdout",
            "kubernetes": {"pod_namespace": "kube-system", "pod_name": "coredns-1", "container_name": "coredns"}
          }
    outputs:
      - extract_from: final
        conditions:
          - type: vrl
            source: |
              assert_eq!(."dns.response_code", "23")
              assert_eq!(."event.outcome", "failure")

  - name: CoreDNS other plugin line
    inputs:
      - insert_at: pods
        type: vrl
        source: |
          . = {
            "message": "[INFO] plugin/reload: Running configuration SHA512 = 1a2b",
            "timestamp": t'2026-10-13T09:00:00.000Z', "stream": "stdout",
            "kubernetes": {"pod_namespace": "kube-system", "pod_name": "coredns-1", "container_name": "coredns"}
          }
    outputs:
      - extract_from: final
        conditions:
          - type: vrl
            source: |
              assert_eq!(."log.level", "info")
              assert_eq!(."log.logger", "plugin/reload")
              assert!(!exists(."dns.question.name"))

  - name: "format mismatch: CoreDNS errors line that isn't a query"
    inputs:
      - insert_at: pods
        type: vrl
        source: |
          . = {
            "message": "[ERROR] plugin/errors: something new happened",
            "timestamp": t'2026-10-13T09:00:00.000Z', "stream": "stdout",
            "kubernetes": {"pod_namespace": "kube-system", "pod_name": "coredns-1", "container_name": "coredns"}
          }
    outputs:
      - extract_from: final
        conditions:
          - type: vrl
            source: |
              assert_eq!(."error.type", "format_mismatch")
              assert_eq!(."log.level", "error")

  - name: "format mismatch: CoreDNS bracketed line without a level"
    inputs:
      - insert_at: pods
        type: vrl
        source: |
          . = {
            "message": "[error] plugin/errors: 2 a. A: x",
            "timestamp": t'2026-10-13T09:00:00.000Z', "stream": "stdout",
            "kubernetes": {"pod_namespace": "kube-system", "pod_name": "coredns-1", "container_name": "coredns"}
          }
    outputs:
      - extract_from: final
        conditions:
          - type: vrl
            source: |
              assert_eq!(."error.message", "no [<LEVEL>] prefix")

  - name: CoreDNS banner line is fine
    inputs:
      - insert_at: pods
        type: vrl
        source: |
          . = {
            "message": "CoreDNS-1.12.4",
            "timestamp": t'2026-10-13T09:00:00.000Z', "stream": "stdout",
            "kubernetes": {"pod_namespace": "kube-system", "pod_name": "coredns-1", "container_name": "coredns"}
          }
    outputs:
      - extract_from: final
        conditions:
          - type: vrl
            source: |
              assert_eq!(."event.kind", "event")
