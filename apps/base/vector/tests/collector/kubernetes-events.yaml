# Unit tests for config/collector/kubernetes-events.yaml.
tests:
  - name: Kubernetes event from the kubelet, repeated
    inputs:
      - insert_at: pods
        type: vrl
        source: |
          . = {
            "message": "{\"type\":\"MODIFIED\",\"object\":{\"apiVersion\":\"v1\",\"count\":5,\"firstTimestamp\":\"2026-10-14T09:00:00Z\",\"involvedObject\":{\"apiVersion\":\"v1\",\"fieldPath\":\"spec.containers{app}\",\"kind\":\"Pod\",\"name\":\"app-7d9f-x2\",\"namespace\":\"homepage\",\"resourceVersion\":\"812\",\"uid\":\"p-1\"},\"kind\":\"Event\",\"lastTimestamp\":\"2026-10-14T09:04:00Z\",\"message\":\"Back-off restarting failed container app in pod app-7d9f-x2_homepage(p-1)\",\"metadata\":{\"creationTimestamp\":\"2026-10-14T09:00:00Z\",\"name\":\"app-7d9f-x2.17fe1\",\"namespace\":\"homepage\",\"resourceVersion\":\"990\",\"uid\":\"e-1\"},\"reason\":\"BackOff\",\"reportingComponent\":\"kubelet\",\"reportingInstance\":\"worker-3\",\"source\":{\"component\":\"kubelet\",\"host\":\"worker-3\"},\"type\":\"Warning\"}}",
            "timestamp": t'2026-10-14T09:04:00.200Z', "stream": "stdout",
            "kubernetes": {"pod_namespace": "kubectl", "pod_name": "events-1", "container_name": "events", "pod_node_name": "worker-1"}
          }
    outputs:
      - extract_from: final
        conditions:
          - type: vrl
            source: |
              assert_eq!(."event.dataset", "kubernetes.event")
              assert_eq!(."event.provider", "kubelet")
              assert_eq!(."event.kind", "event")
              assert_eq!(._msg, "Back-off restarting failed container app in pod app-7d9f-x2_homepage(p-1)")
              # When it last happened.
              assert_eq!(._time, t'2026-10-14T09:04:00Z')
              assert_eq!(."event.start", "2026-10-14T09:00:00Z")
              assert_eq!(."event.end", "2026-10-14T09:04:00Z")
              assert_eq!(."log.level", "warning")
              assert_eq!(."event.reason", "BackOff")
              assert_eq!(."event.id", "e-1")
              assert_eq!(."orchestrator.type", "kubernetes")
              assert_eq!(."orchestrator.resource.type", "pod")
              assert_eq!(."orchestrator.resource.name", "app-7d9f-x2")
              assert_eq!(."orchestrator.namespace", "homepage")
              assert_eq!(."orchestrator.resource.id", "p-1")
              assert_eq!(."orchestrator.api_version", "v1")
              assert_eq!(."container.name", "app")
              assert_eq!(."Orchestrator.Event.Count", 5)
              assert_eq!(."Orchestrator.Resource.ResourceVersion", "812")
              # The node it happened on, not kubectl's.
              assert_eq!(."host.hostname", "worker-3")
              assert_eq!(."host.name", "worker-3.hirednoobs.com")
              assert_eq!(.kubernetes.node.name, "worker-1")
              for_each(["apiVersion", "kind", "metadata", "involvedObject", "reason", "type", "source", "firstTimestamp", "lastTimestamp", "count", "reportingComponent", "reportingInstance"]) -> |_i, k| {
                assert!(get!(., [k]) == null, "still there: " + k)
              }
              assert!(!exists(."Orchestrator.Resource.FieldPath"))

  - name: Kubernetes event deleted (its TTL) isn't logged again
    no_outputs_from: [kubectl_changes]
    inputs:
      - insert_at: pods
        type: vrl
        source: |
          . = {
            "message": "{\"type\":\"DELETED\",\"object\":{\"apiVersion\":\"v1\",\"count\":5,\"firstTimestamp\":\"2026-10-14T09:00:00Z\",\"involvedObject\":{\"apiVersion\":\"v1\",\"kind\":\"Pod\",\"name\":\"app-7d9f-x2\",\"namespace\":\"homepage\",\"uid\":\"p-1\"},\"kind\":\"Event\",\"lastTimestamp\":\"2026-10-14T09:04:00Z\",\"message\":\"Back-off restarting failed container app in pod app-7d9f-x2_homepage(p-1)\",\"metadata\":{\"name\":\"app-7d9f-x2.17fe1\",\"namespace\":\"homepage\",\"uid\":\"e-1\"},\"reason\":\"BackOff\",\"reportingComponent\":\"kubelet\",\"source\":{\"component\":\"kubelet\",\"host\":\"worker-3\"},\"type\":\"Warning\"}}",
            "timestamp": t'2026-10-14T10:04:00.200Z', "stream": "stdout",
            "kubernetes": {"pod_namespace": "kubectl", "pod_name": "events-1", "container_name": "events", "pod_node_name": "worker-1"}
          }

  - name: Kubernetes event from the scheduler (events.k8s.io's fields)
    inputs:
      - insert_at: pods
        type: vrl
        source: |
          . = {
            "message": "{\"type\":\"ADDED\",\"object\":{\"action\":\"Binding\",\"apiVersion\":\"v1\",\"eventTime\":\"2026-10-14T09:00:00.123456Z\",\"firstTimestamp\":null,\"involvedObject\":{\"apiVersion\":\"v1\",\"kind\":\"Pod\",\"name\":\"app-7d9f-x2\",\"namespace\":\"homepage\",\"uid\":\"p-1\"},\"kind\":\"Event\",\"lastTimestamp\":null,\"message\":\"Successfully assigned homepage/app-7d9f-x2 to worker-3\",\"metadata\":{\"name\":\"app-7d9f-x2.17fe0\",\"namespace\":\"homepage\",\"uid\":\"e-2\"},\"reason\":\"Scheduled\",\"reportingComponent\":\"default-scheduler\",\"reportingInstance\":\"default-scheduler-cp-1\",\"source\":{},\"type\":\"Normal\"}}",
            "timestamp": t'2026-10-14T09:00:00.300Z', "stream": "stdout",
            "kubernetes": {"pod_namespace": "kubectl", "pod_name": "events-1", "container_name": "events", "pod_node_name": "worker-1"}
          }
    outputs:
      - extract_from: final
        conditions:
          - type: vrl
            source: |
              assert_eq!(."event.provider", "default-scheduler")
              assert_eq!(."event.action", "Binding")
              assert_eq!(."event.reason", "Scheduled")
              assert_eq!(."log.level", "info")
              assert_eq!(._time, t'2026-10-14T09:00:00.123456Z')
              assert_eq!(."event.start", "2026-10-14T09:00:00.123456Z")
              assert!(!exists(."event.end"))
              assert!(!exists(."Orchestrator.Event.Count"))
              assert_eq!(."Orchestrator.Event.ReportingInstance", "default-scheduler-cp-1")
              # Not a kubelet's: no node of its own, and not kubectl's.
              assert!(!exists(."host.hostname"))
              assert!(!exists(."host.name"))

  - name: Kubernetes event from Flux, with its annotations
    inputs:
      - insert_at: pods
        type: vrl
        source: |
          . = {
            "message": "{\"type\":\"ADDED\",\"object\":{\"apiVersion\":\"v1\",\"count\":1,\"firstTimestamp\":\"2026-10-14T09:00:00Z\",\"involvedObject\":{\"apiVersion\":\"kustomize.toolkit.fluxcd.io/v1\",\"kind\":\"Kustomization\",\"name\":\"apps\",\"namespace\":\"flux-system\",\"uid\":\"k-1\"},\"kind\":\"Event\",\"lastTimestamp\":\"2026-10-14T09:00:00Z\",\"message\":\"Reconciliation finished in 2.1s, next run in 10m0s\",\"metadata\":{\"annotations\":{\"kustomize.toolkit.fluxcd.io/revision\":\"master@sha1:e24edef\"},\"name\":\"apps.17fe2\",\"namespace\":\"flux-system\",\"uid\":\"e-3\"},\"reason\":\"ReconciliationSucceeded\",\"reportingComponent\":\"kustomize-controller\",\"source\":{\"component\":\"kustomize-controller\"},\"type\":\"Normal\"}}",
            "timestamp": t'2026-10-14T09:00:00.300Z', "stream": "stdout",
            "kubernetes": {"pod_namespace": "kubectl", "pod_name": "events-1", "container_name": "events", "pod_node_name": "worker-1"}
          }
    outputs:
      - extract_from: final
        conditions:
          - type: vrl
            source: |
              assert_eq!(."event.provider", "kustomize-controller")
              assert_eq!(."orchestrator.resource.type", "kustomization")
              assert_eq!(."orchestrator.api_version", "kustomize.toolkit.fluxcd.io/v1")
              assert_eq!(."Orchestrator.Event.Annotations", {"kustomize.toolkit.fluxcd.io/revision": "master@sha1:e24edef"})
              assert_eq!(."Orchestrator.Event.Name", "apps.17fe2")
              assert!(!exists(."container.name"))
              assert!(!exists(."host.hostname"))

  - name: Kubernetes event from the kubelet without source.host, on a pod's volume, a related object
    inputs:
      - insert_at: pods
        type: vrl
        source: |
          . = {
            "message": "{\"type\":\"ADDED\",\"object\":{\"apiVersion\":\"v1\",\"eventTime\":\"2026-10-14T10:00:00.000000Z\",\"involvedObject\":{\"apiVersion\":\"v1\",\"fieldPath\":\"spec.volumes{config}\",\"kind\":\"Pod\",\"name\":\"app-1\",\"namespace\":\"homepage\",\"uid\":\"p-2\"},\"kind\":\"Event\",\"message\":\"MountVolume.SetUp failed for volume \\\"config\\\"\",\"metadata\":{\"name\":\"app-1.18a\",\"namespace\":\"homepage\",\"uid\":\"e-4\"},\"reason\":\"FailedMount\",\"related\":{\"kind\":\"Node\",\"name\":\"worker-2\"},\"reportingComponent\":\"kubelet\",\"reportingInstance\":\"worker-2\",\"source\":{},\"type\":\"Warning\"}}",
            "timestamp": t'2026-10-14T10:00:00.200Z', "stream": "stdout",
            "kubernetes": {"pod_namespace": "kubectl", "pod_name": "events-1", "container_name": "events", "pod_node_name": "worker-1"}
          }
    outputs:
      - extract_from: final
        conditions:
          - type: vrl
            source: |
              # The kubelet that reported it.
              assert_eq!(."host.hostname", "worker-2")
              assert_eq!(."Orchestrator.Resource.FieldPath", "spec.volumes{config}")
              assert!(!exists(."container.name"))
              assert_eq!(."Orchestrator.Event.Related", {"kind": "Node", "name": "worker-2"})

  - name: kubectl's own message isn't an event
    inputs:
      - insert_at: pods
        type: vrl
        source: |
          . = {
            "message": "error: watch closed before UntilWithoutRetry timeout",
            "timestamp": t'2026-10-14T09:30:00.000Z', "stream": "stderr",
            "kubernetes": {"pod_namespace": "kubectl", "pod_name": "events-1", "container_name": "events", "pod_node_name": "worker-1"}
          }
    outputs:
      - extract_from: final
        conditions:
          - type: vrl
            source: |
              assert_eq!(."event.dataset", "kubectl.log")
              assert_eq!(."event.kind", "event")
              assert_eq!(."host.hostname", "worker-1")
              assert!(!exists(."orchestrator.type"))

  - name: kubectl's own klog line has its level
    inputs:
      - insert_at: pods
        type: vrl
        source: |
          . = {
            "message": "W1014 09:31:00.000000       1 reflector.go:561] k8s.io/client-go/tools/cache/reflector.go: watch of *v1.Event ended with: an error on the server",
            "timestamp": t'2026-10-14T09:31:00.000Z', "stream": "stderr",
            "kubernetes": {"pod_namespace": "kubectl", "pod_name": "events-1", "container_name": "events", "pod_node_name": "worker-1"}
          }
    outputs:
      - extract_from: final
        conditions:
          - type: vrl
            source: |
              assert_eq!(."event.dataset", "kubectl.log")
              assert_eq!(."log.level", "warning")
              assert_eq!(."log.origin.file.name", "reflector.go")
              assert_eq!(."log.origin.file.line", 561)

  - name: "format mismatch: JSON from kubectl that isn't an event"
    inputs:
      - insert_at: pods
        type: vrl
        source: |
          . = {
            "message": "{\"type\":\"ERROR\",\"object\":{\"kind\":\"Status\",\"message\":\"too old resource version\"}}",
            "timestamp": t'2026-10-14T09:30:00.000Z', "stream": "stdout",
            "kubernetes": {"pod_namespace": "kubectl", "pod_name": "events-1", "container_name": "events", "pod_node_name": "worker-1"}
          }
    outputs:
      - extract_from: final
        conditions:
          - type: vrl
            source: |
              assert_eq!(."event.dataset", "kubectl.log")
              assert_eq!(."event.kind", "pipeline_error")
              assert_eq!(."error.type", "format_mismatch")
