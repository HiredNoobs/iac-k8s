# Unit tests for config/collector/vaultwarden.yaml.
tests:
  - name: Vaultwarden failed login
    inputs:
      - insert_at: pods
        type: vrl
        source: |
          . = {
            "message": "[2026-10-13 12:20:01.123][vaultwarden::api::identity][ERROR] Username or password is incorrect. Try again. IP: 192.168.50.140. Username: bob@example.com.",
            "timestamp": t'2026-10-13T12:20:01.124Z', "stream": "stdout",
            "kubernetes": {"pod_namespace": "vaultwarden", "pod_name": "vaultwarden-0", "container_name": "vaultwarden"}
          }
    outputs:
      - extract_from: final
        conditions:
          - type: vrl
            source: |
              assert_eq!(."event.dataset", "vaultwarden.log")
              assert_eq!(."log.level", "error")
              assert_eq!(."log.logger", "vaultwarden::api::identity")
              assert_eq!(."event.action", "password-login")
              assert_eq!(."event.type", ["start"])
              assert_eq!(."event.outcome", "failure")
              assert_eq!(."source.ip", "192.168.50.140")
              assert_eq!(."user.name", "bob@example.com")

  - name: Vaultwarden WebSocket line (the sample)
    inputs:
      - insert_at: pods
        type: vrl
        source: |
          . = {
            "message": "[2026-10-13 12:16:49.552][vaultwarden::api::notifications][INFO] Closing WS connection from 192.168.50.140",
            "timestamp": t'2026-10-13T12:16:49.553Z', "stream": "stdout",
            "kubernetes": {"pod_namespace": "vaultwarden", "pod_name": "vaultwarden-0", "container_name": "vaultwarden"}
          }
    outputs:
      - extract_from: final
        conditions:
          - type: vrl
            source: |
              assert_eq!(."log.level", "info")
              assert_eq!(."source.ip", "192.168.50.140")
              assert!(!exists(."event.action"))

  - name: "format mismatch: Vaultwarden bracketed line without its prefix"
    inputs:
      - insert_at: pods
        type: vrl
        source: |
          . = {
            "message": "[2026-10-13 12:16:49.552] [INFO] Closing WS connection",
            "timestamp": t'2026-10-13T12:16:49.553Z', "stream": "stdout",
            "kubernetes": {"pod_namespace": "vaultwarden", "pod_name": "vaultwarden-0", "container_name": "vaultwarden"}
          }
    outputs:
      - extract_from: final
        conditions:
          - type: vrl
            source: |
              assert_eq!(."error.type", "format_mismatch")

  - name: Vaultwarden banner line is fine
    inputs:
      - insert_at: pods
        type: vrl
        source: |
          . = {
            "message": "/--------------------------------------------------------------------\\",
            "timestamp": t'2026-10-13T12:16:49.553Z', "stream": "stdout",
            "kubernetes": {"pod_namespace": "vaultwarden", "pod_name": "vaultwarden-0", "container_name": "vaultwarden"}
          }
    outputs:
      - extract_from: final
        conditions:
          - type: vrl
            source: |
              assert_eq!(."event.kind", "event")

  - name: Vaultwarden error's cause line is fine
    inputs:
      - insert_at: pods
        type: vrl
        source: |
          . = {
            "message": "[CAUSE] reqwest::Error {",
            "timestamp": t'2026-10-14T20:31:11.195Z', "stream": "stdout",
            "kubernetes": {"pod_namespace": "vaultwarden", "pod_name": "vaultwarden-0", "container_name": "vaultwarden"}
          }
    outputs:
      - extract_from: final
        conditions:
          - type: vrl
            source: |
              assert_eq!(."event.kind", "event")
