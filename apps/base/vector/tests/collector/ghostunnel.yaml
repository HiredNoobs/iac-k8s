# Unit tests for config/collector/ghostunnel.yaml.
tests:
  - name: ghostunnel pipe (the sample)
    inputs:
      - insert_at: pods
        type: vrl
        source: |
          . = {
            "message": "[1] 2026/10/13 07:49:16.884630 opening pipe: tcp:10.244.10.27:45578 [no cert] <-> tcp:127.0.0.1:17170 [no tls] ",
            "timestamp": t'2026-10-13T07:49:16.885Z', "stream": "stderr",
            "kubernetes": {"pod_namespace": "lldap", "pod_name": "lldap-0", "container_name": "ghostunnel"}
          }
    outputs:
      - extract_from: final
        conditions:
          - type: vrl
            source: |
              assert_eq!(."event.dataset", "ghostunnel.log")
              assert_eq!(."source.ip", "10.244.10.27")
              assert_eq!(."source.port", 45578)
              assert_eq!(."destination.ip", "127.0.0.1")
              assert_eq!(."destination.port", 17170)
