# Unit tests for config/collector/lldap.yaml.
tests:
  - name: lldap's own line (the sample)
    inputs:
      - insert_at: pods
        type: vrl
        source: |
          . = {
            "message": "2026-10-13T08:48:31.145935991+00:00  INFO     ｉ [info]: LDAP session start: b7181dbe-3cf0-4a51-b71c-0d74e82428e7",
            "timestamp": t'2026-10-13T08:48:31.146Z', "stream": "stdout",
            "kubernetes": {"pod_namespace": "lldap", "pod_name": "lldap-0", "container_name": "lldap"}
          }
    outputs:
      - extract_from: final
        conditions:
          - type: vrl
            source: |
              assert_eq!(."event.dataset", "lldap.log")
              assert_eq!(."log.level", "info")
              assert!(!exists(.level))

  - name: lldap login attempt (the sample)
    inputs:
      - insert_at: pods
        type: vrl
        source: |
          . = {
            "message": "2026-10-13T13:39:42.707344684+00:00  INFO     ｉ [info]: OPAQUE login attempt for \"hirednoobs\"",
            "timestamp": t'2026-10-13T13:39:42.707Z', "stream": "stdout",
            "kubernetes": {"pod_namespace": "lldap", "pod_name": "lldap-0", "container_name": "lldap"}
          }
    outputs:
      - extract_from: final
        conditions:
          - type: vrl
            source: |
              assert_eq!(."event.category", ["authentication"])
              assert_eq!(."event.action", "password-login")
              assert_eq!(."event.type", ["start"])
              assert_eq!(."event.outcome", "unknown")
              assert_eq!(."user.name", "hirednoobs")
              assert_eq!(."log.level", "info")

  - name: lldap's WARN level is warning
    inputs:
      - insert_at: pods
        type: vrl
        source: |
          . = {
            "message": "2026-10-13T08:48:31.145935991+00:00  WARN     ┕━ 🚧 [warn]: something",
            "timestamp": t'2026-10-13T08:48:31.146Z', "stream": "stdout",
            "kubernetes": {"pod_namespace": "lldap", "pod_name": "lldap-0", "container_name": "lldap"}
          }
    outputs:
      - extract_from: final
        conditions:
          - type: vrl
            source: |
              assert_eq!(."log.level", "warning")

  - name: lldap-bootstrap removed a user from a group
    inputs:
      - insert_at: pods
        type: vrl
        source: |
          . = {
            "message": "User \"mallory\" successfully removed from the group \"lldap_admin\" (1)",
            "timestamp": t'2026-10-13T09:17:02.000Z', "stream": "stdout",
            "kubernetes": {"pod_namespace": "lldap", "pod_name": "lldap-bootstrap-29340000-abcde", "container_name": "bootstrap"}
          }
    outputs:
      - extract_from: final
        conditions:
          - type: vrl
            source: |
              assert_eq!(."event.dataset", "lldap.bootstrap")
              assert_eq!(."event.provider", "lldap-bootstrap")
              assert_eq!(."event.category", ["iam"])
              assert_eq!(."event.action", "removed-from-group")
              assert_eq!(."event.type", ["group", "change"])
              assert_eq!(."user.name", "mallory")
              assert_eq!(."group.name", "lldap_admin")

  - name: lldap-bootstrap deleted a group
    inputs:
      - insert_at: pods
        type: vrl
        source: |
          . = {
            "message": "Group \"extra\" (7) successfully deleted",
            "timestamp": t'2026-10-13T09:17:02.000Z', "stream": "stdout",
            "kubernetes": {"pod_namespace": "lldap", "pod_name": "lldap-bootstrap-29340000-abcde", "container_name": "bootstrap"}
          }
    outputs:
      - extract_from: final
        conditions:
          - type: vrl
            source: |
              assert_eq!(."event.action", "group-deleted")
              assert_eq!(."event.type", ["group", "deletion"])
              assert_eq!(."group.name", "extra")
              assert!(!exists(."user.name"))

  - name: "format mismatch: lldap timestamped line without a level"
    inputs:
      - insert_at: pods
        type: vrl
        source: |
          . = {
            "message": "2026-10-13T08:48:31.145935991+00:00 [info] LDAP session start",
            "timestamp": t'2026-10-13T08:48:31.146Z', "stream": "stdout",
            "kubernetes": {"pod_namespace": "lldap", "pod_name": "lldap-0", "container_name": "lldap"}
          }
    outputs:
      - extract_from: final
        conditions:
          - type: vrl
            source: |
              assert_eq!(."error.type", "format_mismatch")

  - name: lldap startup line is fine
    inputs:
      - insert_at: pods
        type: vrl
        source: |
          . = {
            "message": "> Starting lldap..",
            "timestamp": t'2026-10-13T08:48:31.146Z', "stream": "stdout",
            "kubernetes": {"pod_namespace": "lldap", "pod_name": "lldap-0", "container_name": "lldap"}
          }
    outputs:
      - extract_from: final
        conditions:
          - type: vrl
            source: |
              assert_eq!(."event.kind", "event")
