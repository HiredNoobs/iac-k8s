# Unit tests for config/collector/hubble.yaml, on lines from production's agents (the node's
# labels shortened).
tests:
  - name: Hubble flow, dropped, the source's namespace from its labels
    inputs:
      - insert_at: pods
        type: vrl
        source: |
          . = {
            "message": encode_json({"flow": {"time": "2026-11-22T11:17:42.347449564Z", "uuid": "70438686-7118-4069-a0c5-9e19984feae5", "emitter": {"name": "Hubble", "version": "1.20.4+gbeb276d2"}, "verdict": "DROPPED", "drop_reason": 139, "ethernet": {"source": "92:8a:1e:53:84:28", "destination": "33:33:ff:53:84:28"}, "IP": {"source": "::", "destination": "ff02::1:ff53:8428", "ipVersion": "IPv6"}, "l4": {"ICMPv6": {"type": 135}}, "source": {"identity": 4162, "cluster_name": "default", "labels": ["gen:io.cilium.k8s.named-ports=http-metrics.TCP.9598_talos.TCP.6050", "k8s:app.kubernetes.io/component=collector", "k8s:app.kubernetes.io/name=vector", "k8s:io.cilium.k8s.namespace.labels.kubernetes.io/metadata.name=vector", "k8s:io.cilium.k8s.namespace.labels.kustomize.toolkit.fluxcd.io/name=apps", "k8s:io.cilium.k8s.namespace.labels.kustomize.toolkit.fluxcd.io/namespace=flux-system", "k8s:io.cilium.k8s.namespace.labels.pod-security.kubernetes.io/enforce=privileged", "k8s:io.cilium.k8s.policy.cluster=default", "k8s:io.cilium.k8s.policy.serviceaccount=vector", "k8s:io.kubernetes.pod.namespace=vector", "k8s:vector.dev/exclude=true"]}, "destination": {"labels": ["reserved:unknown"]}, "Type": "L3_L4", "node_name": "prx-003-srv-prod-core-worker-002", "node_labels": ["beta.kubernetes.io/arch=amd64", "beta.kubernetes.io/os=linux"], "event_type": {"type": 1, "sub_type": 139}, "traffic_direction": "INGRESS", "file": {"name": "bpf_lxc.c", "line": 1832}, "drop_reason_desc": "UNSUPPORTED_L3_PROTOCOL", "Summary": "ICMPv6 NeighborSolicitation"}, "node_name": "prx-003-srv-prod-core-worker-002", "time": "2026-11-22T11:17:42.347449564Z"}),
            "timestamp": t'2026-11-22T11:17:42.400Z', "stream": "stdout",
            "kubernetes": {"pod_namespace": "kube-system", "pod_name": "cilium-47ph2", "container_name": "cilium-agent", "pod_node_name": "prx-003-srv-prod-core-worker-002"}
          }
    outputs:
      - extract_from: final
        conditions:
          - type: vrl
            source: |
              assert_eq!(."event.dataset", "hubble.flow")
              assert_eq!(."event.provider", "hubble")
              assert_eq!(."event.kind", "event")
              assert_eq!(._time, t'2026-11-22T11:17:42.347449564Z')
              assert_eq!(."host.hostname", "prx-003-srv-prod-core-worker-002")
              assert_eq!(."event.category", ["network"])
              assert_eq!(."event.type", ["connection", "denied"])
              assert_eq!(."event.action", "dropped")
              assert_eq!(."event.reason", "UNSUPPORTED_L3_PROTOCOL")
              assert_eq!(."event.id", "70438686-7118-4069-a0c5-9e19984feae5")
              assert_eq!(."source.ip", "::")
              assert_eq!(."destination.ip", "ff02::1:ff53:8428")
              assert_eq!(."related.ip", ["::", "ff02::1:ff53:8428"])
              assert_eq!(."network.type", "ipv6")
              assert_eq!(."network.transport", "ipv6-icmp")
              assert!(!exists(."source.port"))
              # No namespace or pod from Hubble, the pod's namespace label.
              assert_eq!(."Source.Namespace", "vector")
              assert!(!exists(."Source.Pod"))
              assert!(!exists(."Source.Entities"))
              assert_eq!(."Source.Identity", 4162)
              assert_eq!(."Destination.Entities", ["unknown"])
              assert!(!exists(."Destination.Namespace"))
              assert_eq!(._msg, "DROPPED :: (vector) -> ff02::1:ff53:8428 (unknown): ICMPv6 NeighborSolicitation (UNSUPPORTED_L3_PROTOCOL)")
              assert_eq!(."Flow.traffic_direction", "INGRESS")
              assert_eq!(."Flow.file.name", "bpf_lxc.c")
              assert_eq!(."Flow.file.line", 1832)
              assert_eq!(."Flow.l4.ICMPv6.type", 135)
              assert!(!exists(.flow))
              assert!(!exists(.node_name))
              assert!(!exists(."Flow.node_labels"))
              assert!(!exists(."Flow.source"))
              assert!(!exists(."Flow.ethernet.source"))

  - name: Hubble flow, from outside the cluster to a pod
    inputs:
      - insert_at: pods
        type: vrl
        source: |
          . = {
            "message": encode_json({"flow": {"time": "2026-11-22T12:33:02.366839055Z", "uuid": "17d70e03-d1a9-479c-a4d2-c7fd0b3101c6", "emitter": {"name": "Hubble", "version": "1.20.4+gbeb276d2"}, "verdict": "FORWARDED", "ethernet": {"source": "96:fe:c3:70:e4:07", "destination": "6e:cb:38:95:ea:8f"}, "IP": {"source": "192.168.111.1", "destination": "10.245.8.10", "ipVersion": "IPv4"}, "l4": {"UDP": {"source_port": 28244, "destination_port": 53}}, "source": {"identity": 2, "labels": ["reserved:world"]}, "destination": {"ID": 1265, "identity": 34075, "cluster_name": "default", "namespace": "pihole", "labels": ["gen:io.cilium.k8s.named-ports=dns-tcp.TCP.53_dns-udp.UDP.53_https.TCP.443", "k8s:app.kubernetes.io/name=pihole", "k8s:io.cilium.k8s.namespace.labels.kubernetes.io/metadata.name=pihole", "k8s:io.cilium.k8s.namespace.labels.kustomize.toolkit.fluxcd.io/name=apps", "k8s:io.cilium.k8s.namespace.labels.kustomize.toolkit.fluxcd.io/namespace=flux-system", "k8s:io.cilium.k8s.namespace.labels.pod-security.kubernetes.io/enforce=baseline", "k8s:io.cilium.k8s.policy.cluster=default", "k8s:io.cilium.k8s.policy.serviceaccount=default", "k8s:io.kubernetes.pod.namespace=pihole"], "pod_name": "pihole-0", "workloads": [{"name": "pihole", "kind": "StatefulSet"}]}, "Type": "L3_L4", "node_name": "prx-002-srv-prod-core-worker-001", "node_labels": ["beta.kubernetes.io/arch=amd64", "beta.kubernetes.io/os=linux"], "event_type": {"type": 4}, "traffic_direction": "EGRESS", "trace_observation_point": "TO_ENDPOINT", "trace_reason": "NEW", "is_reply": false, "interface": {"index": 56, "name": "lxc376bd2c39e59"}, "Summary": "UDP"}, "node_name": "prx-002-srv-prod-core-worker-001", "time": "2026-11-22T12:33:02.366839055Z"}),
            "timestamp": t'2026-11-22T12:33:02.400Z', "stream": "stdout",
            "kubernetes": {"pod_namespace": "kube-system", "pod_name": "cilium-5ghkm", "container_name": "cilium-agent", "pod_node_name": "prx-002-srv-prod-core-worker-001"}
          }
    outputs:
      - extract_from: final
        conditions:
          - type: vrl
            source: |
              assert_eq!(."event.dataset", "hubble.flow")
              assert_eq!(."event.type", ["connection", "allowed"])
              assert_eq!(."event.action", "forwarded")
              assert!(!exists(."event.reason"))
              assert_eq!(."source.ip", "192.168.111.1")
              assert_eq!(."source.port", 28244)
              assert_eq!(."destination.ip", "10.245.8.10")
              assert_eq!(."destination.port", 53)
              assert_eq!(."network.type", "ipv4")
              assert_eq!(."network.transport", "udp")
              assert_eq!(."Source.Entities", ["world"])
              assert_eq!(."Source.Identity", 2)
              assert!(!exists(."Source.Namespace"))
              assert_eq!(."Destination.Namespace", "pihole")
              assert_eq!(."Destination.Pod", "pihole-0")
              assert_eq!(."Destination.Workload.Kind", "StatefulSet")
              assert_eq!(."Destination.Workload.Name", "pihole")
              assert!(!exists(."Destination.Entities"))
              assert_eq!(._msg, "FORWARDED 192.168.111.1:28244 (world) -> 10.245.8.10:53 (pihole/pihole-0): UDP")
              # Only the ports were in l4.
              assert!(!exists(."Flow.l4.UDP.source_port"))
              assert_eq!(."Flow.is_reply", false)
