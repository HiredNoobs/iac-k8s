# Unit tests for config/collector/generic.yaml (how to run them: tests/collector/pipeline.yaml).
tests:
  - name: "klog structured line (the csi-snapshotter sample)"
    inputs:
      - insert_at: pods
        type: vrl
        source: |
          . = {
            "message": "E1014 11:28:39.910225       1 reflector.go:227] \"Failed to watch\" err=\"failed to list *v1.VolumeSnapshotClass: the server could not find the requested resource (get volumesnapshotclasses.snapshot.storage.k8s.io)\" logger=\"UnhandledError\" reflector=\"github.com/kubernetes-csi/external-snapshotter/client/v8/informers/externalversions/factory.go:143\" type=\"*v1.VolumeSnapshotClass\"",
            "timestamp": t'2026-10-15T08:00:00.500Z', "stream": "stderr",
            "kubernetes": {"pod_namespace": "longhorn-system", "pod_name": "x-1", "container_name": "csi-snapshotter"}
          }
    outputs:
      - extract_from: final
        conditions:
          - type: vrl
            source: |
              assert_eq!(get!(., ["log.level"]), "error")
              assert_eq!(._msg, "Failed to watch")
              assert_eq!(get!(., ["error.message"]), "failed to list *v1.VolumeSnapshotClass: the server could not find the requested resource (get volumesnapshotclasses.snapshot.storage.k8s.io)")
              assert_eq!(get!(., ["log.logger"]), "UnhandledError")
              assert_eq!(.reflector, "github.com/kubernetes-csi/external-snapshotter/client/v8/informers/externalversions/factory.go:143")
              assert_eq!(.type, "*v1.VolumeSnapshotClass")
              assert_eq!(get!(., ["log.origin.file.name"]), "reflector.go")
              assert_eq!(get!(., ["log.origin.file.line"]), 227)
              assert_eq!(get!(., ["event.original"]), "E1014 11:28:39.910225       1 reflector.go:227] \"Failed to watch\" err=\"failed to list *v1.VolumeSnapshotClass: the server could not find the requested resource (get volumesnapshotclasses.snapshot.storage.k8s.io)\" logger=\"UnhandledError\" reflector=\"github.com/kubernetes-csi/external-snapshotter/client/v8/informers/externalversions/factory.go:143\" type=\"*v1.VolumeSnapshotClass\"")
              assert_eq!(.tags, ["generic"])
              assert!(!exists(.err))
              assert!(!exists(.logger))
              assert_eq!(._time, t'2026-10-15T08:00:00.500Z')

  - name: "klog structured line, quotes inside a value (the kube-controller-manager sample)"
    inputs:
      - insert_at: pods
        type: vrl
        source: |
          . = {
            "message": "E1015 03:17:04.429037       1 cronjob_controllerv2.go:202] \"Unhandled Error\" err=\"error syncing CronJobController lldap/lldap-bootstrap, requeuing: Operation cannot be fulfilled on cronjobs.batch \\\"lldap-bootstrap\\\": the object has been modified\" logger=\"UnhandledError\"",
            "timestamp": t'2026-10-15T08:00:00.500Z', "stream": "stderr",
            "kubernetes": {"pod_namespace": "kube-system", "pod_name": "x-1", "container_name": "kube-controller-manager"}
          }
    outputs:
      - extract_from: final
        conditions:
          - type: vrl
            source: |
              assert_eq!(._msg, "Unhandled Error")
              assert_eq!(get!(., ["error.message"]), "error syncing CronJobController lldap/lldap-bootstrap, requeuing: Operation cannot be fulfilled on cronjobs.batch \"lldap-bootstrap\": the object has been modified")

  - name: "klog plain line (the kube-apiserver sample)"
    inputs:
      - insert_at: pods
        type: vrl
        source: |
          . = {
            "message": "I1014 15:45:34.240357       1 cidrallocator.go:278] updated ClusterIP allocator for Service CIDR 10.96.0.0/12",
            "timestamp": t'2026-10-15T08:00:00.500Z', "stream": "stderr",
            "kubernetes": {"pod_namespace": "kube-system", "pod_name": "x-1", "container_name": "kube-apiserver"}
          }
    outputs:
      - extract_from: final
        conditions:
          - type: vrl
            source: |
              assert_eq!(get!(., ["log.level"]), "info")
              assert_eq!(._msg, "updated ClusterIP allocator for Service CIDR 10.96.0.0/12")
              assert_eq!(get!(., ["log.origin.file.name"]), "cidrallocator.go")
              assert_eq!(get!(., ["event.original"]), "I1014 15:45:34.240357       1 cidrallocator.go:278] updated ClusterIP allocator for Service CIDR 10.96.0.0/12")

  - name: "klog client-go warning is a warning (the longhorn-manager sample)"
    inputs:
      - insert_at: pods
        type: vrl
        source: |
          . = {
            "message": "I1015 00:00:23.342226       1 warnings.go:107] \"Warning: v1 Endpoints is deprecated in v1.33+; use discovery.k8s.io/v1 EndpointSlice\"",
            "timestamp": t'2026-10-15T08:00:00.500Z', "stream": "stderr",
            "kubernetes": {"pod_namespace": "longhorn-system", "pod_name": "x-1", "container_name": "longhorn-manager"}
          }
    outputs:
      - extract_from: final
        conditions:
          - type: vrl
            source: |
              assert_eq!(get!(., ["log.level"]), "warning")
              assert_eq!(._msg, "Warning: v1 Endpoints is deprecated in v1.33+; use discovery.k8s.io/v1 EndpointSlice")

