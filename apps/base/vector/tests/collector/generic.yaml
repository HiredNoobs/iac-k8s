  - name: "a line in none of the formats is left as it is (the homepage banner)"
    inputs:
      - insert_at: pods
        type: vrl
        source: |
          . = {
            "message": "- Local:         http://[::1]:3000",
            "timestamp": t'2026-10-15T08:00:00.500Z', "stream": "stderr",
