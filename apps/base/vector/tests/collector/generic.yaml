              assert_eq!(._msg, "Size of /etc/pihole/pihole-FTL.db is 0.36 MB, deleted 0 of 4907 rows")
              assert_eq!(get!(., ["process.pid"]), 184)
              assert_eq!(get!(., ["process.thread.id"]), 186)

