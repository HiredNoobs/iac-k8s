            "message": "2026-10-14 17:38:00.360 BST crond: USER root pid 563550 cmd PATH=\"$PATH:/usr/sbin:/usr/local/bin/\" pihole updatechecker",
            "timestamp": t'2026-10-15T08:00:00.500Z', "stream": "stderr",
