            "message": "2026-10-14T19:16:55.494Z\tinfo\tVictoriaMetrics/lib/promscrape/scraper.go:433\tkubernetes_sd_configs: added targets: 2, removed targets: 3; total targets: 75",
            "timestamp": t'2026-10-15T08:00:00.500Z', "stream": "stderr",
