        source: |
          . = {
            "message": "2026-10-15T00:17:00.888Z\tinfo\tprovider\tkubernetes/controller.go:1263\tprocessing OIDC HMAC Secret\t{\"runner\": \"provider\", \"namespace\": \"envoy-gateway\", \"name\": \"envoy-oidc-hmac\"}",
            "timestamp": t'2026-10-15T08:00:00.500Z', "stream": "stderr",
            "kubernetes": {"pod_namespace": "envoy-gateway", "pod_name": "x-1", "container_name": "envoy-gateway"}
          }
    outputs:
      - extract_from: final
        conditions:
          - type: vrl
            source: |
              assert_eq!(get!(., ["log.level"]), "info")
              assert_eq!(get!(., ["log.logger"]), "provider")
              assert_eq!(get!(., ["log.origin.file.name"]), "kubernetes/controller.go")
              assert_eq!(get!(., ["log.origin.file.line"]), 1263)
              assert_eq!(._msg, "processing OIDC HMAC Secret")
              assert_eq!(.runner, "provider")
              assert_eq!(.namespace, "envoy-gateway")
              assert_eq!(.name, "envoy-oidc-hmac")
              assert_eq!(get!(., ["event.original"]), "2026-10-15T00:17:00.888Z\tinfo\tprovider\tkubernetes/controller.go:1263\tprocessing OIDC HMAC Secret\t{\"runner\": \"provider\", \"namespace\": \"envoy-gateway\", \"name\": \"envoy-oidc-hmac\"}")

