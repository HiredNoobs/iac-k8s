              assert_eq!(._msg, "kubernetes_sd_configs: added targets: 2, removed targets: 3; total targets: 75")

  - name: "zap console line without a caller, a logger and fields (the RabbitMQ topology operator sample)"
    inputs:
      - insert_at: pods
        type: vrl
        source: |
          . = {
            "message": "2026-10-14T19:02:33Z\tDEBUG\tevents\tEvent occurred\t{\"object\": {\"name\":\"contentbot\",\"namespace\":\"rabbitmq\"}, \"kind\": \"User\", \"apiVersion\": \"rabbitmq.com/v1beta1\", \"type\": \"Normal\", \"reason\": \"PasswordUpdated\", \"action\": \"update\", \"note\": \"synced password for user \\\"contentbot\\\"\"}",
            "timestamp": t'2026-10-15T08:00:00.500Z', "stream": "stderr",
            "kubernetes": {"pod_namespace": "rabbitmq-system", "pod_name": "x-1", "container_name": "manager"}
          }
    outputs:
      - extract_from: final
        conditions:
          - type: vrl
            source: |
              assert_eq!(get!(., ["log.level"]), "debug")
              assert_eq!(get!(., ["log.logger"]), "events")
              assert_eq!(._msg, "Event occurred")
              assert_eq!(.reason, "PasswordUpdated")
              assert_eq!(.object, {"name": "contentbot", "namespace": "rabbitmq"})
              assert_eq!(.note, "synced password for user \"contentbot\"")

  - name: "zap console line without a caller or logger, a controller's fields (the RabbitMQ topology operator sample)"
    inputs:
      - insert_at: pods
        type: vrl
        source: |
          . = {
            "message": "2026-10-14T19:02:33Z\tINFO\tFinished reconciling\t{\"controller\": \"user\", \"controllerGroup\": \"rabbitmq.com\", \"controllerKind\": \"User\", \"User\": {\"name\":\"contentbot\",\"namespace\":\"rabbitmq\"}, \"namespace\": \"rabbitmq\", \"name\": \"contentbot\", \"reconcileID\": \"6b343405-f8bb-4ecc-bcda-32608de5a5e7\"}",
            "timestamp": t'2026-10-15T08:00:00.500Z', "stream": "stderr",
            "kubernetes": {"pod_namespace": "rabbitmq-system", "pod_name": "x-1", "container_name": "manager"}
          }
    outputs:
      - extract_from: final
        conditions:
          - type: vrl
            source: |
              assert_eq!(get!(., ["log.level"]), "info")
              assert!(!exists(."log.logger"))
              assert_eq!(._msg, "Finished reconciling")
              assert_eq!(get!(., ["orchestrator.resource.type"]), "user")
              assert_eq!(get!(., ["orchestrator.resource.name"]), "contentbot")
              assert_eq!(get!(., ["trace.id"]), "6b343405-f8bb-4ecc-bcda-32608de5a5e7")
              assert!(!exists(.User))

