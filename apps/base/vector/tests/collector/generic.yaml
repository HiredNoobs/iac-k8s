            "timestamp": t'2026-10-15T08:00:00.500Z', "stream": "stderr",
            "kubernetes": {"pod_namespace": "kube-vip", "pod_name": "x-1", "container_name": "kube-vip"}
          }
    outputs:
      - extract_from: final
        conditions:
          - type: vrl
            source: |
              assert_eq!(get!(., ["log.level"]), "info")
              assert_eq!(._msg, "new leader")
              assert_eq!(.leader, "prx-001-srv-prod-core-worker-002")
              assert_eq!(.service, "rsyslog")
              assert_eq!(.uid, "42dfedcc-1d30-4700-b8ff-659e2f0fa42b")
              assert_eq!(get!(., ["event.original"]), "2026/10/14 15:29:38 INFO new leader leader=prx-001-srv-prod-core-worker-002 service=rsyslog uid=42dfedcc-1d30-4700-b8ff-659e2f0fa42b")

  - name: "Go slog text line with an error (the longhorn-manager sample)"
    inputs:
      - insert_at: pods
        type: vrl
        source: |
          . = {
            "message": "2026/10/15 00:05:49 INFO smartctl failed device=/dev/sdb err=\"exit status 4\"",
            "timestamp": t'2026-10-15T08:00:00.500Z', "stream": "stderr",
            "kubernetes": {"pod_namespace": "longhorn-system", "pod_name": "x-1", "container_name": "longhorn-manager"}
          }
    outputs:
      - extract_from: final
        conditions:
          - type: vrl
            source: |
              assert_eq!(get!(., ["log.level"]), "info")
              assert_eq!(._msg, "smartctl failed")
              assert_eq!(.device, "/dev/sdb")
              assert_eq!(get!(., ["error.message"]), "exit status 4")

  - name: "Go slog text line without pairs"
    inputs:
      - insert_at: pods
        type: vrl
        source: |
          . = {
            "message": "2026/10/14 15:29:36 INFO starting",
            "timestamp": t'2026-10-15T08:00:00.500Z', "stream": "stderr",
            "kubernetes": {"pod_namespace": "kube-vip", "pod_name": "x-1", "container_name": "kube-vip"}
          }
    outputs:
      - extract_from: final
        conditions:
          - type: vrl
            source: |
              assert_eq!(._msg, "starting")

  - name: "logfmt line of a Longhorn replica (the instance-manager sample)"
    inputs:
      - insert_at: pods
        type: vrl
        source: |
          . = {
            "message": "[pvc-3aa517c6-d71d-49d1-b523-29aebecd2d53-r-0c677d08] time=\"2026-10-15T00:00:31.071971522Z\" level=info msg=\"Starting hashing snapshot backup-n-ada89a9d-d5ec-4f5a-a181-fa444666d046\" func=\"replica.(*SnapshotHashJob).Execute\" file=\"hash.go:198\"",
            "timestamp": t'2026-10-15T08:00:00.500Z', "stream": "stderr",
            "kubernetes": {"pod_namespace": "longhorn-system", "pod_name": "x-1", "container_name": "instance-manager"}
          }
    outputs:
      - extract_from: final
        conditions:
          - type: vrl
            source: |
              assert_eq!(get!(., ["log.level"]), "info")
              assert_eq!(._msg, "Starting hashing snapshot backup-n-ada89a9d-d5ec-4f5a-a181-fa444666d046")
              assert_eq!(._time, t'2026-10-15T00:00:31.071971522Z')
              assert_eq!(get!(., ["Storage.Volume.Name"]), "pvc-3aa517c6-d71d-49d1-b523-29aebecd2d53")
              assert_eq!(get!(., ["Storage.Replica.Name"]), "pvc-3aa517c6-d71d-49d1-b523-29aebecd2d53-r-0c677d08")
              assert!(!exists(."Storage.Engine.Name"))
              assert_eq!(get!(., ["log.origin.function"]), "replica.(*SnapshotHashJob).Execute")
              assert_eq!(get!(., ["log.origin.file.name"]), "hash.go")
              assert_eq!(get!(., ["log.origin.file.line"]), 198)
              for_each(["time", "level", "msg", "func", "file"]) -> |_i, k| { assert!(get!(., [k]) == null, "still there: " + k) }
              assert_eq!(get!(., ["event.original"]), "[pvc-3aa517c6-d71d-49d1-b523-29aebecd2d53-r-0c677d08] time=\"2026-10-15T00:00:31.071971522Z\" level=info msg=\"Starting hashing snapshot backup-n-ada89a9d-d5ec-4f5a-a181-fa444666d046\" func=\"replica.(*SnapshotHashJob).Execute\" file=\"hash.go:198\"")

  - name: "logfmt line with its own pairs (the Longhorn backup job sample)"
    inputs:
      - insert_at: pods
        type: vrl
        source: |
          . = {
            "message": "time=\"2026-10-15T03:00:00.88019806Z\" level=info msg=\"Creating volume job\" func=recurringjob.startVolumeJob file=\"volume.go:84\" concurrent=2 executionCount=9 groups=default job=backup-nightly parameters=\"map[]\" retain=5 task=backup volumeName=pvc-5bc09534-d459-4153-80b0-6aff5b9ed49d",
            "timestamp": t'2026-10-15T08:00:00.500Z', "stream": "stderr",
            "kubernetes": {"pod_namespace": "longhorn-system", "pod_name": "x-1", "container_name": "backup-nightly"}
          }
    outputs:
      - extract_from: final
        conditions:
          - type: vrl
            source: |
              assert_eq!(._msg, "Creating volume job")
              assert_eq!(.job, "backup-nightly")
              assert_eq!(.volumeName, "pvc-5bc09534-d459-4153-80b0-6aff5b9ed49d")
              assert_eq!(.concurrent, "2")
              assert!(!exists(."Storage.Volume.Name"))

  - name: "Python logging line (the contentbot sample)"
    inputs:
      - insert_at: pods
        type: vrl
        source: |
          . = {
            "message": "2026-10-15 00:20:49,408 INFO [async_client.py:_receive_packet():L433] Received packet PING data ",
            "timestamp": t'2026-10-15T08:00:00.500Z', "stream": "stderr",
            "kubernetes": {"pod_namespace": "contentbot", "pod_name": "x-1", "container_name": "chatbot"}
          }
    outputs:
      - extract_from: final
        conditions:
          - type: vrl
            source: |
              assert_eq!(get!(., ["log.level"]), "info")
              assert_eq!(._msg, "Received packet PING data ")
              assert_eq!(get!(., ["log.origin.file.name"]), "async_client.py")
              assert_eq!(get!(., ["log.origin.function"]), "_receive_packet")
              assert_eq!(get!(., ["log.origin.file.line"]), 433)

  - name: "Pi-hole FTL line (the sample)"
