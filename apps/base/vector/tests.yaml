# Unit tests for vector.yaml's transforms: `vector test vector.yaml tests.yaml`.
# Not in the ConfigMap. Needs NODE_NAME=cp-1 and NODE_DOMAIN=hirednoobs.com (the remaps read them).
tests:
  - name: pod JSON line with msg and an RFC 3339 time
    inputs:
      - insert_at: pods
        type: vrl
        source: |
          . = {
            "message": "{\"time\":\"2026-10-13T08:48:29.948Z\",\"level\":\"INFO\",\"source\":\"http.go:492\",\"msg\":\"Not following redirect\",\"module\":\"https_authelia\"}",
            "timestamp": t'2026-10-13T08:48:30.001Z',
            "stream": "stderr",
            "file": "/var/log/pods/x/0.log",
            "source_type": "kubernetes_logs",
            "kubernetes": {
              "pod_namespace": "monitoring",
              "pod_name": "blackbox-exporter-abc",
              "container_name": "blackbox-exporter",
              "pod_node_name": "worker-1",
              "pod_ip": "10.244.1.5",
              "container_image": "quay.io/prometheus/blackbox-exporter:v0.29.0",
              "container_id": "containerd://abc",
              "pod_uid": "uid",
              "pod_labels": {"app.kubernetes.io/name": "blackbox-exporter"},
              "pod_annotations": {"prometheus.io/scrape": "true"},
              "namespace_labels": {"kubernetes.io/metadata.name": "monitoring"}
            }
          }
    outputs:
      - extract_from: pods
        conditions:
          - type: vrl
            source: |
              assert_eq!(._msg, "Not following redirect")
              assert_eq!(._time, t'2026-10-13T08:48:29.948Z')
              assert_eq!(.level, "INFO")
              assert_eq!(.source, "http.go:492")
              assert_eq!(.module, "https_authelia")
              assert!(!exists(.time))
              assert!(!exists(.msg))
              assert_eq!(.output_stream, "stderr")
              assert_eq!(.kubernetes, {
                "pod_namespace": "monitoring",
                "pod_name": "blackbox-exporter-abc",
                "container_name": "blackbox-exporter",
                "pod_node_name": "worker-1",
                "pod_ip": "10.244.1.5",
                "container_image": "quay.io/prometheus/blackbox-exporter:v0.29.0",
                "pod_labels": {"app.kubernetes.io/name": "blackbox-exporter"}
              })
              assert!(!exists(.file))
              assert!(!exists(.source_type))
              assert!(!exists(.timestamp))

  - name: pod JSON line with message and no time field (Envoy's access log)
    inputs:
      - insert_at: pods
        type: vrl
        source: |
          . = {
            "message": "{\"message\":\"GET grafana.hirednoobs.com/ 200 3ms\",\"start_time\":\"2026-10-13T08:00:00.000Z\",\"downstream_remote_address\":\"192.168.50.10:51234\",\":authority\":\"grafana.hirednoobs.com\",\"response_code\":200}",
            "timestamp": t'2026-10-13T08:00:00.010Z',
            "stream": "stdout",
            "kubernetes": {"pod_namespace": "envoy-gateway", "pod_name": "envoy-public-1", "container_name": "envoy"}
          }
    outputs:
      - extract_from: pods
        conditions:
          - type: vrl
            source: |
              assert_eq!(._msg, "GET grafana.hirednoobs.com/ 200 3ms")
              assert_eq!(._time, t'2026-10-13T08:00:00.010Z')
              assert_eq!(.start_time, "2026-10-13T08:00:00.000Z")
              assert_eq!(.downstream_remote_address, "192.168.50.10:51234")
              assert_eq!(get!(., [":authority"]), "grafana.hirednoobs.com")
              assert_eq!(.response_code, 200)
              assert_eq!(.kubernetes.container_name, "envoy")

  - name: plain text line stays as _msg (CoreDNS)
    inputs:
      - insert_at: pods
        type: vrl
        source: |
          . = {
            "message": "[ERROR] plugin/errors: 2 pihole.hirednoobs.com. AAAA: read udp 10.244.0.16:48741->169.254.116.108:53: i/o timeout",
            "timestamp": t'2026-10-13T09:00:00.000Z',
            "stream": "stdout",
            "kubernetes": {"pod_namespace": "kube-system", "pod_name": "coredns-1", "container_name": "coredns"}
          }
    outputs:
      - extract_from: pods
        conditions:
          - type: vrl
            source: |
              assert_eq!(._msg, "[ERROR] plugin/errors: 2 pihole.hirednoobs.com. AAAA: read udp 10.244.0.16:48741->169.254.116.108:53: i/o timeout")
              assert_eq!(._time, t'2026-10-13T09:00:00.000Z')
              assert_eq!(keys(.), ["_msg", "_time", "kubernetes", "output_stream"])

  - name: zap JSON with ts as Unix seconds
    inputs:
      - insert_at: pods
        type: vrl
        source: |
          . = {
            "message": "{\"level\":\"info\",\"ts\":1791878400.5,\"logger\":\"controller\",\"msg\":\"reconciled\"}",
            "timestamp": t'2026-10-13T10:00:01.000Z',
            "stream": "stderr",
            "kubernetes": {"pod_namespace": "external-secrets", "pod_name": "eso-1", "container_name": "external-secrets"}
          }
    outputs:
      - extract_from: pods
        conditions:
          - type: vrl
            source: |
              assert_eq!(._msg, "reconciled")
              assert_eq!(._time, t'2026-10-13T08:00:00.500Z')
              assert!(!exists(.ts))
              assert_eq!(.logger, "controller")

  - name: Falco alert, message and a nanosecond time
    inputs:
      - insert_at: pods
        type: vrl
        source: |
          . = {
            "message": "{\"hostname\":\"worker-2\",\"message\":\"08:20:41.123456789: Notice Shell in container\",\"priority\":\"Notice\",\"rule\":\"Terminal shell in container\",\"source\":\"syscall\",\"tags\":[\"T1059\",\"mitre_execution\"],\"time\":\"2026-10-13T08:20:41.123456789Z\",\"output_fields\":{\"k8s.ns.name\":\"default\",\"proc.name\":\"sh\"}}",
            "timestamp": t'2026-10-13T08:20:41.200Z',
            "stream": "stdout",
            "kubernetes": {"pod_namespace": "falco", "pod_name": "falco-1", "container_name": "falco", "pod_node_name": "worker-2"}
          }
    outputs:
      - extract_from: pods
        conditions:
          - type: vrl
            source: |
              assert_eq!(._msg, "08:20:41.123456789: Notice Shell in container")
              assert_eq!(._time, t'2026-10-13T08:20:41.123456789Z')
              assert_eq!(.rule, "Terminal shell in container")
              assert_eq!(.tags, ["T1059", "mitre_execution"])
              assert_eq!(get!(.output_fields, ["k8s.ns.name"]), "default")

  - name: a time that doesn't parse stays a field, _time is the runtime's
    inputs:
      - insert_at: pods
        type: vrl
        source: |
          . = {
            "message": "{\"msg\":\"hello\",\"time\":\"yesterday\"}",
            "timestamp": t'2026-10-13T11:00:00.000Z',
            "stream": "stdout",
            "kubernetes": {"pod_namespace": "a", "pod_name": "b", "container_name": "c"}
          }
    outputs:
      - extract_from: pods
        conditions:
          - type: vrl
            source: |
              assert_eq!(._msg, "hello")
              assert_eq!(.time, "yesterday")
              assert_eq!(._time, t'2026-10-13T11:00:00.000Z')

  - name: a JSON line that isn't an object stays text
    inputs:
      - insert_at: pods
        type: vrl
        source: |
          . = {
            "message": "[1,2,3]",
            "timestamp": t'2026-10-13T11:00:00.000Z',
            "stream": "stdout",
            "kubernetes": {"pod_namespace": "a", "pod_name": "b", "container_name": "c"}
          }
    outputs:
      - extract_from: pods
        conditions:
          - type: vrl
            source: |
              assert_eq!(._msg, "[1,2,3]")

  - name: common fields on a pod's line, level normalised
    inputs:
      - insert_at: pods
        type: vrl
        source: |
          . = {
            "message": "{\"time\":\"2026-10-13T08:48:29.948Z\",\"level\":\"INFO\",\"msg\":\"Not following redirect\"}",
            "timestamp": t'2026-10-13T08:48:30.001Z',
            "stream": "stderr",
            "kubernetes": {"pod_namespace": "monitoring", "pod_name": "blackbox-exporter-abc", "container_name": "blackbox-exporter", "pod_node_name": "worker-1"}
          }
    outputs:
      - extract_from: ecs
        conditions:
          - type: vrl
            source: |
              assert_eq!(get!(., ["event.dataset"]), "monitoring.blackbox-exporter")
              assert_eq!(get!(., ["event.provider"]), "blackbox-exporter")
              assert_eq!(get!(., ["host.hostname"]), "worker-1")
              assert_eq!(get!(., ["host.name"]), "worker-1.hirednoobs.com")
              assert_eq!(get!(., ["log.level"]), "info")
              assert_eq!(.level, "INFO")

  - name: a line can't set its own dataset or node
    inputs:
      - insert_at: pods
        type: vrl
        source: |
          . = {
            "message": "{\"msg\":\"get /api/v1/secrets 200 by admin\",\"event.dataset\":\"kubernetes.audit\",\"host.name\":\"cp-1\"}",
            "timestamp": t'2026-10-13T08:00:00.000Z',
            "stream": "stdout",
            "kubernetes": {"pod_namespace": "default", "pod_name": "x", "container_name": "x", "pod_node_name": "worker-3"}
          }
    outputs:
      - extract_from: ecs
        conditions:
          - type: vrl
            source: |
              assert_eq!(get!(., ["event.dataset"]), "default.x")
              assert_eq!(get!(., ["host.hostname"]), "worker-3")
              assert_eq!(get!(., ["host.name"]), "worker-3.hirednoobs.com")

  # One event per test: with several, Vector passes a test if any one of them meets the conditions.
  - name: zap's dpanic is critical
    inputs:
      - insert_at: pods
        type: vrl
        source: |
          . = {"message": "{\"lvl\":\"dpanic\",\"msg\":\"a\"}", "timestamp": t'2026-10-13T08:00:00.000Z', "stream": "stdout",
            "kubernetes": {"pod_namespace": "a", "pod_name": "b", "container_name": "c"}}
    outputs:
      - extract_from: ecs
        conditions:
          - type: vrl
            source: |
              assert_eq!(get!(., ["log.level"]), "critical")

  - name: an unknown level is kept, lower case
    inputs:
      - insert_at: pods
        type: vrl
        source: |
          . = {"message": "{\"severity\":\"Verbose\",\"msg\":\"b\"}", "timestamp": t'2026-10-13T08:00:00.000Z', "stream": "stdout",
            "kubernetes": {"pod_namespace": "a", "pod_name": "b", "container_name": "c"}}
    outputs:
      - extract_from: ecs
        conditions:
          - type: vrl
            source: |
              assert_eq!(get!(., ["log.level"]), "verbose")

  - name: a text line has no level
    inputs:
      - insert_at: pods
        type: vrl
        source: |
          . = {"message": "plain c", "timestamp": t'2026-10-13T08:00:00.000Z', "stream": "stdout",
            "kubernetes": {"pod_namespace": "a", "pod_name": "b", "container_name": "c"}}
    outputs:
      - extract_from: ecs
        conditions:
          - type: vrl
            source: |
              assert!(!exists(."log.level"))

  - name: Envoy access log line
    inputs:
      - insert_at: pods
        type: vrl
        source: |
          . = {
            "message": "{\"message\":\"POST auth.hirednoobs.com/api/firstfactor?x=1 401 12ms\",\"start_time\":\"2026-10-13T08:00:00.000Z\",\"method\":\"POST\",\"x-envoy-origin-path\":\"/api/firstfactor?x=1\",\"protocol\":\"HTTP/2\",\"response_code\":401,\"response_flags\":\"-\",\"bytes_received\":120,\"bytes_sent\":64,\"duration\":12,\"x-forwarded-for\":null,\"user-agent\":\"Mozilla/5.0\",\"x-request-id\":\"9f0c\",\":authority\":\"auth.hirednoobs.com\",\"upstream_host\":\"10.244.3.7:9091\",\"downstream_remote_address\":\"192.168.50.10:51234\",\"route_name\":\"httproute/authelia/authelia/rule/0/match/0/auth_hirednoobs_com\"}",
            "timestamp": t'2026-10-13T08:00:00.013Z',
            "stream": "stdout",
            "kubernetes": {"pod_namespace": "envoy-gateway", "pod_name": "envoy-public-1", "container_name": "envoy", "pod_node_name": "worker-4"}
          }
    outputs:
      - extract_from: ecs
        conditions:
          - type: vrl
            source: |
              assert_eq!(get!(., ["event.dataset"]), "envoy.access")
              assert_eq!(get!(., ["event.provider"]), "envoy")
              assert_eq!(get!(., ["source.ip"]), "192.168.50.10")
              assert_eq!(get!(., ["source.port"]), 51234)
              assert_eq!(get!(., ["http.request.method"]), "POST")
              assert_eq!(get!(., ["http.response.status_code"]), 401)
              assert_eq!(get!(., ["event.outcome"]), "failure")
              assert_eq!(get!(., ["url.domain"]), "auth.hirednoobs.com")
              assert_eq!(get!(., ["url.original"]), "/api/firstfactor?x=1")
              assert_eq!(get!(., ["url.path"]), "/api/firstfactor")
              assert_eq!(get!(., ["url.query"]), "x=1")
              assert_eq!(get!(., ["user_agent.original"]), "Mozilla/5.0")
              assert_eq!(get!(., ["http.request.id"]), "9f0c")
              assert_eq!(get!(., ["http.request.bytes"]), 120)
              assert_eq!(get!(., ["http.response.bytes"]), 64)
              assert_eq!(get!(., ["event.duration"]), 12000000)
              assert_eq!(get!(., ["host.hostname"]), "worker-4")
              assert_eq!(get!(., ["host.name"]), "worker-4.hirednoobs.com")
              assert_eq!(.downstream_remote_address, "192.168.50.10:51234")
              assert_eq!(get!(., [":authority"]), "auth.hirednoobs.com")
              assert_eq!(._msg, "POST auth.hirednoobs.com/api/firstfactor?x=1 401 12ms")

  - name: Envoy access log line as it arrives (strings, "-")
    inputs:
      - insert_at: pods
        type: vrl
        source: |
          . = {
            "message": "{\":authority\":\"nas.hirednoobs.com\",\"bytes_received\":\"0\",\"bytes_sent\":\"3504\",\"downstream_local_address\":\"10.244.10.27:10443\",\"downstream_remote_address\":\"10.244.6.37:39602\",\"duration\":\"2\",\"message\":\"GET nas.hirednoobs.com/desktop/?os=ugospro 200 2ms\",\"method\":\"GET\",\"protocol\":\"HTTP/1.1\",\"requested_server_name\":\"nas.hirednoobs.com\",\"response_code\":\"200\",\"response_code_details\":\"via_upstream\",\"response_flags\":\"-\",\"route_name\":\"httproute/gateway/nas/rule/0/match/0/nas_hirednoobs_com\",\"start_time\":\"2026-10-13T12:08:05.863Z\",\"upstream_cluster\":\"httproute/gateway/nas/rule/0\",\"upstream_host\":\"192.168.111.6:9999\",\"upstream_local_address\":\"10.244.10.27:34396\",\"user-agent\":\"Blackbox-Exporter/0.29.0\",\"x-envoy-origin-path\":\"/desktop/?os=ugospro\",\"x-forwarded-for\":\"10.244.6.37\",\"x-request-id\":\"5d2b0657-4086-4895-99fd-2fdfa95638eb\"}",
            "timestamp": t'2026-10-13T12:08:14.405Z',
            "stream": "stdout",
            "kubernetes": {"pod_namespace": "envoy-gateway", "pod_name": "envoy-gateway-public-1e7f3513-769954cf7f-7jsx2", "container_name": "envoy", "pod_node_name": "prx-003-srv-prod-core-worker-001"}
          }
    outputs:
      - extract_from: ecs
        conditions:
          - type: vrl
            source: |
              assert_eq!(get!(., ["source.ip"]), "10.244.6.37")
              assert_eq!(get!(., ["http.response.status_code"]), 200)
              assert_eq!(get!(., ["event.outcome"]), "success")
              assert_eq!(get!(., ["http.request.bytes"]), 0)
              assert_eq!(get!(., ["http.response.bytes"]), 3504)
              assert_eq!(get!(., ["event.duration"]), 2000000)
              assert_eq!(get!(., ["url.path"]), "/desktop/")
              assert_eq!(get!(., ["url.query"]), "os=ugospro")
              assert_eq!(get!(., ["host.hostname"]), "prx-003-srv-prod-core-worker-001")
              assert_eq!(get!(., ["host.name"]), "prx-003-srv-prod-core-worker-001.hirednoobs.com")

  - name: Envoy access log line, IPv6 client, no response sent
    inputs:
      - insert_at: pods
        type: vrl
        source: |
          . = {
            "message": "{\"message\":\"GET grafana.hirednoobs.com/ 0 1ms\",\"start_time\":\"2026-10-13T08:00:00.000Z\",\"method\":\"GET\",\"response_code\":\"0\",\"x-envoy-origin-path\":\"/\",\"user-agent\":\"-\",\"x-request-id\":null,\"downstream_remote_address\":\"[::1]:40000\"}",
            "timestamp": t'2026-10-13T08:00:00.002Z',
            "stream": "stdout",
            "kubernetes": {"pod_namespace": "envoy-gateway", "pod_name": "envoy-public-1", "container_name": "envoy"}
          }
    outputs:
      - extract_from: ecs
        conditions:
          - type: vrl
            source: |
              assert_eq!(get!(., ["source.ip"]), "::1")
              assert_eq!(get!(., ["source.port"]), 40000)
              assert_eq!(get!(., ["event.outcome"]), "unknown")
              assert!(!exists(."http.response.status_code"))
              assert!(!exists(."user_agent.original"))
              assert_eq!(get!(., ["user-agent"]), "-")
              assert!(!exists(."http.request.id"))
              assert!(!exists(."url.query"))
              assert_eq!(get!(., ["url.path"]), "/")

  - name: Envoy's own log line
    inputs:
      - insert_at: pods
        type: vrl
        source: |
          . = {
            "message": "[2026-10-13 08:00:00.000][1][warning][config] gRPC config stream closed",
            "timestamp": t'2026-10-13T08:00:00.000Z',
            "stream": "stderr",
            "kubernetes": {"pod_namespace": "envoy-gateway", "pod_name": "envoy-public-1", "container_name": "envoy"}
          }
    outputs:
      - extract_from: ecs
        conditions:
          - type: vrl
            source: |
              assert_eq!(get!(., ["event.dataset"]), "envoy.log")
              assert!(!exists(."source.ip"))

  - name: another container's access-log-shaped line isn't envoy.access
    inputs:
      - insert_at: pods
        type: vrl
        source: |
          . = {
            "message": "{\"message\":\"GET x/ 200 1ms\",\"start_time\":\"2026-10-13T08:00:00.000Z\",\"response_code\":200,\"downstream_remote_address\":\"192.168.50.99:1\"}",
            "timestamp": t'2026-10-13T08:00:00.000Z',
            "stream": "stdout",
            "kubernetes": {"pod_namespace": "default", "pod_name": "x", "container_name": "envoy"}
          }
    outputs:
      - extract_from: ecs
        conditions:
          - type: vrl
            source: |
              assert_eq!(get!(., ["event.dataset"]), "default.envoy")
              assert!(!exists(."source.ip"))

  - name: Authelia failed first factor, banned
    inputs:
      - insert_at: pods
        type: vrl
        source: |
          . = {
            "message": "{\"level\":\"error\",\"method\":\"POST\",\"msg\":\"Unsuccessful 1FA authentication attempt by user 'bob' and they are banned until 12:05:00PM on October 13 2026 (+00:00)\",\"path\":\"/api/firstfactor\",\"remote_ip\":\"192.168.50.140\",\"time\":\"2026-10-13T12:00:00Z\"}",
            "timestamp": t'2026-10-13T12:00:00.100Z', "stream": "stdout",
            "kubernetes": {"pod_namespace": "authelia", "pod_name": "authelia-0", "container_name": "authelia"}
          }
    outputs:
      - extract_from: ecs
        conditions:
          - type: vrl
            source: |
              assert_eq!(get!(., ["event.dataset"]), "authelia.log")
              assert_eq!(get!(., ["log.level"]), "error")
              assert_eq!(get!(., ["source.ip"]), "192.168.50.140")
              assert_eq!(get!(., ["user.name"]), "bob")
              assert_eq!(get!(., ["event.category"]), "authentication")
              assert_eq!(get!(., ["event.action"]), "password-login")
              assert_eq!(get!(., ["event.outcome"]), "failure")
              assert_eq!(get!(., ["event.reason"]), "banned")
              assert_eq!(get!(., ["http.request.method"]), "POST")
              assert_eq!(get!(., ["url.path"]), "/api/firstfactor")
              assert_eq!(.remote_ip, "192.168.50.140")

  - name: Authelia failed TOTP, empty user stays unset
    inputs:
      - insert_at: pods
        type: vrl
        source: |
          . = {
            "message": "{\"level\":\"error\",\"msg\":\"Unsuccessful TOTP authentication attempt by user ''\",\"remote_ip\":\"192.168.50.140\"}",
            "timestamp": t'2026-10-13T12:00:00.100Z', "stream": "stdout",
            "kubernetes": {"pod_namespace": "authelia", "pod_name": "authelia-0", "container_name": "authelia"}
          }
    outputs:
      - extract_from: ecs
        conditions:
          - type: vrl
            source: |
              assert_eq!(get!(., ["event.action"]), "totp-login")
              assert!(!exists(."user.name"))
              assert!(!exists(."event.reason"))

  - name: Authelia unknown user
    inputs:
      - insert_at: pods
        type: vrl
        source: |
          . = {
            "message": "{\"level\":\"error\",\"msg\":\"Error occurred getting details for user with username input 'mallory' which usually indicates they do not exist\",\"remote_ip\":\"192.168.50.9\"}",
            "timestamp": t'2026-10-13T12:00:00.100Z', "stream": "stdout",
            "kubernetes": {"pod_namespace": "authelia", "pod_name": "authelia-0", "container_name": "authelia"}
          }
    outputs:
      - extract_from: ecs
        conditions:
          - type: vrl
            source: |
              assert_eq!(get!(., ["user.name"]), "mallory")
              assert_eq!(get!(., ["event.reason"]), "unknown user")
              assert_eq!(get!(., ["event.outcome"]), "failure")

  - name: Authelia access decision (the sample line)
    inputs:
      - insert_at: pods
        type: vrl
        source: |
          . = {
            "message": "{\"level\":\"info\",\"method\":\"GET\",\"msg\":\"Access to https://victoriametrics.hirednoobs.com/ (method GET) is not authorized to user <anonymous>, responding with status code 302 with location redirect to https://auth.hirednoobs.com/?rd=https%3A%2F%2Fvictoriametrics.hirednoobs.com%2F&rm=GET\",\"path\":\"/api/authz/ext-authz\",\"remote_ip\":\"10.244.6.37\"}",
            "timestamp": t'2026-10-13T12:00:00.100Z', "stream": "stdout",
            "kubernetes": {"pod_namespace": "authelia", "pod_name": "authelia-0", "container_name": "authelia"}
          }
    outputs:
      - extract_from: ecs
        conditions:
          - type: vrl
            source: |
              assert_eq!(get!(., ["event.action"]), "authorization")
              assert_eq!(get!(., ["url.full"]), "https://victoriametrics.hirednoobs.com/")
              assert_eq!(get!(., ["url.domain"]), "victoriametrics.hirednoobs.com")
              assert_eq!(get!(., ["url.path"]), "/")
              assert_eq!(get!(., ["http.response.status_code"]), 302)
              assert!(!exists(."user.name"))

  - name: audit event (unchanged)
    inputs:
      - insert_at: events
        type: vrl
        source: |
          . = {"message": "{\"auditID\":\"a1\",\"verb\":\"get\",\"requestURI\":\"/api/v1/namespaces/default/secrets/x\",\"userAgent\":\"kubectl/v1.37.0\",\"user\":{\"username\":\"admin\"},\"sourceIPs\":[\"192.168.111.254\"],\"responseStatus\":{\"code\":200},\"stageTimestamp\":\"2026-10-13T12:00:00.000000Z\"}"}
    outputs:
      - extract_from: events
        conditions:
          - type: vrl
            source: |
              assert_eq!(._msg, "get /api/v1/namespaces/default/secrets/x 200 by admin")
              assert_eq!(._time, "2026-10-13T12:00:00.000000Z")
              assert_eq!(.source, "kube-audit")
              assert_eq!(.node, "cp-1")
