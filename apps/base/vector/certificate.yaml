# Its ca.crt: Vector checks VictoriaLogs' and the aggregator's certificates (monitoring-ca) with
# it. VictoriaLogs doesn't ask for a client certificate, the aggregator's collectors listener
# does (config/aggregator/collectors.yaml): this one.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vector
spec:
  secretName: vector-tls
  commonName: vector
  usages:
    - digital signature
    - key encipherment
    - client auth
  issuerRef:
    kind: ClusterIssuer
    name: monitoring-ca
