# journald.hirednoobs.com/journald: the prx-999 VMs' Vector (iac-homelab's vector role) sends their
# journals here, to vector-aggregator's journald listener (config/aggregator/journald.yaml's
# journald_relay). Machines can't log in to Authelia, so instead of it only the VMs' addresses are
# let through (the client's own address: externalTrafficPolicy keeps it, and the Gateway trusts no
# X-Forwarded-For), and only this path is routed. Anything on those VMs can write logs here, a CI
# job on the runner included, so these logs say what a host sent, not proof of what happened on it.
# A Backend rather than the Service: the listener serves HTTPS, and Envoy verifies its certificate
# against the monitoring CA (journald-certificate.yaml).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: journald
spec:
  endpoints:
    - fqdn:
        hostname: journald.vector.svc.cluster.local
        port: 8686
  tls:
    sni: journald.vector.svc.cluster.local
    caCertificateRefs:
      - group: ""
        kind: Secret
        name: vector-journald-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: journald
spec:
  parentRefs:
    - name: public
      namespace: gateway
      sectionName: journald
  hostnames:
    - journald.hirednoobs.com
  rules:
    - matches:
        - path:
            type: Exact
            value: /journald
      backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: journald
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: journald
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: journald
  authorization:
    defaultAction: Deny
    rules:
      # mgmt, Forgejo, the runner and Vault (iac-homelab's gitops root).
      - name: prx-999
        action: Allow
        principal:
          clientCIDRs:
            - 192.168.111.254/32
            - 192.168.111.200/32
            - 192.168.111.201/32
            - 192.168.111.202/32
