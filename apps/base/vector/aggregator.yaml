# vector-aggregator: what other machines send (config/aggregator/), so the collectors
# (daemonset.yaml) only read their own node. The LAN's syslog from rsyslog (apps/base/rsyslog),
# with the Proxmox hosts' journals in it, and the prx-999 VMs' journals from the Gateway
# (journald-route.yaml), both through service.yaml; and Envoy's access log, parsed by the
# collectors, for its clients' geo data and threat intel (config/aggregator/collectors.yaml). One
# pod: while it's down rsyslog queues (10000 messages, in memory), the VMs' Vector and the
# collectors buffer on disk.
#
# Its own volume holds the disk buffer for VictoriaLogs, the geo data (config/aggregator/geo.yaml:
# DB-IP's City and ASN Lite, scripts/geodata.sh) and the threat intel (config/aggregator/
# threat-intel.yaml: abuse.ch's ThreatFox and URLhaus, Spamhaus's DROP, scripts/threatintel.py), both fetched by
# init containers each start and by the refresh container every 6 hours after that; Vector
# (--watch-config) reloads the tables when their files change, without restarting. Recreate: the
# volume attaches to one node at a time. If its node goes down, Longhorn's
# nodeDownPodDeletionPolicy lets the new pod start elsewhere (infrastructure/controllers/longhorn).
#
# app.kubernetes.io/name vector like the collectors, so vmagent scrapes it as job vector and the
# Vector alerts cover it; app.kubernetes.io/component tells them apart.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vector-aggregator
  labels:
    app.kubernetes.io/name: vector
    app.kubernetes.io/component: aggregator
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vector-aggregator
  labels:
    app.kubernetes.io/name: vector
    app.kubernetes.io/component: aggregator
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: vector
      app.kubernetes.io/component: aggregator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vector
        app.kubernetes.io/component: aggregator
      annotations:
        # Scraped by vmagent's pods job: lines read and sent, errors (TargetDown if it's gone).
        prometheus.io/scrape: "true"
        prometheus.io/port: "9598"
    spec:
      # Reads nothing from the node: no service account token, not root.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # This month's geo data into the volume, or the copy there if DB-IP can't be reached, or
        # an empty database without either (no geo fields, vmalert-logs' VectorGeoDataMissing).
        - name: geodata
          image: docker.io/library/alpine:3.24.2@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
          command: ["sh", "/scripts/geodata.sh"]
          env:
            - name: GEO_DIR
              value: /var/lib/vector/geo
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # Writing the 127 MB City file fills the page cache, which counts against the limit:
          # at 64Mi the download was killed partway on the Longhorn volume.
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/vector
            - name: scripts
              mountPath: /scripts
              readOnly: true
        # abuse.ch's and Spamhaus's indicators into the volume, or each feed's last copy if it can't be fetched.
        - name: threatintel
          image: docker.io/library/python:3.14.8-alpine3.24@sha256:f6a589d43c42b9e7f7dc67a12d37132491f362859a5d750607710cc56da3bc72
          # -B: no .pyc next to the script (read-only).
          command: ["python", "-B", "/scripts/threatintel.py"]
          env:
            - name: TI_DIR
              value: /var/lib/vector/threat
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/vector
            - name: scripts
              mountPath: /scripts
              readOnly: true
      containers:
        - name: vector
          image: timberio/vector:0.59.0-distroless-static@sha256:2138c72ef15477d3a60126da851407a198ec61d2ff4cd600a4e69db5f6a29ff7
          # --watch-config: also watches the enrichment tables' files (geo.yaml, threat-intel.yaml)
          # and reloads them when the refresh container replaces them.
          args: ["--config", "/etc/vector/*.yaml", "--watch-config"]
          # geo.yaml's and threat-intel.yaml's paths are relative to it (geo/city.mmdb, threat/).
          workingDir: /var/lib/vector
          env:
            # The node it runs on, for a pipeline error's host (config/common/pipeline.yaml).
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NODE_DOMAIN
              value: hirednoobs.com
          ports:
            - name: http-metrics
              containerPort: 9598
              protocol: TCP
            # Syslog from rsyslog (service.yaml).
            - name: syslog
              containerPort: 5514
              protocol: TCP
            # The prx-999 VMs' journals, through the Gateway (journald-route.yaml).
            - name: journald
              containerPort: 8686
              protocol: TCP
            # Envoy's access log from the collectors (service.yaml).
            - name: collectors
              containerPort: 6000
              protocol: TCP
          # Only sent traffic once it's listening.
          readinessProbe:
            tcpSocket:
              port: syslog
            periodSeconds: 10
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # The geo data is read into memory (City 127 MB, ASN 10 MB): about 300 MB idle.
          resources:
            requests:
              cpu: 50m
              memory: 320Mi
            limits:
              memory: 768Mi
          volumeMounts:
            - name: config
              mountPath: /etc/vector
              readOnly: true
            - name: data
              mountPath: /var/lib/vector
            - name: tls
              mountPath: /etc/vector/tls
              readOnly: true
            - name: journald-tls
              mountPath: /etc/vector/journald-tls
              readOnly: true
            - name: collectors-tls
              mountPath: /etc/vector/collectors-tls
              readOnly: true
        # Both scripts again every 6 hours: ThreatFox adds indicators all day, DB-IP has a new
        # month a few days in. Each replaces its files whole (a rename), so Vector never reads
        # half a file, and keeps the last good copy when a feed can't be fetched.
        - name: refresh
          image: docker.io/library/python:3.14.8-alpine3.24@sha256:f6a589d43c42b9e7f7dc67a12d37132491f362859a5d750607710cc56da3bc72
          command:
            - sh
            - -c
            - >-
              while sleep 21600; do
              sh /scripts/geodata.sh;
              python -B /scripts/threatintel.py;
              done
          env:
            - name: GEO_DIR
              value: /var/lib/vector/geo
            - name: TI_DIR
              value: /var/lib/vector/threat
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # As the geodata init container's: a new month's City file fills the page cache.
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/vector
            - name: scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: vector-aggregator-config
        - name: data
          persistentVolumeClaim:
            claimName: vector-aggregator
        - name: scripts
          configMap:
            name: vector-scripts
        - name: tls
          secret:
            secretName: vector-tls
        - name: journald-tls
          secret:
            secretName: vector-journald-tls
        - name: collectors-tls
          secret:
            secretName: vector-collectors-tls
