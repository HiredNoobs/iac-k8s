# The LAN's syslog, from rsyslog: event.dataset syslog.log, the sender as host.* (its hostname,
# host.ip its address), log.syslog.*, process.name/pid, log.level from the severity. A line
# that isn't syslog is kept as a pipeline_error. The Proxmox hosts' journals, sent the same way,
# go to the journal parser (journald.yaml) instead.

sources:
  # The LAN's syslog, relayed by rsyslog (apps/base/rsyslog) through service.yaml: one JSON line
  # per message, the message as it came (message), the sender's address (fromhost_ip), when it
  # arrived (received) and over what (transport: imudp, imtcp).
  syslog_relay:
    type: socket
    mode: tcp
    address: 0.0.0.0:5514
    decoding:
      codec: json
    framing:
      method: newline_delimited

transforms:
  # The Proxmox hosts send their journals through rsyslog (iac-homelab's proxmox/rsyslog.conf):
  # RFC 5424 with the app name journal and each entry's journal fields as JSON. Those go to the
  # journal parser (syslog_journal, then journald.yaml), as the prx-999 VMs' journals do; only
  # from the hosts' addresses (the relay keeps the sender's), anything else is syslog.
  syslog_by_sender:
    type: route
    inputs: [syslog_relay]
    route:
      journal: |
        hosts = ["192.168.111.2", "192.168.111.3", "192.168.111.4", "192.168.111.9"]
        s, err = parse_syslog(string(.message) ?? "")
        err == null && s.appname == "journal" && includes(hosts, .fromhost_ip) && is_object(parse_json(string(s.message) ?? "") ?? null)

  # A Proxmox host's journal entry, as the prx-999 VMs' Vector sends one: the journal's fields,
  # message, @timestamp (when it was logged), event.created (here when the relay received it)
  # and the sender as the last X-Forwarded-For.
  syslog_journal:
    type: remap
    inputs: [syslog_by_sender.journal]
    drop_on_error: true
    reroute_dropped: true
    source: |
      s = parse_syslog!(string!(.message))
      entry = object!(parse_json!(s.message))
      sender = string(.fromhost_ip) ?? ""
      received = .received
      logged = timestamp(s.timestamp) ?? now()
      . = entry
      .message = string(entry.MESSAGE) ?? ""
      ."@timestamp" = format_timestamp!(logged, "%+")
      ."event.created" = received
      ."X-Forwarded-For" = sender

  # Syslog, RFC 3164 or 5424 (parse_syslog), as Elastic's syslog fields: log.syslog.* and the
  # sender as the host (host.hostname from the message, host.ip the address rsyslog saw), the
  # program as process.name/process.pid, the severity as log.level too, UDP or TCP as
  # Log.Transport. An RFC 3164 timestamp has no year or time zone, so its _time is when rsyslog
  # received it; RFC 5424's is its own. Then the router's Wi-Fi, DHCP, DNS and firewall lines.
  syslog:
    type: remap
    inputs: [syslog_by_sender._unmatched]
    drop_on_error: true
    reroute_dropped: true
    source: |
      %dataset = "syslog.log"
      raw = string(.message) ?? ""
      sender = string(.fromhost_ip) ?? ""
      received = parse_timestamp(string(.received) ?? "", "%+") ?? now()
      transport = string(.transport) ?? ""
      . = {"_msg": raw, "_time": received, "event.created": now()}
      if sender != "" { ."host.ip" = sender }
      # How the line reached rsyslog, not the event's own traffic (network.*), so a custom field.
      if transport == "imudp" { ."Log.Transport" = "udp" } else if transport == "imtcp" { ."Log.Transport" = "tcp" }
      s, err = parse_syslog(raw)
      if err != null {
        %mismatch = "not syslog (RFC 3164 or 5424)"
      } else {
        ._msg = s.message
        if is_integer(s.version) {
          ."log.syslog.version" = to_string(s.version)
          ._time = s.timestamp
        }
        severities = ["emerg", "alert", "crit", "err", "warning", "notice", "info", "debug"]
        names = ["Emergency", "Alert", "Critical", "Error", "Warning", "Notice", "Informational", "Debug"]
        levels = ["critical", "critical", "critical", "error", "warning", "notice", "info", "debug"]
        facilities = ["kern", "user", "mail", "daemon", "auth", "syslog", "lpr", "news", "uucp", "cron", "authpriv", "ftp", "ntp", "security", "console", "solaris-cron", "local0", "local1", "local2", "local3", "local4", "local5", "local6", "local7"]
        sev = -1
        for_each(severities) -> |i, n| { if n == s.severity { sev = i } }
        fac = -1
        for_each(facilities) -> |i, n| { if n == s.facility { fac = i } }
        if sev >= 0 {
          ."log.syslog.severity.code" = sev
          ."log.syslog.severity.name" = get!(names, [sev])
          ."log.level" = get!(levels, [sev])
        }
        if fac >= 0 {
          ."log.syslog.facility.code" = fac
          ."log.syslog.facility.name" = s.facility
        }
        if sev >= 0 && fac >= 0 { ."log.syslog.priority" = fac * 8 + sev }
        if is_string(s.hostname) && s.hostname != "-" {
          ."log.syslog.hostname" = s.hostname
          ."host.hostname" = s.hostname
          ."host.name" = s.hostname
        }
        if is_string(s.appname) && s.appname != "-" {
          ."log.syslog.appname" = s.appname
          ."process.name" = s.appname
          %provider = s.appname
        }
        if s.procid != null {
          ."log.syslog.procid" = to_string(s.procid)
          pid = to_int(s.procid) ?? null
          if pid != null { ."process.pid" = pid }
        }
        if is_string(s.msgid) { ."log.syslog.msgid" = s.msgid }
        # Anything else is RFC 5424 structured data: {<SD-ID>: {<name>: <value>}}.
        sd = {}
        for_each(s) -> |key, value| {
          if !includes(["message", "hostname", "appname", "procid", "msgid", "facility", "severity", "timestamp", "version"], key) {
            sd = set!(sd, [key], value)
          }
        }
        if sd != {} { ."log.syslog.structured_data" = sd }

        # The router's Wi-Fi (hostapd) and DHCP (dnsmasq) lines: the device as client.* (its MAC
        # in ECS's format, 28-7B-11-..., its DHCP address and hostname), the interface as
        # observer.ingress.interface.name. No Elastic integration for either.
        msg = string(s.message) ?? ""
        app = string(s.appname) ?? ""
        if app == "hostapd" {
          # "<interface>: STA <mac> <module>: <what happened>"
          sta, err = parse_regex(msg, r'^(?P<iface>\S+): STA (?P<mac>(?:[0-9A-Fa-f]{2}:){5}[0-9A-Fa-f]{2}) (?P<what>.*)$')
          if err == null {
            ."client.mac" = upcase(replace(string!(sta.mac), ":", "-"))
            ."observer.ingress.interface.name" = sta.iface
            what = string!(sta.what)
            if match(what, r'^IEEE 802\.11: associated\b') {
              ."event.action" = "associated"
              ."event.category" = ["network"]
              ."event.type" = ["connection", "start"]
            } else if match(what, r'^IEEE 802\.11: disassociated\b') {
              ."event.action" = "disassociated"
              ."event.category" = ["network"]
              ."event.type" = ["connection", "end"]
            } else if starts_with(what, "WPA: pairwise key handshake completed") {
              # The 4-way handshake: the device proved the Wi-Fi password, it's connected.
              ."event.action" = "pairwise-key-handshake-completed"
              ."event.category" = ["authentication"]
              ."event.type" = ["start"]
              ."event.outcome" = "success"
            } else if starts_with(what, "IEEE 802.1X: Supplicant used different EAP type: 254") {
              # EAP type 254 (expanded) is WPS: a device trying push-button or PIN setup.
              ."event.action" = "wps-attempted"
              ."event.category" = ["authentication"]
              ."event.type" = ["start"]
            } else if starts_with(what, "IEEE 802.1X: authentication failed") {
              # The networks use a password (WPA2-PSK), not 802.1X: this follows a WPS attempt
              # (a wrong password fails the 4-way handshake instead).
              ."event.action" = "wps-failed"
              ."event.category" = ["authentication"]
              ."event.type" = ["start"]
              ."event.outcome" = "failure"
            } else if starts_with(what, "WPA: group key handshake completed") {
              ."event.action" = "group-key-handshake-completed"
              ."event.category" = ["network"]
              ."event.type" = ["connection"]
              ."event.outcome" = "success"
            }
          }
        } else if app == "dnsmasq-dhcp" {
          # "DHCP<TYPE>(<interface>) [<ip>] <mac>[ <hostname, or why for a DHCPNAK>]"
          dhcp, err = parse_regex(msg, r'^DHCP(?P<message>[A-Z]+)\((?P<iface>[^)]+)\) (?:(?P<ip>\d+\.\d+\.\d+\.\d+) )?(?P<mac>(?:[0-9A-Fa-f]{2}:){5}[0-9A-Fa-f]{2})(?: (?P<rest>.+))?$')
          if err == null {
            message = downcase(string!(dhcp.message))
            ."event.action" = "dhcp-" + message
            ."event.category" = ["network"]
            ."event.type" = ["protocol"]
            ."network.protocol" = "dhcp"
            ."observer.ingress.interface.name" = dhcp.iface
            ."client.mac" = upcase(replace(string!(dhcp.mac), ":", "-"))
            if dhcp.ip != null { ."client.ip" = dhcp.ip }
            if message == "ack" {
              ."event.outcome" = "success"
              if is_string(dhcp.rest) && match(string!(dhcp.rest), r'^\S+$') {
                ."client.domain" = dhcp.rest
                ."related.hosts" = [dhcp.rest]
              }
            } else if message == "nak" {
              ."event.outcome" = "failure"
            }
          }
        } else if app == "dnsmasq" {
          # The router's DNS (log-queries): each query, where it went and what came back, with
          # log-queries=extra prefixed "<serial> <client>/<port> " (the serial ties one query's
          # lines together). The question as dns.question.*, the asker as client.*/source.*,
          # the upstream as destination.ip, the answer as dns.resolved_ip (and related.ip) or
          # dns.response_code.
          # No Elastic integration; fields as its network_traffic DNS ones.
          dns, err = parse_regex(msg, r'^(?:(?P<serial>\d+) (?P<peer>[0-9A-Fa-f.:]+)/(?P<port>\d+) )?(?P<kind>query\[(?P<qtype>[A-Za-z0-9]+)\]|forwarded|reply|cached|config|[/\w.-]+) (?P<name>\S+) (?P<rel>from|to|is) (?P<value>\S+)$')
          if err == null {
            ."event.category" = ["network"]
            ."event.type" = ["protocol"]
            ."network.protocol" = "dns"
            name = string!(dns.name)
            ."dns.question.name" = name
            ."related.hosts" = [name]
            if dns.serial != null { ."Dns.Serial" = to_int(dns.serial) ?? null }
            if dns.peer != null {
              ."client.ip" = dns.peer
              ."source.ip" = dns.peer
              port = to_int(dns.port) ?? null
              if port != null {
                ."client.port" = port
                ."source.port" = port
              }
            }
            kind = string!(dns.kind)
            value = string!(dns.value)
            if dns.qtype != null {
              ."event.action" = "dns-query"
              ."dns.type" = "query"
              ."dns.question.type" = upcase(string!(dns.qtype))
              ."client.ip" = value
              ."source.ip" = value
            } else if kind == "forwarded" {
              # To Pi-hole, or the router's fallback upstream when Pi-hole doesn't answer.
              ."event.action" = "dns-forwarded"
              ."dns.type" = "query"
              ."destination.ip" = value
            } else {
              # reply (from upstream), cached, config (the router's own records) or a hosts
              # file's path.
              ."event.action" = if kind == "reply" || kind == "cached" || kind == "config" { "dns-" + kind } else { "dns-hosts" }
              ."dns.type" = "answer"
              if is_ipv4(value) || is_ipv6(value) {
                ."dns.response_code" = "NOERROR"
                ."dns.resolved_ip" = [value]
                ."related.ip" = [value]
                ."event.outcome" = "success"
              } else if includes(["NXDOMAIN", "SERVFAIL", "REFUSED"], value) {
                ."dns.response_code" = value
                ."event.outcome" = "failure"
              } else if starts_with(value, "NODATA") {
                # The name exists without a record of that type (NODATA-IPv4, NODATA-IPv6).
                ."dns.response_code" = "NOERROR"
                ."event.outcome" = "success"
              } else {
                # <CNAME> (the next line answers the target), <HTTPS>, <SRV>, ...
                ."Dns.Answer" = value
                ."event.outcome" = "success"
              }
            }
          }
        } else if app == "kernel" {
          # The router's firewall log (Firewall > Logged packets): netfilter's LOG target with the
          # prefix DROP or ACCEPT. As Elastic's iptables integration: interfaces as
          # observer.*.interface.name, addresses, ports and MACs as source.*/destination.*, the
          # protocol as network.transport; TCP flags and ICMP type/code in Firewall.*.
          fw, err = parse_regex(msg, r'^(?:\[\s*\d+\.\d+\] )?(?P<action>DROP|ACCEPT) ?(?P<fields>IN=.*)$')
          if err == null {
            action = downcase(string!(fw.action))
            ."event.action" = action
            ."event.category" = ["network"]
            ."event.type" = if action == "drop" { ["connection", "denied"] } else { ["connection", "allowed"] }
            # An empty value (OUT= for a packet to the router itself) as "", else the parser takes
            # the next pair as its value.
            pairs = replace(replace(string!(fw.fields), r'= ', "=\"\" "), r'=$', "=\"\"")
            fields = parse_key_value(pairs, key_value_delimiter: "=", field_delimiter: " ", accept_standalone_key: true) ?? {}
            if is_string(fields.IN) && fields.IN != "" { ."observer.ingress.interface.name" = fields.IN }
            if is_string(fields.OUT) && fields.OUT != "" { ."observer.egress.interface.name" = fields.OUT }
            # MAC=<destination>:<source>:<ethertype>, 14 bytes.
            mac = split(string(fields.MAC) ?? "", ":")
            if length(mac) == 14 {
              ."destination.mac" = upcase(join!(slice!(mac, 0, 6), "-"))
              ."source.mac" = upcase(join!(slice!(mac, 6, 12), "-"))
            }
            if is_string(fields.SRC) { ."source.ip" = fields.SRC }
            if is_string(fields.DST) { ."destination.ip" = fields.DST }
            ."network.type" = if is_ipv6(string(fields.SRC) ?? "") { "ipv6" } else { "ipv4" }
            if is_string(fields.PROTO) { ."network.transport" = downcase(string!(fields.PROTO)) }
            if fields.SPT != null { ."source.port" = to_int(fields.SPT) ?? null }
            if fields.DPT != null { ."destination.port" = to_int(fields.DPT) ?? null }
            # Flags are keys without a value (parse_key_value gives them true).
            flags = filter(["CWR", "ECE", "URG", "ACK", "PSH", "RST", "SYN", "FIN"]) -> |_i, f| {
              flag = get(fields, [f]) ?? null
              flag == true
            }
            if flags != [] { ."Firewall.TcpFlags" = flags }
            if fields.TYPE != null { ."Firewall.Icmp.Type" = to_int(fields.TYPE) ?? null }
            if fields.CODE != null { ."Firewall.Icmp.Code" = to_int(fields.CODE) ?? null }
          }
        }
      }
