# What this side hands to the common end (../common/pipeline.yaml). Pass-throughs, so the common
# file names the same three inputs in both Vectors. Add a new parser here.

transforms:
  # The lines a parser failed on, for unparsed.
  to_unparsed:
    type: filter
    inputs: [syslog.dropped, syslog_journal.dropped, journald.dropped]
    condition: "true"

  # The parsed lines, with where their public addresses are (geo.yaml) and what's known-bad
  # (threat-intel.yaml), for the common fields.
  to_ecs:
    type: filter
    inputs: [threat_intel]
    condition: "true"

  to_final:
    type: filter
    inputs: [ecs]
    condition: "true"
