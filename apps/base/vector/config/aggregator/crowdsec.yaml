# What CrowdSec's agent reads (apps/base/crowdsec): the Gateway's access log and the router's
# firewall drops, cut down to the fields its parsers use (apps/base/crowdsec/release.yaml), so
# it never gets whole events. Each is a syslog line ("<time> vector <program>: <message>") in a
# JSON object, as the agent's HTTP source takes only JSON: its own syslog parser then reads the
# time, program (kernel or gateway) and message, and the firewall drops go to its iptables
# parser unchanged. Over HTTPS with this side's client certificate (vector-tls, the monitoring
# CA), which the agent asks for. Best effort: in memory, the newest dropped while the agent is
# down, so VictoriaLogs never waits on it.

transforms:
  crowdsec_lines:
    type: remap
    inputs: [to_victorialogs]
    source: |
      dataset = string(get!(., ["event.dataset"])) ?? ""
      time = format_timestamp(timestamp(._time) ?? now(), "%+") ?? ""
      if dataset == "envoy.access" && is_string(get!(., ["source.ip"])) {
        message = encode_json({
          "source_ip": get!(., ["source.ip"]),
          "method": string(get!(., ["http.request.method"])) ?? "",
          "path": string(get!(., ["url.original"])) ?? "",
          "status": to_string(get!(., ["http.response.status_code"])) ?? "",
          "user_agent": string(get!(., ["user_agent.original"])) ?? "",
          "host": string(get!(., ["url.domain"])) ?? ""
        })
        . = {"line": time + " vector gateway: " + message}
      } else if dataset == "syslog.log" && get!(., ["event.action"]) == "drop" && is_string(._msg) {
        . = {"line": time + " vector kernel: " + string!(._msg)}
      } else {
        abort
      }

sinks:
  crowdsec:
    type: http
    inputs: [crowdsec_lines]
    uri: https://crowdsec-agent-service.crowdsec.svc:8081/
    method: post
    encoding:
      codec: json
    framing:
      method: newline_delimited
    compression: gzip
    tls:
      crt_file: /etc/vector/tls/tls.crt
      key_file: /etc/vector/tls/tls.key
      ca_file: /etc/vector/tls/ca.crt
    batch:
      timeout_secs: 5
    buffer:
      type: memory
      max_events: 10000
      when_full: drop_newest
