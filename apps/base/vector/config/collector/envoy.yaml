transforms:
  # Envoy's access log (EnvoyProxy's format, infrastructure/configs/gateway/envoy-proxy.yaml).
  # Its own log lines are envoy.log. Envoy writes "-" for a value it doesn't have.
  envoy:
    type: remap
    inputs: [by_source.envoy]
    drop_on_error: true
    reroute_dropped: true
    source: |
      if !exists(.start_time) || !exists(.response_code) {
        %dataset = "envoy.log"
      } else {
        %dataset = "envoy.access"
        # The values that move as they are, each to its field, and the original goes. "-" (or
        # null) only says there's no value: dropped. No ECS field for the Proxy.* ones (capitalised
        # as ECS recommends for custom fields, so they can't clash with a future ECS field).
        for_each({
          "method": "http.request.method",
          ":authority": "url.domain",
          "x-envoy-origin-path": "url.original",
          "user-agent": "user_agent.original",
          "x-request-id": "http.request.id",
          # The SNI the client asked for (the TLS connection's, not the request's site).
          "requested_server_name": "tls.client.server_name",
          # The backend Envoy sent the request to, as Elastic's Envoy integration.
          "upstream_host": "destination.address",
          # Why Envoy answered as it did (via_upstream, ext_authz_denied, route_not_found, ...).
          "response_code_details": "event.reason",
          "response_flags": "Proxy.ResponseFlags",
          "route_name": "Proxy.RouteName",
          "downstream_local_address": "Proxy.ListenerAddress",
          "x-forwarded-for": "Proxy.ForwardedFor",
          "connection_termination_details": "Proxy.ConnectionTerminationDetails",
          "upstream_transport_failure_reason": "Proxy.UpstreamTransportFailureReason",
          "x-envoy-upstream-service-time": "Proxy.UpstreamServiceTime",
        }) -> |key, field| {
          s = get!(., [key])
          . = remove!(., [key])
          if is_string(s) && s != "-" && s != "" { . = set!(., [field], s) }
        }
        # The client, downstream_remote_address without its port ([...] for IPv6). An address
        # that doesn't parse stays as it is.
        addr, err = parse_regex(string(.downstream_remote_address) ?? "", r'^\[?(?P<ip>[0-9A-Fa-f.:]+?)\]?:(?P<port>\d+)$')
        if err == null {
          ."source.ip" = addr.ip
          ."source.port" = to_int(addr.port) ?? null
          del(.downstream_remote_address)
        } else {
          %mismatch = "downstream_remote_address isn't <ip>:<port>"
        }
        # 0 when no response was sent (the client went away first). One that isn't a number stays.
        code = to_int(.response_code) ?? -1
        if code > 0 {
          ."http.response.status_code" = code
          ."event.outcome" = if code < 400 { "success" } else { "failure" }
        } else {
          ."event.outcome" = "unknown"
          if code < 0 { %mismatch = "response_code isn't a number" }
        }
        if code >= 0 { del(.response_code) }
        path = get!(., ["url.original"])
        if path != null {
          parts = split(string!(path), "?", limit: 2)
          ."url.path" = parts[0]
          if length(parts) > 1 { ."url.query" = parts[1] }
        }
        ua = get!(., ["user_agent.original"])
        if ua != null {
          # uap-core's parse, as Elastic's user_agent processor. Versions from their parts (its
          # own version can be the name), no device when it's only a "Generic ..." guess.
          agent = parse_user_agent(string!(ua), mode: "enriched")
          if agent.browser.family != null {
            ."user_agent.name" = agent.browser.family
            version = join(compact([agent.browser.major, agent.browser.minor, agent.browser.patch]), ".") ?? ""
            if version != "" { ."user_agent.version" = version }
          }
          if agent.os.family != null {
            ."user_agent.os.name" = agent.os.family
            version = join(compact([agent.os.major, agent.os.minor, agent.os.patch]), ".") ?? ""
            if version != "" {
              ."user_agent.os.version" = version
              ."user_agent.os.full" = string!(agent.os.family) + " " + version
            }
          }
          if agent.device.family != null && agent.device.brand != "Generic" {
            ."user_agent.device.name" = agent.device.family
          }
        }
        # Body bytes (Envoy's BYTES_RECEIVED and BYTES_SENT for HTTP).
        received = to_int(.bytes_received) ?? null
        if received != null { ."http.request.body.bytes" = received; del(.bytes_received) }
        sent = to_int(.bytes_sent) ?? null
        if sent != null { ."http.response.body.bytes" = sent; del(.bytes_sent) }
        # ECS durations are in nanoseconds.
        ms = to_int(.duration) ?? -1
        if ms >= 0 { ."event.duration" = ms * 1000000; del(.duration) }
        if is_string(.start_time) { ."event.start" = del(.start_time) }
        # "HTTP/1.1", "HTTP/2": the version alone.
        proto, err = parse_regex(string(.protocol) ?? "", r'^HTTP/(?P<version>[0-9.]+)$')
        if err == null { ."http.version" = proto.version; del(.protocol) }
        # The backend's <ip>:<port> as the address and its parts; anything else stays whole.
        addr, err = parse_regex(string(get!(., ["destination.address"])) ?? "", r'^\[?(?P<ip>[0-9A-Fa-f.:]+?)\]?:(?P<port>\d+)$')
        if err == null {
          ."destination.address" = addr.ip
          ."destination.ip" = addr.ip
          ."destination.port" = to_int(addr.port) ?? null
        }
        # As Elastic's Envoy integration.
        ."event.category" = ["network"]
        ."event.type" = ["connection", "protocol"]
        ."network.protocol" = "http"
        # Flags as a list (UF,URX: two), as Elastic's; the upstream's time in nanoseconds, as
        # event.duration.
        flags = string(get!(., ["Proxy.ResponseFlags"])) ?? null
        if flags != null { ."Proxy.ResponseFlags" = split!(flags, ",") }
        upstream_ms = to_int(get!(., ["Proxy.UpstreamServiceTime"]) || "") ?? -1
        if upstream_ms >= 0 { ."Proxy.UpstreamServiceTime" = upstream_ms * 1000000 }
        # Envoy's own names for the upstream connection: Proxy.RouteName and destination.* say
        # where the request went, and the local side is this pod.
        del(.upstream_cluster)
        del(.upstream_local_address)
      }

sinks:
  # The parsed lines go on to vector-aggregator (../aggregator/collectors.yaml), for where its
  # clients are and what's known-bad (geo.yaml, threat-intel.yaml, data only the aggregator
  # has), then its common end. The lines this failed on stay here (handoff.yaml). Metadata
  # (%dataset, %mismatch) goes with them. TLS both ways: the collectors' client certificate
  # (vector-tls), the aggregator's server one (../../collectors-certificate.yaml).
  aggregator:
    type: vector
    inputs: [envoy]
    address: https://collectors.vector.svc:6000
    tls:
      enabled: true
      ca_file: /etc/vector/tls/ca.crt
      crt_file: /etc/vector/tls/tls.crt
      key_file: /etc/vector/tls/tls.key
    # A batch goes after at most 0.1 s (Vector's default 1 s): the hop adds no more than that.
    batch:
      timeout_secs: 0.1
    # On the node's disk while the aggregator is down (one replica). When full, newer lines
    # are dropped rather than holding up every other pod's logs behind them.
    buffer:
      type: disk
      max_size: 268435488
      when_full: drop_newest
