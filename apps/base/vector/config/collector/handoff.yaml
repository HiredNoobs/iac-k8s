# What this side hands to the common end (../common/pipeline.yaml). Pass-throughs, so the common
# file names the same four inputs in both Vectors. Add a new parser here.

transforms:
  # The lines a parser failed on, for unparsed.
  to_unparsed:
    type: filter
    inputs: [pods.dropped, generic.dropped, envoy.dropped, authelia.dropped, falco.dropped, lldap.dropped, vaultwarden.dropped, coredns.dropped, mealie.dropped, grafana.dropped, ghostunnel.dropped, kubectl.dropped, talos.dropped]
    condition: "true"

  # The parsed lines, for the common fields.
  to_ecs:
    type: filter
    inputs: [generic, envoy, authelia_kept, falco, lldap, vaultwarden, coredns, mealie, grafana, ghostunnel, kubectl, talos]
    condition: "true"

  # The audit events are ECS already (kubernetes-audit.yaml).
  to_final:
    type: filter
    inputs: [ecs, events]
    condition: "true"

  # The audit events that didn't parse, as they came (kubernetes-audit.yaml).
  to_victorialogs:
    type: filter
    inputs: [final, audit_unparsed]
    condition: "true"
