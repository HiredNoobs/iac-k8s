# The end of every log's way to VictoriaLogs, in both Vectors: the collectors, one on each node
# (daemonset.yaml: pod logs, the audit log, Talos; ../collector/), and vector-aggregator
# (aggregator.yaml: what other machines send, the LAN's syslog and the prx-999 VMs' and Proxmox
# hosts' journals; ../aggregator/). Each loads this directory and its own as one config
# (--config /etc/vector/*.yaml); tests in ../../tests/<collector|aggregator>/, a file per
# source, run from tests/ (how: tests/collector/pipeline.yaml).
#
# Each side's handoff.yaml says which of its components come here: to_unparsed (the lines its
# parsers failed on), to_ecs (the parsed lines), to_final (with what doesn't need ecs, the audit
# events) and to_victorialogs (with what's sent as it is).
#
# The common fields (ecs), ECS names (https://www.elastic.co/guide/en/ecs/current/) written as
# flat dotted keys, so they can't clash with an app's own field of the same top-level name (the
# same field in VictoriaLogs either way):
#   event.dataset   which source: its own name (envoy.access, ...) or <namespace>.<container>
#   event.provider  what wrote it: the dataset's first part (envoy, ...) or the image's name
#                   (source-controller, ...), else the container's
#   host.hostname   the node's hostname (its name): the pod's, or for a Kubernetes event the node
#                   it happened on (none for a cluster-wide one)
#   host.name       the node's FQDN, <hostname>.<NODE_DOMAIN> (daemonset.yaml, aggregator.yaml)
#   log.level       the app's level as debug, info, notice, warning, error or critical
#   event.kind      event, alert (Falco's), or pipeline_error: a line Vector couldn't parse
#                   (error.type remap_error or format_mismatch, error.message why), kept as it is
#   tags            "generic" added for a line without a parser of its own
#   related.ip, related.user  every address and user the event names
# Stream fields: event.dataset, event.kind, host.name, kubernetes.namespace, kubernetes.pod.name,
# kubernetes.container.name.
#
# Each source with an Elastic integration (Envoy, Falco, CoreDNS, the audit log) is mapped as it
# maps it, unless noted. The level is the exception: log.level is always one vocabulary.
#
# A source's own field that has an ECS field is dropped once it's been moved (Envoy's
# downstream_remote_address, :authority, ...; Authelia's remote_ip; Falco's rule, priority and
# output_fields with an ECS home; the audit event's verb, requestURI, ...; a JSON line's level,
# logger, error and zap's caller). A value that doesn't parse stays where it was.
#
# A field with no ECS field is a custom field: capitalised under a generic concept (Envoy's
# response flags as Proxy.ResponseFlags, the audit event's stage as Orchestrator.Audit.Stage,
# ...), as ECS recommends: ECS names are lower case, so these can't clash with a future ECS
# field. Maps that are a source's own data (Falco's leftover output fields under Sensor.Fields,
# the audit event's request and response bodies and annotations) keep their keys.
data_dir: /var/lib/vector

sources:
  # Vector's own metrics (lines read, sent, errors), scraped by vmagent's pods job.
  internal:
    type: internal_metrics

transforms:
  # A line one of the parsers failed on (a runtime error: none is expected, VRL makes every
  # fallible call be handled): as it came into that remap, Vector's reason in metadata.dropped.
  # Kept, in that source's <name>.log, as a remap_error (ecs). Only the remaps' dropped outputs
  # come here, so a line can't claim to be one.
  unparsed:
    type: remap
    inputs: [to_unparsed]
    source: |
      dropped = object(.metadata.dropped) ?? {}
      . = remove!(., ["metadata", "dropped"])
      if .metadata == {} { del(.metadata) }
      component = string(dropped.component_id) ?? ""
      if component == "pods" {
        # Straight from kubernetes_logs.
        . = {
          "_msg": .message,
          "_time": .timestamp,
          "event.created": now(),
          "Log.Stream": .stream,
          "container.image.name": .kubernetes.container_image,
          "kubernetes": {
            "namespace": .kubernetes.pod_namespace,
            "pod": {"name": .kubernetes.pod_name, "ip": .kubernetes.pod_ip},
            "container": {"name": .kubernetes.container_name},
            "node": {"name": .kubernetes.pod_node_name},
            "labels": .kubernetes.pod_labels,
          },
        }
      } else if includes(["syslog", "syslog_journal"], component) {
        # As rsyslog sent it.
        . = {
          "_msg": .message,
          "_time": .timestamp,
          "event.created": now(),
          "host.ip": .fromhost_ip,
        }
        %dataset = "syslog.log"
      } else if component == "journald" {
        # As the VM's Vector sent it: the message, its time, the VM.
        forwarded = split(string(get!(., ["X-Forwarded-For"])) ?? "", ",")
        sender = strip_whitespace(string(forwarded[-1]) ?? "")
        hostname = string(get!(., ["_HOSTNAME"])) ?? ""
        . = {
          "_msg": .message,
          "_time": get!(., ["@timestamp"]) || .timestamp,
          "event.created": now(),
          "Systemd.Unit": get!(., ["_SYSTEMD_UNIT"]),
        }
        if sender != "" { ."host.ip" = sender }
        if hostname != "" { %host = hostname }
        %dataset = "journald.log"
      } else if component == "talos" {
        # As Talos sent it: the message, when Vector got it (the node is this Vector's).
        . = {
          "_msg": .msg,
          "_time": .timestamp,
          "event.created": now(),
        }
        %host = get_env_var("NODE_NAME") ?? ""
        %dataset = "talos.log"
      } else if includes(["audit_records", "talos_audit"], component) {
        # An audit record as talos made it, or an event's records together (one per line).
        if is_array(.audit_record) {
          . = {
            "_msg": join(map_values(array!(.audit_record)) -> |r| { string(r.line) ?? "" }, "\n") ?? "",
            "_time": ._time,
            "event.created": now(),
          }
        } else {
          . = {"_msg": ._msg, "_time": ._time, "event.created": now()}
        }
        %host = get_env_var("NODE_NAME") ?? ""
        %dataset = "talos.audit"
      } else if component != "" && component != "generic" {
        # generic's lines keep <namespace>.<container> (ecs).
        %dataset = component + ".log"
      }
      %error_type = "remap_error"
      %error_message = dropped.message

  # Fields every line gets, after its source's own remap. Overwritten whatever the line
  # had, so a container can't pass its logs off as another source's. The remaps say what they
  # found in metadata (%dataset, %provider, %kind, %mismatch, %error_*), which a line can't set.
  ecs:
    type: remap
    inputs: [to_ecs, unparsed]
    source: |
      # event.kind: pipeline_error for a line a remap failed on (remap_error) or one that looked
      # like its source's format but didn't parse (format_mismatch), the reason in error.message;
      # alert for Falco's alerts; event for the rest.
      kind = string(%kind) ?? "event"
      error_type = string(%error_type) ?? ""
      error_message = string(%error_message) ?? ""
      mismatch = string(%mismatch) ?? ""
      if error_type == "" && mismatch != "" {
        error_type = "format_mismatch"
        error_message = mismatch
      }
      if error_type != "" {
        kind = "pipeline_error"
        ."error.type" = error_type
        ."error.message" = error_message
      }
      ."event.kind" = kind

      # The dataset's product unless the remap says otherwise, the container for the rest.
      dataset = string(%dataset) ?? ""
      provider = string(%provider) ?? ""
      # A line without a parser of its own (only the fields below) is tagged generic.
      if dataset == "" && kind == "event" {
        if is_array(.tags) {
          .tags = push(array!(.tags), "generic")
        } else if exists(.tags) {
          .tags = [.tags, "generic"]
        } else {
          .tags = ["generic"]
        }
      }
      if dataset == "" {
        dataset = (string(.kubernetes.namespace) ?? "") + "." + (string(.kubernetes.container.name) ?? "")
        # The software: the image's name without its registry, path, tag or digest
        # (ghcr.io/fluxcd/source-controller:v1.9.6 is source-controller; containers are often
        # named something generic like manager), else the container's name.
        image, err = parse_regex(string(get!(., ["container.image.name"])) ?? "", r'^(?:[^@]*/)?(?P<name>[^/:@]+)(?::[^/@]*)?(?:@\S+)?$')
        if provider == "" && err == null { provider = image.name }
        if provider == "" { provider = string(.kubernetes.container.name) ?? "" }
      } else if provider == "" {
        provider = split(dataset, ".")[0]
      }
      ."event.dataset" = dataset
      ."event.provider" = provider
      # The node it happened on: the pod's, unless the remap says otherwise (%host: a Kubernetes
      # event's node, or none).
      node = string(.kubernetes.node.name) ?? ""
      if %host != null { node = string(%host) ?? "" }
      domain = get_env_var("NODE_DOMAIN") ?? ""
      if node != "" {
        ."host.hostname" = node
        ."host.name" = if domain == "" { node } else { node + "." + domain }
      }

      if !exists(."log.logger") && is_string(.logger) { ."log.logger" = del(.logger) }

      # Flux's kustomize-controller lists every object it applied in output, {"<Kind>/<namespace>/
      # <name>": "unchanged", ...}: one JSON text field (a field name per object in the repo
      # otherwise); unpack_json from it at query time.
      if .kubernetes.namespace == "flux-system" && is_object(.output) { .output = encode_json(.output) }

      # A Kubernetes controller's line (controller-runtime's fields: Flux, the RabbitMQ topology
      # operator, ESO): the object it reconciled as orchestrator.*, as Kubernetes events and the
      # audit log have it (the kind lower case); one reconcile's lines share trace.id (its
      # reconcileID); the controller as Orchestrator.Controller, the kind's API group as
      # Orchestrator.Resource.ApiGroup, Flux's revision as Orchestrator.Resource.Revision.
      # controller-runtime repeats the object as {"<Kind>": {"name", "namespace"}}: dropped when
      # it's the same one. Without controllerKind, name and namespace can mean anything.
      if is_string(.controllerKind) && !exists(."orchestrator.type") {
        kind = string!(del(.controllerKind))
        ."orchestrator.type" = "kubernetes"
        ."orchestrator.resource.type" = downcase(kind)
        if is_string(.name) { ."orchestrator.resource.name" = del(.name) }
        if is_string(.namespace) { ."orchestrator.namespace" = del(.namespace) }
        if is_string(.controllerGroup) {
          group = del(.controllerGroup)
          if group != "" { ."Orchestrator.Resource.ApiGroup" = group }
        }
        if is_string(.controller) { ."Orchestrator.Controller" = del(.controller) }
        if is_string(.reconcileID) { ."trace.id" = del(.reconcileID) }
        if is_string(.revision) { ."Orchestrator.Resource.Revision" = del(.revision) }
        repeated = get!(., [kind])
        if is_object(repeated) && keys(object!(repeated)) == ["name", "namespace"] && repeated.name == get!(., ["orchestrator.resource.name"]) && repeated.namespace == get!(., ["orchestrator.namespace"]) {
          . = remove!(., [kind])
        }
      }
      # Flux's notification-controller logs each event it receives with the object it's about
      # (eventInvolvedObject): as orchestrator.*, as a Kubernetes event's object. Any other key
      # stays under eventInvolvedObject.
      if is_object(.eventInvolvedObject) && !exists(."orchestrator.type") {
        ref = object!(del(.eventInvolvedObject))
        ."orchestrator.type" = "kubernetes"
        if is_string(ref.kind) { ."orchestrator.resource.type" = downcase(string!(ref.kind)) }
        if is_string(ref.name) { ."orchestrator.resource.name" = ref.name }
        if is_string(ref.namespace) { ."orchestrator.namespace" = ref.namespace }
        if is_string(ref.uid) { ."orchestrator.resource.id" = ref.uid }
        if is_string(ref.apiVersion) { ."orchestrator.api_version" = ref.apiVersion }
        if is_string(ref.resourceVersion) { ."Orchestrator.Resource.ResourceVersion" = ref.resourceVersion }
        rest = {}
        for_each(ref) -> |key, value| {
          if !includes(["kind", "name", "namespace", "uid", "apiVersion", "resourceVersion"], key) || !is_string(value) {
            rest = set!(rest, [key], value)
          }
        }
        if rest != {} { .eventInvolvedObject = rest }
      }

      # The app's own level, in one vocabulary: debug, info, notice, warning, error, critical
      # (anything else as it is, lower case). From a JSON line's level, lvl or severity, else
      # from the text formats several apps share. The JSON field it came from goes.
      if !exists(."log.level") {
        raw = null
        from = ""
        for_each(["level", "lvl", "severity"]) -> |_i, key| {
          v = get!(., [key])
          if raw == null && v != null { raw = v; from = key }
        }
        msg = string(._msg) ?? ""
        if raw == null {
          # zap's console format: "<time>\t<level>\t[<logger>\t]<file>.go:<line>\t<message>".
          zap, err = parse_regex(msg, r'^\d{4}-\d\d-\d\dT\S+\t(?P<level>[A-Za-z]+)\t(?:(?P<logger>[^\t]+)\t)?(?P<file>[^\t\s]+\.go):(?P<line>\d+)\t')
          if err == null {
            raw = zap.level
            if zap.logger != null && !exists(."log.logger") { ."log.logger" = zap.logger }
            ."log.origin.file.name" = zap.file
            ."log.origin.file.line" = to_int(zap.line) ?? null
          }
        }
        if raw == null {
          # klog: "<I|W|E|F>MMDD hh:mm:ss.uuuuuu <pid> <file>:<line>] <message>".
          klog, err = parse_regex(msg, r'^(?P<sev>[IWEF])\d{4} \d\d:\d\d:\d\d\.\d+\s+\d+ (?P<file>[^:\]\s]+):(?P<line>\d+)\] ')
          if err == null {
            raw = if klog.sev == "I" { "info" } else if klog.sev == "W" { "warning" } else if klog.sev == "E" { "error" } else { "critical" }
            ."log.origin.file.name" = klog.file
            ."log.origin.file.line" = to_int(klog.line) ?? null
          }
        }
        if raw == null {
          # logfmt (logrus' text format, Go's slog): a level= pair.
          kv, err = parse_regex(msg, r'(?:^|\s)level=(?P<level>[A-Za-z]+)(?:\s|$)')
          if err == null { raw = kv.level }
        }
        # client-go's warnings from the API server (deprecated APIs).
        if raw == null && starts_with(msg, "Warning: ") { raw = "warning" }
        if is_string(raw) {
          l = downcase(string!(raw))
          if includes(["trace", "debug", "dbug"], l) {
            l = "debug"
          } else if includes(["info", "information", "informational"], l) {
            l = "info"
          } else if includes(["warn", "warning"], l) {
            l = "warning"
          } else if includes(["error", "err", "eror"], l) {
            l = "error"
          } else if includes(["crit", "critical", "fatal", "panic", "dpanic", "alert", "emerg", "emergency"], l) {
            l = "critical"
          }
          ."log.level" = l
          if from != "" { . = remove!(., [from]) }
        }
      }

      # The app's error, a JSON line's error or err (zap, logrus, Go's slog, Authelia). On a
      # pipeline_error, error.message is Vector's reason, so the app's field stays as it is.
      if kind != "pipeline_error" {
        for_each(["error", "err"]) -> |_i, key| {
          e = get!(., [key])
          if !exists(."error.message") && is_string(e) && e != "" {
            ."error.message" = e
            . = remove!(., [key])
          }
        }
      }
      # Where it was logged from, zap JSON's caller ("<file>.go:<line>").
      if !exists(."log.origin.file.name") && is_string(.caller) {
        caller, err = parse_regex(string!(.caller), r'^(?P<file>[^\s:]+):(?P<line>\d+)$')
        if err == null {
          ."log.origin.file.name" = caller.file
          ."log.origin.file.line" = to_int(caller.line) ?? null
          del(.caller)
        }
      }

  # The last fields every event gets: the ECS version the fields follow, and as Elastic's
  # integrations every IP address and user an event names, in related.ip and related.user, to
  # find all of an address's or user's events in one field (an audit event's proxy chain is
  # already there).
  final:
    type: remap
    inputs: [to_final]
    source: |
      ."ecs.version" = "9.5.0"
      ips = array(get!(., ["related.ip"])) ?? []
      for_each(["source.ip", "destination.ip", "client.ip", "server.ip"]) -> |_i, key| {
        ip = get!(., [key])
        if is_string(ip) { ips = push(ips, ip) }
      }
      if ips != [] { ."related.ip" = unique(ips) }
      users = []
      for_each(["user.name", "user.id"]) -> |_i, key| {
        u = get!(., [key])
        if is_string(u) { users = push(users, u) }
      }
      if users != [] { ."related.user" = unique(users) }

sinks:
  # Every source alike; only pod logs have the kubernetes.* stream fields.
  victorialogs:
    type: http
    inputs: [to_victorialogs]
    uri: https://victorialogs.monitoring.svc:9428/insert/jsonline?_stream_fields=event.dataset,event.kind,host.name,kubernetes.namespace,kubernetes.pod.name,kubernetes.container.name&_msg_field=_msg&_time_field=_time
    method: post
    encoding:
      codec: json
    framing:
      method: newline_delimited
    compression: gzip
    tls:
      ca_file: /etc/vector/tls/ca.crt
    # On disk while VictoriaLogs is down (256 MiB is Vector's minimum): the node's, or the
    # aggregator's volume.
    buffer:
      type: disk
      max_size: 268435488
      when_full: block
  metrics:
    type: prometheus_exporter
    inputs: [internal]
    address: 0.0.0.0:9598
