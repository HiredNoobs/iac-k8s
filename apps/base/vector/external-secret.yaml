# ABUSECH_AUTH_KEY: the abuse.ch account's Auth-Key, for vector-aggregator's threat intel
# (scripts/threatintel.py).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vector
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: vector
  dataFrom:
    - extract:
        key: production/vector
