# The collectors: Vector (config/common/, config/collector/) on every node: every pod's log files
# (/var/log/pods), on the control planes kube-apiserver's audit log (/var/log/audit/kube, as its own
# user, 65534), and the node's own Talos logs (service.yaml's talos-logs). Root with only
# CAP_DAC_READ_SEARCH: it can read those files and write its read positions and buffer to the node
# (/var/lib/vector), nothing else. Its service account reads pods, namespaces and nodes (rbac.yaml)
# for the logs' metadata. What other machines send goes to vector-aggregator (aggregator.yaml).
#
# The selector is the DaemonSet's first one (it can't change); the Services pick these pods by
# app.kubernetes.io/component too, as the aggregator's pods are app.kubernetes.io/name vector.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: vector
  labels:
    app.kubernetes.io/name: vector
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: vector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vector
        app.kubernetes.io/component: collector
        vector.dev/exclude: "true"
      annotations:
        # Scraped by vmagent's pods job: lines read and sent, errors (TargetDown if it's gone).
        prometheus.io/scrape: "true"
        prometheus.io/port: "9598"
    spec:
      serviceAccountName: vector
      tolerations:
        - operator: Exists
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vector
          image: timberio/vector:0.59.0-distroless-static@sha256:2138c72ef15477d3a60126da851407a198ec61d2ff4cd600a4e69db5f6a29ff7
          args: ["--config", "/etc/vector/*.yaml"]
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # The nodes' DNS domain (iac-homelab's clusters root), for host.name: node names are
            # their hostnames.
            - name: NODE_DOMAIN
              value: hirednoobs.com
            # kubernetes_logs only reads the pods on its own node.
            - name: VECTOR_SELF_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: http-metrics
              containerPort: 9598
              protocol: TCP
            # The node's own Talos logs (service.yaml's talos-logs).
            - name: talos
              containerPort: 6050
              protocol: TCP
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["DAC_READ_SEARCH"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/vector
              readOnly: true
            - name: pods
              mountPath: /var/log/pods
              readOnly: true
            - name: audit
              mountPath: /var/log/audit/kube
              readOnly: true
            - name: data
              mountPath: /var/lib/vector
            - name: tls
              mountPath: /etc/vector/tls
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: vector
        # Only the pods' logs, not all of /var/log (or /var/lib, etcd's data on the control
        # planes).
        - name: pods
          hostPath:
            path: /var/log/pods
        # No type check: Talos' kubelet runs in its own container without /var/log/audit, so it
        # would report the directory missing; containerd mounts it from the host. Empty on the
        # workers.
        - name: audit
          hostPath:
            path: /var/log/audit/kube
        - name: data
          hostPath:
            path: /var/lib/vector
            type: DirectoryOrCreate
        - name: tls
          secret:
            secretName: vector-tls
