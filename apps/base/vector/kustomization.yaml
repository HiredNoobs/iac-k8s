# Logs into VictoriaLogs (apps/base/monitoring): every pod's log lines with their namespace, pod,
# container and labels, and kube-apiserver's audit log (source="kube-audit") for the security
# detections (apps/base/monitoring/vmalert-logs/rules/kube-audit.yml). What gets audited is the
# audit policy in iac-homelab (terraform/modules/talos-cluster/audit-policy.yaml). Syslog from the
# LAN still goes through rsyslog (apps/base/rsyslog).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: vector
resources:
  - namespace.yaml
  - certificate.yaml
  - rbac.yaml
  - daemonset.yaml
# A change rolls the pods (the name gets a hash). tests.yaml is for CI only.
configMapGenerator:
  - name: vector
    files:
      - vector.yaml
