# Logs into VictoriaLogs (apps/base/monitoring), mapped to ECS fields (config/, a file per source): every pod's
# log lines with their namespace, pod, container and labels; kube-apiserver's audit log
# (event.dataset kubernetes.audit) for the security detections
# (apps/base/monitoring/vmalert-logs/rules/kube-audit.yml), what gets audited being the audit
# policy in iac-homelab (terraform/modules/talos-cluster/audit-policy.yaml); the LAN's syslog,
# relayed by rsyslog (apps/base/rsyslog) to service.yaml; the prx-999 VMs' journals, sent by
# their own Vector (iac-homelab's vector role) through journald-route.yaml; and the nodes' own
# Talos logs, sent by Talos to service.yaml's talos-logs.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: vector
resources:
  - namespace.yaml
  - certificate.yaml
  - rbac.yaml
  - daemonset.yaml
  - service.yaml
  - journald-certificate.yaml
  - journald-route.yaml
# A change rolls the pods (the name gets a hash). tests/ is for CI only.
configMapGenerator:
  - name: vector
    files:
      - config/authelia.yaml
      - config/coredns.yaml
      - config/envoy.yaml
      - config/falco.yaml
      - config/generic.yaml
      - config/ghostunnel.yaml
      - config/grafana.yaml
      - config/journald.yaml
      - config/kubernetes-audit.yaml
      - config/kubernetes-events.yaml
      - config/lldap.yaml
      - config/mealie.yaml
      - config/pipeline.yaml
      - config/syslog.yaml
      - config/talos.yaml
      - config/vaultwarden.yaml
