# Logs into VictoriaLogs (apps/base/monitoring), mapped to ECS fields (config/, a file per source).
# The collectors, one on each node (daemonset.yaml, config/collector/): every pod's log lines with
# their namespace, pod, container and labels; kube-apiserver's audit log (event.dataset
# kubernetes.audit) for the security detections (apps/base/monitoring/vmalert-logs/rules/
# kube-audit.yml), what gets audited being the audit policy in iac-homelab
# (terraform/modules/talos-cluster/audit-policy.yaml); and the node's own Talos logs, sent by Talos
# to service.yaml's talos-logs. vector-aggregator (aggregator.yaml, config/aggregator/): the LAN's
# syslog, relayed by rsyslog (apps/base/rsyslog) to service.yaml, and the prx-999 VMs' journals,
# sent by their own Vector (iac-homelab's vector role) through journald-route.yaml, with where
# their public addresses are (config/aggregator/geo.yaml, DB-IP's data, scripts/geodata.sh) and
# what's known-bad (config/aggregator/threat-intel.yaml, abuse.ch's and Spamhaus's, scripts/threatintel.py), both
# refreshed by aggregator-refresh.yaml. Both end in config/common/.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: vector
resources:
  - namespace.yaml
  - certificate.yaml
  - rbac.yaml
  - daemonset.yaml
  - aggregator.yaml
  - aggregator-refresh.yaml
  - service.yaml
  - journald-certificate.yaml
  - journald-route.yaml
# A change rolls the pods (the name gets a hash). Each Vector gets the common files and its
# own side's (the names must be unique across them). tests/ is for CI only.
configMapGenerator:
  - name: vector
    files:
      - config/common/pipeline.yaml
      - config/collector/authelia.yaml
      - config/collector/coredns.yaml
      - config/collector/envoy.yaml
      - config/collector/falco.yaml
      - config/collector/generic.yaml
      - config/collector/ghostunnel.yaml
      - config/collector/grafana.yaml
      - config/collector/handoff.yaml
      - config/collector/kubernetes-audit.yaml
      - config/collector/kubernetes-events.yaml
      - config/collector/lldap.yaml
      - config/collector/mealie.yaml
      - config/collector/pods.yaml
      - config/collector/talos.yaml
      - config/collector/vaultwarden.yaml
  # Not named after the Deployment: kustomize rewrites a Role's resourceNames that match a
  # generated ConfigMap to its hashed name, which took aggregator-refresh's access to the
  # Deployment.
  - name: vector-aggregator-config
    files:
      - config/common/pipeline.yaml
      - config/aggregator/geo.yaml
      - config/aggregator/handoff.yaml
      - config/aggregator/journald.yaml
      - config/aggregator/syslog.yaml
      - config/aggregator/threat-intel.yaml
  # The aggregator's init containers fetch its geo data and threat intel with them.
  - name: vector-scripts
    files:
      - scripts/geodata.sh
      - scripts/threatintel.py
