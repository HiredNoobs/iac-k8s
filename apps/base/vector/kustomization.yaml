# Logs into VictoriaLogs (apps/base/monitoring), mapped to ECS fields: the collectors on each node
# and vector-aggregator for other machines' logs. Sources and enrichment: docs/logging.md.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: vector
resources:
  - namespace.yaml
  - certificate.yaml
  - rbac.yaml
  - daemonset.yaml
  - aggregator.yaml
  - service.yaml
  - journald-certificate.yaml
  - collectors-certificate.yaml
  - journald-route.yaml
# A change rolls the pods (the name gets a hash). Each Vector gets the common files and its
# own side's (the names must be unique across them). tests/ is for CI only.
configMapGenerator:
  - name: vector
    files:
      - config/common/pipeline.yaml
      - config/collector/authelia.yaml
      - config/collector/coredns.yaml
      - config/collector/envoy.yaml
      - config/collector/falco.yaml
      - config/collector/generic.yaml
      - config/collector/ghostunnel.yaml
      - config/collector/grafana.yaml
      - config/collector/handoff.yaml
      - config/collector/kubernetes-audit.yaml
      - config/collector/kubernetes-events.yaml
      - config/collector/lldap.yaml
      - config/collector/mealie.yaml
      - config/collector/pods.yaml
      - config/collector/talos.yaml
      - config/collector/talos-audit.yaml
      - config/collector/vaultwarden.yaml
  - name: vector-aggregator-config
    files:
      - config/common/pipeline.yaml
      - config/aggregator/collectors.yaml
      - config/aggregator/geo.yaml
      - config/aggregator/handoff.yaml
      - config/aggregator/journald.yaml
      - config/aggregator/syslog.yaml
      - config/aggregator/threat-intel.yaml
  # The aggregator's init and refresh containers fetch its geo data and threat intel with them.
  - name: vector-scripts
    files:
      - scripts/geodata.sh
      - scripts/threatintel.py
