# Vector on every node, sending to VictoriaLogs.
#
# Pod logs: every container's log lines (kubernetes_logs), with their namespace, pod, container,
# node, image and the pod's labels (kubernetes.*). A JSON line is split into its fields: the first
# of message, msg, log becomes _msg and the first of time, timestamp, ts that parses becomes
# _time (otherwise the time the container runtime wrote the line). Any other line is _msg as it
# is. Then the common fields, ECS names (https://www.elastic.co/guide/en/ecs/current/) written as
# flat dotted keys, so they can't clash with an app's own field of the same top-level name (the
# same field in VictoriaLogs either way):
#   event.dataset   which source: its own name (envoy.access, ...) or <namespace>.<container>
#   event.provider  what wrote it: the dataset's first part (envoy, ...) or the image's name
#                   (source-controller, ...), else the container's
#   host.hostname   the node's hostname (its name)
#   host.name       the node's FQDN, <hostname>.<NODE_DOMAIN> (daemonset.yaml)
#   log.level       the app's level as debug, info, notice, warning, error or critical
#   event.kind      event, alert (Falco's), or pipeline_error: a line Vector couldn't parse
#                   (error.type remap_error or format_mismatch, error.message why), kept as it is
#   tags            "generic" added for a line without a parser of its own
# Stream fields: event.dataset, event.kind, host.name, kubernetes.pod_namespace,
# kubernetes.pod_name, kubernetes.container_name.
#
# kube-apiserver's audit log, on the control planes: each event as one JSON line. The event's
# own fields stay (nested ones become objectRef.resource, requestObject.spec..., ... in
# VictoriaLogs), plus:
#   _msg       "<verb> <requestURI> <code> by <user>", a summary to read in lists
#   _time      when the response completed (stageTimestamp)
# and the common fields: event.dataset (kubernetes.audit), event.provider (kube-apiserver),
# event.kind, host.hostname, host.name, source.ip (the client, sourceIPs[0]), user.name,
# user_agent.original, event.action (the verb), event.outcome and http.response.status_code
# (from the response code), error.message (the response's message), url.original, url.path and
# url.query (requestURI), event.id (auditID), event.start and event.end (when it was received and
# completed). A line that isn't JSON is kept as a pipeline_error.
#
# A source's own field that has an ECS field is dropped once it's been moved (Envoy's
# downstream_remote_address, :authority, ...; Authelia's remote_ip; Falco's rule, priority and
# output_fields with an ECS home; the audit event's verb, requestURI, ...; a JSON line's level,
# logger, error and zap's caller). A value that doesn't parse stays where it was, as does
# sourceIPs when it has more than the client (a proxy's chain).
data_dir: /var/lib/vector

sources:
  # Not Vector's own pods (the vector.dev/exclude label, daemonset.yaml): its errors about
  # sending would be sent through itself. Its metrics show them.
  pod_logs:
    type: kubernetes_logs
    # Without a checkpoint (first start), from now rather than every file on the node. Files
    # found later (new pods, rotations) are read from their start.
    read_from: end
  audit:
    type: file
    include:
      - /var/log/audit/kube/*.log
    # Without a checkpoint (first start), from now: the files hold up to 30 days of the old,
    # untrimmed policy. Files rotated in later are read from their start.
    read_from: end
    ignore_older_secs: 86400
  # Vector's own metrics (lines read, sent, errors), scraped by vmagent's pods job.
  internal:
    type: internal_metrics

transforms:
  pods:
    type: remap
    inputs: [pod_logs]
    drop_on_error: true
    reroute_dropped: true
    source: |
      meta = {
        "pod_namespace": .kubernetes.pod_namespace,
        "pod_name": .kubernetes.pod_name,
        "container_name": .kubernetes.container_name,
        "pod_node_name": .kubernetes.pod_node_name,
        "pod_ip": .kubernetes.pod_ip,
        "container_image": .kubernetes.container_image,
        "pod_labels": .kubernetes.pod_labels,
      }
      line = string(.message) ?? ""
      written = .timestamp
      output_stream = .stream

      parsed, err = parse_json(line)
      if err == null && is_object(parsed) {
        . = object!(parsed)
        if is_string(.message) && .message != "" {
          ._msg = del(.message)
        } else if is_string(.msg) && .msg != "" {
          ._msg = del(.msg)
        } else if is_string(.log) && .log != "" {
          ._msg = del(.log)
        }
        # RFC 3339 strings, or Unix seconds as a number (zap's default).
        t = null
        for_each(["time", "timestamp", "ts"]) -> |_i, key| {
          v = get!(., [key])
          if t == null && v != null {
            if is_string(v) {
              t = parse_timestamp(string(v) ?? "", "%+") ?? null
            } else if is_float(v) || is_integer(v) {
              ms = to_int((to_float(v) ?? 0.0) * 1000)
              t = from_unix_timestamp(ms, unit: "milliseconds") ?? null
            }
            if t != null { . = remove!(., [key]) }
          }
        }
        if t == null { t = written }
        ._time = t
      } else {
        . = {"_msg": line, "_time": written}
      }
      .kubernetes = meta
      .output_stream = output_stream

  # Each source with its own fields to its remap (by namespace and container, which the pod can't
  # choose), the rest straight to ecs.
  by_source:
    type: route
    inputs: [pods]
    route:
      envoy: .kubernetes.pod_namespace == "envoy-gateway" && .kubernetes.container_name == "envoy"
      authelia: .kubernetes.pod_namespace == "authelia" && .kubernetes.container_name == "authelia"
      falco: .kubernetes.pod_namespace == "falco" && .kubernetes.container_name == "falco"
      lldap: .kubernetes.pod_namespace == "lldap" && includes(["lldap", "bootstrap"], .kubernetes.container_name)
      vaultwarden: .kubernetes.pod_namespace == "vaultwarden" && .kubernetes.container_name == "vaultwarden"
      coredns: .kubernetes.pod_namespace == "kube-system" && .kubernetes.container_name == "coredns"
      mealie: .kubernetes.pod_namespace == "mealie" && .kubernetes.container_name == "mealie"
      ghostunnel: .kubernetes.pod_namespace == "lldap" && .kubernetes.container_name == "ghostunnel"

  # Envoy's access log (EnvoyProxy's format, infrastructure/configs/gateway/envoy-proxy.yaml).
  # Its own log lines are envoy.log. Envoy writes "-" for a value it doesn't have.
  envoy:
    type: remap
    inputs: [by_source.envoy]
    drop_on_error: true
    reroute_dropped: true
    source: |
      if !exists(.start_time) || !exists(.response_code) {
        %dataset = "envoy.log"
      } else {
        %dataset = "envoy.access"
        # The string values it has, without the "-"s. Each becomes its ECS field below, and the
        # original goes ("-" included: it only says there's no value).
        v = {}
        for_each(["method", ":authority", "x-envoy-origin-path", "user-agent", "x-request-id"]) -> |_i, key| {
          s = get!(., [key])
          if is_string(s) && s != "-" && s != "" { v = set!(v, [key], s) }
          if is_string(s) { . = remove!(., [key]) }
        }
        # The client, downstream_remote_address without its port ([...] for IPv6). An address
        # that doesn't parse stays as it is.
        addr, err = parse_regex(string(.downstream_remote_address) ?? "", r'^\[?(?P<ip>[^\[\]]+?)\]?:(?P<port>\d+)$')
        if err == null {
          ."source.ip" = addr.ip
          ."source.port" = to_int(addr.port) ?? null
          del(.downstream_remote_address)
        } else {
          %mismatch = "downstream_remote_address isn't <ip>:<port>"
        }
        method = get!(v, ["method"])
        if method != null { ."http.request.method" = method }
        # 0 when no response was sent (the client went away first). One that isn't a number stays.
        code = to_int(.response_code) ?? -1
        if code > 0 {
          ."http.response.status_code" = code
          ."event.outcome" = if code < 400 { "success" } else { "failure" }
        } else {
          ."event.outcome" = "unknown"
          if code < 0 { %mismatch = "response_code isn't a number" }
        }
        if code >= 0 { del(.response_code) }
        domain = get!(v, [":authority"])
        if domain != null { ."url.domain" = domain }
        path = get!(v, ["x-envoy-origin-path"])
        if path != null {
          ."url.original" = path
          parts = split(string!(path), "?", limit: 2)
          ."url.path" = parts[0]
          if length(parts) > 1 { ."url.query" = parts[1] }
        }
        ua = get!(v, ["user-agent"])
        if ua != null { ."user_agent.original" = ua }
        id = get!(v, ["x-request-id"])
        if id != null { ."http.request.id" = id }
        received = to_int(.bytes_received) ?? null
        if received != null { ."http.request.bytes" = received; del(.bytes_received) }
        sent = to_int(.bytes_sent) ?? null
        if sent != null { ."http.response.bytes" = sent; del(.bytes_sent) }
        # ECS durations are in nanoseconds.
        ms = to_int(.duration) ?? -1
        if ms >= 0 { ."event.duration" = ms * 1000000; del(.duration) }
        if is_string(.start_time) { ."event.start" = del(.start_time) }
        # "HTTP/1.1", "HTTP/2": the version alone.
        proto, err = parse_regex(string(.protocol) ?? "", r'^HTTP/(?P<version>[0-9.]+)$')
        if err == null { ."http.version" = proto.version; del(.protocol) }
        # The SNI the client asked for (the TLS connection's, not the request's site).
        sni = string(.requested_server_name) ?? "-"
        if sni != "-" && sni != "" { ."tls.client.server_name" = sni }
        if exists(.requested_server_name) { del(.requested_server_name) }
      }

  # Authelia (JSON: level, msg, remote_ip, method, path). It logs failed logins, not successful
  # ones, and its access decisions; the user is only in the message.
  authelia:
    type: remap
    inputs: [by_source.authelia]
    drop_on_error: true
    reroute_dropped: true
    source: |
      %dataset = "authelia.log"
      if !exists(.level) { %mismatch = "not Authelia's JSON (no level)" }
      if is_string(.remote_ip) { ."source.ip" = del(.remote_ip) }
      msg = string(._msg) ?? ""

      login, err = parse_regex(msg, r'^Unsuccessful (?P<factor>1FA|TOTP|WebAuthn|Duo) authentication attempt by user \'(?P<user>[^\']*)\'(?P<banned> and they are banned)?')
      if err == null {
        ."event.category" = "authentication"
        ."event.action" = if login.factor == "1FA" { "password-login" } else { downcase(string!(login.factor)) + "-login" }
        ."event.outcome" = "failure"
        if login.user != "" { ."user.name" = login.user }
        if login.banned != null { ."event.reason" = "banned" }
      }
      unknown, err = parse_regex(msg, r'username input \'(?P<user>[^\']*)\' which usually indicates they do not exist')
      if err == null {
        ."event.category" = "authentication"
        ."event.action" = "password-login"
        ."event.outcome" = "failure"
        ."event.reason" = "unknown user"
        if unknown.user != "" { ."user.name" = unknown.user }
      }
      # An access decision for a site behind Authelia: the site's URL and method. The line's own
      # method and path are the proxy's check request to Authelia (its method, an authz
      # endpoint), so they go when they're that; anything else stays.
      access, err = parse_regex(msg, r'^Access to (?P<url>\S+) \(method (?P<method>[A-Z]+)\) is not authorized to user (?P<user>.+?), responding with status code (?P<code>\d+)')
      if err == null {
        ."event.category" = "authentication"
        ."event.action" = "authorization"
        ."event.outcome" = "failure"
        ."url.full" = access.url
        u, err = parse_url(string!(access.url))
        if err == null { ."url.domain" = u.host; ."url.path" = u.path }
        ."http.request.method" = access.method
        ."http.response.status_code" = to_int(access.code) ?? null
        if access.user != "<anonymous>" { ."user.name" = access.user }
        if .method == access.method { del(.method) }
        if match(string(.path) ?? "", r'^/api/(authz/[a-z-]+|verify)/?$') { del(.path) }
      } else {
        if is_string(.method) { ."http.request.method" = del(.method) }
        if is_string(.path) { ."url.path" = del(.path) }
      }

  # Falco's alerts (rule, priority, tags, output_fields.*), falco.alert; its own log lines are
  # falco.log. The tactic and technique are the first of each in the tags, like the alert rule's.
  falco:
    type: remap
    inputs: [by_source.falco]
    drop_on_error: true
    reroute_dropped: true
    source: |
      if !exists(.rule) {
        %dataset = "falco.log"
      } else {
        %dataset = "falco.alert"
        %kind = "alert"
        if !is_string(.priority) || !is_array(.tags) { %mismatch = "an alert without priority or tags" }
        ."rule.name" = del(.rule)
        # The node, which host.hostname already is.
        del(.hostname)
        # Falco's event source: syscall (its own drivers) or a source plugin's (k8saudit, ...).
        if is_string(.source) { ."event.module" = del(.source) }
        p = downcase(string(.priority) ?? "")
        if is_string(.priority) { del(.priority) }
        ."log.level" = if includes(["emergency", "alert", "critical"], p) {
          "critical"
        } else if p == "informational" {
          "info"
        } else {
          p
        }
        tactic = null
        technique = null
        for_each(array(.tags) ?? []) -> |_i, t| {
          s = string(t) ?? ""
          if tactic == null && starts_with(s, "mitre_") {
            tactic = replace(slice!(s, 6), "_", "-")
          }
          if technique == null && match(s, r'^T[0-9]{4}(\.[0-9]{3})?$') {
            technique = s
          }
        }
        if tactic != null { ."threat.tactic.name" = tactic }
        if technique != null { ."threat.technique.id" = technique }
        # What kind of event, from the rule's tags: ECS categories, as many as it has (container
        # and host say where, not what).
        categories = []
        for_each(array(.tags) ?? []) -> |_i, t| {
          c = get!({"process": "process", "shell": "process", "filesystem": "file", "network": "network", "users": "iam", "k8s": "api"}, [string(t) ?? ""])
          if c != null && !includes(categories, c) { categories = push(categories, c) }
        }
        if categories != [] { ."event.category" = categories }
        # The event's own fields (output_fields keys have dots in them). Each one with an ECS
        # field moves there; the rest (and <NA>s, Falco's "no value") stay in output_fields.
        f = object(.output_fields) ?? {}
        moved = []
        for_each({
          "proc.name": "process.name",
          "proc.cmdline": "process.command_line",
          "proc.exepath": "process.executable",
          "proc.pid": "process.pid",
          "user.name": "user.name",
          "container.name": "container.name",
          "container.image.repository": "container.image.name",
          "fd.name": "file.path",
          "proc.pname": "process.parent.name",
          "proc.ppid": "process.parent.pid",
          "proc.pcmdline": "process.parent.command_line",
          "container.id": "container.id",
          "container.image.tag": "container.image.tag",
          "user.uid": "user.id",
          # A connection: the client and the server end (fd.cip is the container's own address
          # for an outbound one).
          "fd.cip": "source.ip",
          "fd.cport": "source.port",
          "fd.sip": "destination.ip",
          "fd.sport": "destination.port",
        }) -> |from, to| {
          x = get!(f, [from])
          if x != null && x != "<NA>" {
            . = set!(., [to], x)
            moved = push(moved, from)
          }
        }
        # Where in the cluster (ECS has no Kubernetes fields of its own).
        ns = get!(f, ["k8s.ns.name"])
        if is_string(ns) && ns != "<NA>" {
          ."orchestrator.type" = "kubernetes"
          ."orchestrator.namespace" = ns
          moved = push(moved, "k8s.ns.name")
          pod = get!(f, ["k8s.pod.name"])
          if is_string(pod) && pod != "<NA>" {
            ."orchestrator.resource.type" = "pod"
            ."orchestrator.resource.name" = pod
            moved = push(moved, "k8s.pod.name")
          }
        }
        if is_object(.output_fields) {
          for_each(moved) -> |_i, key| { f = remove!(f, [string!(key)]) }
          .output_fields = f
        }
      }

  # lldap: its own lines ("<time>  INFO     ｉ [info]: LDAP session start: ...", tracing's
  # tree lines without the prefix), and lldap-bootstrap's hourly run, whose lines say what it
  # changed back to match git.
  lldap:
    type: remap
    inputs: [by_source.lldap]
    drop_on_error: true
    reroute_dropped: true
    source: |
      msg = string(._msg) ?? ""
      if .kubernetes.container_name == "lldap" {
        %dataset = "lldap.log"
        prefix, err = parse_regex(msg, r'^\d{4}-\d\d-\d\dT\S+\s+(?P<level>[A-Z]+)\s')
        if err == null {
          l = downcase(string!(prefix.level))
          ."log.level" = if l == "warn" { "warning" } else if l == "trace" { "debug" } else { l }
        } else if match(msg, r'^\d{4}-\d\d-\d\dT') {
          %mismatch = "a timestamped line without lldap's level"
        }
        # A login to its UI: whether it worked isn't logged.
        login, err = parse_regex(msg, r'login attempt for "(?P<user>[^"]+)"')
        if err == null {
          ."event.category" = "authentication"
          ."event.action" = "password-login"
          ."event.outcome" = "unknown"
          ."user.name" = login.user
        }
      } else {
        %dataset = "lldap.bootstrap"
        %provider = "lldap-bootstrap"
        if contains(msg, "[WARNING]") { ."log.level" = "warning" }
        # A group is named with its id: Group "<name>" (<id>) successfully deleted.
        change, err = parse_regex(msg, r'(?P<kind>User|Group) "(?P<name>[^"]+)"(?: \(\d+\))? successfully (?P<what>created|deleted|added to the group|removed from the group)(?: "(?P<group>[^"]+)")?')
        if err == null {
          ."event.category" = "iam"
          ."event.outcome" = "success"
          if change.kind == "User" {
            ."user.name" = change.name
            if change.group != null { ."group.name" = change.group }
          } else {
            ."group.name" = change.name
          }
          ."event.action" = if change.what == "added to the group" {
            "added-to-group"
          } else if change.what == "removed from the group" {
            "removed-from-group"
          } else {
            downcase(string!(change.kind)) + "-" + string!(change.what)
          }
        }
      }

  # Vaultwarden: "[<time>][<module>][<LEVEL>] <message>". It logs failed logins (a wrong password
  # and an unknown account alike), not successful ones. The IP is the client's (IP_HEADER is
  # X-Forwarded-For).
  vaultwarden:
    type: remap
    inputs: [by_source.vaultwarden]
    drop_on_error: true
    reroute_dropped: true
    source: |
      %dataset = "vaultwarden.log"
      msg = string(._msg) ?? ""
      prefix, err = parse_regex(msg, r'^\[[^\]]+\]\[(?P<logger>[^\]]+)\]\[(?P<level>[A-Z]+)\]')
      if err == null {
        ."log.logger" = prefix.logger
        l = downcase(string!(prefix.level))
        ."log.level" = if l == "warn" { "warning" } else if l == "trace" { "debug" } else { l }
      } else if starts_with(msg, "[") {
        # Not a continuation line or the startup banner, which have no prefix.
        %mismatch = "no [<time>][<module>][<LEVEL>] prefix"
      }
      login, err = parse_regex(msg, r'Username or password is incorrect\..* IP: (?P<ip>\S+)\. Username: (?P<user>.*)\.$')
      if err == null {
        ."event.category" = "authentication"
        ."event.action" = "password-login"
        ."event.outcome" = "failure"
        ."source.ip" = login.ip
        if login.user != "" { ."user.name" = login.user }
      } else {
        ws, err = parse_regex(msg, r' connection from (?P<ip>[0-9A-Fa-f.:]+)$')
        if err == null { ."source.ip" = ws.ip }
      }

  # CoreDNS: "[<LEVEL>] plugin/<name>: <message>". The errors plugin's lines are failed queries:
  # "<count> <name> <type>: <error>", the error usually naming the upstream it asked
  # ("read udp <us>-><upstream>:53: i/o timeout").
  coredns:
    type: remap
    inputs: [by_source.coredns]
    drop_on_error: true
    reroute_dropped: true
    source: |
      %dataset = "coredns.log"
      msg = string(._msg) ?? ""
      line, err = parse_regex(msg, r'^\[(?P<level>[A-Z]+)\] (?:(?P<plugin>plugin/[a-z0-9_]+): )?(?P<rest>.*)$')
      if err != null && starts_with(msg, "[") {
        # Not the startup banner (".:53", "CoreDNS-<version>", ...), which has no prefix.
        %mismatch = "no [<LEVEL>] prefix"
      }
      if err == null {
        l = downcase(string!(line.level))
        ."log.level" = if l == "warn" { "warning" } else if l == "fatal" { "critical" } else { l }
        if line.plugin != null { ."log.logger" = line.plugin }
        if line.plugin == "plugin/errors" {
          q, err = parse_regex(string!(line.rest), r'^(?P<count>\d+) (?P<name>\S+) (?P<type>[A-Z0-9]+): (?P<error>.*)$')
          if err == null {
            ."event.outcome" = "failure"
            ."dns.question.name" = replace(string!(q.name), r'\.$', "")
            ."dns.question.type" = q.type
            ."error.message" = q.error
            ."event.count" = to_int(q.count) ?? null
            upstream, err = parse_regex(string!(q.error), r'->\[?(?P<ip>[0-9A-Fa-f.:]+?)\]?:(?P<port>\d+)')
            if err == null {
              ."destination.ip" = upstream.ip
              ."destination.port" = to_int(upstream.port) ?? null
            }
          } else {
            %mismatch = "an errors plugin line that isn't <count> <name> <type>: <error>"
          }
        }
      }

  # Mealie: "<LEVEL>    <time> - <message>"; its access lines' message is
  # "[<ip>:<port>] <code> <reason> \"<method> <path> HTTP/<version>\"" (the Gateway's address).
  mealie:
    type: remap
    inputs: [by_source.mealie]
    drop_on_error: true
    reroute_dropped: true
    source: |
      %dataset = "mealie.log"
      msg = string(._msg) ?? ""
      line, err = parse_regex(msg, r'^(?P<level>[A-Z]+)\s+\S+ - (?P<rest>.*)$')
      if err != null && match(msg, r'^(DEBUG|INFO|WARNING|ERROR|CRITICAL)\s') {
        # Not a traceback's lines, which have no prefix.
        %mismatch = "a level without Mealie's <time> - prefix"
      }
      if err == null {
        l = downcase(string!(line.level))
        ."log.level" = if l == "warn" { "warning" } else { l }
        access, err = parse_regex(string!(line.rest), r'^\[(?P<ip>[^\]]+?):(?P<port>\d+)\] (?P<code>\d{3}) [^"]*"(?P<method>[A-Z]+) (?P<path>\S+) HTTP/(?P<version>[0-9.]+)"$')
        if err == null {
          %dataset = "mealie.access"
          ."source.ip" = access.ip
          ."source.port" = to_int(access.port) ?? null
          code = to_int(access.code) ?? 0
          ."http.response.status_code" = code
          ."event.outcome" = if code < 400 { "success" } else { "failure" }
          ."http.request.method" = access.method
          ."http.version" = access.version
          ."url.original" = access.path
          parts = split(string!(access.path), "?", limit: 2)
          ."url.path" = parts[0]
          if length(parts) > 1 { ."url.query" = parts[1] }
        }
      }

  # ghostunnel (lldap's HTTPS): "[<pid>] <time> opening pipe: tcp:<client> [...] <-> tcp:<target>".
  ghostunnel:
    type: remap
    inputs: [by_source.ghostunnel]
    drop_on_error: true
    reroute_dropped: true
    source: |
      %dataset = "ghostunnel.log"
      pipe, err = parse_regex(string(._msg) ?? "", r'pipe: tcp:\[?(?P<ip>[0-9A-Fa-f.:]+?)\]?:(?P<port>\d+) .*<-> tcp:\[?(?P<dip>[0-9A-Fa-f.:]+?)\]?:(?P<dport>\d+)')
      if err == null {
        ."source.ip" = pipe.ip
        ."source.port" = to_int(pipe.port) ?? null
        ."destination.ip" = pipe.dip
        ."destination.port" = to_int(pipe.dport) ?? null
      }

  # A line one of the remaps above failed on (a runtime error: none is expected, VRL makes every
  # fallible call be handled): as it came into that remap, Vector's reason in metadata.dropped.
  # Kept, in that source's <name>.log, as a remap_error (ecs). Only the remaps' dropped outputs
  # come here, so a line can't claim to be one.
  unparsed:
    type: remap
    inputs: [pods.dropped, envoy.dropped, authelia.dropped, falco.dropped, lldap.dropped, vaultwarden.dropped, coredns.dropped, mealie.dropped, ghostunnel.dropped]
    source: |
      dropped = object(.metadata.dropped) ?? {}
      . = remove!(., ["metadata", "dropped"])
      if .metadata == {} { del(.metadata) }
      component = string(dropped.component_id) ?? ""
      if component == "pods" {
        # Straight from kubernetes_logs.
        . = {
          "_msg": .message,
          "_time": .timestamp,
          "output_stream": .stream,
          "kubernetes": {
            "pod_namespace": .kubernetes.pod_namespace,
            "pod_name": .kubernetes.pod_name,
            "container_name": .kubernetes.container_name,
            "pod_node_name": .kubernetes.pod_node_name,
            "pod_ip": .kubernetes.pod_ip,
            "container_image": .kubernetes.container_image,
            "pod_labels": .kubernetes.pod_labels,
          },
        }
      } else if component != "" {
        %dataset = component + ".log"
      }
      %error_type = "remap_error"
      %error_message = dropped.message

  # Fields every pod's line gets, after its source's own remap. Overwritten whatever the line
  # had, so a container can't pass its logs off as another source's. The remaps say what they
  # found in metadata (%dataset, %provider, %kind, %mismatch, %error_*), which a line can't set.
  ecs:
    type: remap
    inputs: [by_source._unmatched, envoy, authelia, falco, lldap, vaultwarden, coredns, mealie, ghostunnel, unparsed]
    source: |
      # event.kind: pipeline_error for a line a remap failed on (remap_error) or one that looked
      # like its source's format but didn't parse (format_mismatch), the reason in error.message;
      # alert for Falco's alerts; event for the rest.
      kind = string(%kind) ?? "event"
      error_type = string(%error_type) ?? ""
      error_message = string(%error_message) ?? ""
      mismatch = string(%mismatch) ?? ""
      if error_type == "" && mismatch != "" {
        error_type = "format_mismatch"
        error_message = mismatch
      }
      if error_type != "" {
        kind = "pipeline_error"
        ."error.type" = error_type
        ."error.message" = error_message
      }
      ."event.kind" = kind

      # The dataset's product unless the remap says otherwise, the container for the rest.
      dataset = string(%dataset) ?? ""
      provider = string(%provider) ?? ""
      # A line without a parser of its own (only the fields below) is tagged generic.
      if dataset == "" && kind == "event" {
        if is_array(.tags) {
          .tags = push(array!(.tags), "generic")
        } else if exists(.tags) {
          .tags = [.tags, "generic"]
        } else {
          .tags = ["generic"]
        }
      }
      if dataset == "" {
        dataset = (string(.kubernetes.pod_namespace) ?? "") + "." + (string(.kubernetes.container_name) ?? "")
        # The software: the image's name without its registry, path, tag or digest
        # (ghcr.io/fluxcd/source-controller:v1.9.6 is source-controller; containers are often
        # named something generic like manager), else the container's name.
        image, err = parse_regex(string(.kubernetes.container_image) ?? "", r'^(?:[^@]*/)?(?P<name>[^/:@]+)(?::[^/@]*)?(?:@\S+)?$')
        if provider == "" && err == null { provider = image.name }
        if provider == "" { provider = string(.kubernetes.container_name) ?? "" }
      } else if provider == "" {
        provider = split(dataset, ".")[0]
      }
      ."event.dataset" = dataset
      ."event.provider" = provider
      node = string(.kubernetes.pod_node_name) ?? ""
      domain = get_env_var("NODE_DOMAIN") ?? ""
      ."host.hostname" = node
      ."host.name" = if node == "" || domain == "" { node } else { node + "." + domain }

      if !exists(."log.logger") && is_string(.logger) { ."log.logger" = del(.logger) }

      # The app's own level, in one vocabulary: debug, info, notice, warning, error, critical
      # (anything else as it is, lower case). From a JSON line's level, lvl or severity, else
      # from the text formats several apps share. The JSON field it came from goes.
      if !exists(."log.level") {
        raw = null
        from = ""
        for_each(["level", "lvl", "severity"]) -> |_i, key| {
          v = get!(., [key])
          if raw == null && v != null { raw = v; from = key }
        }
        msg = string(._msg) ?? ""
        if raw == null {
          # zap's console format: "<time>\t<level>\t[<logger>\t]<file>.go:<line>\t<message>".
          zap, err = parse_regex(msg, r'^\d{4}-\d\d-\d\dT\S+\t(?P<level>[A-Za-z]+)\t(?:(?P<logger>[^\t]+)\t)?(?P<file>[^\t\s]+\.go):(?P<line>\d+)\t')
          if err == null {
            raw = zap.level
            if zap.logger != null && !exists(."log.logger") { ."log.logger" = zap.logger }
            ."log.origin.file.name" = zap.file
            ."log.origin.file.line" = to_int(zap.line) ?? null
          }
        }
        if raw == null {
          # klog: "<I|W|E|F>MMDD hh:mm:ss.uuuuuu <pid> <file>:<line>] <message>".
          klog, err = parse_regex(msg, r'^(?P<sev>[IWEF])\d{4} \d\d:\d\d:\d\d\.\d+\s+\d+ (?P<file>[^:\]\s]+):(?P<line>\d+)\] ')
          if err == null {
            raw = if klog.sev == "I" { "info" } else if klog.sev == "W" { "warning" } else if klog.sev == "E" { "error" } else { "critical" }
            ."log.origin.file.name" = klog.file
            ."log.origin.file.line" = to_int(klog.line) ?? null
          }
        }
        if raw == null {
          # logfmt (logrus' text format, Go's slog): a level= pair.
          kv, err = parse_regex(msg, r'(?:^|\s)level=(?P<level>[A-Za-z]+)(?:\s|$)')
          if err == null { raw = kv.level }
        }
        # client-go's warnings from the API server (deprecated APIs).
        if raw == null && starts_with(msg, "Warning: ") { raw = "warning" }
        if is_string(raw) {
          l = downcase(string!(raw))
          if includes(["trace", "debug", "dbug"], l) {
            l = "debug"
          } else if includes(["info", "information", "informational"], l) {
            l = "info"
          } else if includes(["warn", "warning"], l) {
            l = "warning"
          } else if includes(["error", "err", "eror"], l) {
            l = "error"
          } else if includes(["crit", "critical", "fatal", "panic", "dpanic", "alert", "emerg", "emergency"], l) {
            l = "critical"
          }
          ."log.level" = l
          if from != "" { . = remove!(., [from]) }
        }
      }

      # The app's error, a JSON line's error or err (zap, logrus, Go's slog, Authelia). On a
      # pipeline_error, error.message is Vector's reason, so the app's field stays as it is.
      if kind != "pipeline_error" {
        for_each(["error", "err"]) -> |_i, key| {
          e = get!(., [key])
          if !exists(."error.message") && is_string(e) && e != "" {
            ."error.message" = e
            . = remove!(., [key])
          }
        }
      }
      # Where it was logged from, zap JSON's caller ("<file>.go:<line>").
      if !exists(."log.origin.file.name") && is_string(.caller) {
        caller, err = parse_regex(string!(.caller), r'^(?P<file>[^\s:]+):(?P<line>\d+)$')
        if err == null {
          ."log.origin.file.name" = caller.file
          ."log.origin.file.line" = to_int(caller.line) ?? null
          del(.caller)
        }
      }

  events:
    type: remap
    inputs: [audit]
    # A line that isn't JSON isn't sent half-parsed: it goes to audit_unparsed.
    drop_on_error: true
    reroute_dropped: true
    source: |
      . = object!(parse_json!(.message))
      ._time = .stageTimestamp || .requestReceivedTimestamp
      node = get_env_var!("NODE_NAME")
      code = ""
      if .responseStatus.code != null { code = to_string!(.responseStatus.code) }
      ._msg = join!(compact([
        string(.verb) ?? "",
        string(.requestURI) ?? "",
        code,
        "by",
        string(.user.username) ?? "",
      ]), " ")

      # The common fields (ECS, as for pod logs).
      ."event.dataset" = "kubernetes.audit"
      ."event.provider" = "kube-apiserver"
      ."event.kind" = "event"
      domain = get_env_var("NODE_DOMAIN") ?? ""
      ."host.hostname" = node
      ."host.name" = if domain == "" { node } else { node + "." + domain }
      ."source.ip" = .sourceIPs[0]
      ."user.name" = .user.username
      ."user_agent.original" = .userAgent
      ."event.action" = .verb
      status = to_int(.responseStatus.code) ?? 0
      ."event.outcome" = if status == 0 { "unknown" } else if status < 400 { "success" } else { "failure" }
      if status > 0 { ."http.response.status_code" = status }
      # Why it was refused (e.g. Pod Security's "violates PodSecurity ...").
      if is_string(.responseStatus.message) { ."error.message" = .responseStatus.message }
      if .auditID != null { ."event.id" = del(.auditID) }
      if .requestReceivedTimestamp != null { ."event.start" = del(.requestReceivedTimestamp) }
      if .stageTimestamp != null { ."event.end" = del(.stageTimestamp) }
      if is_string(.requestURI) {
        ."url.original" = del(.requestURI)
        parts = split(string!(."url.original"), "?", limit: 2)
        ."url.path" = parts[0]
        if length(parts) > 1 { ."url.query" = parts[1] }
      }
      # The event's own copies of those. sourceIPs stays when it has more than the client (a
      # proxy's chain).
      del(.verb)
      del(.userAgent)
      del(.user.username)
      if .user == {} { del(.user) }
      if length(array(.sourceIPs) ?? []) == 1 { del(.sourceIPs) }
      if status > 0 { del(.responseStatus.code) }
      del(.responseStatus.message)
      if .responseStatus == {} || .responseStatus == {"metadata": {}} { del(.responseStatus) }

  # An audit log line that isn't an event (e.g. a partial line), kept as it is: something in
  # the audit log that can't be read is worth seeing.
  audit_unparsed:
    type: remap
    inputs: [events.dropped]
    source: |
      node = get_env_var("NODE_NAME") ?? ""
      domain = get_env_var("NODE_DOMAIN") ?? ""
      fqdn = if domain == "" { node } else { node + "." + domain }
      . = {
        "_msg": .message,
        "_time": .timestamp,
        "event.dataset": "kubernetes.audit",
        "event.provider": "kube-apiserver",
        "host.hostname": node,
        "host.name": fqdn,
        "event.kind": "pipeline_error",
        "error.type": "remap_error",
        "error.message": .metadata.dropped.message,
      }

sinks:
  # Pod logs and audit events alike; audit events have no kubernetes.* stream fields.
  victorialogs:
    type: http
    inputs: [ecs, events, audit_unparsed]
    uri: https://victorialogs.monitoring.svc:9428/insert/jsonline?_stream_fields=event.dataset,event.kind,host.name,kubernetes.pod_namespace,kubernetes.pod_name,kubernetes.container_name&_msg_field=_msg&_time_field=_time
    method: post
    encoding:
      codec: json
    framing:
      method: newline_delimited
    compression: gzip
    tls:
      ca_file: /etc/vector/tls/ca.crt
    # On the node's disk while VictoriaLogs is down (256 MiB is Vector's minimum).
    buffer:
      type: disk
      max_size: 268435488
      when_full: block
  metrics:
    type: prometheus_exporter
    inputs: [internal]
    address: 0.0.0.0:9598
