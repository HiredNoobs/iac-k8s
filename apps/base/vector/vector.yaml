# Vector on every node, sending to VictoriaLogs.
#
# Pod logs: every container's log lines (kubernetes_logs), with their namespace, pod, container,
# node, image and the pod's labels (kubernetes.*). A JSON line is split into its fields: the first
# of message, msg, log becomes _msg and the first of time, timestamp, ts that parses becomes
# _time (otherwise the time the container runtime wrote the line). Any other line is _msg as it
# is. Then the common fields, ECS names (https://www.elastic.co/guide/en/ecs/current/) written as
# flat dotted keys, so they can't clash with an app's own field of the same top-level name (the
# same field in VictoriaLogs either way):
#   event.dataset   which source: its own name (envoy.access, ...) or <namespace>.<container>
#   event.provider  what wrote it: the dataset's first part (envoy, ...) or the container
#   host.hostname   the node's hostname (its name)
#   host.name       the node's FQDN, <hostname>.<NODE_DOMAIN> (daemonset.yaml)
#   log.level       the app's level as debug, info, notice, warning, error or critical
# Stream fields: event.dataset, host.name, kubernetes.pod_namespace, kubernetes.pod_name,
# kubernetes.container_name.
#
# kube-apiserver's audit log, on the control planes: each event as one JSON line. The event's
# fields stay as they are (nested ones become user.username, objectRef.resource,
# responseStatus.code, ... in VictoriaLogs), plus:
#   _msg       "<verb> <requestURI> <code> by <user>", a summary to read in lists
#   _time      when the response completed (stageTimestamp)
#   remote_ip  the client, sourceIPs[0] (sourceIPs itself is an array, stored as JSON text), named
#              like the other sources' client field
#   source     "kube-audit", and node: the stream fields
# and the common fields: event.dataset (kubernetes.audit), event.provider (kube-apiserver),
# host.hostname, host.name, source.ip, user.name, user_agent.original, event.action (the verb)
# and event.outcome (from the response code).
data_dir: /var/lib/vector

sources:
  # Not Vector's own pods (the vector.dev/exclude label, daemonset.yaml): its errors about
  # sending would be sent through itself. Its metrics show them.
  pod_logs:
    type: kubernetes_logs
    # Without a checkpoint (first start), from now rather than every file on the node. Files
    # found later (new pods, rotations) are read from their start.
    read_from: end
  audit:
    type: file
    include:
      - /var/log/audit/kube/*.log
    # Without a checkpoint (first start), from now: the files hold up to 30 days of the old,
    # untrimmed policy. Files rotated in later are read from their start.
    read_from: end
    ignore_older_secs: 86400
  # Vector's own metrics (lines read, sent, errors), scraped by vmagent's pods job.
  internal:
    type: internal_metrics

transforms:
  pods:
    type: remap
    inputs: [pod_logs]
    source: |
      meta = {
        "pod_namespace": .kubernetes.pod_namespace,
        "pod_name": .kubernetes.pod_name,
        "container_name": .kubernetes.container_name,
        "pod_node_name": .kubernetes.pod_node_name,
        "pod_ip": .kubernetes.pod_ip,
        "container_image": .kubernetes.container_image,
        "pod_labels": .kubernetes.pod_labels,
      }
      line = string(.message) ?? ""
      written = .timestamp
      output_stream = .stream

      parsed, err = parse_json(line)
      if err == null && is_object(parsed) {
        . = object!(parsed)
        if is_string(.message) && .message != "" {
          ._msg = del(.message)
        } else if is_string(.msg) && .msg != "" {
          ._msg = del(.msg)
        } else if is_string(.log) && .log != "" {
          ._msg = del(.log)
        }
        # RFC 3339 strings, or Unix seconds as a number (zap's default).
        t = null
        for_each(["time", "timestamp", "ts"]) -> |_i, key| {
          v = get!(., [key])
          if t == null && v != null {
            if is_string(v) {
              t = parse_timestamp(string(v) ?? "", "%+") ?? null
            } else if is_float(v) || is_integer(v) {
              ms = to_int((to_float(v) ?? 0.0) * 1000)
              t = from_unix_timestamp(ms, unit: "milliseconds") ?? null
            }
            if t != null { . = remove!(., [key]) }
          }
        }
        if t == null { t = written }
        ._time = t
      } else {
        . = {"_msg": line, "_time": written}
      }
      .kubernetes = meta
      .output_stream = output_stream

  # Each source with its own fields to its remap (by namespace and container, which the pod can't
  # choose), the rest straight to ecs.
  by_source:
    type: route
    inputs: [pods]
    route:
      envoy: .kubernetes.pod_namespace == "envoy-gateway" && .kubernetes.container_name == "envoy"
      authelia: .kubernetes.pod_namespace == "authelia" && .kubernetes.container_name == "authelia"

  # Envoy's access log (EnvoyProxy's format, infrastructure/configs/gateway/envoy-proxy.yaml).
  # Its own log lines are envoy.log. Envoy writes "-" for a value it doesn't have.
  envoy:
    type: remap
    inputs: [by_source.envoy]
    source: |
      if !exists(.start_time) || !exists(.response_code) {
        %dataset = "envoy.log"
      } else {
        %dataset = "envoy.access"
        # The string values it has, without the "-"s.
        v = {}
        for_each(["method", ":authority", "x-envoy-origin-path", "user-agent", "x-request-id"]) -> |_i, key| {
          s = get!(., [key])
          if is_string(s) && s != "-" && s != "" { v = set!(v, [key], s) }
        }
        # The client, downstream_remote_address without its port ([...] for IPv6).
        addr, err = parse_regex(string(.downstream_remote_address) ?? "", r'^\[?(?P<ip>[^\[\]]+?)\]?:(?P<port>\d+)$')
        if err == null {
          ."source.ip" = addr.ip
          ."source.port" = to_int(addr.port) ?? null
        }
        method = get!(v, ["method"])
        if method != null { ."http.request.method" = method }
        # 0 when no response was sent (the client went away first).
        code = to_int(.response_code) ?? 0
        if code > 0 {
          ."http.response.status_code" = code
          ."event.outcome" = if code < 400 { "success" } else { "failure" }
        } else {
          ."event.outcome" = "unknown"
        }
        domain = get!(v, [":authority"])
        if domain != null { ."url.domain" = domain }
        path = get!(v, ["x-envoy-origin-path"])
        if path != null {
          ."url.original" = path
          parts = split(string!(path), "?", limit: 2)
          ."url.path" = parts[0]
          if length(parts) > 1 { ."url.query" = parts[1] }
        }
        ua = get!(v, ["user-agent"])
        if ua != null { ."user_agent.original" = ua }
        id = get!(v, ["x-request-id"])
        if id != null { ."http.request.id" = id }
        received = to_int(.bytes_received) ?? null
        if received != null { ."http.request.bytes" = received }
        sent = to_int(.bytes_sent) ?? null
        if sent != null { ."http.response.bytes" = sent }
        # ECS durations are in nanoseconds.
        ms = to_int(.duration) ?? -1
        if ms >= 0 { ."event.duration" = ms * 1000000 }
      }

  # Authelia (JSON: level, msg, remote_ip, method, path). It logs failed logins, not successful
  # ones, and its access decisions; the user is only in the message.
  authelia:
    type: remap
    inputs: [by_source.authelia]
    source: |
      %dataset = "authelia.log"
      if is_string(.remote_ip) { ."source.ip" = .remote_ip }
      msg = string(._msg) ?? ""

      login, err = parse_regex(msg, r'^Unsuccessful (?P<factor>1FA|TOTP|WebAuthn|Duo) authentication attempt by user \'(?P<user>[^\']*)\'(?P<banned> and they are banned)?')
      if err == null {
        ."event.category" = "authentication"
        ."event.action" = if login.factor == "1FA" { "password-login" } else { downcase(string!(login.factor)) + "-login" }
        ."event.outcome" = "failure"
        if login.user != "" { ."user.name" = login.user }
        if login.banned != null { ."event.reason" = "banned" }
      }
      unknown, err = parse_regex(msg, r'username input \'(?P<user>[^\']*)\' which usually indicates they do not exist')
      if err == null {
        ."event.category" = "authentication"
        ."event.action" = "password-login"
        ."event.outcome" = "failure"
        ."event.reason" = "unknown user"
        if unknown.user != "" { ."user.name" = unknown.user }
      }
      # An access decision for a site behind Authelia: the site's URL, not Authelia's own path.
      access, err = parse_regex(msg, r'^Access to (?P<url>\S+) \(method (?P<method>[A-Z]+)\) is not authorized to user (?P<user>.+?), responding with status code (?P<code>\d+)')
      if err == null {
        ."event.category" = "authentication"
        ."event.action" = "authorization"
        ."event.outcome" = "failure"
        ."url.full" = access.url
        u, err = parse_url(string!(access.url))
        if err == null { ."url.domain" = u.host; ."url.path" = u.path }
        ."http.request.method" = access.method
        ."http.response.status_code" = to_int(access.code) ?? null
        if access.user != "<anonymous>" { ."user.name" = access.user }
      } else {
        if is_string(.method) { ."http.request.method" = .method }
        if is_string(.path) { ."url.path" = .path }
      }

  # Fields every pod's line gets, after its source's own remap. Overwritten whatever the line
  # had, so a container can't pass its logs off as another source's.
  ecs:
    type: remap
    inputs: [by_source._unmatched, envoy, authelia]
    source: |
      # The dataset's product unless the remap says otherwise, the container for the rest.
      dataset = string(%dataset) ?? ""
      provider = string(%provider) ?? ""
      if dataset == "" {
        dataset = (string(.kubernetes.pod_namespace) ?? "") + "." + (string(.kubernetes.container_name) ?? "")
        if provider == "" { provider = string(.kubernetes.container_name) ?? "" }
      } else if provider == "" {
        provider = split(dataset, ".")[0]
      }
      ."event.dataset" = dataset
      ."event.provider" = provider
      node = string(.kubernetes.pod_node_name) ?? ""
      domain = get_env_var("NODE_DOMAIN") ?? ""
      ."host.hostname" = node
      ."host.name" = if node == "" || domain == "" { node } else { node + "." + domain }

      # The app's own level, in one vocabulary: debug, info, notice, warning, error, critical
      # (anything else as it is, lower case).
      if !exists(."log.level") {
        raw = .level || .lvl || .severity
        if is_string(raw) {
          l = downcase(string!(raw))
          if includes(["trace", "debug", "dbug"], l) {
            l = "debug"
          } else if includes(["info", "information", "informational"], l) {
            l = "info"
          } else if includes(["warn", "warning"], l) {
            l = "warning"
          } else if includes(["error", "err", "eror"], l) {
            l = "error"
          } else if includes(["crit", "critical", "fatal", "panic", "dpanic", "alert", "emerg", "emergency"], l) {
            l = "critical"
          }
          ."log.level" = l
        }
      }

  events:
    type: remap
    inputs: [audit]
    # A line that isn't JSON is dropped (logged by Vector) rather than sent half-parsed.
    drop_on_error: true
    source: |
      . = object!(parse_json!(.message))
      ._time = .stageTimestamp || .requestReceivedTimestamp
      .source = "kube-audit"
      node = get_env_var!("NODE_NAME")
      .node = node
      .remote_ip = .sourceIPs[0]
      code = ""
      if .responseStatus.code != null { code = to_string!(.responseStatus.code) }
      ._msg = join!(compact([
        string(.verb) ?? "",
        string(.requestURI) ?? "",
        code,
        "by",
        string(.user.username) ?? "",
      ]), " ")

      # The common fields (ECS, as for pod logs).
      ."event.dataset" = "kubernetes.audit"
      ."event.provider" = "kube-apiserver"
      domain = get_env_var("NODE_DOMAIN") ?? ""
      ."host.hostname" = node
      ."host.name" = if domain == "" { node } else { node + "." + domain }
      ."source.ip" = .remote_ip
      ."user.name" = .user.username
      ."user_agent.original" = .userAgent
      ."event.action" = .verb
      status = to_int(.responseStatus.code) ?? 0
      ."event.outcome" = if status == 0 { "unknown" } else if status < 400 { "success" } else { "failure" }

sinks:
  # Two sinks for their stream fields: an app's own `source` or `node` field must not become one.
  victorialogs_pods:
    type: http
    inputs: [ecs]
    uri: https://victorialogs.monitoring.svc:9428/insert/jsonline?_stream_fields=event.dataset,host.name,kubernetes.pod_namespace,kubernetes.pod_name,kubernetes.container_name&_msg_field=_msg&_time_field=_time
    method: post
    encoding:
      codec: json
    framing:
      method: newline_delimited
    compression: gzip
    tls:
      ca_file: /etc/vector/tls/ca.crt
    # On the node's disk while VictoriaLogs is down (256 MiB is Vector's minimum).
    buffer:
      type: disk
      max_size: 268435488
      when_full: block
  victorialogs:
    type: http
    inputs: [events]
    uri: https://victorialogs.monitoring.svc:9428/insert/jsonline?_stream_fields=source,node,event.dataset,host.name&_msg_field=_msg&_time_field=_time
    method: post
    encoding:
      codec: json
    framing:
      method: newline_delimited
    compression: gzip
    tls:
      ca_file: /etc/vector/tls/ca.crt
    buffer:
      type: disk
      max_size: 268435488
      when_full: block
  metrics:
    type: prometheus_exporter
    inputs: [internal]
    address: 0.0.0.0:9598
