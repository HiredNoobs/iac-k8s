# Restarts vector-aggregator every 6 hours, so its init containers fetch the threat intel
# again (scripts/threatintel.py: ThreatFox adds indicators all day) and DB-IP's new month
# (scripts/geodata.sh, which downloads nothing while it has the newest): Vector only reads them
# when it starts (aggregator.yaml). Each restart is a few seconds of syslog and journals queued
# by their senders. A failed run is KubeJobFailed.
#
# Its service account can only read and restart that Deployment.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aggregator-refresh
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aggregator-refresh
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["vector-aggregator"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aggregator-refresh
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aggregator-refresh
subjects:
  - kind: ServiceAccount
    name: aggregator-refresh
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: aggregator-refresh
  labels:
    app.kubernetes.io/name: vector
    app.kubernetes.io/component: aggregator-refresh
spec:
  schedule: "15 */6 * * *"
  timeZone: Europe/London
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: vector
            app.kubernetes.io/component: aggregator-refresh
        spec:
          serviceAccountName: aggregator-refresh
          restartPolicy: Never
          # The image runs as root by default; kubectl needs no user of its own.
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: restart
              image: registry.k8s.io/kubectl:v1.37.1@sha256:b7cab618e281b1ee7484e7b706a96e2135fbb6e072c2a573a7dab4e87d7f2385
              args:
                - rollout
                - restart
                - deployment/vector-aggregator
                # Its discovery cache, on the writable /tmp.
                - --cache-dir=/tmp/kube-cache
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
