# Where rsyslog (apps/base/rsyslog) sends the LAN's syslog, and the Gateway the prx-999 VMs'
# journals (journald-route.yaml): any node's Vector takes them, so a node going away doesn't stop
# them.
apiVersion: v1
kind: Service
metadata:
  name: syslog
  labels:
    app.kubernetes.io/name: vector
spec:
  selector:
    app.kubernetes.io/name: vector
  ports:
    - name: syslog
      port: 5514
      targetPort: syslog
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: journald
  labels:
    app.kubernetes.io/name: vector
spec:
  selector:
    app.kubernetes.io/name: vector
  ports:
    - name: journald
      port: 8686
      targetPort: journald
      protocol: TCP
