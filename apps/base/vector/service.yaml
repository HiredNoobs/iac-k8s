# Where rsyslog (apps/base/rsyslog) sends the LAN's syslog, and the Gateway the prx-999 VMs'
# journals (journald-route.yaml): vector-aggregator (aggregator.yaml).
apiVersion: v1
kind: Service
metadata:
  name: syslog
  labels:
    app.kubernetes.io/name: vector
spec:
  selector:
    app.kubernetes.io/name: vector
    app.kubernetes.io/component: aggregator
  ports:
    - name: syslog
      port: 5514
      targetPort: syslog
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: journald
  labels:
    app.kubernetes.io/name: vector
spec:
  selector:
    app.kubernetes.io/name: vector
    app.kubernetes.io/component: aggregator
  ports:
    - name: journald
      port: 8686
      targetPort: journald
      protocol: TCP
---
# Where the collectors hand Envoy's access log to vector-aggregator (config/collector/envoy.yaml).
apiVersion: v1
kind: Service
metadata:
  name: collectors
  labels:
    app.kubernetes.io/name: vector
spec:
  selector:
    app.kubernetes.io/name: vector
    app.kubernetes.io/component: aggregator
  ports:
    - name: collectors
      port: 6000
      targetPort: collectors
      protocol: TCP
---
# Where every node's Talos sends its own logs (iac-homelab's talos-cluster module,
# machine.logging). Talos resolves names with the host's DNS, not the cluster's, so the address
# is fixed: in the first 256 of the Service range (10.96.0.0/12), which Kubernetes only assigns
# to Services that ask for an address, so a rebuild can't give it to another one. Change both
# together. Local: each node's lines go to the Vector on that node, which is how they get their
# host. Reachable from the nodes and pods, not the LAN.
apiVersion: v1
kind: Service
metadata:
  name: talos-logs
  labels:
    app.kubernetes.io/name: vector
spec:
  clusterIP: 10.96.0.50
  internalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: vector
    app.kubernetes.io/component: collector
  ports:
    - name: talos
      port: 6050
      targetPort: talos
      protocol: TCP
