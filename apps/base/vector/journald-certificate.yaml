# The journald listener's server certificate (config/aggregator/journald.yaml's journald_relay):
# Envoy checks it against the monitoring CA (journald-route.yaml).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vector-journald
spec:
  secretName: vector-journald-tls
  commonName: journald.vector.svc.cluster.local
  dnsNames:
    - journald.vector.svc.cluster.local
    - journald.vector.svc
  usages:
    - digital signature
    - key encipherment
    - server auth
  issuerRef:
    kind: ClusterIssuer
    name: monitoring-ca
