# The app's secrets file (SECRETS_PATH), built from labv2/production/contentbot. The usernames
# are the Redis ACL user and the RabbitMQ user (apps/base/rabbitmq/topology/contentbot.yaml, which
# reads RABBITMQ_PASSWORD too). toJson quotes the values for YAML.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: contentbot
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: contentbot
    template:
      data:
        contentbot_secrets.conf: |
          cytube_user: {{ .cytube_user | toJson }}
          cytube_pass: {{ .cytube_pass | toJson }}
          db_user: contentbot
          db_pass: {{ .db_pass | toJson }}
          rabbitmq_user: contentbot
          rabbitmq_pass: {{ .rabbitmq_pass | toJson }}
  data:
    - secretKey: cytube_user
      remoteRef:
        key: production/contentbot
        property: CYTUBE_USER
    - secretKey: cytube_pass
      remoteRef:
        key: production/contentbot
        property: CYTUBE_PASS
    - secretKey: db_pass
      remoteRef:
        key: production/contentbot
        property: REDIS_PASSWORD
    - secretKey: rabbitmq_pass
      remoteRef:
        key: production/contentbot
        property: RABBITMQ_PASSWORD
