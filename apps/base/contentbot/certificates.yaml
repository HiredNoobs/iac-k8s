# contentbot's client certificates for Redis and RabbitMQ, from their CAs (the ClusterIssuers in
# infrastructure/configs/cluster-issuer). cert-manager renews them, Reloader restarts the pods.
# Each secret holds tls.crt, tls.key and ca.crt (the CA the server is checked against). The
# commonName differs from the CAs' ("redis", "rabbitmq"), or OpenSSL would take them for
# self-signed. The identity is still the user and password, not the certificate.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: contentbot-redis
spec:
  secretName: contentbot-redis-tls
  commonName: contentbot
  usages:
    - digital signature
    - key encipherment
    - client auth
  issuerRef:
    kind: ClusterIssuer
    name: redis-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: contentbot-rabbitmq
spec:
  secretName: contentbot-rabbitmq-tls
  commonName: contentbot
  usages:
    - digital signature
    - key encipherment
    - client auth
  issuerRef:
    kind: ClusterIssuer
    name: rabbitmq-ca
