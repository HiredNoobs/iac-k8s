# The chatbot and the worker, the same image with a different argument: this Deployment once for
# each (../chatbot, ../worker set its name, component and argument). Each runs exactly once: a
# second chatbot would join the channel twice, and the worker hasn't been checked with more than
# one replica. Recreate stops the old pod before the new one starts. If a node dies without a
# clean shutdown, Kubernetes starts a replacement about 5 minutes later, before the old pod is
# confirmed gone, so a second chatbot can briefly be in the channel. One replica, no PDB.
#
# The image's user is 10001 (the restricted pod security standard); its dictionary
# (/etc/contentbot/eng_dict.txt) and the mounted files are readable by anyone. The config files
# are mounted one by one so the dictionary isn't hidden.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: contentbot
  labels:
    app.kubernetes.io/name: contentbot
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: contentbot
  template:
    metadata:
      labels:
        app.kubernetes.io/name: contentbot
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: contentbot
          image: hirednoobs/contentbot:4.0.0-rc1@sha256:112dd2fc3720aca2b5976c014b668c5a87a297eba1c87393009e9e70a35ae1a5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            # Logs to stdout.
            - name: RUNNING_ENVIRONMENT
              value: DOCKER
            - name: LOG_LEVEL
              value: INFO
            - name: CONFIG_PATH
              value: /etc/contentbot/contentbot.conf
            - name: SECRETS_PATH
              value: /etc/contentbot/contentbot_secrets.conf
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/contentbot/contentbot.conf
              subPath: contentbot.conf
              readOnly: true
            - name: secrets
              mountPath: /etc/contentbot/contentbot_secrets.conf
              subPath: contentbot_secrets.conf
              readOnly: true
            - name: tls
              mountPath: /etc/contentbot/tls
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: contentbot-config
        - name: secrets
          secret:
            secretName: contentbot
        # The file names config/contentbot.conf expects.
        - name: tls
          projected:
            sources:
              - secret:
                  name: contentbot-redis-tls
                  items:
                    - { key: ca.crt, path: redis_ca.crt }
                    - { key: tls.crt, path: redis.crt }
                    - { key: tls.key, path: redis.key }
              - secret:
                  name: contentbot-rabbitmq-tls
                  items:
                    - { key: ca.crt, path: rabbitmq_ca.crt }
                    - { key: tls.crt, path: rabbitmq.crt }
                    - { key: tls.key, path: rabbitmq.key }
