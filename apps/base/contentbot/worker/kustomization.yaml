# The worker (../deployment).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../deployment
labels:
  - pairs:
      app.kubernetes.io/component: worker
    includeSelectors: true
patches:
  - target:
      kind: Deployment
    patch: |
      - { op: replace, path: /metadata/name, value: worker }
      - { op: replace, path: /spec/template/spec/containers/0/name, value: worker }
      - { op: add, path: /spec/template/spec/containers/0/args, value: ["worker"] }
