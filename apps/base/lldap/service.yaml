# Authelia binds over LDAPS (ldaps://lldap.lldap.svc:6360), the Gateway routes lldap.hirednoobs.com
# and the bootstrap reaches the admin UI/API over HTTPS (ghostunnel). Both use certificate.yaml's
# certificate. LLDAP's plain LDAP and HTTP ports aren't in the Service.
apiVersion: v1
kind: Service
metadata:
  name: lldap
  labels:
    app.kubernetes.io/name: lldap
spec:
  selector:
    app.kubernetes.io/name: lldap
  ports:
    - name: ldaps
      port: 6360
      targetPort: ldaps
      protocol: TCP
    - name: https
      port: 443
      targetPort: https
      protocol: TCP
