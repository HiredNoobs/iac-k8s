# labv2/production/lldap:
#
# - LLDAP_JWT_SECRET: signs the UI's sessions, changing it logs everyone out.
# - LLDAP_KEY_SEED: the password hashes are derived from it. Changing it stops every existing
#   password from working.
# - LLDAP_ADMIN_PASS: the admin account's password. LLDAP only uses it when the account is first
#   created, but the bootstrap (bootstrap.yaml) logs in with it, so its runs fail if it's out of
#   date (changed in the UI and not in Vault).
# - HIREDNOOBS_PASSWORD: the hirednoobs user's password, set by the bootstrap (change it in Vault,
#   not the UI, or the next run puts Vault's back).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lldap
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: lldap
  dataFrom:
    - extract:
        key: production/lldap
