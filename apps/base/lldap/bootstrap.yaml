# LLDAP's users and groups from git: bootstrap/users/<user>.json and bootstrap/groups/<group>.json,
# applied by the image's own bootstrap script (/app/bootstrap.sh, see LLDAP's
# example_configs/bootstrap/bootstrap.md) through the admin API. It creates what's missing, sets
# the declared groups and resets each user's password to Vault's (password_file), so a run that
# finds nothing to change changes nothing.
#
# A CronJob rather than a Job: a Job only runs again when its spec changes, and a password
# rotated in Vault doesn't change it. Hourly, it also undoes changes made in the UI to what's
# declared here. To run it now:
#
#   kubectl -n lldap create job --from=cronjob/lldap-bootstrap lldap-bootstrap-manual
#
# Users and groups that aren't declared are deleted (DO_CLEANUP), except the admin user and the
# lldap_* groups: anything made in the UI goes on the next run, declare it here instead.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: lldap-bootstrap
  labels:
    app.kubernetes.io/name: lldap
    app.kubernetes.io/component: bootstrap
spec:
  schedule: "17 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: lldap
            app.kubernetes.io/component: bootstrap
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: bootstrap
              # The same image as LLDAP: the script, lldap_set_password, jq, curl and jo.
              image: lldap/lldap:v0.6.3-alpine-rootless@sha256:ba2c50930ea998eefd5454aa678a7977448019248b1827da87d330df0b71c284
              command: ["/app/bootstrap.sh"]
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              env:
                # HTTPS (ghostunnel), checked against the internal CA: curl reads CURL_CA_BUNDLE,
                # lldap_set_password (rustls with the native roots) SSL_CERT_FILE.
                - name: LLDAP_URL
                  value: https://lldap.lldap.svc.cluster.local
                - name: CURL_CA_BUNDLE
                  value: /tls/ca.crt
                - name: SSL_CERT_FILE
                  value: /tls/ca.crt
                - name: LLDAP_ADMIN_USERNAME
                  value: admin
                # Fails the run if LLDAP_ADMIN_PASS in Vault no longer matches the admin's.
                - name: LLDAP_ADMIN_PASSWORD_FILE
                  value: /passwords/admin
                - name: USER_CONFIGS_DIR
                  value: /bootstrap/users
                - name: GROUP_CONFIGS_DIR
                  value: /bootstrap/groups
                - name: DO_CLEANUP
                  value: "true"
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
              volumeMounts:
                - name: users
                  mountPath: /bootstrap/users
                  readOnly: true
                - name: groups
                  mountPath: /bootstrap/groups
                  readOnly: true
                - name: passwords
                  mountPath: /passwords
                  readOnly: true
                - name: tls
                  mountPath: /tls
                  readOnly: true
          volumes:
            - name: users
              configMap:
                name: lldap-bootstrap-users
            - name: groups
              configMap:
                name: lldap-bootstrap-groups
            - name: passwords
              secret:
                secretName: lldap-bootstrap
            # Only the CA.
            - name: tls
              secret:
                secretName: lldap-tls
                items:
                  - key: ca.crt
                    path: ca.crt
---
# The passwords the bootstrap uses, its own Secret so a missing key only stops the bootstrap, not
# LLDAP. authelia's is the one Authelia reads (labv2/production/authelia), so Vault is the only
# copy: rotate it there, the next run sets it in LLDAP and Reloader restarts Authelia.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lldap-bootstrap
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: lldap-bootstrap
  data:
    - secretKey: admin
      remoteRef:
        key: production/lldap
        property: LLDAP_ADMIN_PASS
    - secretKey: authelia
      remoteRef:
        key: production/authelia
        property: AUTHELIA_LDAP_PASSWORD
    - secretKey: hirednoobs
      remoteRef:
        key: production/lldap
        property: HIREDNOOBS_PASSWORD
