# A single LLDAP. It uses SQLite, so it can't run more than once. The data (users, groups and
# password hashes) is on a Longhorn volume that follows the pod to any node. No PDB: with one
# instance there's nothing to keep up during a drain.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: lldap
  labels:
    app.kubernetes.io/name: lldap
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  serviceName: lldap
  replicas: 1
  # The volume outlives the StatefulSet, removing LLDAP from git doesn't delete the data.
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: lldap
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lldap
    spec:
      # The rootless image runs as lldap (1000:1000), fsGroup lets it write /data.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: lldap
          image: lldap/lldap:v0.6.3-alpine-rootless@sha256:ba2c50930ea998eefd5454aa678a7977448019248b1827da87d330df0b71c284
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: LLDAP_LDAP_BASE_DN
              value: dc=hirednoobs,dc=com
            - name: LLDAP_LDAP_USER_DN
              value: admin
            - name: LLDAP_HTTP_URL
              value: https://lldap.hirednoobs.com
            # The default (::) needs IPv6 in the pod.
            - name: LLDAP_LDAP_HOST
              value: "0.0.0.0"
            - name: LLDAP_HTTP_HOST
              value: "0.0.0.0"
            - name: LLDAP_JWT_SECRET_FILE
              value: /secrets/jwt-secret
            # Changing it after the first start stops every existing password from working.
            - name: LLDAP_KEY_SEED
              valueFrom:
                secretKeyRef:
                  name: lldap
                  key: LLDAP_KEY_SEED
            # Only used when the admin account is first created.
            - name: LLDAP_LDAP_USER_PASS_FILE
              value: /secrets/admin-password
          ports:
            - name: ldap
              containerPort: 3890
              protocol: TCP
            - name: http
              containerPort: 17170
              protocol: TCP
          # The image's own healthcheck, it checks both the LDAP and HTTP servers.
          readinessProbe:
            exec:
              command: ["/app/lldap", "healthcheck", "--config-file", "/data/lldap_config.toml"]
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["/app/lldap", "healthcheck", "--config-file", "/data/lldap_config.toml"]
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: secrets
              mountPath: /secrets
              readOnly: true
      volumes:
        - name: secrets
          secret:
            secretName: lldap
            items:
              - key: LLDAP_JWT_SECRET
                path: jwt-secret
              - key: LLDAP_ADMIN_PASS
                path: admin-password
  # Moved from stack-lldap by re-attaching its volume: the PVC data-lldap-0 was created by hand
  # before the first sync, bound to the old PV.
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: lldap
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: longhorn
        resources:
          requests:
            storage: 1Gi
