# The admin UI. Not behind Authelia: LLDAP has its own login, and Authelia needs LLDAP to log
# anyone in. HTTPS to the pod, verified (BackendTLSPolicy in certificate.yaml).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: lldap
spec:
  parentRefs:
    - name: public
      namespace: gateway
      sectionName: https
  hostnames:
    - lldap.hirednoobs.com
  rules:
    - backendRefs:
        - name: lldap
          port: 443
