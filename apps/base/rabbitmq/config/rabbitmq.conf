# Docs: https://github.com/rabbitmq/rabbitmq-server/blob/main/deps/rabbit/docs/rabbitmq.conf.example
# The certificates are the rabbitmq-tls Secret (Certificate rabbitmq), ca.crt is rabbitmq-ca.

# -----------------------------------------------------
# Broker config
# -----------------------------------------------------

# TLS only, no plain AMQP listener.
listeners.tcp = none
listeners.ssl.default = 5671

reverse_dns_lookups = true

# -----------------------------------------------------
# Cluster config
# -----------------------------------------------------

# Three nodes, found by their pod names: rabbitmq-0 forms the cluster, the others join it
# (rabbitmq_peer_discovery_k8s, which since 4.1 doesn't need the Kubernetes API). Between them
# over TLS (inter_node_tls.config, RABBITMQ_*_ERL_ARGS in statefulset.yaml).
cluster_formation.peer_discovery_backend = k8s
cluster_formation.target_cluster_size_hint = 3

# The metadata store (Khepri) and the quorum queues need a majority: a node cut off from the
# other two stops serving rather than diverging, and carries on once it can reach them again.

# Queues declared without a type (contentbot's) are quorum queues: replicated to all three
# nodes, a majority (two) must be up. Classic queues aren't replicated at all since 4.0. Queues
# that exist keep their type (they have to be deleted and declared again to change).
default_queue_type = quorum
queue_leader_locator = balanced

# -----------------------------------------------------
# TLS config
# -----------------------------------------------------

ssl_options.verify               = verify_peer
ssl_options.fail_if_no_peer_cert = true
ssl_options.cacertfile           = /etc/rabbitmq/tls/ca.crt
ssl_options.certfile             = /etc/rabbitmq/tls/tls.crt
ssl_options.keyfile              = /etc/rabbitmq/tls/tls.key

# -----------------------------------------------------
# Management config
# -----------------------------------------------------

management.ssl.port       = 15671
management.ssl.cacertfile = /etc/rabbitmq/tls/ca.crt
management.ssl.certfile   = /etc/rabbitmq/tls/tls.crt
management.ssl.keyfile    = /etc/rabbitmq/tls/tls.key
