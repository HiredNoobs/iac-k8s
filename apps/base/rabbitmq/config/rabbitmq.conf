# Docs: https://github.com/rabbitmq/rabbitmq-server/blob/main/deps/rabbit/docs/rabbitmq.conf.example
# The certificates are the rabbitmq-tls Secret (Certificate rabbitmq), ca.crt is rabbitmq-ca.

# -----------------------------------------------------
# Broker config
# -----------------------------------------------------

# TLS only, no plain AMQP listener.
listeners.tcp = none
listeners.ssl.default = 5671

reverse_dns_lookups = true

# -----------------------------------------------------
# TLS config
# -----------------------------------------------------

ssl_options.verify               = verify_peer
ssl_options.fail_if_no_peer_cert = true
ssl_options.cacertfile           = /etc/rabbitmq/tls/ca.crt
ssl_options.certfile             = /etc/rabbitmq/tls/tls.crt
ssl_options.keyfile              = /etc/rabbitmq/tls/tls.key

# -----------------------------------------------------
# Management config
# -----------------------------------------------------

management.ssl.port       = 15671
management.ssl.cacertfile = /etc/rabbitmq/tls/ca.crt
management.ssl.certfile   = /etc/rabbitmq/tls/tls.crt
management.ssl.keyfile    = /etc/rabbitmq/tls/tls.key
