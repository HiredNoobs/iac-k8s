# Gives each pod its stable name, rabbitmq-<n>.rabbitmq.rabbitmq.svc, which is also its RabbitMQ
# node name and how the nodes find each other. Published before the pods are ready so they can
# resolve themselves and each other at boot.
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  labels:
    app.kubernetes.io/name: rabbitmq
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: rabbitmq
  ports:
    - name: amqps
      port: 5671
      targetPort: amqps
      protocol: TCP
---
# Clients in the cluster use rabbitmq-broker.rabbitmq.svc, clients outside it
# rabbitmq-broker.hirednoobs.com (Pi-hole's record for the LoadBalancer IP set per cluster, see
# apps/<cluster>/). Any node serves any queue, so it's all three; kube-vip announces the IP from
# a node with a ready one. The web UI is rabbitmq.hirednoobs.com (routes.yaml); vmagent scrapes
# each pod's metrics port itself.
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-broker
  labels:
    app.kubernetes.io/name: rabbitmq
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: rabbitmq
  ports:
    - name: amqps
      port: 5671
      targetPort: amqps
      protocol: TCP
    - name: management
      port: 15671
      targetPort: management
      protocol: TCP
    - name: prometheus
      port: 15692
      targetPort: prometheus
      protocol: TCP
