# contentbot (chatbot and worker): full permissions on /. Its credentials are
# ../users/contentbot.yaml. The operator re-syncs the password whenever that Secret changes.
# Removing the User from git deletes the user from RabbitMQ.
apiVersion: rabbitmq.com/v1beta1
kind: User
metadata:
  name: contentbot
spec:
  importCredentialsSecret:
    name: rabbitmq-user-contentbot
  rabbitmqClusterReference:
    connectionSecret:
      name: rabbitmq-topology-operator
---
apiVersion: rabbitmq.com/v1beta1
kind: Permission
metadata:
  name: contentbot
spec:
  vhost: /
  userReference:
    name: contentbot
  permissions:
    configure: ".*"
    write: ".*"
    read: ".*"
  rabbitmqClusterReference:
    connectionSecret:
      name: rabbitmq-topology-operator
