# contentbot's credentials for its User (topology/contentbot.yaml). Its password is in contentbot's
# own Vault secret (labv2/production/contentbot, RABBITMQ_PASSWORD), which its app reads too. Its
# client certificate is a Certificate from rabbitmq-ca in its own app.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rabbitmq-user-contentbot
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: rabbitmq-user-contentbot
    template:
      metadata:
        labels:
          rabbitmq.com/topology-operator: "true"
      data:
        username: contentbot
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: production/contentbot
        property: RABBITMQ_PASSWORD
