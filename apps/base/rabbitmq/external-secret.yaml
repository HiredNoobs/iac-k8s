# The default user, only created when the volume is empty (the first start, or a rebuild without
# a backup). Only these two keys: labv2/production/rabbitmq also holds the CA's key, which stays
# in cert-manager's namespace (infrastructure/configs/cluster-issuer/rabbitmq-ca.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rabbitmq-default-user
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: rabbitmq-default-user
  data:
    - secretKey: RABBITMQ_DEFAULT_USER
      remoteRef:
        key: production/rabbitmq
        property: RABBITMQ_DEFAULT_USER
    - secretKey: RABBITMQ_DEFAULT_PASS
      remoteRef:
        key: production/rabbitmq
        property: RABBITMQ_DEFAULT_PASS
