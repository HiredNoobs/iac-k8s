# A three-node RabbitMQ cluster: rabbitmq-0 forms it, rabbitmq-1 and -2 join it (rabbitmq.conf).
# Queues are quorum queues, replicated to all three, so any one node can be down. Each node's
# data (its definitions, users and queues) is on its own Longhorn volume that follows the pod to
# any node.
#
# The pods start together (Parallel): after a full stop the last node to stop has the newest
# metadata and the others wait for it, so starting them one after another could wait forever.
# One per node and preferably one per Proxmox host (zone); the PDB and the preStop hook keep a
# majority up in a drain.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  labels:
    app.kubernetes.io/name: rabbitmq
  annotations:
    # Restart to load a renewed certificate, a changed default user or cookie.
    secret.reloader.stakater.com/reload: rabbitmq-tls,rabbitmq-default-user,rabbitmq-erlang-cookie
spec:
  serviceName: rabbitmq
  replicas: 3
  podManagementPolicy: Parallel
  # The volumes outlive the StatefulSet, removing RabbitMQ from git doesn't delete the data.
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: rabbitmq
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rabbitmq
      annotations:
        # Scraped by vmagent's pods job (job rabbitmq), each node's own metrics.
        prometheus.io/scrape: "true"
        prometheus.io/port: "15692"
    spec:
      # The rabbitmq user from the image, fsGroup lets it read the certs and write its data.
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: rabbitmq
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: topology.kubernetes.io/zone
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: rabbitmq
      # The preStop hook waits for the queues to have a majority without this node, then closes
      # its connections; the rest is closing them and syncing queues to disk.
      terminationGracePeriodSeconds: 600
      initContainers:
        # The cookie into the data directory ($HOME of the rabbitmq user), where the node and the
        # CLI tools read it; RabbitMQ wants it readable by its owner only.
        - name: erlang-cookie
          image: rabbitmq:4.3.6-management@sha256:54cb013d76cd1fd6c0a0708f34062ad61c452bb6f016b434c6c33f1a765d2b58
          command:
            - sh
            - -c
            - >-
              rm -f /var/lib/rabbitmq/.erlang.cookie &&
              cp /etc/rabbitmq-cookie/cookie /var/lib/rabbitmq/.erlang.cookie &&
              chmod 0400 /var/lib/rabbitmq/.erlang.cookie
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: erlang-cookie
              mountPath: /etc/rabbitmq-cookie
              readOnly: true
            - name: data
              mountPath: /var/lib/rabbitmq
      containers:
        - name: rabbitmq
          image: rabbitmq:4.3.6-management@sha256:54cb013d76cd1fd6c0a0708f34062ad61c452bb6f016b434c6c33f1a765d2b58
          # Talos warns about anything short of the restricted pod security standard.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # The data directory is named after the node, so it's the pod's stable FQDN
            # (rabbit@rabbitmq-0.rabbitmq.rabbitmq.svc.cluster.local), which is also how the
            # nodes find each other. Changing it (e.g. the namespace) starts an empty node.
            - name: RABBITMQ_USE_LONGNAME
              value: "true"
            - name: RABBITMQ_NODENAME
              value: "rabbit@$(POD_NAME).rabbitmq.$(POD_NAMESPACE).svc.cluster.local"
            # Erlang distribution (node to node, and the CLI tools in the pod, probes included)
            # over TLS.
            - name: RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS
              value: "-proto_dist inet_tls -ssl_dist_optfile /etc/rabbitmq/inter_node_tls.config"
            - name: RABBITMQ_CTL_ERL_ARGS
              value: "-proto_dist inet_tls -ssl_dist_optfile /etc/rabbitmq/inter_node_tls.config"
          # RABBITMQ_DEFAULT_USER and RABBITMQ_DEFAULT_PASS, only used when the cluster is new.
          envFrom:
            - secretRef:
                name: rabbitmq-default-user
          ports:
            - name: amqps
              containerPort: 5671
              protocol: TCP
            - name: management
              containerPort: 15671
              protocol: TCP
            - name: prometheus
              containerPort: 15692
              protocol: TCP
            - name: epmd
              containerPort: 4369
              protocol: TCP
            - name: cluster
              containerPort: 25672
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: amqps
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: amqps
            periodSeconds: 10
            failureThreshold: 3
          # Checks the node itself responds, not just the port. Runs the CLI, so not too often.
          livenessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            periodSeconds: 60
            timeoutSeconds: 30
            failureThreshold: 3
          # Before stopping, wait until every quorum queue has a majority on the other nodes (so
          # stopping this one doesn't take any offline), then hand its queue leaders and clients
          # to the others. Times out rather than block a drain for good.
          lifecycle:
            preStop:
              exec:
                command:
                  - sh
                  - -c
                  - >-
                    rabbitmq-upgrade await_online_quorum_plus_one -t 480 &&
                    rabbitmq-upgrade drain -t 60
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            # RabbitMQ's memory high watermark (0.4 by default) is taken from this limit.
            limits:
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /etc/rabbitmq/rabbitmq.conf
              subPath: rabbitmq.conf
              readOnly: true
            - name: config
              mountPath: /etc/rabbitmq/enabled_plugins
              subPath: enabled_plugins
              readOnly: true
            - name: config
              mountPath: /etc/rabbitmq/inter_node_tls.config
              subPath: inter_node_tls.config
              readOnly: true
            - name: certs
              mountPath: /etc/rabbitmq/tls
              readOnly: true
            - name: data
              mountPath: /var/lib/rabbitmq
      volumes:
        - name: config
          configMap:
            name: rabbitmq-config
        - name: certs
          secret:
            secretName: rabbitmq-tls
            defaultMode: 0440
        - name: erlang-cookie
          secret:
            secretName: rabbitmq-erlang-cookie
            defaultMode: 0440
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: rabbitmq
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: longhorn
        resources:
          requests:
            storage: 2Gi
---
# One node at a time in a drain: two of three keep every quorum queue available.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: rabbitmq
  labels:
    app.kubernetes.io/name: rabbitmq
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rabbitmq
