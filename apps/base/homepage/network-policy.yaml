# Only the Gateway's Envoy reaches Homepage, every other connection to its pods is dropped.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        # The Gateway's Envoy.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway
          podSelector:
            matchLabels:
              gateway.envoyproxy.io/owning-gateway-name: public
      ports:
        - port: http
