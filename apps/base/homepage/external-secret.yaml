# The widgets' credentials (e.g. PROXMOX_API_PASS, PIHOLE_API_KEY), one key each in Vault. They
# become HOMEPAGE_VAR_<key> env vars, which homepage substitutes for {{HOMEPAGE_VAR_<key>}} in
# config/services.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homepage
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: homepage
  dataFrom:
    - extract:
        key: production/homepage
      rewrite:
        - regexp:
            source: "(.*)"
            target: "HOMEPAGE_VAR_$1"
