# href is opened in the browser, so it uses the hirednoobs.com names (through the Gateway). A
# widget's url is called from the homepage pod, so it goes straight to the upstream, the same
# ones as the Gateway's routes (infrastructure/configs/gateway/routes, or the app's own
# HTTPRoute). Self-signed certs are accepted. {{HOMEPAGE_VAR_*}} are the widgets' credentials,
# from the homepage secret (external-secret.yaml).

- Infra:
  - Router:
      href: https://router.hirednoobs.com
      icon: router
  - Proxmox:
      href: https://proxmox.hirednoobs.com
      icon: proxmox
      widget:
        type: proxmox
        url: https://192.168.111.2:8006
        username: {{HOMEPAGE_VAR_PROXMOX_API_USER}}
        password: {{HOMEPAGE_VAR_PROXMOX_API_PASS}}
  - Proxmox 999:
      href: https://proxmox-999.hirednoobs.com
      description: GitOps server
      icon: proxmox
  - NAS:
      href: https://nas.hirednoobs.com
      icon: ugreen
  # One app password (PIHOLE_API_APP_PWHASH in stack-pihole) is shared by every replica.
  - Pi-hole 1:
      href: https://pihole1.hirednoobs.com/admin
      icon: pi-hole
      widget:
        type: pihole
        url: https://pihole-0.pihole.pihole.svc.cluster.local
        version: 6
        key: {{HOMEPAGE_VAR_PIHOLE_API_KEY}}
  - Pi-hole 2:
      href: https://pihole2.hirednoobs.com/admin
      icon: pi-hole
      widget:
        type: pihole
        url: https://pihole-1.pihole.pihole.svc.cluster.local
        version: 6
        key: {{HOMEPAGE_VAR_PIHOLE_API_KEY}}
  - Pi-hole 3:
      href: https://pihole3.hirednoobs.com/admin
      icon: pi-hole
      widget:
        type: pihole
        url: https://pihole-2.pihole.pihole.svc.cluster.local
        version: 6
        key: {{HOMEPAGE_VAR_PIHOLE_API_KEY}}

- Monitoring:
  - Grafana:
      href: https://grafana.hirednoobs.com
      icon: grafana
      # Grafana's own stats (scraped by vmagent) and firing alerts from vmalert's ALERTS series, in
      # one widget so they share a row. The grafana widget's alert count would always include the
      # healthchecks.io heartbeat (Watchdog).
      widget:
        type: prometheusmetric
        url: https://victoriametrics.monitoring.svc.cluster.local:8428
        refreshInterval: 60000
        metrics:
          - label: DASHBOARDS
            query: max(grafana_stat_totals_dashboard)
          - label: DATASOURCES
            query: sum(grafana_stat_totals_datasource)
          - label: ALERTS TRIGGERED
            query: count(ALERTS{alertstate="firing", alertname!="Watchdog"}) or vector(0)
  - VictoriaLogs:
      href: https://victorialogs.hirednoobs.com
      icon: victorialogs
  - VictoriaMetrics:
      href: https://victoriametrics.hirednoobs.com
      icon: victoriametrics
  - VMAlert:
      href: https://vmalert.hirednoobs.com
      icon: victoriametrics
  - VMAgent:
      href: https://vmagent.hirednoobs.com
      icon: victoriametrics
  - Alertmanager:
      href: https://alertmanager.hirednoobs.com
      icon: alertmanager

