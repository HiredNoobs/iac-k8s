# Monitoring, from stack-grafana: Grafana, VictoriaMetrics, VictoriaLogs, vmagent, vmalert and
# Alertmanager, each a single instance. Plain manifests, the stack's. Plus kube-state-metrics and
# blackbox_exporter (upstream's charts). node_exporter is its own app (apps/base/node-exporter, it needs a privileged
# namespace), rsyslog forwards syslog to VictoriaLogs (apps/base/rsyslog).
#
# One directory per component, with its manifests, its config and its own kustomization (the
# config's ConfigMaps). Shared here: the namespace, the server certificate and the Helm repository.
#
# The components talk to each other over TLS by their service names (<component>.monitoring.svc),
# with one certificate from the monitoring-ca ClusterIssuer (certificate.yaml).
# Grafana, VictoriaMetrics and VictoriaLogs keep their data on Longhorn volumes.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - namespace.yaml
  - certificate.yaml
  - repository.yaml
  - grafana
  - victoriametrics
  - victorialogs
  - vmagent
  - vmalert
  - alertmanager
  - kube-state-metrics
  - blackbox-exporter
