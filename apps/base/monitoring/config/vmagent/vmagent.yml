global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  # node_exporter on every k8s node (the node-exporter DaemonSet in apps/base/node-exporter, host
  # network so the pod IP is the node's). instance is the node name, e.g.
  # prx-001-srv-prod-core-worker-001.
  - job_name: node
    metrics_path: /metrics
    scheme: http
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: ["node-exporter"]
        selectors:
          - role: pod
            label: "app.kubernetes.io/name=node-exporter"
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_ip]
        target_label: __address__
        replacement: "$1:9100"
      - source_labels: [__meta_kubernetes_pod_node_name]
        target_label: instance

  # node_exporter installed by iac-homelab's monitoring playbook on the Debian VMs (management
  # and the prx-999 servers). By IP, the prx-999 VMs aren't in Pi-hole, instance is the VM name.
  - job_name: node-debian
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets: ["192.168.111.254:9100"]
        labels: { vm: prx-999-srv-mgmt-001 }
      - targets: ["192.168.111.200:9100"]
        labels: { vm: prx-999-srv-git-001 }
      - targets: ["192.168.111.201:9100"]
        labels: { vm: prx-999-srv-runner-001 }
      - targets: ["192.168.111.202:9100"]
        labels: { vm: prx-999-srv-vault-001 }
    relabel_configs:
      - source_labels: [vm]
        target_label: instance
      - action: labeldrop
        regex: vm
      - target_label: job
        replacement: node

  # Each kubelet, for the persistent volume stats (node_exporter doesn't see the pod volume
  # mounts). Authenticates with vmagent's service account token (vmagent.yaml, nodes/metrics).
  # The kubelets' serving certificates are from the cluster CA (Talos' serverTLSBootstrap,
  # approved by kubelet-serving-cert-approver) and name the node's IP, so they're verified.
  # Only the volume stats are kept.
  - job_name: kubelet
    metrics_path: /metrics
    scheme: https
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    kubernetes_sd_configs:
      - role: node
    relabel_configs:
      - source_labels: [__meta_kubernetes_node_name]
        target_label: instance
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "kubelet_volume_stats_.+"
        action: keep

  # Each kubelet's cAdvisor, for per-container CPU, memory and OOM kills and per-pod network
  # (what the Kubernetes dashboards use). Only those are kept: CPU and memory for containers
  # (not the pod and system cgroups, which have no container label), network for pods (only
  # reported without one).
  - job_name: cadvisor
    metrics_path: /metrics/cadvisor
    scheme: https
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    kubernetes_sd_configs:
      - role: node
    relabel_configs:
      - source_labels: [__meta_kubernetes_node_name]
        target_label: instance
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "container_(cpu_usage_seconds_total|cpu_cfs_periods_total|cpu_cfs_throttled_periods_total|cpu_cfs_throttled_seconds_total|memory_working_set_bytes|oom_events_total|network_(receive|transmit)_(bytes|packets|errors|packets_dropped)_total)"
        action: keep
      - source_labels: [__name__, container]
        regex: "container_network_.+;|container_(cpu|memory|oom)_.+;.+"
        action: keep

  # Vault on prx-999 (iac-homelab), metrics are unauthenticated and a sealed Vault is scraped
  # too. Let's Encrypt certificate, so it's verified.
  - job_name: "vault"
    metrics_path: /v1/sys/metrics
    params:
      format: ["prometheus"]
    scheme: https
    static_configs:
      - targets: ["vault.hirednoobs.com:443"]
        labels: { vm: prx-999-srv-vault-001 }
    relabel_configs:
      - source_labels: [vm]
        target_label: instance
      - action: labeldrop
        regex: vm

  # namespace for RabbitMQ's dashboard, which picks the cluster by it.
  - job_name: "rabbitmq"
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets:
          - "rabbitmq-broker.rabbitmq.svc:15692"
        labels: { namespace: rabbitmq }
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  # The monitoring components themselves, by their service names (single instances), verified
  # with the monitoring CA. vmagent scrapes itself the same way. Each one's job is its name
  # (victoriametrics, vmagent, ...), which VictoriaMetrics' dashboards select by.
  - job_name: monitoring
    metrics_path: /metrics
    scheme: https
    tls_config:
      ca_file: /etc/vmagent/tls/ca.crt
    static_configs:
      - targets:
          - grafana.monitoring.svc:3000
          - victoriametrics.monitoring.svc:8428
          - victorialogs.monitoring.svc:9428
          - vmagent.monitoring.svc:8429
          - vmalert.monitoring.svc:8880
          - alertmanager.monitoring.svc:9093
    relabel_configs:
      - source_labels: [__address__]
        regex: '([^.]+)\..*'
        target_label: job

  # kube-state-metrics (kube-state-metrics.yaml): the state of Kubernetes objects (pods,
  # Deployments, Jobs, PVCs, ...) and Flux's resources (gotk_resource_info).
  - job_name: kube-state-metrics
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets: ["kube-state-metrics.monitoring.svc:8080"]
    # The objects' own namespace/pod labels win over the target's.
    honor_labels: true

  # blackbox_exporter's probes (blackbox-exporter.yaml has the modules). Each target group sets
  # its module, which is kept as a label (the alerts in config/vmalert/blackbox.yml use it);
  # instance is the target. Names resolve like any client's (the router, then Pi-hole), so the
  # HTTPS probes also depend on Pi-hole. pihole2/3 and proxmox-002/003 are added with Step B's
  # hosts.
  - job_name: blackbox
    metrics_path: /probe
    scrape_interval: 60s
    scrape_timeout: 15s
    static_configs:
      # Through the Gateway (.101), each app's own page or login.
      - labels: { __param_module: https }
        targets:
          - https://auth.hirednoobs.com/
          - https://grafana.hirednoobs.com/
          - https://lldap.hirednoobs.com/
          - https://vaultwarden.hirednoobs.com/
          - https://rabbitmq.hirednoobs.com/
          - https://pihole.hirednoobs.com/
          - https://pihole1.hirednoobs.com/
          - https://proxmox.hirednoobs.com/
          - https://proxmox-001.hirednoobs.com/
          - https://proxmox-999.hirednoobs.com/
          - https://nas.hirednoobs.com/
          - https://jellyfin.hirednoobs.com/
          - https://seerr.hirednoobs.com/
          - https://sonarr.hirednoobs.com/
          - https://radarr.hirednoobs.com/
          - https://lidarr.hirednoobs.com/
          - https://bazarr.hirednoobs.com/
          - https://prowlarr.hirednoobs.com/
          - https://profilarr.hirednoobs.com/
          - https://qbittorrent.hirednoobs.com/
      # prx-999, not through the Gateway.
      - labels: { __param_module: https }
        targets:
          - https://git.hirednoobs.com/
          - https://vault.hirednoobs.com/
      # Behind Authelia: redirected to its portal.
      - labels: { __param_module: https_authelia }
        targets:
          - https://homepage.hirednoobs.com/
          - https://alertmanager.hirednoobs.com/
          - https://victoriametrics.hirednoobs.com/
          - https://victorialogs.hirednoobs.com/
          - https://vmagent.hirednoobs.com/
          - https://vmalert.hirednoobs.com/
      # Pi-hole on its LoadBalancer IP (.100), as the LAN uses it.
      - labels: { __param_module: dns_local }
        targets: ["192.168.111.100"]
      - labels: { __param_module: dns_blocked }
        targets: ["192.168.111.100"]
      - labels: { __param_module: dns_recursive }
        targets: ["192.168.111.100"]
      # The other LoadBalancer IPs: Redis (.102, over TLS with a client certificate), RabbitMQ
      # (.103, its plain metrics port rather than AMQPS, which wants a client certificate) and
      # rsyslog (.104).
      - labels: { __param_module: redis_tls }
        targets: ["redis.hirednoobs.com:6379"]
      - labels: { __param_module: tcp_connect }
        targets: ["rsyslog.hirednoobs.com:514"]
      - labels: { __param_module: http }
        targets:
          - http://rabbitmq-broker.hirednoobs.com:15692/metrics
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - source_labels: [__param_module]
        target_label: module
      - target_label: __address__
        replacement: blackbox-exporter.monitoring.svc:9115

  # Pods annotated prometheus.io/scrape: "true" (with prometheus.io/port and, optionally,
  # prometheus.io/path and prometheus.io/scheme): cert-manager, Envoy Gateway's controller and
  # its Envoy proxies (/stats/prometheus). The pod's namespace label wins, a metric's own
  # namespace becomes exported_namespace (cert-manager's Certificates).
  - job_name: pods
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        regex: "true"
        action: keep
      - source_labels: [__meta_kubernetes_pod_phase]
        regex: "Running"
        action: keep
      # Discovery makes a target per declared container port, all rewritten to the annotated
      # port below: keep only the one declaring it (else duplicates, e.g. Envoy Gateway's
      # controller declares five ports).
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_port, __meta_kubernetes_pod_container_port_number]
        action: keep_if_equal
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scheme]
        regex: "(https?)"
        target_label: __scheme__
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        regex: "(.+)"
        target_label: __metrics_path__
      - source_labels: [__meta_kubernetes_pod_ip, __meta_kubernetes_pod_annotation_prometheus_io_port]
        regex: '(.+);(\d+)'
        replacement: "$1:$2"
        target_label: __address__
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name, __meta_kubernetes_pod_label_app]
        regex: "(.+);.*|;(.+)"
        replacement: "$1$2"
        target_label: job

  # Flux's controllers (port http-prom). Their resources' state comes from kube-state-metrics.
  # namespace and pod as Flux's dashboards expect (the resources' own namespace label becomes
  # exported_namespace).
  - job_name: flux
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: ["flux-system"]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_container_port_name]
        regex: "http-prom"
        action: keep
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod

  # External Secrets' controller, webhook and cert controller (port metrics). service is what
  # its dashboard selects by. No namespace label: the ExternalSecrets' own is kept as namespace.
  - job_name: external-secrets
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: ["external-secrets"]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_container_port_name]
        regex: "metrics"
        action: keep
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
        target_label: service
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod

  # Longhorn: every node's manager (port manager) reports that node's volumes, disks and backups,
  # so each one is scraped.
  - job_name: longhorn
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: ["longhorn-system"]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        regex: "longhorn-manager"
        action: keep
      - source_labels: [__meta_kubernetes_pod_container_port_name]
        regex: "manager"
        action: keep
      - source_labels: [__meta_kubernetes_pod_node_name]
        target_label: instance
