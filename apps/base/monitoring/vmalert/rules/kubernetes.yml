# From kube-state-metrics (kube-state-metrics/release.yaml), a subset of the kubernetes-mixin's
# rules: https://github.com/kubernetes-monitoring/kubernetes-mixin
groups:
  - name: Scrape
    interval: 60s
    rules:
      # Always firing: Alertmanager sends it to healthchecks.io, which
      # notifies when it stops arriving. Not shown on the overview, not notified.
      - alert: Watchdog
        expr: 'vector(1)'
        labels:
          severity: none
        annotations:
          summary: Watchdog, always firing while vmalert, VictoriaMetrics and Alertmanager work
      # Every job vmagent scrapes, including the monitoring components themselves.
      - alert: TargetDown
        expr: 'up == 0'
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Target down ({{ $labels.job }} {{ $labels.instance }})
          description: "vmagent can't scrape {{ $labels.instance }} (job {{ $labels.job }}).\n  LABELS = {{ $labels }}"
      # Alerts that fired but were never delivered: ntfy refusing a notification (it doesn't
      # retry a 400), or ntfy.sh unreachable. This one is a single short alert, so it gets
      # through whatever was too big; if ntfy itself is down, Grafana still shows it.
      - alert: AlertmanagerNotificationsFailing
        expr: 'sum by (integration, reason) (increase(alertmanager_notifications_failed_total[10m])) > 0'
        labels:
          severity: critical
        annotations:
          summary: Alertmanager failed to send {{ $value | printf "%.0f" }} notifications ({{ $labels.integration }}, {{ $labels.reason }})
          description: "{{ $labels.integration }} notifications failed ({{ $labels.reason }}): Alertmanager's log has the receiver and the error.\n  LABELS = {{ $labels }}"
      # Both vmalerts (metrics and logs) failing to hand alerts to Alertmanager.
      - alert: VmalertSendErrors
        expr: 'sum by (job, instance) (increase(vmalert_alerts_send_errors_total[10m])) > 0'
        labels:
          severity: critical
        annotations:
          summary: vmalert can't send alerts to Alertmanager ({{ $labels.instance }})
          description: "{{ $labels.instance }} failed to send alerts to Alertmanager: vmalert's log has the error.\n  LABELS = {{ $labels }}"

  - name: Kubernetes
    interval: 60s
    rules:
      - alert: KubeNodeNotReady
        expr: 'kube_node_status_condition{condition="Ready",status="true"} == 0'
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Node not ready ({{ $labels.node }})
          description: "{{ $labels.node }} has been unready for more than 5 minutes."

      - alert: KubePodCrashLooping
        expr: 'max_over_time(kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"}[5m]) >= 1'
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Pod crash looping ({{ $labels.namespace }}/{{ $labels.pod }})
          description: "Container {{ $labels.container }} of {{ $labels.namespace }}/{{ $labels.pod }} is in CrashLoopBackOff."

      # Pending (unschedulable, image pull, volume not attaching), Unknown or Failed.
      - alert: KubePodNotReady
        expr: 'sum by (namespace, pod) (kube_pod_status_phase{phase=~"Pending|Unknown|Failed"}) > 0'
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Pod not ready ({{ $labels.namespace }}/{{ $labels.pod }})
          description: "{{ $labels.namespace }}/{{ $labels.pod }} has been in a non-ready state for more than 15 minutes."

      - alert: KubeContainerOOMKilled
        expr: 'increase(kube_pod_container_status_restarts_total[15m]) > 0 and on (namespace, pod, container) kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1'
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: Container OOM killed ({{ $labels.namespace }}/{{ $labels.pod }})
          description: "Container {{ $labels.container }} of {{ $labels.namespace }}/{{ $labels.pod }} was killed for running out of memory (its limit)."

      - alert: KubeDeploymentReplicasMismatch
        expr: 'kube_deployment_spec_replicas != kube_deployment_status_replicas_available'
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Deployment replicas mismatch ({{ $labels.namespace }}/{{ $labels.deployment }})
          description: "{{ $labels.namespace }}/{{ $labels.deployment }} has had fewer available replicas than wanted for 15 minutes."

      - alert: KubeStatefulSetReplicasMismatch
        expr: 'kube_statefulset_status_replicas_ready != kube_statefulset_replicas'
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: StatefulSet replicas mismatch ({{ $labels.namespace }}/{{ $labels.statefulset }})
          description: "{{ $labels.namespace }}/{{ $labels.statefulset }} has had fewer ready replicas than wanted for 15 minutes."

      - alert: KubeDaemonSetNotReady
        expr: 'kube_daemonset_status_number_ready < kube_daemonset_status_desired_number_scheduled'
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: DaemonSet not ready ({{ $labels.namespace }}/{{ $labels.daemonset }})
          description: "{{ $labels.namespace }}/{{ $labels.daemonset }} has pods that aren't ready on some nodes."

      # A failed Job stays until it's deleted (or pushed out by its CronJob's failedJobsHistoryLimit),
      # so this keeps firing until then: delete the Job once dealt with.
      - alert: KubeJobFailed
        expr: 'kube_job_status_failed > 0'
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: Job failed ({{ $labels.namespace }}/{{ $labels.job_name }})
          description: "{{ $labels.namespace }}/{{ $labels.job_name }} failed, see its pods' logs (kubectl -n {{ $labels.namespace }} logs job/{{ $labels.job_name }})."

      - alert: KubePersistentVolumeClaimPending
        expr: 'kube_persistentvolumeclaim_status_phase{phase="Pending"} == 1'
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: PVC pending ({{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }})
          description: "{{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} has been Pending for 15 minutes."

  # kube-apiserver and CoreDNS (vmagent's apiserver and coredns jobs). Down is TargetDown's.
  - name: Control plane
    interval: 60s
    rules:
      - alert: KubeAPIServerErrors
        expr: 'sum by (instance) (rate(apiserver_request_total{job="apiserver",code=~"5.."}[5m])) / sum by (instance) (rate(apiserver_request_total{job="apiserver"}[5m])) > 0.05'
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: API server returning errors ({{ $labels.instance }})
          description: "{{ $value | humanizePercentage }} of the requests to the API server on {{ $labels.instance }} fail with a 5xx: see its resource and verb on the API server dashboard (often etcd)."

      # Mean time of the ordinary requests (WATCH and CONNECT stay open on purpose).
      - alert: KubeAPIServerSlow
        expr: 'sum by (instance) (rate(apiserver_request_duration_seconds_sum{job="apiserver",verb!~"WATCH|CONNECT"}[5m])) / sum by (instance) (rate(apiserver_request_duration_seconds_count{job="apiserver",verb!~"WATCH|CONNECT"}[5m])) > 1'
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: API server slow ({{ $labels.instance }})
          description: "Requests to the API server on {{ $labels.instance }} take {{ $value | humanizeDuration }} on average: a busy or starved control plane, or a slow etcd."

      - alert: KubeDeprecatedAPIUsed
        expr: 'max by (group, version, resource, removed_release) (apiserver_requested_deprecated_apis{job="apiserver"}) == 1'
        labels:
          severity: info
        annotations:
          summary: Deprecated API in use ({{ $labels.group }}/{{ $labels.version }} {{ $labels.resource }})
          description: "{{ $labels.resource }} in {{ $labels.group }}/{{ $labels.version }} was requested and goes in Kubernetes {{ $labels.removed_release }}. The audit log has who asked (objectRef.apiVersion)."

      - alert: CoreDNSErrors
        expr: 'sum(rate(coredns_dns_responses_total{job="coredns",rcode="SERVFAIL"}[5m])) / sum(rate(coredns_dns_responses_total{job="coredns"}[5m])) > 0.05'
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: CoreDNS failing lookups
          description: "{{ $value | humanizePercentage }} of the cluster's DNS answers are SERVFAIL: CoreDNS can't reach its upstream (the router, then Pi-hole)."

      - alert: CoreDNSSlow
        expr: 'histogram_quantile(0.99, sum by (le) (rate(coredns_dns_request_duration_seconds_bucket{job="coredns"}[5m]))) > 1'
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: CoreDNS slow
          description: "1% of the cluster's DNS lookups take longer than {{ $value | humanizeDuration }}: usually the upstream (the router, then Pi-hole)."

  - name: Flux
    interval: 60s
    rules:
      # gotk_resource_info from kube-state-metrics' custom resource config.
      - alert: FluxResourceNotReady
        expr: 'gotk_resource_info{ready="False"} == 1'
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Flux {{ $labels.customresource_kind }} not ready ({{ $labels.exported_namespace }}/{{ $labels.name }})
          description: "{{ $labels.customresource_kind }} {{ $labels.exported_namespace }}/{{ $labels.name }} has been failing for 15 minutes: flux get {{ $labels.customresource_kind | toLower }} -n {{ $labels.exported_namespace }} {{ $labels.name }}"

      # Suspending is for maintenance, forgetting to resume stops every change.
      - alert: FluxResourceSuspended
        expr: 'gotk_resource_info{suspended="true"} == 1'
        for: 2h
        labels:
          severity: warning
          source: flux
          mitre_tactic: defense-evasion
          mitre_technique: T1562.001
        annotations:
          summary: Flux {{ $labels.customresource_kind }} suspended ({{ $labels.exported_namespace }}/{{ $labels.name }})
          description: "{{ $labels.customresource_kind }} {{ $labels.exported_namespace }}/{{ $labels.name }} has been suspended for 2 hours: flux resume ..."
