# From kube-state-metrics (kube-state-metrics/release.yaml), a subset of the kubernetes-mixin's
# rules: https://github.com/kubernetes-monitoring/kubernetes-mixin
groups:
  - name: Scrape
    interval: 60s
    rules:
      # Always firing: Alertmanager sends it to healthchecks.io, which
      # notifies when it stops arriving. Not shown on the overview, not notified.
      - alert: Watchdog
        expr: 'vector(1)'
        labels:
          severity: none
        annotations:
          summary: Watchdog, always firing while vmalert, VictoriaMetrics and Alertmanager work
      # Every job vmagent scrapes, including the monitoring components themselves.
      - alert: TargetDown
        expr: 'up == 0'
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Target down ({{ $labels.job }} {{ $labels.instance }})
          description: "vmagent can't scrape {{ $labels.instance }} (job {{ $labels.job }}).\n  LABELS = {{ $labels }}"

  - name: Kubernetes
    interval: 60s
    rules:
      - alert: KubeNodeNotReady
        expr: 'kube_node_status_condition{condition="Ready",status="true"} == 0'
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Node not ready ({{ $labels.node }})
          description: "{{ $labels.node }} has been unready for more than 5 minutes."

      - alert: KubePodCrashLooping
        expr: 'max_over_time(kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"}[5m]) >= 1'
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Pod crash looping ({{ $labels.namespace }}/{{ $labels.pod }})
          description: "Container {{ $labels.container }} of {{ $labels.namespace }}/{{ $labels.pod }} is in CrashLoopBackOff."

      # Pending (unschedulable, image pull, volume not attaching), Unknown or Failed.
      - alert: KubePodNotReady
        expr: 'sum by (namespace, pod) (kube_pod_status_phase{phase=~"Pending|Unknown|Failed"}) > 0'
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Pod not ready ({{ $labels.namespace }}/{{ $labels.pod }})
          description: "{{ $labels.namespace }}/{{ $labels.pod }} has been in a non-ready state for more than 15 minutes."

      - alert: KubeContainerOOMKilled
        expr: 'increase(kube_pod_container_status_restarts_total[15m]) > 0 and on (namespace, pod, container) kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1'
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: Container OOM killed ({{ $labels.namespace }}/{{ $labels.pod }})
          description: "Container {{ $labels.container }} of {{ $labels.namespace }}/{{ $labels.pod }} was killed for running out of memory (its limit)."

      - alert: KubeDeploymentReplicasMismatch
        expr: 'kube_deployment_spec_replicas != kube_deployment_status_replicas_available'
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Deployment replicas mismatch ({{ $labels.namespace }}/{{ $labels.deployment }})
          description: "{{ $labels.namespace }}/{{ $labels.deployment }} has had fewer available replicas than wanted for 15 minutes."

      - alert: KubeStatefulSetReplicasMismatch
        expr: 'kube_statefulset_status_replicas_ready != kube_statefulset_replicas'
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: StatefulSet replicas mismatch ({{ $labels.namespace }}/{{ $labels.statefulset }})
          description: "{{ $labels.namespace }}/{{ $labels.statefulset }} has had fewer ready replicas than wanted for 15 minutes."

      - alert: KubeDaemonSetNotReady
        expr: 'kube_daemonset_status_number_ready < kube_daemonset_status_desired_number_scheduled'
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: DaemonSet not ready ({{ $labels.namespace }}/{{ $labels.daemonset }})
          description: "{{ $labels.namespace }}/{{ $labels.daemonset }} has pods that aren't ready on some nodes."

      # A failed Job stays until it's deleted (or pushed out by its CronJob's failedJobsHistoryLimit),
      # so this keeps firing until then: delete the Job once dealt with.
      - alert: KubeJobFailed
        expr: 'kube_job_status_failed > 0'
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: Job failed ({{ $labels.namespace }}/{{ $labels.job_name }})
          description: "{{ $labels.namespace }}/{{ $labels.job_name }} failed, see its pods' logs (kubectl -n {{ $labels.namespace }} logs job/{{ $labels.job_name }})."

      - alert: KubePersistentVolumeClaimPending
        expr: 'kube_persistentvolumeclaim_status_phase{phase="Pending"} == 1'
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: PVC pending ({{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }})
          description: "{{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} has been Pending for 15 minutes."

  - name: Flux
    interval: 60s
    rules:
      # gotk_resource_info from kube-state-metrics' custom resource config.
      - alert: FluxResourceNotReady
        expr: 'gotk_resource_info{ready="False"} == 1'
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Flux {{ $labels.customresource_kind }} not ready ({{ $labels.exported_namespace }}/{{ $labels.name }})
          description: "{{ $labels.customresource_kind }} {{ $labels.exported_namespace }}/{{ $labels.name }} has been failing for 15 minutes: flux get {{ $labels.customresource_kind | toLower }} -n {{ $labels.exported_namespace }} {{ $labels.name }}"

      # Suspending is for maintenance (e.g. a cutover), forgetting to resume stops every change.
      - alert: FluxResourceSuspended
        expr: 'gotk_resource_info{suspended="true"} == 1'
        for: 2h
        labels:
          severity: warning
        annotations:
          summary: Flux {{ $labels.customresource_kind }} suspended ({{ $labels.exported_namespace }}/{{ $labels.name }})
          description: "{{ $labels.customresource_kind }} {{ $labels.exported_namespace }}/{{ $labels.name }} has been suspended for 2 hours: flux resume ..."
