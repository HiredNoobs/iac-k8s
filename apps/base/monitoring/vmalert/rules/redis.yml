# Redis (apps/base/redis), from the redis-exporter sidecars (vmagent's pods job): whether Redis
# answers, persistence (the AOF, appendonly yes), memory against the container's limit (from
# kube-state-metrics; no maxmemory: Redis grows until the kernel kills it), refused clients, and
# replication (one master, two replicas in sync, which Sentinel keeps). The exporter itself
# being gone is TargetDown's.
groups:
  - name: Redis
    interval: 60s
    rules:
      - alert: RedisDown
        expr: 'redis_up == 0'
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Redis isn't answering its exporter ({{ $labels.pod }})
          description: "redis-exporter can't reach Redis on {{ $labels.pod }}: it's down, still loading the AOF, or the exporter's ACL user or certificate is refused (its log says which). contentbot can't use it either."

      # 0 = the last write to the AOF, or the last rewrite of it, failed: Redis stops accepting
      # writes after a failed fsync, and a failed rewrite leaves the AOF growing.
      - alert: RedisPersistenceFailing
        expr: 'min by (pod) (redis_aof_last_write_status) == 0 or min by (pod) (redis_aof_last_bgrewrite_status) == 0'
        labels:
          severity: critical
        annotations:
          summary: Redis can't write its AOF ({{ $labels.pod }})
          description: "The last AOF write or rewrite on {{ $labels.pod }} failed: usually a full or read-only volume (Longhorn). Redis' log has the error; INFO persistence the status."

      - alert: RedisMemoryNearLimit
        expr: >-
          max by (pod) (redis_memory_used_bytes)
          / on (pod) max by (pod) (kube_pod_container_resource_limits{namespace="redis", container="redis", resource="memory"})
          > .85
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Redis uses {{ $value | humanizePercentage }} of its memory limit ({{ $labels.pod }})
          description: "Redis has no maxmemory, so at the container's limit it's OOM killed and reloads the AOF. Raise the limit (statefulset.yaml) or find what grew (redis scan-delete, contentbot's keys)."

      - alert: RedisRejectedConnections
        expr: 'increase(redis_rejected_connections_total[10m]) > 0'
        labels:
          severity: warning
        annotations:
          summary: Redis refused {{ $value | humanize }} connections in 10 minutes ({{ $labels.pod }})
          description: "Redis hit maxclients ({{ $labels.pod }}): a client is leaking connections. redis CLIENT LIST shows who holds them."

      # During a failover there's no master for a few seconds (the sentinels agree after 10).
      - alert: RedisNoMaster
        expr: 'count(redis_instance_info{namespace="redis", role="master"}) < 1 or absent(redis_instance_info{namespace="redis", role="master"})'
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Redis has no master
          description: "None of the Redis pods is a master, so nothing can write (contentbot fails). The sentinels decide: redis SENTINEL masters, their logs (container sentinel) say why they haven't failed over (fewer than two up, no replica in sync)."

      - alert: RedisMoreThanOneMaster
        expr: 'count(redis_instance_info{namespace="redis", role="master"}) > 1'
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $value }} Redis pods are masters"
          description: "More than one Redis pod is a master: clients may be writing to different ones and the data splits. Usually a pod that came back after a failover without being told: the sentinels should turn it into a replica within a minute. If it lasts, ask them (SENTINEL get-master-addr-by-name redis) and restart the stray pod."

      - alert: RedisReplicaNotSyncing
        expr: 'redis_master_link_up{namespace="redis"} == 0'
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Redis replica {{ $labels.pod }} isn't connected to its master
          description: "{{ $labels.pod }} has lost its master link (or never finished the first sync): it serves stale data and can't take over cleanly. Its log says why (the replica user's password, the master's name or certificate)."

      - alert: RedisMissingReplicas
        expr: 'max by (pod) (redis_connected_slaves{namespace="redis"} and on (pod) redis_instance_info{namespace="redis", role="master"}) < 2'
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: The Redis master has {{ $value }} of 2 replicas
          description: "The master ({{ $labels.pod }}) has fewer than two replicas connected: one more failure and there's nothing to fail over to. A pod down or not syncing (RedisReplicaNotSyncing)."
