apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - service.yaml
  - routes.yaml
# One file per area. A change rolls the pod (the name gets a hash).
configMapGenerator:
  - name: vmalert-rules
    files:
      - rules/alerts.yml
      - rules/kubernetes.yml
      - rules/controllers.yml
      - rules/blackbox.yml
      - rules/pihole.yml
