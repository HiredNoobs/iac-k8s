# vmalert.hirednoobs.com, behind Authelia (../security-policy.yaml). A Backend rather than the
# Service: vmalert serves HTTPS, and Envoy verifies its certificate against the monitoring CA
# (ca.crt in vmalert-tls) and the service name (sni, one of the certificate's dnsNames).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: vmalert
spec:
  endpoints:
    - fqdn:
        hostname: vmalert.monitoring.svc.cluster.local
        port: 8880
  tls:
    sni: vmalert.monitoring.svc.cluster.local
    caCertificateRefs:
      - group: ""
        kind: Secret
        name: vmalert-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vmalert
spec:
  parentRefs:
    - name: public
      namespace: gateway
      sectionName: https
  hostnames:
    - vmalert.hirednoobs.com
  rules:
    - backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: vmalert
