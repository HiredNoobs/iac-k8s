# vmagent.hirednoobs.com, behind Authelia (../security-policy.yaml). A Backend rather than the
# Service: vmagent serves HTTPS, and Envoy verifies its certificate against the monitoring CA
# (ca.crt in vmagent-tls) and the service name (sni, one of the certificate's dnsNames).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: vmagent
spec:
  endpoints:
    - fqdn:
        hostname: vmagent.monitoring.svc.cluster.local
        port: 8429
  tls:
    sni: vmagent.monitoring.svc.cluster.local
    caCertificateRefs:
      - group: ""
        kind: Secret
        name: vmagent-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vmagent
spec:
  parentRefs:
    - name: public
      namespace: gateway
      sectionName: https
  hostnames:
    - vmagent.hirednoobs.com
  rules:
    - backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: vmagent
