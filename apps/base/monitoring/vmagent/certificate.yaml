# vmagent's server certificate, from the monitoring CA
# (infrastructure/configs/cluster-issuer/monitoring-ca.yaml). Clients check it against ca.crt
# from their own monitoring-ca certificate secret (the same CA). cert-manager renews it,
# Reloader restarts the pod to load it.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vmagent
spec:
  secretName: vmagent-tls
  commonName: vmagent.monitoring.svc
  dnsNames:
    - vmagent
    - vmagent.monitoring.svc
    - vmagent.monitoring.svc.cluster.local
  usages:
    - digital signature
    - key encipherment
    - server auth
  issuerRef:
    kind: ClusterIssuer
    name: monitoring-ca
