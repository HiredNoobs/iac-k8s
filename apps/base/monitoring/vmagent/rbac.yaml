# vmagent's Kubernetes service discovery, to find the node-exporter pods, and read access to
# each kubelet's metrics (nodes/metrics) for the volume stats.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vmagent
  labels:
    app.kubernetes.io/name: vmagent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: monitoring-vmagent
  labels:
    app.kubernetes.io/name: vmagent
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes", "nodes/metrics", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: monitoring-vmagent
  labels:
    app.kubernetes.io/name: vmagent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: monitoring-vmagent
subjects:
  - kind: ServiceAccount
    name: vmagent
    namespace: monitoring
