# Grafana. SQLite, so a single instance, with its data (users, preferences, anything made in the
# UI) on a Longhorn volume. The data sources and dashboards are provisioned from config/ and dashboards/.
# grafana.hirednoobs.com isn't behind Authelia's forward auth: Grafana's login sends you to
# Authelia (OIDC, below).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: grafana
  labels:
    app.kubernetes.io/name: grafana
  annotations:
    # Not reloader's auto: the dashboards' ConfigMaps change without a restart (see
    # kustomization.yaml).
    secret.reloader.stakater.com/reload: grafana-tls,grafana
spec:
  serviceName: grafana
  replicas: 1
  # The volume outlives the StatefulSet, removing Grafana from git doesn't delete the data.
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
    spec:
      # The grafana user from the image, fsGroup lets it write its data.
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 0
        fsGroup: 472
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: grafana
          image: grafana/grafana:12.4.0@sha256:b0ae311af06228bcfd4a620504b653db80f5b91e94dc3dc2a5b7dab202bcde20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            # Only used when the database is first created.
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana
                  key: GRAFANA_ADMIN_PASS
            - name: GF_LOG_CONSOLE_FORMAT
              value: json
            - name: GF_SERVER_PROTOCOL
              value: https
            - name: GF_SERVER_HTTP_PORT
              value: "3000"
            - name: GF_SERVER_CERT_FILE
              value: /etc/grafana/tls/tls.crt
            - name: GF_SERVER_CERT_KEY
              value: /etc/grafana/tls/tls.key
            - name: GF_SERVER_ROOT_URL
              value: https://grafana.hirednoobs.com
            # The home page, for everyone without their own (Profile -> Preferences).
            - name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH
              value: /etc/grafana/dashboards/Overview/overview.json
            # Installed on start (into the data volume) when missing, pinned like everything else.
            - name: GF_PLUGINS_PREINSTALL
              value: victoriametrics-logs-datasource@0.32.0,victoriametrics-metrics-datasource@0.26.1
            # Logins through Authelia (OIDC, client `grafana` in apps/base/authelia). Only members
            # of `admins`, as Grafana server admins; the role is set again at every login, so a
            # change in LLDAP applies at the next one. Anyone else is refused.
            - name: GF_AUTH_GENERIC_OAUTH_ENABLED
              value: "true"
            - name: GF_AUTH_GENERIC_OAUTH_NAME
              value: Authelia
            - name: GF_AUTH_GENERIC_OAUTH_ICON
              value: signin
            - name: GF_AUTH_GENERIC_OAUTH_CLIENT_ID
              value: grafana
            - name: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: grafana
                  key: GRAFANA_OIDC_CLIENT_SECRET
            - name: GF_AUTH_GENERIC_OAUTH_SCOPES
              value: openid profile email groups offline_access
            - name: GF_AUTH_GENERIC_OAUTH_AUTH_URL
              value: https://auth.hirednoobs.com/api/oidc/authorization
            - name: GF_AUTH_GENERIC_OAUTH_TOKEN_URL
              value: https://auth.hirednoobs.com/api/oidc/token
            - name: GF_AUTH_GENERIC_OAUTH_API_URL
              value: https://auth.hirednoobs.com/api/oidc/userinfo
            # The client's token_endpoint_auth_method: client_secret_basic.
            - name: GF_AUTH_GENERIC_OAUTH_AUTH_STYLE
              value: AuthStyleInHeader
            - name: GF_AUTH_GENERIC_OAUTH_USE_PKCE
              value: "true"
            - name: GF_AUTH_GENERIC_OAUTH_USE_REFRESH_TOKEN
              value: "true"
            - name: GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH
              value: preferred_username
            - name: GF_AUTH_GENERIC_OAUTH_NAME_ATTRIBUTE_PATH
              value: name
            - name: GF_AUTH_GENERIC_OAUTH_EMAIL_ATTRIBUTE_PATH
              value: email
            - name: GF_AUTH_GENERIC_OAUTH_GROUPS_ATTRIBUTE_PATH
              value: groups
            - name: GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH
              value: contains(groups[*], 'admins') && 'GrafanaAdmin'
            - name: GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT
              value: "true"
            - name: GF_AUTH_GENERIC_OAUTH_ALLOW_ASSIGN_GRAFANA_ADMIN
              value: "true"
            - name: GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP
              value: "true"
            # Straight to Authelia. The local login (the admin account, break-glass when Authelia
            # is down) is still at /login?disableAutoLogin.
            - name: GF_AUTH_OAUTH_AUTO_LOGIN
              value: "true"
            # Signing out of Grafana signs out of Authelia too, or auto login would sign straight
            # back in.
            - name: GF_AUTH_SIGNOUT_REDIRECT_URL
              value: https://auth.hirednoobs.com/logout
          ports:
            - name: https
              containerPort: 3000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /api/health
              port: https
              scheme: HTTPS
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: https
              scheme: HTTPS
            # Plugins are installed before it starts listening.
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: provisioning
              mountPath: /etc/grafana/provisioning/datasources/datasources.yml
              subPath: datasources.yml
              readOnly: true
            - name: provisioning
              mountPath: /etc/grafana/provisioning/dashboards/dashboards.yml
              subPath: dashboards.yml
              readOnly: true
            # One directory per Grafana folder (foldersFromFilesStructure). Not subPaths, so
            # ConfigMap changes reach the running pod.
            - name: dashboards-overview
              mountPath: /etc/grafana/dashboards/Overview
              readOnly: true
            - name: dashboards-gateway
              mountPath: /etc/grafana/dashboards/Gateway
              readOnly: true
            - name: dashboards-kubernetes
              mountPath: /etc/grafana/dashboards/Kubernetes
              readOnly: true
            - name: dashboards-control-plane
              mountPath: /etc/grafana/dashboards/Control plane
              readOnly: true
            - name: dashboards-monitoring
              mountPath: /etc/grafana/dashboards/Monitoring
              readOnly: true
            - name: dashboards-storage
              mountPath: /etc/grafana/dashboards/Storage
              readOnly: true
            - name: dashboards-flux
              mountPath: /etc/grafana/dashboards/Flux
              readOnly: true
            - name: dashboards-platform
              mountPath: /etc/grafana/dashboards/Platform
              readOnly: true
            - name: dashboards-services
              mountPath: /etc/grafana/dashboards/Services
              readOnly: true
            - name: dashboards-security
              mountPath: /etc/grafana/dashboards/Security
              readOnly: true
            - name: tls
              mountPath: /etc/grafana/tls
              readOnly: true
            - name: data
              mountPath: /var/lib/grafana
      volumes:
        - name: provisioning
          configMap:
            name: grafana-provisioning
        - name: dashboards-overview
          configMap:
            name: grafana-dashboards-overview
        - name: dashboards-gateway
          configMap:
            name: grafana-dashboards-gateway
        - name: dashboards-kubernetes
          configMap:
            name: grafana-dashboards-kubernetes
        - name: dashboards-control-plane
          configMap:
            name: grafana-dashboards-control-plane
        - name: dashboards-monitoring
          configMap:
            name: grafana-dashboards-monitoring
        - name: dashboards-storage
          configMap:
            name: grafana-dashboards-storage
        - name: dashboards-flux
          configMap:
            name: grafana-dashboards-flux
        - name: dashboards-platform
          configMap:
            name: grafana-dashboards-platform
        - name: dashboards-services
          configMap:
            name: grafana-dashboards-services
        - name: dashboards-security
          configMap:
            name: grafana-dashboards-security
        - name: tls
          secret:
            secretName: grafana-tls
            defaultMode: 0440
  # Moved from stack-grafana by re-attaching its volume: the PVC data-grafana-0 was created by
  # hand before the first sync, bound to the old PV.
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: grafana
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: longhorn
        resources:
          requests:
            storage: 2Gi
