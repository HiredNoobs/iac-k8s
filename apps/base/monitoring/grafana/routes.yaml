# grafana.hirednoobs.com, with Grafana's own login (no Authelia). A Backend rather than the
# Service: Grafana serves HTTPS, and Envoy verifies its certificate against the monitoring CA
# (ca.crt in grafana-tls) and the service name (sni, one of the certificate's dnsNames).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: grafana
spec:
  endpoints:
    - fqdn:
        hostname: grafana.monitoring.svc.cluster.local
        port: 3000
  tls:
    sni: grafana.monitoring.svc.cluster.local
    caCertificateRefs:
      - group: ""
        kind: Secret
        name: grafana-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
spec:
  parentRefs:
    - name: public
      namespace: gateway
      sectionName: https
  hostnames:
    - grafana.hirednoobs.com
  rules:
    - backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: grafana
