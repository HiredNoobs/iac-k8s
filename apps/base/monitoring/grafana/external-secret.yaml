# labv2/production/grafana:
#
# - GRAFANA_ADMIN_PASS: the admin account's password. Grafana only uses it when its database is
#   first created, after that the password is whatever was set in the UI. Break-glass only:
#   logins are through Authelia, the local form is at /login?disableAutoLogin.
# - GRAFANA_OIDC_CLIENT_SECRET: Grafana's OIDC client secret. Authelia holds its digest
#   (labv2/production/authelia AUTHELIA_OIDC_GRAFANA_CLIENT_SECRET_DIGEST): change both together.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: grafana
  dataFrom:
    - extract:
        key: production/grafana
