apiVersion: 1

# Straight to the services in the cluster (not through the Gateway), verified with the monitoring
# CA (monitoring-ca, ca.crt in the monitoring-tls secret).
# $__file{} is Grafana's, it reads the CA from the mounted secret.
datasources:
  - name: alertmanager
    uid: alertmanager
    type: alertmanager
    access: proxy
    url: https://alertmanager.monitoring.svc:9093
    isDefault: false
    jsonData:
      handleGrafanaManagedAlerts: true
      implementation: prometheus
      pdcInjected: false
      tlsAuthWithCACert: true
    secureJsonData:
      tlsCACert: $__file{/etc/grafana/tls/ca.crt}

  - name: prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: https://victoriametrics.monitoring.svc:8428
    isDefault: true
    jsonData:
      pdcInjected: false
      tlsAuthWithCACert: true
    secureJsonData:
      tlsCACert: $__file{/etc/grafana/tls/ca.crt}

  - name: victoriametrics-logs-datasource
    uid: victorialogs
    type: victoriametrics-logs-datasource
    access: proxy
    url: https://victorialogs.monitoring.svc:9428
    isDefault: false
    jsonData:
      pdcInjected: false
      tlsAuthWithCACert: true
    secureJsonData:
      tlsCACert: $__file{/etc/grafana/tls/ca.crt}

  - name: victoriametrics-metrics-datasource
    uid: victoriametrics
    type: victoriametrics-metrics-datasource
    access: proxy
    url: https://victoriametrics.monitoring.svc:8428
    isDefault: false
    jsonData:
      httpMethod: GET
      pdcInjected: false
      tlsAuthWithCACert: true
    secureJsonData:
      tlsCACert: $__file{/etc/grafana/tls/ca.crt}
