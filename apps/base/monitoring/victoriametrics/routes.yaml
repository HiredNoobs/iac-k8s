# victoriametrics.hirednoobs.com, behind Authelia (../security-policy.yaml). A Backend rather
# than the Service: victoriametrics serves HTTPS, and Envoy verifies its certificate against the
# monitoring CA (ca.crt in victoriametrics-tls) and the service name (sni, one of the
# certificate's dnsNames).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: victoriametrics
spec:
  endpoints:
    - fqdn:
        hostname: victoriametrics.monitoring.svc.cluster.local
        port: 8428
  tls:
    sni: victoriametrics.monitoring.svc.cluster.local
    caCertificateRefs:
      - group: ""
        kind: Secret
        name: victoriametrics-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: victoriametrics
spec:
  parentRefs:
    - name: public
      namespace: gateway
      sectionName: https
  hostnames:
    - victoriametrics.hirednoobs.com
  rules:
    - backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: victoriametrics
