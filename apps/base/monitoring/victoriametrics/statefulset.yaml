# VictoriaMetrics (single node), with its data on a Longhorn volume, kept 7 days. vmagent writes
# to it, Grafana and vmalert read from it.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: victoriametrics
  labels:
    app.kubernetes.io/name: victoriametrics
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  serviceName: victoriametrics
  replicas: 1
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: victoriametrics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: victoriametrics
    spec:
      # The image runs as root, it doesn't need to.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: victoriametrics
          image: victoriametrics/victoria-metrics:v1.136.0@sha256:593b533bfbea439f2fd8aed306294cb6a5b362e7932681ebb476cc6aaef70841
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          args:
            - --storageDataPath=/victoria-metrics-data
            - --httpListenAddr=:8428
            - --tls
            - --tlsCertFile=/etc/victoriametrics/tls/tls.crt
            - --tlsKeyFile=/etc/victoriametrics/tls/tls.key
            - --retentionPeriod=7d
          ports:
            - name: https
              containerPort: 8428
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: https
              scheme: HTTPS
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: https
              scheme: HTTPS
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: tls
              mountPath: /etc/victoriametrics/tls
              readOnly: true
            - name: data
              mountPath: /victoria-metrics-data
      volumes:
        - name: tls
          secret:
            secretName: monitoring-tls
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: victoriametrics
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: longhorn
        resources:
          requests:
            storage: 10Gi
