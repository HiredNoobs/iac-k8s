# <component>.hirednoobs.com for each component. A Backend rather than the Service: they're HTTPS,
# their certificate (monitoring-ca) isn't verified. Grafana has its own login, the others are
# behind Authelia (SecurityPolicy, see infrastructure/configs/gateway/authelia.yaml for the
# Backend and the ReferenceGrant letting this namespace use it).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: grafana
spec:
  endpoints:
    - fqdn:
        hostname: grafana.monitoring.svc.cluster.local
        port: 3000
  tls:
    insecureSkipVerify: true
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
spec:
  parentRefs:
    - name: public
      namespace: gateway
      sectionName: https
  hostnames:
    - grafana.hirednoobs.com
  rules:
    - backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: grafana
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: alertmanager
spec:
  endpoints:
    - fqdn:
        hostname: alertmanager.monitoring.svc.cluster.local
        port: 9093
  tls:
    insecureSkipVerify: true
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: alertmanager
spec:
  parentRefs:
    - name: public
      namespace: gateway
      sectionName: https
  hostnames:
    - alertmanager.hirednoobs.com
  rules:
    - backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: alertmanager
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: alertmanager
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: alertmanager
  extAuth:
    failOpen: false
    headersToExtAuth:
      - X-Forwarded-Proto
      - X-Forwarded-For
      - Authorization
      - Proxy-Authorization
      - Accept
      - Cookie
    http:
      path: /api/authz/ext-authz/
      backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: authelia
          namespace: gateway
      headersToBackend:
        - Remote-User
        - Remote-Groups
        - Remote-Name
        - Remote-Email
