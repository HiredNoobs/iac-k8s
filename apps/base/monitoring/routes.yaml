# <component>.hirednoobs.com for each component. A Backend rather than the Service: they're HTTPS,
# and Envoy verifies their certificate against the monitoring CA (ca.crt in monitoring-tls) and
# the service name (sni, which has to be one of the certificate's dnsNames). Grafana has its own
# login, the others are behind Authelia (SecurityPolicy: ext-authz against Authelia's Service,
# allowed by apps/base/authelia/reference-grant.yaml).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: grafana
spec:
  endpoints:
    - fqdn:
        hostname: grafana.monitoring.svc.cluster.local
        port: 3000
  tls:
    sni: grafana.monitoring.svc.cluster.local
    caCertificateRefs:
      - group: ""
        kind: Secret
        name: monitoring-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
spec:
  parentRefs:
    - name: public
      namespace: gateway
      sectionName: https
  hostnames:
    - grafana.hirednoobs.com
  rules:
    - backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: grafana
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: alertmanager
spec:
  endpoints:
    - fqdn:
        hostname: alertmanager.monitoring.svc.cluster.local
        port: 9093
  tls:
    sni: alertmanager.monitoring.svc.cluster.local
    caCertificateRefs:
      - group: ""
        kind: Secret
        name: monitoring-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: alertmanager
spec:
  parentRefs:
    - name: public
      namespace: gateway
      sectionName: https
  hostnames:
    - alertmanager.hirednoobs.com
  rules:
    - backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: alertmanager
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: alertmanager
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: alertmanager
  extAuth:
    failOpen: false
    headersToExtAuth:
      - X-Forwarded-Proto
      - X-Forwarded-For
      - Authorization
      - Proxy-Authorization
      - Accept
      - Cookie
    http:
      path: /api/authz/ext-authz/
      backendRefs:
        - group: ""
          kind: Service
          name: authelia
          namespace: authelia
          port: 9091
      headersToBackend:
        - Remote-User
        - Remote-Groups
        - Remote-Name
        - Remote-Email
