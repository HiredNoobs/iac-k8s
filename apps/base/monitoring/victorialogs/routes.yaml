# victorialogs.hirednoobs.com, behind Authelia (SecurityPolicy: ext-authz against Authelia's Service,
# allowed by apps/base/authelia/reference-grant.yaml). A Backend rather than the Service: victorialogs
# serves HTTPS, and Envoy verifies its certificate against the monitoring CA (ca.crt in
# monitoring-tls) and the service name (sni, one of the certificate's dnsNames).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: victorialogs
spec:
  endpoints:
    - fqdn:
        hostname: victorialogs.monitoring.svc.cluster.local
        port: 9428
  tls:
    sni: victorialogs.monitoring.svc.cluster.local
    caCertificateRefs:
      - group: ""
        kind: Secret
        name: monitoring-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: victorialogs
spec:
  parentRefs:
    - name: public
      namespace: gateway
      sectionName: https
  hostnames:
    - victorialogs.hirednoobs.com
  rules:
    - backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: victorialogs
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: victorialogs
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: victorialogs
  extAuth:
    failOpen: false
    headersToExtAuth:
      - X-Forwarded-Proto
      - X-Forwarded-For
      - Authorization
      - Proxy-Authorization
      - Accept
      - Cookie
    http:
      path: /api/authz/ext-authz/
      backendRefs:
        - group: ""
          kind: Service
          name: authelia
          namespace: authelia
          port: 9091
      headersToBackend:
        - Remote-User
        - Remote-Groups
        - Remote-Name
        - Remote-Email
