# victorialogs.hirednoobs.com, behind Authelia (../security-policy.yaml). A Backend rather than the
# Service: victorialogs serves HTTPS, and Envoy verifies its certificate against the monitoring CA
# (ca.crt in victorialogs-tls) and the service name (sni, one of the certificate's dnsNames).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: victorialogs
spec:
  endpoints:
    - fqdn:
        hostname: victorialogs.monitoring.svc.cluster.local
        port: 9428
  tls:
    sni: victorialogs.monitoring.svc.cluster.local
    caCertificateRefs:
      - group: ""
        kind: Secret
        name: victorialogs-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: victorialogs
spec:
  parentRefs:
    - name: public
      namespace: gateway
      sectionName: https
  hostnames:
    - victorialogs.hirednoobs.com
  rules:
    - backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: victorialogs
