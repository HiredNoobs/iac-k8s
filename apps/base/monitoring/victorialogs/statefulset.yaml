# VictoriaLogs, with its data on a Longhorn volume, kept 30 days (or less, see its args).
# rsyslog forwards syslog to it on 514, Grafana reads from it.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: victorialogs
  labels:
    app.kubernetes.io/name: victorialogs
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  serviceName: victorialogs
  replicas: 1
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: victorialogs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: victorialogs
    spec:
      # The image runs as root, it doesn't need to. Port 514 without root or
      # CAP_NET_BIND_SERVICE: containerd lets pods bind any port (ip_unprivileged_port_start=0).
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: victorialogs
          image: victoriametrics/victoria-logs:v1.46.0@sha256:022d57bc5cf206131d4540297818afb134bca4236fb0e71e596d67e5dce6acc3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          args:
            - --storageDataPath=/var/lib/victoria-logs
            - --httpListenAddr=:9428
            - --syslog.listenAddr.udp=:514
            - --syslog.listenAddr.tcp=:514
            - --tls
            - --tlsCertFile=/etc/victorialogs/tls/tls.crt
            - --tlsKeyFile=/etc/victorialogs/tls/tls.key
            - --retentionPeriod=30d
            # Drops the oldest days early when the volume passes 85%.
            - --retention.maxDiskUsagePercent=85
          env:
            - name: TZ
              value: Europe/London
          ports:
            - name: https
              containerPort: 9428
              protocol: TCP
            - name: syslog-udp
              containerPort: 514
              protocol: UDP
            - name: syslog-tcp
              containerPort: 514
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: https
              scheme: HTTPS
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: https
              scheme: HTTPS
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: tls
              mountPath: /etc/victorialogs/tls
              readOnly: true
            - name: data
              mountPath: /var/lib/victoria-logs
      volumes:
        - name: tls
          secret:
            secretName: victorialogs-tls
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: victorialogs
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: longhorn
        resources:
          requests:
            storage: 20Gi
