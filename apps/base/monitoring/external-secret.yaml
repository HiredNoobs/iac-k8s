# labv2/production/grafana:
#
# - GRAFANA_ADMIN_PASS: the admin account's password. Grafana only uses it when its database is
#   first created, after that the password is whatever was set in the UI.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: grafana
  dataFrom:
    - extract:
        key: production/grafana
---
# labv2/production/alertmanager:
#
# - NTFY_TOPIC: the ntfy.sh topic Alertmanager publishes to and the ntfy app subscribes to.
#
# Rendered into the two webhook URLs config/alertmanager/alertmanager.yml reads (url_file).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-ntfy
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: alertmanager-ntfy
    template:
      data:
        url: "https://ntfy.sh/{{ .NTFY_TOPIC }}?template=alertmanager"
        url-critical: "https://ntfy.sh/{{ .NTFY_TOPIC }}?template=alertmanager&priority=high"
  dataFrom:
    - extract:
        key: production/alertmanager
