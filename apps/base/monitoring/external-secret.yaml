# labv2/production/grafana:
#
# - GRAFANA_ADMIN_PASS: the admin account's password. Grafana only uses it when its database is
#   first created, after that the password is whatever was set in the UI.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: grafana
  dataFrom:
    - extract:
        key: production/grafana
