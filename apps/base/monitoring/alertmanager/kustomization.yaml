apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - service.yaml
  - external-secret.yaml
  - routes.yaml
# A change rolls the pod (the name gets a hash).
configMapGenerator:
  - name: alertmanager-config
    files:
      - config/alertmanager.yml
      - config/alertmanager_web.yml
