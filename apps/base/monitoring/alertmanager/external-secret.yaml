# labv2/production/alertmanager:
#
# - NTFY_TOPIC: the ntfy.sh topic Alertmanager publishes to and the ntfy app subscribes to.
# - HEALTHCHECKS_URL: the healthchecks.io check's ping URL, pinged by the Watchdog alert.
#
# Rendered into the webhook URLs config/alertmanager.yml reads (url_file).
#
# ntfy formats Alertmanager's JSON with the title (t) and message (m) templates in the URL
# (tpl=yes), one summary line per alert. Not ntfy's built-in alertmanager template: it prints
# each alert's source link (~1 KB for a log alert's Explore URL), and ntfy refuses messages over
# 4 KB, which Alertmanager doesn't retry: a group of 4 log alerts was lost that way. The
# templates are written out here and URL-encoded by ESO (urlquery); the backquoted strings keep
# ntfy's {{ }} away from ESO's own templating. Tapping a notification opens the ntfy app; its
# Alertmanager button opens Alertmanager, which has each alert's labels, annotations and source
# link (a click URL would replace opening the app).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-notifiers
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: alertmanager-notifiers
    template:
      data:
        url: 'https://ntfy.sh/{{ .NTFY_TOPIC }}?tpl=yes&actions={{ `view, Alertmanager, https://alertmanager.hirednoobs.com/` | urlquery }}&t={{ `{{if eq .status "firing"}}🚨{{else}}✅{{end}} {{(index .alerts 0).labels.alertname}}{{if gt (len .alerts) 1}} ({{len .alerts}}{{if .truncatedAlerts}}+{{.truncatedAlerts}}{{end}}){{end}}` | urlquery }}&m={{ `{{range .alerts}}{{if eq .status "firing"}}🔥{{else}}✅{{end}} {{.annotations.summary}}{{"\n"}}{{end}}{{if .truncatedAlerts}}+{{.truncatedAlerts}} more in Alertmanager{{end}}` | urlquery }}'
        # The same, at ntfy's high priority.
        url-critical: 'https://ntfy.sh/{{ .NTFY_TOPIC }}?tpl=yes&priority=high&actions={{ `view, Alertmanager, https://alertmanager.hirednoobs.com/` | urlquery }}&t={{ `{{if eq .status "firing"}}🚨{{else}}✅{{end}} {{(index .alerts 0).labels.alertname}}{{if gt (len .alerts) 1}} ({{len .alerts}}{{if .truncatedAlerts}}+{{.truncatedAlerts}}{{end}}){{end}}` | urlquery }}&m={{ `{{range .alerts}}{{if eq .status "firing"}}🔥{{else}}✅{{end}} {{.annotations.summary}}{{"\n"}}{{end}}{{if .truncatedAlerts}}+{{.truncatedAlerts}} more in Alertmanager{{end}}` | urlquery }}'
        healthchecks-url: "{{ .HEALTHCHECKS_URL }}"
  dataFrom:
    - extract:
        key: production/alertmanager
