route:
  receiver: ntfy
  # One notification per alert name and namespace, gathered for 30s; changes to a group at most
  # every 5 minutes; still firing, again every 12 hours. Resolved alerts are notified too.
  group_by: [alertname, namespace]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  routes:
    # The always-firing Watchdog (vmalert/rules/kubernetes.yml) pings healthchecks.io every 2
    # minutes. healthchecks.io notifies when the pings stop: monitoring, the cluster or the
    # network is down. Never notified anywhere else.
    - matchers: ['alertname="Watchdog"']
      receiver: healthchecks
      group_wait: 0s
      group_interval: 1m
      repeat_interval: 2m
    # Informational (underused hosts, kernel changes, correctable memory errors): Grafana only.
    - matchers: ['severity="info"']
      receiver: blackhole
    - matchers: ['severity="critical"']
      receiver: ntfy-critical

receivers:
  - name: blackhole
  - name: healthchecks
    webhook_configs:
      - url_file: /etc/alertmanager/notifiers/healthchecks-url
        send_resolved: false
  - name: ntfy
    webhook_configs:
      - url_file: /etc/alertmanager/notifiers/url
        send_resolved: true
  - name: ntfy-critical
    webhook_configs:
      - url_file: /etc/alertmanager/notifiers/url-critical
        send_resolved: true
