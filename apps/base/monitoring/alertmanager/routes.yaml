# alertmanager.hirednoobs.com, behind Authelia (../security-policy.yaml). A Backend rather than the
# Service: alertmanager serves HTTPS, and Envoy verifies its certificate against the monitoring CA
# (ca.crt in alertmanager-tls) and the service name (sni, one of the certificate's dnsNames).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: alertmanager
spec:
  endpoints:
    - fqdn:
        hostname: alertmanager.monitoring.svc.cluster.local
        port: 9093
  tls:
    sni: alertmanager.monitoring.svc.cluster.local
    caCertificateRefs:
      - group: ""
        kind: Secret
        name: alertmanager-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: alertmanager
spec:
  parentRefs:
    - name: public
      namespace: gateway
      sectionName: https
  hostnames:
    - alertmanager.hirednoobs.com
  rules:
    - backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: alertmanager
