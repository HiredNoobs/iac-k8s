# kube-state-metrics: the state of the cluster's objects as metrics (pods restarting, Deployments
# short of replicas, failed Jobs, pending PVCs, ...), scraped by vmagent, alerted on by vmalert
# (config/vmalert/kubernetes.yml). Upstream's chart.
#
# Also Flux's resources, through its custom resource support: gotk_resource_info, one series per
# Kustomization, HelmRelease and source with its ready and suspended state (Flux's own metrics no
# longer have it; this is Flux's documented replacement, flux2-monitoring-example).
#
# Bump the chart version and the image together, the image is the chart's appVersion pinned by its
# digest (the multi-arch index).
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: prometheus-community
spec:
  interval: 24h
  url: https://prometheus-community.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-state-metrics
spec:
  interval: 1h
  chart:
    spec:
      chart: kube-state-metrics
      version: "8.6.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
  values:
    image:
      sha: sha256:42cfe3723a5f058171c627537fb57a3ea0f26e4380fa18555a95cb1a1b4cfc5b
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi
    rbac:
      extraRules:
        - apiGroups:
            - kustomize.toolkit.fluxcd.io
            - helm.toolkit.fluxcd.io
            - source.toolkit.fluxcd.io
          resources: ["*"]
          verbs: ["list", "watch"]
    customResourceState:
      enabled: true
      config:
        kind: CustomResourceStateMetrics
        spec:
          # The same metric for each kind (written out: kustomize doesn't take YAML merge keys).
          resources:
            - groupVersionKind: {group: kustomize.toolkit.fluxcd.io, version: v1, kind: Kustomization}
              metricNamePrefix: gotk
              metrics:
                - name: resource_info
                  help: The current state of a Flux resource.
                  each:
                    type: Info
                    info:
                      labelsFromPath:
                        name: [metadata, name]
                  labelsFromPath:
                    exported_namespace: [metadata, namespace]
                    ready: [status, conditions, "[type=Ready]", status]
                    suspended: [spec, suspend]
            - groupVersionKind: {group: helm.toolkit.fluxcd.io, version: v2, kind: HelmRelease}
              metricNamePrefix: gotk
              metrics:
                - name: resource_info
                  help: The current state of a Flux resource.
                  each:
                    type: Info
                    info:
                      labelsFromPath:
                        name: [metadata, name]
                  labelsFromPath:
                    exported_namespace: [metadata, namespace]
                    ready: [status, conditions, "[type=Ready]", status]
                    suspended: [spec, suspend]
            - groupVersionKind: {group: source.toolkit.fluxcd.io, version: v1, kind: GitRepository}
              metricNamePrefix: gotk
              metrics:
                - name: resource_info
                  help: The current state of a Flux resource.
                  each:
                    type: Info
                    info:
                      labelsFromPath:
                        name: [metadata, name]
                  labelsFromPath:
                    exported_namespace: [metadata, namespace]
                    ready: [status, conditions, "[type=Ready]", status]
                    suspended: [spec, suspend]
            - groupVersionKind: {group: source.toolkit.fluxcd.io, version: v1, kind: OCIRepository}
              metricNamePrefix: gotk
              metrics:
                - name: resource_info
                  help: The current state of a Flux resource.
                  each:
                    type: Info
                    info:
                      labelsFromPath:
                        name: [metadata, name]
                  labelsFromPath:
                    exported_namespace: [metadata, namespace]
                    ready: [status, conditions, "[type=Ready]", status]
                    suspended: [spec, suspend]
            - groupVersionKind: {group: source.toolkit.fluxcd.io, version: v1, kind: HelmRepository}
              metricNamePrefix: gotk
              metrics:
                - name: resource_info
                  help: The current state of a Flux resource.
                  each:
                    type: Info
                    info:
                      labelsFromPath:
                        name: [metadata, name]
                  labelsFromPath:
                    exported_namespace: [metadata, namespace]
                    ready: [status, conditions, "[type=Ready]", status]
                    suspended: [spec, suspend]
            - groupVersionKind: {group: source.toolkit.fluxcd.io, version: v1, kind: HelmChart}
              metricNamePrefix: gotk
              metrics:
                - name: resource_info
                  help: The current state of a Flux resource.
                  each:
                    type: Info
                    info:
                      labelsFromPath:
                        name: [metadata, name]
                  labelsFromPath:
                    exported_namespace: [metadata, namespace]
                    ready: [status, conditions, "[type=Ready]", status]
                    suspended: [spec, suspend]
