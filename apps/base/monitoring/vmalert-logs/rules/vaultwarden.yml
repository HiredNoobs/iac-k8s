# Vaultwarden's logins (apps/base/vaultwarden), from its pod logs: event.dataset vaultwarden.log
# with Vector's ECS fields (apps/base/vector). A failed login is event.action password-login,
# event.outcome failure, with source.ip and user.name from the message. The IP is the client's
# because IP_HEADER is X-Forwarded-For.
#
# Vaultwarden logs the same line for a wrong password and for an account that doesn't exist, and
# nothing for a successful login or a failed unlock (a locked client checks the password itself).
#
# Each group's interval is also the window its queries count over.
groups:
  - name: vaultwarden
    type: vlogs
    interval: 5m
    rules:
      - alert: VaultwardenLoginFailures
        expr: >-
          {event.dataset="vaultwarden.log"}
          event.action:=password-login event.outcome:=failure
          | copy user.name as user, source.ip as remote_ip
          | stats by (user, remote_ip) count() as failures
          | filter failures:>=5
        labels:
          severity: warning
          source: vaultwarden
          mitre_tactic: credential-access
          mitre_technique: T1110.001
        annotations:
          summary: "{{ $value }} failed Vaultwarden logins for {{ $labels.user }} from {{ $labels.remote_ip }} in 5 minutes"
          description: >-
            Repeated wrong master passwords (or a made-up account) from one client: password
            guessing, or a client with a stale password.
          tested: "2026-10-10"
          runbook: >-
            Look at the client's other requests (source.ip in the Envoy access logs). Trigger:
            log out of the web vault fully (locking isn't enough), then five wrong master
            passwords within 5 minutes.

      - alert: VaultwardenManyUsernames
        expr: >-
          {event.dataset="vaultwarden.log"}
          event.action:=password-login event.outcome:=failure
          | copy user.name as user, source.ip as remote_ip
          | stats by (remote_ip) count_uniq(user) as users
          | filter users:>=3
        labels:
          severity: warning
          source: vaultwarden
          mitre_tactic: credential-access
          mitre_technique: T1110.003
        annotations:
          summary: "{{ $value }} different usernames failed Vaultwarden logins from {{ $labels.remote_ip }} in 5 minutes"
          description: >-
            Failed logins for several accounts from one client: guessing or spraying usernames.
            Vaultwarden doesn't say whether an account exists, so this covers both.
          tested: "2026-10-10"
          runbook: >-
            The usernames tried are the matching lines' user.name. Trigger: log out
            fully, then log in with three made-up email addresses within 5 minutes.
