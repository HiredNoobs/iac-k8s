# Authelia's logins (apps/base/authelia), from its pod logs: event.dataset authelia.log with
# Vector's ECS fields (apps/base/vector). source.ip is the client (the Gateway passes it through),
# user.name the username from the message. A failed login is event.outcome failure with
# event.action password-login or totp-login, event.reason "unknown user" for a username that
# doesn't exist. Authelia logs failures, not successes (at log level info).
#
# Regulation (Authelia's defaults: 3 failed first factors in 2 minutes ban the user for 5) doesn't
# log the ban itself, only the attempts made during it ("... and they are banned until ..."), and
# never bans usernames that don't exist.
#
# Each group's interval is also the window its queries count over.
groups:
  - name: authelia
    type: vlogs
    interval: 5m
    rules:
      - alert: AutheliaLoginFailures
        expr: >-
          {event.dataset="authelia.log"}
          event.action:=password-login event.outcome:=failure user.name:*
          -event.reason:="unknown user"
          | copy user.name as user, source.ip as remote_ip
          | stats by (user, remote_ip) count() as failures
          | filter failures:>=5
        labels:
          severity: warning
          source: authelia
          mitre_tactic: credential-access
          mitre_technique: T1110.001
        annotations:
          summary: "{{ $value }} failed Authelia logins for {{ $labels.user }} from {{ $labels.remote_ip }} in 5 minutes"
          description: >-
            Repeated wrong passwords for an existing user, including attempts while regulation
            has the user banned: password guessing, or a client with a stale password.
          tested: "2026-10-14"
          runbook: >-
            Look at the client's other requests (source.ip in the Envoy access logs) and whether a
            TOTP failure followed (the password worked). Trigger: six wrong passwords for a real
            user within 5 minutes; the user is then banned for 5 minutes.

      - alert: AutheliaUnknownUsers
        expr: >-
          {event.dataset="authelia.log"}
          event.reason:="unknown user"
          | copy source.ip as remote_ip
          | stats by (remote_ip) count() as attempts
          | filter attempts:>=3
        labels:
          severity: warning
          source: authelia
          mitre_tactic: credential-access
          mitre_technique: T1110.003
        annotations:
          summary: "{{ $value }} Authelia logins with unknown usernames from {{ $labels.remote_ip }} in 5 minutes"
          description: >-
            Logins with usernames that don't exist, which regulation never bans: guessing or
            spraying usernames.
          tested: "2026-10-14"
          runbook: >-
            The usernames tried are in the matching lines ("username input '...'"). Trigger:
            three logins with made-up usernames within 5 minutes.

      - alert: AutheliaSecondFactorFailures
        expr: >-
          {event.dataset="authelia.log"}
          event.action:=totp-login event.outcome:=failure
          | copy user.name as user, source.ip as remote_ip
          | stats by (user, remote_ip) count() as failures
          | filter failures:>=3
        labels:
          severity: critical
          source: authelia
          mitre_tactic: credential-access
          mitre_technique: T1110
        annotations:
          summary: "{{ $value }} failed TOTP codes for {{ $labels.user }} from {{ $labels.remote_ip }} in 5 minutes"
          description: >-
            A TOTP code is only asked for after the right password, so the user's password is
            known to whoever is at this client (T1078 Valid Accounts), and they're guessing the
            second factor.
          tested: "2026-10-14"
          runbook: >-
            If it isn't you, change the user's password in Vault (lldap-bootstrap resets it
            hourly) and look at what the client did (Envoy access logs). Trigger: the right
            password, then three wrong TOTP codes within 5 minutes.
