# The prx-999 VMs' journals (iac-homelab's vector role, through apps/base/vector) and the Proxmox
# hosts' (iac-homelab's proxmox/rsyslog.conf, through the syslog relay), mapped to ECS fields by
# Vector (apps/base/vector/config/aggregator/journald.yaml): prx-999-srv-{mgmt,git,runner,vault}-001 and
# prx-001, -002, -003 and prx-999 as host.hostname (host.name is the FQDN, a stream field).
# sshd's lines are event.dataset sshd.log (logins as event.action ssh_login with event.outcome,
# user.name, source.ip, Ssh.Method), sudo's sudo.log (user.name, user.effective.name, the command
# as process.command_line, refusals as event.outcome failure), Forgejo's forgejo.log (failed
# logins as password-login), the hosts' pvedaemon's pvedaemon.log (web UI and API logins as
# login, user.name and the realm as user.domain, a failure's source.ip). mgmt (192.168.111.254)
# is where Ansible and Terraform run, and the user's way in from the LAN.
#
# Vault's audit log is in vault.service's journal (the stdout audit device, terraform/vault): one
# JSON object per request and per response, event.dataset vault.audit, mapped as Elastic's
# HashiCorp Vault integration: event.action the operation, source.ip, user.name the token's
# display name, user.roles its policies, event.outcome and error.message (a response's error),
# the rest under Secrets.Audit.* (Secrets.Audit.Request.Path, Secrets.Audit.Type). Only the
# responses are read (they repeat the request, plus the result), with secrets and tokens HMAC'd.
# build.sh vault uses the root token, so a Vault apply fires VaultRootTokenUsed and
# VaultConfigChange: they ask "was this you?".
#
# Each group's interval is also the window its queries count over.
groups:
  - name: journald
    type: vlogs
    interval: 5m
    rules:
      # From mgmt is expected (Ansible, you); so is git over SSH to Forgejo (pushes, and Flux's
      # pulls from the nodes), and you logging in to mgmt from the LAN.
      - alert: SshLoginUnexpected
        expr: >-
          {event.dataset="sshd.log"} event.action:=ssh_login event.outcome:=success
          -source.ip:=192.168.111.254 -(user.name:=git host.hostname:="prx-999-srv-git-001")
          -(host.hostname:="prx-999-srv-mgmt-001" source.ip:ipv4_range("192.168.50.0/24"))
          | copy host.hostname as host, user.name as user, source.ip as remote_ip, Ssh.Method as method
          | stats by (host, user, remote_ip, method) count() as logins
        labels:
          severity: warning
          source: ssh
          mitre_tactic: lateral-movement
          mitre_technique: T1021.004
        annotations:
          summary: "SSH login to {{ $labels.host }} as {{ $labels.user }} from {{ $labels.remote_ip }}"
          description: >-
            An SSH login to a prx-999 VM that didn't come from mgmt (nor git over SSH, nor you
            into mgmt from the LAN): someone moving between machines with a key they found.
          tested: "2026-10-14"
          runbook: >-
            Who: the key's fingerprint is in the line (Ssh.Signature). Check ~/.ssh/authorized_keys
            on that VM and what the session did (sudo lines, the user's shell history).
            Trigger: ssh from your workstation straight to the Vault or Forgejo VM.

      # fail2ban bans after 3 failures in 10 minutes (1 hour), so a 4th is rarely logged: with
      # passwords off each attempt logs one failed ssh_login (an unknown user, a key refused). 3
      # is the burst fail2ban acts on.
      - alert: SshAuthFailures
        expr: >-
          {event.dataset="sshd.log"} event.action:=ssh_login event.outcome:=failure
          | copy host.hostname as host, source.ip as remote_ip
          | stats by (host, remote_ip) count() as failures
          | filter failures:>=3
        labels:
          severity: warning
          source: ssh
          mitre_tactic: credential-access
          mitre_technique: T1110
        annotations:
          summary: "{{ $value }} failed SSH logins to {{ $labels.host }} from {{ $labels.remote_ip }} in 5 minutes"
          description: >-
            Repeated failed SSH logins (unknown users, wrong keys): guessing, usually stopped by
            fail2ban after three.
          tested: "2026-10-14"
          runbook: >-
            The users tried are in the events (user.name). fail2ban-client status sshd on the VM
            shows bans.
            Trigger: for i in 1 2 3; do ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new
            nobody@<vm> true; done (fail2ban then blocks you from that VM for an hour).

      # Ansible becomes root with sudo as the admin user (hirednoobs) on every run. sudo logs
      # the command for refused attempts too: those are SudoFailures'.
      - alert: SudoUnexpectedUser
        expr: >-
          {event.dataset="sudo.log"} event.category:process event.outcome:=success
          -user.name:=hirednoobs
          | copy host.hostname as host, user.name as user
          | stats by (host, user) count() as commands
        labels:
          severity: warning
          source: sudo
          mitre_tactic: privilege-escalation
          mitre_technique: T1548.003
        annotations:
          summary: "{{ $labels.user }} ran {{ $value }} commands with sudo on {{ $labels.host }}"
          description: >-
            sudo used by someone other than the admin user: a new or service account given sudo,
            or a way to root that shouldn't exist.
          tested: "2026-10-11"
          runbook: >-
            The commands are in the events (process.command_line). Check /etc/sudoers.d on the
            VM.
            Trigger: none safe; test locally with a sample line.

      - alert: SudoFailures
        expr: >-
          {event.dataset="sudo.log"} event.outcome:=failure
          | copy host.hostname as host, user.name as user
          | stats by (host, user) count() as failures
        labels:
          severity: warning
          source: sudo
          mitre_tactic: privilege-escalation
          mitre_technique: T1548.003
        annotations:
          summary: "{{ $labels.user }} failed to use sudo on {{ $labels.host }} ({{ $value }} lines)"
          description: >-
            sudo refused (not allowed, or a wrong password): someone on the VM trying to become
            root.
          tested: "2026-10-14"
          runbook: >-
            Who was logged in then (sshd.log). Trigger: sudo -u nobody sudo true, and
            Enter at the three password prompts (with -n sudo stops before logging anything).

      - alert: VaultRootTokenUsed
        expr: >-
          {event.dataset="vault.audit"} Secrets.Audit.Type:=response user.roles:~"\"root\""
          | copy source.ip as remote_ip, user.name as user
          | stats by (remote_ip, user) count() as requests
        labels:
          severity: warning
          source: vault
          mitre_tactic: privilege-escalation
          mitre_technique: T1078.001
        annotations:
          summary: "Vault's root token used for {{ $value }} requests from {{ $labels.remote_ip }}"
          description: >-
            Requests made with a root token: build.sh vault does this; anything else means the
            root token (or keys.json) is out.
          tested: "2026-10-14"
          runbook: >-
            The paths are in the events (Secrets.Audit.Request.Path). If it wasn't an apply of
            terraform/vault,
            revoke root tokens (vault token revoke) and rotate keys.json. Trigger: a plan of the
            Vault root (build.sh vault, then cancel at the prompt).

      # sys/audit is the audit devices: removing one hides what follows.
      - alert: VaultAuditDeviceChange
        expr: >-
          {event.dataset="vault.audit"} Secrets.Audit.Type:=response
          Secrets.Audit.Request.Path:~"^sys/audit(/|$)" event.action:in("create", "update", "delete")
          | copy source.ip as remote_ip, user.name as user, Secrets.Audit.Request.Path as path,
          event.action as operation
          | stats by (remote_ip, user, path, operation) count() as requests
        labels:
          severity: critical
          source: vault
          mitre_tactic: defense-evasion
          mitre_technique: T1562.008
        annotations:
          summary: "Vault audit device {{ $labels.operation }} {{ $labels.path }} by {{ $labels.user }} from {{ $labels.remote_ip }}"
          description: >-
            An audit device enabled or disabled. Disabling one is how Vault's trail is cut; only
            terraform/vault should touch them.
          tested: "2026-10-14"
          runbook: >-
            vault audit list on the VM; both devices (stdout, file) should be there. If not,
            re-apply terraform/vault and treat the root token as compromised. Trigger (as root):
            vault audit enable -path=siem-test file file_path=discard, then vault audit disable
            siem-test. Enabling the first devices didn't fire it: a request is only audited by
            the devices that existed before it.

      - alert: VaultConfigChange
        expr: >-
          {event.dataset="vault.audit"} Secrets.Audit.Type:=response
          event.action:in("create", "update", "delete")
          Secrets.Audit.Request.Path:~"^(sys/(policies/acl|policy|auth|mounts)/|auth/[^/]+/(role|users|config)(/|$))"
          | copy source.ip as remote_ip, user.name as user, Secrets.Audit.Request.Path as path,
          event.action as operation
          | stats by (remote_ip, user, path, operation) count() as requests
        labels:
          severity: warning
          source: vault
          mitre_tactic: persistence
          mitre_technique: T1098
        annotations:
          summary: "Vault {{ $labels.operation }} {{ $labels.path }} by {{ $labels.user }} from {{ $labels.remote_ip }}"
          description: >-
            A policy, auth method, role or user changed: who can read which secrets. Only
            terraform/vault (and you adding userpass users by hand) should do this.
          tested: "2026-10-14"
          runbook: >-
            Compare with terraform/vault (a plan shows drift). Trigger: an apply of
            terraform/vault that changes something.

      # A wrong userpass password is an error response, not a failed request: no top-level
      # error, only the response's data.error (HMAC'd). Refused requests have the top-level one.
      # Vector counts either as event.outcome failure.
      - alert: VaultLoginFailures
        expr: >-
          {event.dataset="vault.audit"} Secrets.Audit.Type:=response event.outcome:=failure
          Secrets.Audit.Request.Path:~"^auth/[^/]+/login"
          | copy source.ip as remote_ip, Secrets.Audit.Request.Path as path
          | stats by (remote_ip, path) count() as failures
          | filter failures:>=3
        labels:
          severity: warning
          source: vault
          mitre_tactic: credential-access
          mitre_technique: T1110
        annotations:
          summary: "{{ $value }} failed Vault logins ({{ $labels.path }}) from {{ $labels.remote_ip }} in 5 minutes"
          description: >-
            Failed logins (userpass passwords, Kubernetes service account tokens): guessing, or
            ESO with a token Vault no longer accepts.
          tested: "2026-10-14"
          runbook: >-
            The username is in the path (userpass), the error is HMAC'd (compare with vault
            write sys/audit-hash/stdout input=...). From a node address with auth/kubernetes:
            check ESO's ClusterSecretStore. Trigger: vault login -no-store -method=userpass
            username=siem-test password=wrong, three times.

      - alert: VaultPermissionDenied
        expr: >-
          {event.dataset="vault.audit"} Secrets.Audit.Type:=response error.message:~"permission denied"
          | copy source.ip as remote_ip, user.name as user
          | stats by (remote_ip, user) count() as denied
          | filter denied:>=5
        labels:
          severity: warning
          source: vault
          mitre_tactic: credential-access
          mitre_technique: T1555
        annotations:
          summary: "{{ $value }} Vault requests denied for {{ $labels.user }} from {{ $labels.remote_ip }} in 5 minutes"
          description: >-
            A token trying paths its policy doesn't allow: looking for secrets it shouldn't have,
            or an app configured with the wrong path.
          tested: "2026-10-11"
          runbook: >-
            The paths are in the events (Secrets.Audit.Request.Path). Trigger: with ESO's role,
            read a path
            outside labv2/data/production/* five times.

      - alert: ForgejoLoginFailures
        expr: >-
          {event.dataset="forgejo.log"} event.action:=password-login event.outcome:=failure
          | copy source.ip as remote_ip
          | stats by (remote_ip) count() as failures
          | filter failures:>=5
        labels:
          severity: warning
          source: forgejo
          mitre_tactic: credential-access
          mitre_technique: T1110
        annotations:
          summary: "{{ $value }} failed Forgejo logins from {{ $labels.remote_ip }} in 5 minutes"
          description: >-
            Repeated wrong passwords on git.hirednoobs.com: guessing, or a client with an old
            password or token.
          tested: "2026-10-14"
          runbook: >-
            The usernames tried are in the events (user.name). Trigger: five wrong passwords at
            https://git.hirednoobs.com/user/login.

      # pvedaemon checks every password login to a Proxmox host, the web UI's and the API's (API
      # tokens aren't logins, so homepage's isn't logged). No fail2ban on the hosts: each wrong
      # password is one line.
      - alert: ProxmoxLoginFailures
        expr: >-
          {event.dataset="pvedaemon.log"} event.action:=login event.outcome:=failure
          | copy host.hostname as host, source.ip as remote_ip
          | stats by (host, remote_ip) count() as failures
          | filter failures:>=3
        labels:
          severity: warning
          source: proxmox
          mitre_tactic: credential-access
          mitre_technique: T1110
        annotations:
          summary: "{{ $value }} failed Proxmox logins to {{ $labels.host }} from {{ $labels.remote_ip }} in 5 minutes"
          description: >-
            Repeated wrong passwords or unknown users at a Proxmox host's web UI or API:
            guessing, or a client with an old password.
          tested: "2026-10-16"
          runbook: >-
            The users tried and why each failed are in the events (user.name, user.domain,
            event.reason). Trigger: three wrong passwords for root at the host's web UI
            (https://<host>:8006).

      # Only root@pam logs in; homepage's read-only user has an API token, which isn't a login.
      # A login as anyone else (a password set on homepage's user, a new account) is unexpected.
      - alert: ProxmoxLoginUnexpectedUser
        expr: >-
          {event.dataset="pvedaemon.log"} event.action:=login event.outcome:=success
          -(user.name:=root user.domain:=pam)
          | copy host.hostname as host, user.name as user, user.domain as realm
          | stats by (host, user, realm) count() as logins
        labels:
          severity: warning
          source: proxmox
          mitre_tactic: initial-access
          mitre_technique: T1078
        annotations:
          summary: "Proxmox login to {{ $labels.host }} as {{ $labels.user }}@{{ $labels.realm }}"
          description: >-
            A Proxmox host's web UI or API was logged in to as someone other than root@pam: an
            account that shouldn't have a password, or a new one.
          tested: "2026-10-16"
          runbook: >-
            Check Datacenter > Permissions > Users (and API tokens) for the account and what it
            may do. The line has no address: pveproxy's access log on the host
            (/var/log/pveproxy/access.log) does. Trigger: give a test user (pveum user add
            siem-test@pve --password) a login, log in as it, then pveum user delete
            siem-test@pve.

      # A shell on a machine's console: the Proxmox web UI's Shell (a host's or a VM's console),
      # or a keyboard. login logs it (sshd's logins are SshLoginUnexpected's). Rare enough that
      # every one is worth an alert.
      - alert: HostConsoleLogin
        expr: >-
          {event.dataset="journald.log"} log.syslog.appname:=login _msg:"session opened for user"
          | extract "session opened for user <user>(" | copy host.hostname as host
          | stats by (host, user) count() as logins
        labels:
          severity: warning
          source: journald
          mitre_tactic: initial-access
          mitre_technique: T1078
        annotations:
          summary: "Console login to {{ $labels.host }} as {{ $labels.user }}"
          description: >-
            Someone opened a shell on the machine's console: on a Proxmox host usually the web
            UI's Shell, which needs a root login to the UI first.
          tested: "2026-10-16"
          runbook: >-
            Who logged in to the web UI just before (ProxmoxLoginUnexpectedUser, pvedaemon.log's
            logins) and what the session did. Trigger: open the Shell of a host in the web UI.

      # A Proxmox task that ended with an error: a backup (vzdump, the scheduler's), a
      # migration, a VM starting or stopping, ... Ending with warnings counts as done.
      - alert: ProxmoxTaskFailed
        expr: >-
          Task.Id:* event.type:end event.outcome:=failure
          | copy host.hostname as host, event.action as task, Task.Target as target,
          error.message as error
          | stats by (host, task, target, error) count() as failures
        labels:
          severity: warning
          source: proxmox
        annotations:
          summary: "Proxmox {{ $labels.task }} {{ $labels.target }} failed on {{ $labels.host }}: {{ $labels.error }}"
          description: >-
            A task Proxmox ran (a backup, a migration, a VM start, ...) ended with an error.
          runbook: >-
            The task's log: Datacenter > the host > Task History, or pvenode task log <Task.Id>
            on the host. Trigger: pvesh create /nodes/<host>/vzdump --vmid 99999 (no such guest)
            on a host.

      # The machines' own health, the Proxmox hosts' and the prx-999 VMs': smartd (the hosts run
      # it, Proxmox's default) at critical or error (a failing self-check, pending or
      # uncorrectable sectors, a disk gone), and the kernel's I/O errors.
      - alert: HostDiskFailing
        expr: >-
          {event.dataset="journald.log"}
          ((log.syslog.appname:=smartd log.level:in("critical", "error"))
          or (log.syslog.appname:=kernel _msg:"I/O error"))
          | copy host.hostname as host, log.syslog.appname as reporter
          | stats by (host, reporter) count() as lines
        labels:
          severity: critical
          source: journald
        annotations:
          summary: "Disk problems on {{ $labels.host }} ({{ $value }} {{ $labels.reporter }} lines in 5 minutes)"
          description: >-
            smartd or the kernel reported a failing disk: under a host, its VMs and Longhorn's
            copies; in a VM, its virtual disk or the storage under it.
          runbook: >-
            The disk and what's wrong are in the events (_msg). On the host: smartctl -a
            /dev/<disk>, and which VMs and Longhorn disks are on it. Trigger: none safe;
            logger -t smartd -p daemon.crit "Device: /dev/sdz [SAT], 8 Currently unreadable
            (pending) sectors" on a host (a test line, no disk involved).

      # The kernel killing a process because the whole machine ran out of memory (not a container
      # at its own limit, "Memory cgroup out of memory"). On a host it's usually a VM's qemu.
      - alert: HostOomKill
        expr: >-
          {event.dataset="journald.log"} log.syslog.appname:=kernel _msg:~"^Out of memory: Killed process"
          | extract "Killed process <pid> (<process>)"
          | copy host.hostname as host
          | stats by (host, process) count() as kills
        labels:
          severity: critical
          source: journald
        annotations:
          summary: "{{ $labels.host }} ran out of memory and killed {{ $labels.process }}"
          description: >-
            The kernel's OOM killer ended a process to free memory: on a Proxmox host usually a
            VM (qemu), which goes down.
          runbook: >-
            journalctl -k on the machine around then shows what used the memory. On a host,
            check its VMs' memory against the host's (ballooning off, too much assigned).
            Trigger: none safe; logger -t kernel -p kern.err "Out of memory: Killed process 1234
            (siem-test)" on a host (a test line).

      # The Proxmox cluster's corosync, as each host sees it. Corosync logs every peer down and
      # then up when it starts, so only a link whose last line in the window is down counts. A
      # host cut off from the others is also cut off from the relay: its own lines arrive (from
      # rsyslog's queue) after the window they belong to, so the others' lines are what fire.
      - alert: CorosyncLinkDown
        expr: >-
          {event.dataset="journald.log"} log.syslog.appname:=corosync
          _msg:~"host: [0-9]+ link: [0-9]+ is (down|up)"
          | extract "host: <peer> link: <link> is <state>" | copy host.hostname as host
          | last 1 by (_time) partition by (host, peer, link)
          | filter state:=down
          | stats by (host, peer, link) count() as lines
        labels:
          severity: warning
          source: proxmox
        annotations:
          summary: "Corosync link {{ $labels.link }} from {{ $labels.host }} to node {{ $labels.peer }} is down"
          description: >-
            A Proxmox host lost its cluster link to another (a node id): that host is down,
            rebooting, or unreachable on the cluster network. No HA, so nothing is fenced; while
            the cluster stays quorate the rest carry on.
          runbook: >-
            pvecm status on a host (and pvecm nodes for which host the node id is). Expected
            while a host reboots for more than a few minutes. Trigger: systemctl stop corosync
            on one host for 6 minutes, then start it (its /etc/pve is read-only meanwhile, its
            VMs keep running).

      # Without quorum a host's /etc/pve is read-only: no starting, stopping, migrating or
      # changing guests there (the running ones carry on). Corosync also logs this briefly while
      # it starts, before it has found the others, so only the last line in the window counts.
      - alert: CorosyncQuorumLost
        expr: >-
          {event.dataset="journald.log"} log.syslog.appname:=corosync
          _msg:"This node is within the"
          | extract "within the <component> component" | copy host.hostname as host
          | last 1 by (_time) partition by (host)
          | filter component:=non-primary
          | stats by (host) count() as lines
        labels:
          severity: critical
          source: proxmox
        annotations:
          summary: "{{ $labels.host }} has lost the Proxmox cluster's quorum"
          description: >-
            Corosync on a Proxmox host is in the non-primary component: too few hosts reachable
            for a majority, so Proxmox won't change anything on it until they're back.
          runbook: >-
            pvecm status on the host (Quorate, the votes); which hosts are down or unreachable
            (CorosyncLinkDown). Trigger: none safe; logger -t corosync "[QUORUM] This node is
            within the non-primary component and will NOT provide any services." on a host
            (a test line).
