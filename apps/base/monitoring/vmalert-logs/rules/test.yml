# A deliberate test of the log alerting path (LogsQL -> vmalert-logs -> Alertmanager -> ntfy), not
# a detection. Fires for one evaluation after a log line containing "vmalert-logs-test" arrives,
# from any source.
groups:
  - name: test
    type: vlogs
    interval: 1m
    rules:
      - alert: LogAlertTest
        expr: '"vmalert-logs-test" | stats count() as hits | filter hits:>0'
        labels:
          severity: warning
          source: test
        annotations:
          summary: Log alert test, {{ $value }} matching lines in the last minute
          description: >-
            A log line containing "vmalert-logs-test" arrived. This rule only checks that log
            alerts reach ntfy.
          runbook: >-
            Trigger: kubectl run vmalert-logs-test --rm -i --restart=Never --image=busybox:1.37
            -- echo vmalert-logs-test. The alert fires within about two minutes (vlagent ships the
            line, the next evaluation finds it) and resolves on the evaluation after.
