# The router's syslog (event.dataset syslog.log from 192.168.111.1, through rsyslog and Vector's
# config/aggregator/syslog.yaml): its firewall's dropped packets (event.action drop, source.*,
# destination.*, network.transport), the connections it lets through (accept, one line per
# connection: nat-start's LOG_ACCEPT chain, with observer.egress.interface.name the way out) and
# its DNS queries (dnsmasq log-queries, dns.*).
#
# Each group's interval is also the window its queries count over.
groups:
  - name: router
    type: vlogs
    interval: 5m
    rules:
      # A LAN device the firewall stops from reaching many ports or many hosts: something
      # mapping the network (a compromised device, or a scanner someone ran). Drops from the
      # internet are scans too, but constant and expected: no alert for those.
      - alert: NetworkScanFromLan
        expr: >-
          {event.dataset="syslog.log"} host.ip:="192.168.111.1" event.action:=drop
          (source.ip:ipv4_range("192.168.0.0/16") or source.ip:ipv4_range("10.0.0.0/8")
          or source.ip:ipv4_range("172.16.0.0/12"))
          | copy source.ip as remote_ip
          | stats by (remote_ip) count_uniq(destination.port) as ports, count_uniq(destination.ip) as hosts
          | math max(ports, hosts) as targets
          | filter targets:>=10
          | fields remote_ip, targets
        labels:
          severity: warning
          source: router
          mitre_tactic: discovery
          mitre_technique: T1046
        annotations:
          summary: "{{ $labels.remote_ip }} was dropped trying {{ $value }} ports or hosts in 5 minutes"
          description: >-
            A device on the LAN tried many ports or many addresses the router's firewall
            blocks: network discovery, from malware or a scanner. Your own nmap counts too.
          runbook: >-
            What it tried: {event.dataset="syslog.log"} event.action:=drop
            source.ip:="{{ $labels.remote_ip }}" | stats by (destination.ip, destination.port)
            count(). Which device it is: its DHCP lease (event.action:dhcp-ack, client.ip) and
            its DNS queries on the Network dashboard. Trigger: from a LAN client, scan ports the
            router drops for it (e.g. nmap -Pn -p 1-20 to an address across a blocked VLAN
            boundary); which traffic the router logs as dropped is to confirm first.

      # A device asking a DNS server on the internet itself, not the router (which sends it to
      # Pi-hole): a resolver set by hand or built in, a VPN app, or malware keeping its lookups
      # out of Pi-hole's logs and blocklists. DNS Director sends the other networks' DNS to the
      # router, so from them this means a client exempted or the redirection off. Pi-hole's own
      # upstream (unbound to Mullvad's 10.64.0.1) leaves from the lab VLAN's nodes. DNS over
      # HTTPS can't be told apart from other HTTPS.
      - alert: DnsToOutsideServer
        expr: >-
          {event.dataset="syslog.log"} host.ip:="192.168.111.1" event.action:=accept
          destination.port:in(53, 853) observer.egress.interface.name:in(wgc1, ppp0)
          source.ip:ipv4_range("192.168.0.0/16")
          -(source.ip:ipv4_range("192.168.111.0/24") destination.ip:="10.64.0.1")
          | copy source.ip as client, destination.ip as server
          | stats by (client, server) count() as connections
        labels:
          severity: warning
          source: router
          mitre_tactic: command-and-control
          mitre_technique: T1071.004
        annotations:
          summary: "{{ $labels.client }} asked {{ $labels.server }} for DNS directly, not Pi-hole"
          description: >-
            A device sent DNS (port 53, or 853 for DNS over TLS) to a server on the internet,
            through the VPN or straight out, instead of the router. Pi-hole doesn't see or
            block those lookups.
          tested: "2026-10-29"
          runbook: >-
            What it sent: {event.dataset="syslog.log"} event.action:=accept
            source.ip:="{{ $labels.client }}" destination.port:in(53, 853). Which device: its
            DHCP lease (event.action:dhcp-ack, client.ip) and the Network dashboard. Outside
            the lab VLAN: check DNS Director is on and the device isn't set to No Redirection.
            A device with its resolver built in (a TV, a streaming stick) needs it changed.
            Trigger: from a lab VLAN machine, nslookup example.com 1.1.1.1.
