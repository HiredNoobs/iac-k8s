# A single Authelia. Its storage is SQLite, so it can't run more than once. The data (2FA
# registrations, the notifier's file) is on a Longhorn volume that follows the pod to any node.
# Sessions are in memory, a restart logs everyone out. No PDB: with one instance there's nothing
# to keep up during a drain.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: authelia
  labels:
    app.kubernetes.io/name: authelia
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  serviceName: authelia
  replicas: 1
  # The volume outlives the StatefulSet, removing Authelia from git doesn't delete the data.
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: authelia
  template:
    metadata:
      labels:
        app.kubernetes.io/name: authelia
    spec:
      # Authelia reads every AUTHELIA_* env var as config and won't start with ones it doesn't
      # know, e.g. the AUTHELIA_SERVICE_HOST Kubernetes adds for the authelia Service.
      enableServiceLinks: false
      # Any non-root user works, fsGroup lets it write /data.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: authelia
          image: authelia/authelia:4.39.28@sha256:bd97cff4fcbf715b5ff1f9ae286afbe6033afce385302520b0368122d43a6f54
          args: ["--config", "/config/configuration.yml"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE
              value: /secrets/jwt-secret
            - name: AUTHELIA_SESSION_SECRET_FILE
              value: /secrets/session-secret
            # Encrypts the 2FA registrations in the database, they can't be read without it.
            - name: AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE
              value: /secrets/storage-encryption-key
            - name: AUTHELIA_AUTHENTICATION_BACKEND_LDAP_PASSWORD_FILE
              value: /secrets/ldap-password
          ports:
            - name: http
              containerPort: 9091
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /config
              readOnly: true
            - name: secrets
              mountPath: /secrets
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: authelia-config
        - name: secrets
          secret:
            secretName: authelia
            items:
              - key: AUTHELIA_JWT_SECRET
                path: jwt-secret
              - key: AUTHELIA_SESSION_SECRET
                path: session-secret
              - key: AUTHELIA_STORAGE_ENCRYPTION_KEY
                path: storage-encryption-key
              - key: AUTHELIA_LDAP_PASSWORD
                path: ldap-password
  # Moved from stack-authelia by re-attaching its volume: the PVC data-authelia-0 was created by
  # hand before the first sync, bound to the old PV.
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: authelia
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: longhorn
        resources:
          requests:
            storage: 1Gi
