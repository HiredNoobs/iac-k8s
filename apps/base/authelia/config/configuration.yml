# Authelia's config. Secrets aren't in here, they're mounted from the authelia Secret and passed
# with the AUTHELIA_*_FILE env vars (statefulset.yaml), or read from those files by the template
# filter (X_AUTHELIA_CONFIG_FILTERS: the OIDC signing key and client secret digests below).
#
# https://www.authelia.com/configuration/prologue/introduction/

# The internal CA (ca.crt from authelia-tls, statefulset.yaml), trusted on top of the system's:
# LLDAP's LDAPS certificate is from it.
certificates_directory: '/certs'

# HTTPS, the certificate from certificate.yaml. The Gateway checks it.
server:
  address: 'tcp://:9091/'
  tls:
    certificate: '/tls/tls.crt'
    key: '/tls/tls.key'

log:
  level: 'info'
  format: 'json'

# Prometheus metrics on their own listener (:9959/metrics, plain HTTP), scraped by vmagent.
telemetry:
  metrics:
    enabled: true
    address: 'tcp://:9959/metrics'

theme: 'auto'

totp:
  issuer: 'hirednoobs.com'

webauthn:
  display_name: 'hirednoobs.com'

authentication_backend:
  # The authelia user is in lldap_strict_readonly, so it can't change passwords. They're reset in
  # LLDAP's UI (lldap.hirednoobs.com) instead.
  password_reset:
    disable: true
  ldap:
    implementation: 'lldap'
    # LDAPS: every login's bind carries the user's password.
    address: 'ldaps://lldap.lldap.svc.cluster.local:6360'
    tls:
      server_name: 'lldap.lldap.svc.cluster.local'
      minimum_version: 'TLS1.2'
    base_dn: 'dc=hirednoobs,dc=com'
    user: 'uid=authelia,ou=people,dc=hirednoobs,dc=com'

session:
  cookies:
    - domain: 'hirednoobs.com'
      authelia_url: 'https://auth.hirednoobs.com'
      default_redirection_url: 'https://homepage.hirednoobs.com'

storage:
  local:
    path: '/data/db.sqlite3'

# One-time codes (e.g. registering 2FA) are written here rather than emailed, read them with
# kubectl -n authelia exec authelia-0 -- cat /data/notification.txt
notifier:
  filesystem:
    filename: '/data/notification.txt'

# Nothing is protected until a route gets a SecurityPolicy, this is who gets in once it has one.
access_control:
  default_policy: 'deny'
  rules:
    - domain: '*.hirednoobs.com'
      subject: 'group:admins'
      policy: 'two_factor'

# OpenID Connect provider, for apps with their own login (Mealie, Grafana). Its HMAC secret comes from
# AUTHELIA_IDENTITY_PROVIDERS_OIDC_HMAC_SECRET_FILE. A client gets in with its secret, its users
# with the client's authorization_policy (password and 2FA); which users an app accepts is up to
# the app (e.g. Mealie's group settings). Consent is implicit: these are our own apps.
#
# https://www.authelia.com/configuration/identity-providers/openid-connect/provider/
identity_providers:
  oidc:
    jwks:
      - key_id: 'main'
        algorithm: 'RS256'
        use: 'sig'
        key: {{ secret "/secrets/oidc-jwks-key" | mindent 10 "|" | msquote }}
    clients:
      # https://www.authelia.com/integration/openid-connect/clients/mealie/
      - client_id: 'mealie'
        client_name: 'Mealie'
        client_secret: '{{ secret "/secrets/oidc-mealie-client-secret-digest" }}'
        public: false
        authorization_policy: 'two_factor'
        consent_mode: 'implicit'
        require_pkce: true
        pkce_challenge_method: 'S256'
        redirect_uris:
          - 'https://mealie.hirednoobs.com/login'
        scopes:
          - 'openid'
          - 'email'
          - 'profile'
          - 'groups'
        response_types:
          - 'code'
        grant_types:
          - 'authorization_code'
        access_token_signed_response_alg: 'none'
        userinfo_signed_response_alg: 'none'
        token_endpoint_auth_method: 'client_secret_basic'
      # https://www.authelia.com/integration/openid-connect/clients/grafana/
      - client_id: 'grafana'
        client_name: 'Grafana'
        client_secret: '{{ secret "/secrets/oidc-grafana-client-secret-digest" }}'
        public: false
        authorization_policy: 'two_factor'
        consent_mode: 'implicit'
        require_pkce: true
        pkce_challenge_method: 'S256'
        redirect_uris:
          - 'https://grafana.hirednoobs.com/login/generic_oauth'
        # offline_access: Grafana ends its session when the access token expires (1h) unless it
        # can refresh it.
        scopes:
          - 'openid'
          - 'email'
          - 'profile'
          - 'groups'
          - 'offline_access'
        response_types:
          - 'code'
        grant_types:
          - 'authorization_code'
          - 'refresh_token'
        access_token_signed_response_alg: 'none'
        userinfo_signed_response_alg: 'none'
        token_endpoint_auth_method: 'client_secret_basic'
