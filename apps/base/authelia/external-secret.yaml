# labv2/production/authelia:
#
# - AUTHELIA_JWT_SECRET: signs identity verification links.
# - AUTHELIA_SESSION_SECRET: encrypts the sessions, changing it logs everyone out.
# - AUTHELIA_STORAGE_ENCRYPTION_KEY: encrypts the database. Without it the 2FA registrations
#   can't be read.
# - AUTHELIA_LDAP_PASSWORD: the authelia user's password in LLDAP (a member of
#   lldap_strict_readonly). LLDAP's bootstrap sets it from here (apps/base/lldap/bootstrap.yaml),
#   so rotate it in Vault only.
# - AUTHELIA_OIDC_HMAC_SECRET: signs the OIDC provider's opaque tokens and codes.
# - AUTHELIA_OIDC_JWKS_KEY: the OIDC provider's RSA private key (PEM), signs ID tokens. Changing
#   it logs every OIDC app out.
# - AUTHELIA_OIDC_MEALIE_CLIENT_SECRET_DIGEST: the digest of Mealie's client secret
#   (labv2/production/mealie OIDC_CLIENT_SECRET), change both together.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authelia
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: authelia
  dataFrom:
    - extract:
        key: production/authelia
