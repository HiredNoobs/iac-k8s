# The portal (auth.hirednoobs.com, httproute.yaml) and the ext-authz endpoint the
# SecurityPolicies check each request against. HTTPS, verified by the Gateway (BackendTLSPolicy
# in certificate.yaml).
apiVersion: v1
kind: Service
metadata:
  name: authelia
  labels:
    app.kubernetes.io/name: authelia
spec:
  selector:
    app.kubernetes.io/name: authelia
  ports:
    - name: https
      port: 9091
      targetPort: https
      protocol: TCP
