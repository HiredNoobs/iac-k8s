# Redis' server certificate, renewed by cert-manager (Reloader restarts Redis to load it). Every
# pod has the same one, also as its client certificate (replication, the sentinels, the probes).
# The secret holds tls.crt, tls.key and ca.crt (redis-ca, which clients are checked against).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: redis
spec:
  secretName: redis-tls
  dnsNames:
    - redis-0.redis.redis.svc
    - redis-0.redis.redis.svc.cluster.local
    - redis-1.redis.redis.svc
    - redis-1.redis.redis.svc.cluster.local
    - redis-2.redis.redis.svc
    - redis-2.redis.redis.svc.cluster.local
    - redis-sentinel
    - redis-sentinel.redis.svc
    - redis-sentinel.redis.svc.cluster.local
    # The probes and the exporter, in the pod.
    - localhost
  usages:
    - digital signature
    - key encipherment
    - server auth
    - client auth
  issuerRef:
    kind: ClusterIssuer
    name: redis-ca
