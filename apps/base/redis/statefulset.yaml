# Redis with Sentinel: three pods, each a Redis (one master, two replicas, replicating over TLS)
# and a sentinel. The sentinels watch the master and, when two of them agree it's been down for
# 10 seconds, make a replica the master. Clients ask the sentinels where the master is
# (redis-sentinel.redis.svc, services.yaml). Each pod's data (the AOF) is on its own Longhorn
# volume that follows it to any node; init.sh (config/) picks each pod's role at start.
#
# Pods start one after another (OrderedReady): redis-0 first, so on a full start the others find
# its sentinel. One per node and preferably one per Proxmox host (zone); the PDB keeps two up in
# a drain.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  labels:
    app.kubernetes.io/name: redis
  annotations:
    # Restart to load a renewed certificate, changed ACL users or passwords.
    secret.reloader.stakater.com/reload: redis-tls,redis-acl,redis-exporter,redis-internal
spec:
  serviceName: redis
  replicas: 3
  # The volumes outlive the StatefulSet, removing Redis from git doesn't delete the data.
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
      annotations:
        # Scraped by vmagent's pods job: the redis-exporter sidecar's memory, clients, commands,
        # keys, persistence and replication.
        prometheus.io/scrape: "true"
        prometheus.io/port: "9121"
    spec:
      # The redis user from the image, fsGroup lets it read the certs and write /data.
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: redis
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: topology.kubernetes.io/zone
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: redis
      # Time to flush the AOF on shutdown.
      terminationGracePeriodSeconds: 60
      initContainers:
        - name: init
          image: redis:8.10.2@sha256:2c2dff791878316e3b083188be0d578423b24813cdda5de0e80ea4f7b3e6bfd6
          command: ["sh", "/usr/local/etc/redis/init.sh"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          envFrom:
            - secretRef:
                name: redis-internal
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: config
              mountPath: /usr/local/etc/redis
              readOnly: true
            - name: certs
              mountPath: /etc/redis/secrets
              readOnly: true
            - name: acl
              mountPath: /etc/redis/acl
              readOnly: true
            - name: run
              mountPath: /etc/redis-run
      containers:
        - name: redis
          image: redis:8.10.2@sha256:2c2dff791878316e3b083188be0d578423b24813cdda5de0e80ea4f7b3e6bfd6
          command: ["redis-server", "/etc/redis-run/redis.conf"]
          # Talos warns about anything short of the restricted pod security standard.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: redis-tls
              containerPort: 6379
              protocol: TCP
          # All three over TLS with Redis' own certificate (a client certificate from redis-ca
          # too): a TCP check would abort the handshake, which Redis logs as an error each time.
          # Started and alive: Redis answers at all, LOADING (reading the AOF) included.
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - >-
                  redis-cli --tls -h localhost -p 6379
                  --cacert /etc/redis/secrets/ca.crt
                  --cert /etc/redis/secrets/tls.crt
                  --key /etc/redis/secrets/tls.key
                  ping | grep -qE 'PONG|NOAUTH|LOADING'
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - >-
                  redis-cli --tls -h localhost -p 6379
                  --cacert /etc/redis/secrets/ca.crt
                  --cert /etc/redis/secrets/tls.crt
                  --key /etc/redis/secrets/tls.key
                  ping | grep -qE 'PONG|NOAUTH|LOADING'
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          # Ready: serving (not LOADING). NOAUTH, as the default user is off, still means serving.
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - >-
                  redis-cli --tls -h localhost -p 6379
                  --cacert /etc/redis/secrets/ca.crt
                  --cert /etc/redis/secrets/tls.crt
                  --key /etc/redis/secrets/tls.key
                  ping | grep -qE 'PONG|NOAUTH'
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: run
              mountPath: /etc/redis-run
            - name: certs
              mountPath: /etc/redis/secrets
              readOnly: true
            # A directory, not a subPath, so a changed Secret reaches the file.
            - name: acl
              mountPath: /etc/redis/acl
              readOnly: true
            - name: data
              mountPath: /data
        - name: sentinel
          image: redis:8.10.2@sha256:2c2dff791878316e3b083188be0d578423b24813cdda5de0e80ea4f7b3e6bfd6
          command: ["redis-sentinel", "/etc/redis-run/sentinel.conf"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: sentinel-tls
              containerPort: 26379
              protocol: TCP
          # Over TLS as Redis' probes; NOAUTH: the sentinel's default user is off.
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - >-
                  redis-cli --tls -h localhost -p 26379
                  --cacert /etc/redis/secrets/ca.crt
                  --cert /etc/redis/secrets/tls.crt
                  --key /etc/redis/secrets/tls.key
                  ping | grep -qE 'PONG|NOAUTH'
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: run
              mountPath: /etc/redis-run
            - name: certs
              mountPath: /etc/redis/secrets
              readOnly: true
        # Redis' metrics (INFO and friends) for Prometheus, as the ACL user exporter: no keys,
        # only the read-only server commands it needs (external-secret.yaml). Same certificate
        # as the probes, over loopback (which the certificate names), so it still reaches Redis
        # while the pod isn't ready.
        - name: redis-exporter
          image: oliver006/redis_exporter:v1.94.0@sha256:0842ef7110e62b40bbde2d5c11f38c6fbd99f7100c75e3866637c1b335a1eff7
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: REDIS_ADDR
              value: rediss://localhost:6379
            - name: REDIS_USER
              value: exporter
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-exporter
                  key: REDIS_PASSWORD
            - name: REDIS_EXPORTER_TLS_CA_CERT_FILE
              value: /etc/redis/secrets/ca.crt
            - name: REDIS_EXPORTER_TLS_CLIENT_CERT_FILE
              value: /etc/redis/secrets/tls.crt
            - name: REDIS_EXPORTER_TLS_CLIENT_KEY_FILE
              value: /etc/redis/secrets/tls.key
          ports:
            - name: http-metrics
              containerPort: 9121
              protocol: TCP
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: certs
              mountPath: /etc/redis/secrets
              readOnly: true
      volumes:
        # redis.conf, sentinel.conf and init.sh.
        - name: config
          configMap:
            name: redis-config
        # The configs init.sh writes, which Redis and Sentinel rewrite.
        - name: run
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: certs
          secret:
            secretName: redis-tls
            defaultMode: 0440
        - name: acl
          secret:
            secretName: redis-acl
            defaultMode: 0440
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: redis
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: longhorn
        resources:
          requests:
            storage: 2Gi
---
# Two of the three stay up in a drain: a master and a replica, and two sentinels to agree on a
# failover.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: redis
  labels:
    app.kubernetes.io/name: redis
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
