# A single Redis instance, its data (the AOF and users.acl) on a Longhorn volume that follows
# the pod to any node. No PDB: with one instance there's nothing to keep up during a drain.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  labels:
    app.kubernetes.io/name: redis
  annotations:
    # Restart to load a renewed certificate.
    secret.reloader.stakater.com/reload: redis-tls
spec:
  serviceName: redis
  # Replication (Sentinel/cluster) isn't set up yet, a second instance would split the data.
  replicas: 1
  # The volume outlives the StatefulSet, removing Redis from git doesn't delete the data.
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
    spec:
      # The redis user from the image, fsGroup lets it read the certs and write /data.
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
      # Time to flush the AOF on shutdown.
      terminationGracePeriodSeconds: 60
      containers:
        - name: redis
          image: redis:8.2.4@sha256:320e9ce6d5c940815a84d989f0e53e3a4d065c0d9132cd9e1222265e78eb6080
          # Redis won't start if the aclfile is missing.
          command:
            - sh
            - -c
            - |
              touch /data/users.acl
              exec redis-server /usr/local/etc/redis/redis.conf
          ports:
            - name: redis-tls
              containerPort: 6379
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: redis-tls
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            tcpSocket:
              port: redis-tls
            periodSeconds: 20
            failureThreshold: 3
          # NOAUTH once the default user is disabled, still means Redis is serving (not LOADING).
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - >-
                  redis-cli --tls -h localhost -p 6379
                  --cacert /etc/redis/secrets/ca.crt
                  --cert /etc/redis/secrets/tls.crt
                  --key /etc/redis/secrets/tls.key
                  ping | grep -qE 'PONG|NOAUTH'
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /usr/local/etc/redis/redis.conf
              subPath: redis.conf
              readOnly: true
            - name: certs
              mountPath: /etc/redis/secrets
              readOnly: true
            - name: data
              mountPath: /data
      volumes:
        - name: config
          configMap:
            name: redis-config
        - name: certs
          secret:
            secretName: redis-tls
            defaultMode: 0440
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: redis
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: longhorn
        resources:
          requests:
            storage: 2Gi
