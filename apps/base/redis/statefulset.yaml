# A single Redis instance, its data (the AOF) on a Longhorn volume that follows the pod to any
# node. No PDB: with one instance there's nothing to keep up during a drain.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  labels:
    app.kubernetes.io/name: redis
  annotations:
    # Restart to load a renewed certificate, changed ACL users or the exporter's password.
    secret.reloader.stakater.com/reload: redis-tls,redis-acl,redis-exporter
spec:
  serviceName: redis
  # Replication (Sentinel/cluster) isn't set up yet, a second instance would split the data.
  replicas: 1
  # The volume outlives the StatefulSet, removing Redis from git doesn't delete the data.
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
      annotations:
        # Scraped by vmagent's pods job: the redis-exporter sidecar's memory, clients, commands,
        # keys and persistence.
        prometheus.io/scrape: "true"
        prometheus.io/port: "9121"
    spec:
      # The redis user from the image, fsGroup lets it read the certs and write /data.
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      # The pod's own name is itself (the exporter's address, see redis-exporter).
      hostAliases:
        - ip: 127.0.0.1
          hostnames: [redis-0.redis.redis.svc]
      # Time to flush the AOF on shutdown.
      terminationGracePeriodSeconds: 60
      containers:
        - name: redis
          image: redis:8.2.4@sha256:320e9ce6d5c940815a84d989f0e53e3a4d065c0d9132cd9e1222265e78eb6080
          command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
          # Talos warns about anything short of the restricted pod security standard.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: redis-tls
              containerPort: 6379
              protocol: TCP
          # All three over TLS with Redis' own certificate (a client certificate from redis-ca
          # too): a TCP check would abort the handshake, which Redis logs as an error each time.
          # Started and alive: Redis answers at all, LOADING (reading the AOF) included.
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - >-
                  redis-cli --tls -h localhost -p 6379
                  --cacert /etc/redis/secrets/ca.crt
                  --cert /etc/redis/secrets/tls.crt
                  --key /etc/redis/secrets/tls.key
                  ping | grep -qE 'PONG|NOAUTH|LOADING'
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - >-
                  redis-cli --tls -h localhost -p 6379
                  --cacert /etc/redis/secrets/ca.crt
                  --cert /etc/redis/secrets/tls.crt
                  --key /etc/redis/secrets/tls.key
                  ping | grep -qE 'PONG|NOAUTH|LOADING'
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          # Ready: serving (not LOADING). NOAUTH, as the default user is off, still means serving.
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - >-
                  redis-cli --tls -h localhost -p 6379
                  --cacert /etc/redis/secrets/ca.crt
                  --cert /etc/redis/secrets/tls.crt
                  --key /etc/redis/secrets/tls.key
                  ping | grep -qE 'PONG|NOAUTH'
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /usr/local/etc/redis/redis.conf
              subPath: redis.conf
              readOnly: true
            - name: certs
              mountPath: /etc/redis/secrets
              readOnly: true
            # A directory, not a subPath, so a changed Secret reaches the file.
            - name: acl
              mountPath: /etc/redis/acl
              readOnly: true
            - name: data
              mountPath: /data
        # Redis' metrics (INFO and friends) for Prometheus, as the ACL user exporter: no keys,
        # only the read-only server commands it needs (external-secret.yaml). Same certificate
        # as the probes. It connects over loopback (hostAliases), so it still reaches Redis
        # while the pod isn't ready, by a name the server certificate has.
        - name: redis-exporter
          image: oliver006/redis_exporter:v1.94.0@sha256:0842ef7110e62b40bbde2d5c11f38c6fbd99f7100c75e3866637c1b335a1eff7
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: REDIS_ADDR
              value: rediss://redis-0.redis.redis.svc:6379
            - name: REDIS_USER
              value: exporter
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-exporter
                  key: REDIS_PASSWORD
            - name: REDIS_EXPORTER_TLS_CA_CERT_FILE
              value: /etc/redis/secrets/ca.crt
            - name: REDIS_EXPORTER_TLS_CLIENT_CERT_FILE
              value: /etc/redis/secrets/tls.crt
            - name: REDIS_EXPORTER_TLS_CLIENT_KEY_FILE
              value: /etc/redis/secrets/tls.key
          ports:
            - name: http-metrics
              containerPort: 9121
              protocol: TCP
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: certs
              mountPath: /etc/redis/secrets
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: redis-config
        - name: certs
          secret:
            secretName: redis-tls
            defaultMode: 0440
        - name: acl
          secret:
            secretName: redis-acl
            defaultMode: 0440
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: redis
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: longhorn
        resources:
          requests:
            storage: 2Gi
