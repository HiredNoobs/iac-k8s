# Redis' ACL users (redis.conf's aclfile), rendered with each password's SHA-256, so the Secret
# only holds hashes. Each user's password is in its client's own Vault secret, which the client
# reads too:
#
# - admin: labv2/production/redis REDIS_ADMIN_PASSWORD (tools-bin's `redis`).
# - contentbot: labv2/production/contentbot REDIS_PASSWORD, its own keys (*@youtube*).
# - exporter: labv2/production/redis REDIS_EXPORTER_PASSWORD (the redis-exporter sidecar), no
#   keys: redis_exporter's recommended ACL without the commands its key checks need.
#
# default is off: without a line for it Redis would create it on, with no password and +@all.
# The file is read-only, so ACL SETUSER and ACL SAVE don't last: change the users here. A change
# restarts Redis (Reloader).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: redis-acl
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: redis-acl
    template:
      data:
        users.acl: |
          user default off
          user admin on #{{ .admin | sha256sum }} ~* &* +@all
          user contentbot on #{{ .contentbot | sha256sum }} ~*@youtube* +@read +@write +@transaction
          user exporter on #{{ .exporter | sha256sum }} -@all +@connection -hello -echo -quit -reset -auth -asking -readonly -readwrite -command -wait +client +info +config|get +slowlog +latency +memory +cluster|info
  data:
    - secretKey: admin
      remoteRef:
        key: production/redis
        property: REDIS_ADMIN_PASSWORD
    - secretKey: contentbot
      remoteRef:
        key: production/contentbot
        property: REDIS_PASSWORD
    - secretKey: exporter
      remoteRef:
        key: production/redis
        property: REDIS_EXPORTER_PASSWORD
---
# The exporter's password for the redis-exporter sidecar (statefulset.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: redis-exporter
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: redis-exporter
  data:
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: production/redis
        property: REDIS_EXPORTER_PASSWORD
