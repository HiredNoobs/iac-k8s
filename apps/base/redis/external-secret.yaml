# Redis' ACL users (redis.conf's aclfile) and the sentinels' (sentinel.conf, appended by
# init.sh), rendered with each password's SHA-256, so the Secret only holds hashes. Each user's
# password is in its client's own Vault secret, which the client reads too:
#
# - admin: labv2/production/redis REDIS_ADMIN_PASSWORD (tools-bin's `redis`), on both.
# - contentbot: labv2/production/contentbot REDIS_PASSWORD, its own keys (*@youtube*); on the
#   sentinels only asking where the master is.
# - exporter: labv2/production/redis REDIS_EXPORTER_PASSWORD (the redis-exporter sidecar), no
#   keys: redis_exporter's recommended ACL without the commands its key checks need, plus
#   COMMAND INFO (it asks whether COMMANDLOG exists on every scrape).
# - probe: no password, only PING, on both: the kubelet's probes (statefulset.yaml), which
#   would otherwise each get a NOAUTH error. Connecting at all needs a redis-ca certificate.
# - replica: labv2/production/redis REDIS_REPLICA_PASSWORD, what a replica logs in to its
#   master as (masteruser): only the replication commands.
# - sentinel: labv2/production/redis REDIS_SENTINEL_PASSWORD, what the sentinels log in to Redis
#   as (the commands Redis' docs list for Sentinel) and to each other as (everything, as admin).
#
# default is off with no permissions: without a line for it Redis would create it on, with no
# password and +@all. Needs Redis >= 8.4: before that, loading the AOF re-checks EXEC against
# default and skips every MULTI/EXEC block it refuses (redis/redis#14156, fixed by #14545).
# The file is read-only, so ACL SETUSER and ACL SAVE don't last: change the users here. A change
# restarts Redis (Reloader).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: redis-acl
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: redis-acl
    template:
      data:
        users.acl: |
          user default off -@all
          user admin on #{{ .admin | sha256sum }} ~* &* +@all
          user contentbot on #{{ .contentbot | sha256sum }} ~*@youtube* +@read +@write +@transaction
          user exporter on #{{ .exporter | sha256sum }} -@all +@connection -hello -echo -quit -reset -auth -asking -readonly -readwrite -command +command|info -wait +client +info +config|get +slowlog +latency +memory +cluster|info
          user probe on nopass -@all +ping
          user replica on #{{ .replica | sha256sum }} -@all +psync +replconf +ping
          user sentinel on #{{ .sentinel | sha256sum }} -@all +multi +slaveof +ping +exec +subscribe +config|rewrite +role +publish +info +client|setname +client|kill +script|kill
        sentinel-users.acl: |
          user default off -@all
          user admin on #{{ .admin | sha256sum }} ~* &* +@all
          user sentinel on #{{ .sentinel | sha256sum }} ~* &* +@all
          user probe on nopass -@all +ping
          user contentbot on #{{ .contentbot | sha256sum }} -@all +auth +hello +ping +client|setname +sentinel|get-master-addr-by-name +sentinel|masters +sentinel|master +sentinel|sentinels +sentinel|replicas +sentinel|slaves
  data:
    - secretKey: admin
      remoteRef:
        key: production/redis
        property: REDIS_ADMIN_PASSWORD
    - secretKey: contentbot
      remoteRef:
        key: production/contentbot
        property: REDIS_PASSWORD
    - secretKey: exporter
      remoteRef:
        key: production/redis
        property: REDIS_EXPORTER_PASSWORD
    - secretKey: replica
      remoteRef:
        key: production/redis
        property: REDIS_REPLICA_PASSWORD
    - secretKey: sentinel
      remoteRef:
        key: production/redis
        property: REDIS_SENTINEL_PASSWORD
---
# The exporter's password for the redis-exporter sidecar (statefulset.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: redis-exporter
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: redis-exporter
  data:
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: production/redis
        property: REDIS_EXPORTER_PASSWORD
---
# The replica and sentinel passwords in plain text, for init.sh: a replica's masterauth and the
# sentinels' auth-pass and sentinel-pass are written into their config as they are.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: redis-internal
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: redis-internal
  data:
    - secretKey: REDIS_REPLICA_PASSWORD
      remoteRef:
        key: production/redis
        property: REDIS_REPLICA_PASSWORD
    - secretKey: REDIS_SENTINEL_PASSWORD
      remoteRef:
        key: production/redis
        property: REDIS_SENTINEL_PASSWORD
