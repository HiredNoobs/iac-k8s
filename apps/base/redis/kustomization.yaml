# Redis, TLS only with ACL users from git (external-secret.yaml). A single instance with its
# data (the AOF) on a Longhorn volume. Clients need a certificate from the redis-ca
# ClusterIssuer (infrastructure/configs/cluster-issuer/redis-ca.yaml) and their ACL
# user's password.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: redis
resources:
  - namespace.yaml
  - certificate.yaml
  - external-secret.yaml
  - statefulset.yaml
  - services.yaml
# A change rolls the pod (the name gets a hash).
configMapGenerator:
  - name: redis-config
    files:
      - config/redis.conf
