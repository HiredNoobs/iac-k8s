port 0
tls-port 26379

tls-ca-cert-file "/etc/redis/secrets/ca.crt"
tls-cert-file "/etc/redis/secrets/tls.crt"
tls-key-file "/etc/redis/secrets/tls.key"

# Clients need a certificate from redis-ca, and Sentinel talks TLS to Redis and to the other
# sentinels.
tls-auth-clients yes
tls-replication yes

# The pods by name, not by address (which changes when a pod moves): what the certificate has.
sentinel resolve-hostnames yes
sentinel announce-hostnames yes
