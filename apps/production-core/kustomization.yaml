# The apps production-core runs: ../base/<app>, plus patches for this cluster.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base/homepage
  - ../base/pihole
  - ../base/redis
  - ../base/rabbitmq
  - ../base/contentbot
  - ../base/lldap
  - ../base/authelia
  - ../base/monitoring
  - ../base/node-exporter
  - ../base/rsyslog
  - ../base/vector
  - ../base/kubectl
  - ../base/falco
  - ../base/vaultwarden
  - ../base/mealie
patches:
  # The LAN's DNS IP (the router hands it out), announced by kube-vip.
  - target:
      kind: Service
      name: pihole-dns
      namespace: pihole
    patch: |
      - op: add
        path: /metadata/annotations
        value:
          kube-vip.io/loadbalancerIPs: "192.168.111.100"
  # RabbitMQ for clients outside the cluster (rabbitmq-broker.hirednoobs.com), announced by
  # kube-vip.
  - target:
      kind: Service
      name: rabbitmq-broker
      namespace: rabbitmq
    patch: |
      - op: add
        path: /metadata/annotations
        value:
          kube-vip.io/loadbalancerIPs: "192.168.111.103"
  # Syslog for the LAN (rsyslog.hirednoobs.com), announced by kube-vip.
  - target:
      kind: Service
      name: rsyslog
      namespace: rsyslog
    patch: |
      - op: add
        path: /metadata/annotations
        value:
          kube-vip.io/loadbalancerIPs: "192.168.111.104"
